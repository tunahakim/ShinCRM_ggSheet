<!-- 
 * PROJECT: ShinCRM_Master_Workspace
 * FILE: Styles.html
 * TITLE: Sidebar CSS
 * ROLE: Style
 * -------------------------------------------------------------------------
 * CHI TIẾT ĐẶC TẢ:
 * Định dạng giao diện cho toàn bộ ứng dụng, bao gồm:
  * - Bảng màu sắc chủ đạo và trạng thái (Màu xanh dương, xám, đỏ lỗi, xanh lá công việc).
  * - Kiểu dáng ô nhập liệu (Bo góc, viền mỏng, hiệu ứng focus và lỗi).
  * - Bố cục dàn trang (Hàng ngang, cột, khoảng cách đều).
  * - Định dạng nhãn (Chữ in hoa nhỏ, màu xám phụ).
  * - Định dạng nút bấm (Nền màu, chữ trắng, hiệu ứng hover).
 * -------------------------------------------------------------------------
 * NGÀY KHỞI TẠO: 06/03/2026
 -->

<!-- <style>
  /**
   * =========================================================================
   * HÀM CẤU HÌNH: :root (KHAI BÁO BIẾN MÀU SẮC)
   * =========================================================================
   * - Mục đích: Lưu trữ toàn bộ mã màu cốt lõi của hệ thống vào các biến.
   * - Cách hoạt động: Khai báo 1 lần ở gốc (:root), gọi lại ở nhiều nơi qua hàm var().
   * - Kết quả trả về: Bộ thông số màu sắc đồng nhất cho toàn bộ giao diện.
   * - Cách sử dụng: Thay vì viết #1a73e8, hãy viết var(--p). Đổi 1 chỗ, cập nhật toàn hệ thống.
   * - @param {Global} Hệ thống màu sắc áp dụng cho toàn bộ file HTML.
   */
  :root { 
    --p: #1a73e8;           /* Màu Xanh dương chủ đạo (Google style) */
    --bg: #f8f9fa;          /* Màu Nền xám nhạt cho toàn bộ ứng dụng */
    --txt: #202124;         /* Màu Chữ chính (đen xám dễ đọc) */
    --sub: #5f6368;         /* Màu Chữ phụ (xám) dành cho ghi chú, nhãn */
    --border: #dadce0;      /* Màu Viền tiêu chuẩn */
    --hover: #f1f3f4;       /* Màu nền mờ khi đưa chuột qua các vùng tương tác */
    --err-bg: #fce8e6;      /* Màu Lỗi nền (đỏ nhạt) */
    --err-bd: #c5221f;      /* Màu Lỗi viền (đỏ đậm) */
    --job-bg: #e6f4ea;      /* Màu Job nền (xanh lá nhạt) cho trạng thái công việc */
    --job-txt: #137333;     /* Màu Job chữ (xanh lá đậm) */
    --pin-color: #fbbc04;   /* Màu vàng cho icon ghim (Pin) */
  }
  
  /**
   * =========================================================================
   * HÀM RESET & THÂN TRANG: * và body
   * =========================================================================
   * - Mục đích: Xóa bỏ định dạng thừa của trình duyệt và cấu hình khung sườn ứng dụng.
   * - Cách hoạt động: Ép box-sizing chuẩn, thiết lập font chữ và khóa thanh cuộn ngoài.
   * - Kết quả trả về: Giao diện tràn viền 100% màn hình, không bị xô lệch.
   * - @param {HTMLElement} body - Thẻ gốc bao bọc toàn bộ giao diện Sidebar.
   */
  * { 
    box-sizing: border-box; /* Tính toán chiều rộng bao gồm cả viền và padding */
  } 
  body { 
    font-family: 'Roboto', sans-serif; /* Áp dụng font chữ Roboto tiêu chuẩn */
    margin: 0;              /* Xóa viền trắng mặc định xung quanh trình duyệt */
    background: var(--bg);  /* Trải màu nền xám nhạt lên toàn bộ ứng dụng */
    color: var(--txt);      /* Áp dụng màu chữ đen xám làm mặc định */
    font-size: 14px;        /* Cỡ chữ mặc định của hệ thống là 14px */
    overflow: hidden;       /* Ẩn thanh cuộn mặc định của cửa sổ trình duyệt */
    display: flex;          /* Bật chế độ Flexbox để dàn xếp các khối */
    flex-direction: column; /* Sắp xếp các khối con nối đuôi nhau từ trên xuống dưới */
    height: 100vh;          /* Chiều cao ứng dụng bằng đúng 100% chiều cao màn hình (Viewport Height) */
  }
  
  /**
   * =========================================================================
   * 1. HÀM GIAO DIỆN HEADER & SEARCH
   * =========================================================================
   * - Mục đích: Định dạng thanh điều hướng trên cùng, các nút icon và thanh tìm kiếm.
   * - Cách hoạt động: Cố định Header ở trên, tạo hiệu ứng hover cho nút, xử lý hộp gợi ý.
   * - Kết quả trả về: Thanh công cụ dính chặt trên cùng, nút bấm có hiệu ứng mượt.
   * - @param {HTMLDivElement} .header - Khối chứa thanh tiêu đề.
   * - @param {HTMLButtonElement} .icon-btn - Các nút bấm hình icon trên thanh tiêu đề.
   */
  .header { 
    background: #fff;       /* Đổ nền trắng cho thanh tiêu đề */
    border-bottom: 1px solid var(--border); /* Kẻ vạch xám dưới đáy thanh tiêu đề */
    padding: 0 8px;         /* Không cách lề trên dưới, lùi vào trái phải 8px */
    height: 48px;           /* Cố định chiều cao thanh header là 48px */
    display: flex;          /* Dàn các phần tử bên trong theo hàng ngang */
    align-items: center;    /* Căn giữa các phần tử theo trục dọc */
    gap: 4px;               /* Tạo khoảng cách 4px giữa các nút icon */
    flex-shrink: 0;         /* Không cho phép thanh này bị bóp méo khi màn hình nhỏ */
    z-index: 50;            /* Đẩy thanh này nổi lên trên các thành phần khác (lớp số 50) */
    position: relative;     /* Đặt làm mốc tọa độ cho thanh loading màu xanh chạy ngang */
  }
  .spacer { 
    flex: 1;                /* Chiếm toàn bộ không gian trống, đẩy các nút dạt ra 2 bên */
  }
  .icon-btn { 
    width: 32px;            /* Nút hình vuông rộng 32px */
    height: 32px;           /* Nút hình vuông cao 32px */
    border: none;           /* Xóa đường viền thô cứng mặc định của nút */
    background: transparent;/* Làm nền nút trong suốt */
    border-radius: 50%;     /* Bo tròn nút thành hình tròn hoàn hảo */
    cursor: pointer;        /* Biến con trỏ chuột thành hình bàn tay khi trỏ vào */
    display: flex;          /* Bật flex để căn chỉnh icon SVG bên trong */
    align-items: center;    /* Căn icon ra giữa theo chiều dọc */
    justify-content: center;/* Căn icon ra giữa theo chiều ngang */
    color: var(--sub);      /* Đổ màu xám cho icon */
    transition: 0.2s;       /* Tạo hiệu ứng chuyển đổi màu sắc mượt trong 0.2 giây */
  }
  .icon-btn:hover { 
    background: var(--hover); /* Đổ nền xám nhạt khi chuột lướt qua */
    color: var(--txt);      /* Chuyển icon sang màu đen đậm hơn */
  }
  .icon-btn.active { 
    color: #f9ab00;         /* Đổi icon sang màu vàng nếu nút đang bật (active) */
    background: #fef7e0;    /* Đổ nền vàng nhạt để báo hiệu trạng thái kích hoạt */
  }
  .icon-btn svg { 
    width: 20px;            /* Khống chế kích thước hình vẽ SVG bên trong là 20px */
    height: 20px;           /* Cao 20px */
    fill: currentColor;     /* Hình vẽ SVG sẽ tự động ăn theo màu (color) của thẻ cha */
  }
  .icon-btn.disabled { 
    opacity: 0.3;           /* Làm mờ nút đi 70% khi bị vô hiệu hóa */
    pointer-events: none;   /* Chặn mọi click chuột vào nút này */
  }

  /* --- Hiệu ứng Loader Line (Thanh chạy ngang khi gọi API) --- */
  #loader-line { 
    height: 3px;            /* Thanh loading mỏng 3px */
    width: 100%;            /* Chạy dài suốt chiều ngang màn hình */
    background: transparent;/* Nền trong suốt */
    overflow: hidden;       /* Giấu đi phần vạch xanh chạy tràn ra ngoài */
    position: absolute;     /* Neo tọa độ vào thanh .header */
    bottom: 0;              /* Ép dính xuống mép dưới cùng của thanh header */
    left: 0;                /* Kéo dính vào mép trái */
    z-index: 52;            /* Nổi lên trên header (lớp số 52) */
    display: none;          /* Mặc định ẩn, chỉ bật lên bằng JS khi tải dữ liệu */
  }
  #loader-line div { 
    width: 30%;             /* Đoạn vạch xanh dài bằng 30% màn hình */
    height: 100%;           /* Chiều cao bằng thẻ cha (3px) */
    background: var(--p);   /* Đổ màu xanh chủ đạo cho vạch chạy */
    position: absolute;     /* Neo vào thanh #loader-line */
    left: -30%;             /* Điểm xuất phát: Nằm khuất bên ngoài lề trái */
    animation: loading 1s infinite linear; /* Chạy hiệu ứng 'loading' tuần hoàn không ngừng */
  }

  /* --- Bảng Tìm Kiếm (Search Panel) --- */
  #search-panel { 
    width: 100%;            /* Trải rộng 100% màn hình */
    background: #fff;       /* Nền trắng */
    border-bottom: 1px solid var(--border); /* Viền xám dưới đáy */
    padding: 8px;           /* Thụt lề mọi hướng 8px */
    z-index: 49;            /* Lớp số 49 (nằm dưới header lớp 50) */
    box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* Đổ bóng nhẹ tạo độ sâu */
    display: none;          /* Mặc định ẩn */
    flex-shrink: 0;         /* Không cho co nén khung tìm kiếm */
  }
  .search-inp-wrap { 
    position: relative;     /* Cột mốc tọa độ cho hộp suggest-box bay bên dưới */
  }
  .search-inp { 
    width: 100%;            /* Ô nhập chữ rộng 100% */
    padding: 6px 30px 6px 10px; /* Thụt lề: trên 6px, phải 30px (để chừa chỗ icon), dưới 6px, trái 10px */
    border: 1px solid var(--border); /* Viền xám */
    border-radius: 4px;     /* Bo góc nhẹ 4px */
    font-size: 14px;        /* Cỡ chữ gõ vào là 14px */
    outline: none;          /* Tắt viền xanh mặc định của trình duyệt */
  }
  .search-inp:focus { 
    border-color: var(--p); /* Đổi viền sang màu xanh khi click gõ chữ */
    box-shadow: 0 0 0 2px rgba(26,115,232,0.2); /* Tạo quầng sáng xanh mờ bao quanh viền */
  }
  
  /* --- Hộp Gợi Ý (Suggest Box) dùng chung cho Dropdown và Tìm kiếm --- */
  .suggest-box { 
    max-height: 80vh;       /* Chiều cao tối đa không vượt quá 80% màn hình */
    overflow-y: auto;       /* Tự động hiện thanh cuộn nếu danh sách dài */
    border: 1px solid var(--border); /* Viền xám bao quanh hộp */
    background: #fff;       /* Nền hộp màu trắng */
    position: absolute;     /* Neo lơ lửng bám theo ô input cha */
    width: 100%;            /* Chiều rộng bằng ô input cha */
    z-index: 1000;          /* Phải chèn lớp cực cao (1000) để đè lên mọi form bên dưới */
    box-shadow: 0 4px 6px rgba(0,0,0,0.15); /* Đổ bóng đen mờ cho hộp nổi lên */
    border-radius: 0 0 4px 4px; /* Chỉ bo góc 4px ở 2 cạnh dưới, cạnh trên vuông góc */
    display: none;          /* Mặc định ẩn */
    top: 100%;              /* Dính sát mép dưới của ô input */
    margin-top: 1px;        /* Cách ô input 1px để không bị dính nét */
  }
  .s-item { 
    padding: 6px 10px;      /* Căn lề dòng gợi ý */
    border-bottom: 1px solid #f1f3f4; /* Kẻ vạch xám siêu nhạt phân cách các dòng */
    cursor: pointer;        /* Biểu tượng bàn tay khi trỏ vào dòng */
    display: flex;          /* Dàn hàng ngang */
    justify-content: space-between; /* Đẩy tên sang trái, mô tả phụ sang phải */
    align-items: center;    /* Căn giữa theo chiều cao dòng */
  }
  .s-name { 
    font-weight: 500;       /* Tên hiển thị (Tên KH, Tên SP) in đậm nhẹ */
    color: #202124;         /* Chữ đen đậm */
    font-size: 14px;        /* Cỡ chữ 14 */
    margin-bottom: 2px;     /* Đẩy phần mô tả phụ xuống 2px */
  }
  .s-sub { 
    font-size: 11px;        /* Mô tả phụ (MST, Phone) bé hơn (11px) */
    color: #5f6368;         /* Chữ xám */
    line-height: 1.3;       /* Khoảng cách dòng 1.3 */
  }
  .s-item:hover, .s-item.active { 
    background: #e8f0fe;    /* Đổ nền xanh nhạt khi rê chuột hoặc dùng phím mũi tên chọn */
    color: var(--p);        /* Đổi màu chữ sang xanh chủ đạo */
  }

  /**
   * =========================================================================
   * 2. HÀM MAIN LAYOUT & SCROLLBAR (BỐ CỤC CHÍNH)
   * =========================================================================
   * - Mục đích: Chia màn hình làm 2 phần: Phía trên cố định, phía dưới cuộn được.
   * - @param {HTMLDivElement} #fixed-area - Khu vực chứa tên Khách hàng (Cố định).
   * - @param {HTMLDivElement} #scroll-area - Khu vực chứa danh sách Giao dịch (Cuộn).
   */
  #fixed-area { 
    flex-shrink: 0;         /* Không cho phép khu vực này bị ép nhỏ lại */
    padding: 6px 8px 0 8px; /* Lề: trên 6px, phải 8px, dưới 0, trái 8px */
    background: var(--bg);  /* Đổ nền xám hệ thống */
    z-index: 40;            /* Nổi lên trên lớp nội dung cuộn (lớp 40) */
  }
  #scroll-area { 
    flex-grow: 1;           /* Chiếm trọn không gian còn lại của màn hình */
    overflow-y: auto;       /* Bật thanh cuộn dọc cho khu vực này */
    padding: 0 8px 80px 8px;/* Độn đáy 80px để nội dung cuối cùng không bị dính mép dưới */
    scroll-behavior: smooth;/* Cuộn trang mượt mà */
  }
  
  /* --- Thiết kế thanh cuộn (Scrollbar) chuẩn Google --- */
  ::-webkit-scrollbar { 
    width: 4px;             /* Bóp thanh cuộn dọc nhỏ lại còn 4px cho thanh lịch */
    height: 4px;            /* Bóp thanh cuộn ngang nhỏ lại còn 4px */
  }
  ::-webkit-scrollbar-track { 
    background: transparent;/* Rãnh cuộn trong suốt để lộ nền xám bên dưới */
  }
  ::-webkit-scrollbar-thumb { 
    background: #dadce0;    /* Nút cuộn (con chạy) màu xám */
    border-radius: 2px;     /* Bo tròn 2 đầu con chạy */
  }
  ::-webkit-scrollbar-thumb:hover { 
    background: #bdc1c6;    /* Con chạy đậm màu hơn chút khi trỏ chuột vào */
  }

  .card { 
    background: #fff;       /* Nền thẻ màu trắng */
    border: 1px solid var(--border); /* Viền thẻ xám */
    border-radius: 8px;     /* Bo góc thẻ 8px */
    padding: 10px;          /* Thụt lề chữ vào trong 10px */
    margin-bottom: 8px;     /* Cách thẻ phía dưới 8px */
    box-shadow: 0 1px 2px rgba(60,64,67,0.05); /* Đổ bóng mờ tạo khối nổi nhẹ */
  }

  /**
   * =========================================================================
   * 3. HÀM INFO STYLE (HIỂN THỊ THÔNG TIN KHÁCH HÀNG)
   * =========================================================================
   * - Mục đích: Trang trí các thông tin cứng của Khách (Tên công ty, MST, SĐT).
   */
  .c-name { 
    font-size: 15px;        /* Tên công ty to 15px */
    font-weight: 700;       /* In đậm tên */
    color: var(--p);        /* Tên màu xanh */
    line-height: 1.4;       /* Khoảng cách dòng 1.4 */
    margin-bottom: 6px;     /* Cách phần thông tin dưới 6px */
    text-align: justify;    /* [Yêu cầu của bạn] Căn đều 2 lề văn bản cho đẹp */
  }
  .info-row { 
    display: flex;          /* Dàn hàng ngang */
    justify-content: space-between; /* Đẩy 2 cụm thông tin sang 2 bên vách */
    align-items: center;    /* Căn giữa dọc */
    font-size: 13px;        /* Chữ thông tin bé 13px */
    color: var(--txt);      /* Màu đen tiêu chuẩn */
    margin-bottom: 4px;     /* Cách dòng bên dưới 4px */
  }
  .info-left { 
    font-weight: 500;       /* Dữ liệu bên trái (Mã KH) in đậm vừa */
    color: #333;            /* Màu xám đen */
    text-align: left;       /* Căn sát lề trái */
  } 
  .info-right { 
    font-weight: 600;       /* Dữ liệu bên phải (MST) in đậm hơn */
    color: #000;            /* Màu đen tuyền nguyên chất */
    text-align: right;      /* Căn sát lề phải */
  } 

  /**
   * =========================================================================
   * 4. HÀM NOTE STYLE (GHI CHÚ VÀ TIÊU ĐỀ THẺ)
   * =========================================================================
   */
  .card-header { 
    display: flex;          /* Dàn ngang tiêu đề và nút bấm */
    justify-content: space-between; /* Đẩy xa nhau */
    align-items: center;    /* Căn giữa dọc */
    margin-bottom: 6px;     /* Khoảng cách xuống nội dung dưới */
    padding-bottom: 4px;    /* Khoảng cách nội tại tới viền dưới */
    border-bottom: 1px dashed #eee; /* Kẻ đường đứt nét phân cách tiêu đề */
  }
  .card-title { 
    font-size: 11px;        /* Chữ 11px */
    font-weight: 700;       /* In đậm */
    text-transform: uppercase; /* Viết HOA toàn bộ */
    color: var(--sub);      /* Màu chữ xám phụ */
  }
  .action-link { 
    font-size: 11px;        /* Link chức năng cỡ 11px */
    font-weight: 600;       /* In đậm vừa */
    color: var(--p);        /* Màu xanh link */
    cursor: pointer;        /* Con trỏ bàn tay */
    display: flex;          /* Kích hoạt flex để kết hợp icon */
    align-items: center;    /* Căn giữa icon và chữ */
    gap: 3px;               /* Icon cách chữ 3px */
  }
  .action-link:hover { 
    text-decoration: underline; /* Gạch chân khi trỏ chuột vào báo hiệu click được */
  }
  .note-content { 
    background: #fce8e6;    /* Nền đỏ nhạt (Cảnh báo quan trọng) */
    color: #c5221f;         /* Chữ đỏ đậm */
    padding: 8px;           /* Độn lề 8px */
    border-radius: 4px;     /* Bo góc */
    font-size: 13px;        /* Chữ 13px */
    border-left: 3px solid #d93025; /* Thêm vạch kẻ đỏ đậm ở lề trái tạo điểm nhấn */
    white-space: pre-wrap;  /* Giữ nguyên định dạng xuống dòng của người dùng nhập vào */
    line-height: 1.4;       /* Giãn dòng chữ */
  }

  /**
   * =========================================================================
   * 5. HÀM TRANSACTION LIST (DANH SÁCH GIAO DỊCH & GHIM)
   * =========================================================================
   */
  .tx-list { 
    display: flex;          /* Flex xếp dọc các giao dịch */
    flex-direction: column; 
    gap: 6px;               /* Các giao dịch cách nhau 6px */
  }
  .tx-item { 
    background: #fff;       /* Nền giao dịch trắng */
    border-bottom: 1px solid #f1f3f4; /* Kẻ vạch xám phân cách dưới cùng */
    padding-bottom: 6px;    /* Đẩy vạch cách nội dung 6px */
    position: relative;     /* Cột mốc tọa độ cho icon chỉnh sửa */
  }
  .tx-item:last-child { 
    border-bottom: none;    /* Giao dịch cuối cùng không cần kẻ vạch dưới */
    padding-bottom: 0;      /* Xóa lề dưới của giao dịch cuối */
  }
  .tx-meta {
