  <!--
    Khung sidebar: năm vùng cố định của tài liệu 04 Phần 3, viết cứng đúng một lần ở đây, không khai trong schema, vì nó
    không bao giờ đổi. Tệp này cố tình **rỗng nội dung** — nó không biết gì về khách, về form, về danh mục. Mọi thứ hiện
    lên trong vùng thân đều do code đổ vào lúc chạy.

    Thứ tự nhúng không tùy ý. Hai tệp style vào trước để khung có hình ngay từ khung hình đầu; các tệp code vào theo chiều
    phụ thuộc, và `bootstrap` vào cuối vì nó là thứ gọi mọi thứ khác. `textNormalize` tự chạy bảng ca chuẩn ngay lúc nạp
    nên nó phải vào trước những chỗ dùng tới nó.

    Năm thư mục con của `client/` chia theo mục đích, không chia theo đuôi thẻ: `style/` là hình thức dùng chung cho mọi
    màn, `ui/` là bộ máy màn nào cũng gọi được, `screen/` là một tệp một màn người dùng nhìn thấy, `save/` là đường ghi và
    đường xóa, còn `ram/`, `schema/`, `util/` thì đúng như tên. Một tệp trong `screen/` được mang theo style riêng của nó,
    vì style đó chết cùng màn đó.

    **Đường dẫn trong `include` là cả đường dẫn, không có đuôi tệp.** Khi clasp đẩy lên Google, tên tệp trên đó chính là
    đường dẫn ở máy: `client/style/tokens.html` thành tệp tên `client/style/tokens`. Ghi tên cụt là lỗi chỉ lộ ra lúc chạy thật.
  -->
  <?!= include('client/style/tokens') ?>
  <?!= include('client/style/frame') ?>
  <?!= include('client/style/components') ?>

</head>

<body>
  <div id="sidebar-root">

    <!-- Vùng 1 — Header. Cao cố định, ghim đỉnh. Hàng icon và hộp tìm kiếm vào đây ở chặng dựng form. -->
    <div id="sidebar-header">
      <b>ShinCRM</b>
    </div>

    <!-- Vùng 2 — Dải tiến trình. Cao vài pixel, chạy khi có lời gọi máy chủ đang chờ. -->
    <div id="sidebar-progress"></div>

    <!-- Thông báo thao tác bận nằm trong luồng bố cục để khi hiện sẽ đẩy các vùng bên dưới xuống. -->
    <div id="shin-busy-notice" class="shin-busy-notice" role="status" aria-live="polite" hidden>Đang xử lý dữ liệu…</div>
    <div id="shin-startup-warning" class="shin-startup-warning" role="status" aria-live="polite" hidden></div>

    <!--
      Hộp tìm khách. Ẩn sẵn, nút kính lúp ở header mở ra. Nằm ngoài bốn vùng engine vẽ vì một ô `<input>` bị vẽ lại sau
      từng chữ thì con trỏ nhảy ra khỏi ô — cùng lý do dải tiến trình ở trên cũng nằm ngoài.
    -->
    <div id="shin-search" hidden>
      <div class="shin-search-wrap">
        <input type="text" id="shin-search-input" class="shin-input" autocomplete="off" spellcheck="false" placeholder="Tên, mã, số điện thoại, mã số thuế…" aria-label="Tìm khách hàng">
        <div id="shin-search-list" class="shin-search-list" hidden></div>
      </div>
    </div>

    <!-- Vùng 3 — Khối thông tin chung. Cao theo nội dung. -->
    <div id="sidebar-info" hidden>Đang mở…</div>

    <!-- Sync is a separate full-sidebar screen; hiding it never cancels the GAS session. -->
    <div id="fbm-sync-screen" class="shin-sync-screen" hidden>
      <div class="shin-sync-screen-header">
        <button type="button" id="fbm-sync-back" class="shin-icon" aria-label="Quay lại">&#8592;</button>
        <strong>Đồng bộ FBM</strong>
      </div>
      <div id="fbm-sync-content" class="shin-sync-screen-content"></div>
    </div>

    <!-- Vùng 4 — Thân. Chiếm hết phần dư, cuộn dọc khi tràn. -->
    <div id="sidebar-body"></div>

    <!-- Vùng 5 — Chân. Ghim đáy, ẩn khi màn không khai vùng này. -->
    <div id="sidebar-footer" hidden></div>

    <!--
      Dải hoàn tác việc xóa. Ẩn sẵn, hiện trong lúc đếm ngược. Cũng nằm ngoài bốn vùng engine vẽ, và ở đây lý do còn gắt
      hơn hộp tìm: một lượt vẽ lại vùng giữa lúc đang đếm sẽ xóa mất chính cái nút Hoàn tác, và lệnh xóa vẫn cứ bay đi.
    -->
    <div id="shin-undo" class="shin-undo" hidden>
      <span id="shin-undo-text" class="shin-undo-text"></span>
      <button type="button" class="shin-undo-btn" data-action="undoDelete">Hoàn tác</button>
    </div>

    <div id="shin-extension-warning" class="shin-extension-warning" hidden>Thiếu Extension — sidebar tự dò, chậm hơn</div>

  </div>

  <div id="shin-busy-overlay" class="shin-busy-overlay" aria-hidden="true" hidden></div>
