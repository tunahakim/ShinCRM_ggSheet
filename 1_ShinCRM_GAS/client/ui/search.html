<script>
/*
 * Hộp tìm khách — món đồ cố định thứ sáu của khung, tài liệu 04 Phần 3.
 *
 * Vì sao ô gõ **không** nằm trong bốn vùng engine vẽ: mỗi lượt vẽ thay sạch ruột cả vùng, nên ô `<input>` bị dựng lại sau từng chữ và con trỏ nhảy ra khỏi ô — tài liệu 04 Phần 4. Nó ở ngoài `RENDER_REGIONS` đúng như dải tiến trình, và cũng như dải tiến trình thì tệp này tự chạm DOM của riêng mình.
 *
 * Bàn phím, bung/ẩn danh sách và bôi đen chữ cũ là `client/ui/listPicker.html`, dùng chung với ô gõ-để-lọc. Tệp này chỉ khai phần riêng của hộp tìm: nguồn dòng là `Store.searchCustomers`, và cú chọn **không có đường riêng** — dòng mang `data-action="setCurrentCustomer"` nên nó nổi lên bộ phát click như mọi nút, tên hành động vẫn chịu phép kiểm lúc khởi động.
 *
 * Danh sách gợi ý do engine dựng: `SLOTS.searchSuggestions` sinh Block, `renderNodes` đổi thành chuỗi. Các Block đó không mang `id` và không mang `menu` nên chúng không ghi gì vào `RENDER_INDEX`, và lượt vẽ màn sau vẫn sạch.
 *
 * Đóng hộp **không xóa chữ**: mở lại trong cùng phiên thì chữ cũ còn đó, được bôi đen và danh sách bung theo. Sidebar tải lại thì DOM mới, chữ tự mất.
 */

/** Ba thẻ của món đồ cố định, viết cứng trong `client/Sidebar.html`. */
var SEARCH_PANEL_ID = 'shin-search';
var SEARCH_INPUT_ID = 'shin-search-input';
var SEARCH_LIST_ID = 'shin-search-popup';

/** Tên hành động của nút mở hộp, để đánh dấu nút đang bật. */
var SEARCH_TOGGLE_ACTION = 'toggleSearchPanel';

/** Trần số dòng gợi ý. Bản cũ cũng 20: cuộn qua danh sách dài trong khung 300px còn chậm hơn gõ thêm một chữ. */
var SEARCH_LIMIT = 20;

/** Hộp đang mở nhưng tạm ẩn vì người dùng sang màn form; quay lại màn xem thì hiện lại nguyên chữ đã gõ. */
var searchHeldOpen = false;

/** Khung hộp tìm. Thiếu thẻ là lỗi nối dây trong `Sidebar.html`, không phải người dùng làm sai. */
function searchPanelEl() {
  var el = document.getElementById(SEARCH_PANEL_ID);
  if (!el) {
    throw new Error('Khung sidebar thiếu phần tử "' + SEARCH_PANEL_ID + '" nên hộp tìm khách không mở được. Kiểm tra `client/Sidebar.html`.');
  }
  return el;
}

function searchInputEl() { return document.getElementById(SEARCH_INPUT_ID); }

function searchListEl() { return document.getElementById(SEARCH_LIST_ID); }

/** Hộp đang mở hay không, đọc từ chính DOM chứ không giữ thêm một biến cờ — hai chỗ nhớ một việc thì có ngày lệch. */
function searchIsOpen() {
  var el = document.getElementById(SEARCH_PANEL_ID);
  return !!el && !el.hidden;
}


/* ─── Khai báo cho ListPicker ─── */

/**
 * Vẽ nội dung danh sách gợi ý theo chữ đang gõ.
 *
 * Ô rỗng thì không hiện gì chứ không hiện câu "không có khách nào khớp": lúc mới mở hộp thì ô vốn rỗng, và một câu báo không tìm thấy khi chưa gõ gì là một câu sai.
 *
 * Hỏi `storeSearchTokens` chứ không hỏi `normalizeText`: một ô chỉ có dấu ngoặc kép vừa mở thì chuẩn hóa ra chuỗi không rỗng nhưng cắt mẩu ra rỗng — vẫn là ca "chưa gõ gì".
 *
 * Luôn sáng dòng đầu, nên gõ xong bấm `Enter` là ra khách mà không phải với tay tới mũi xuống.
 */
function searchFill(inp) {
  var box = searchListEl();
  if (!storeSearchTokens(inp.value).length) {
    box.innerHTML = '';
    return null;
  }

  var ket = Store.searchCustomers(inp.value, SEARCH_LIMIT);
  var boiCanh = { records: { search: ket } };
  box.innerHTML = renderNodes(SLOTS.searchSuggestions(boiCanh), boiCanh);

  return { markFirst: true, show: { width: 'anchor', region: 'viewport', minHeight: 0, maxHeight: 220 } };
}

function searchIsInput(el) {
  return !!el && el === searchInputEl();
}

/** Dòng của hộp tìm → ô gõ của nó. Dòng của danh sách khác (ô combo) không thuộc về hộp này. */
function searchInputOfRow(dong) {
  var box = dong && dong.closest ? dong.closest('#' + SEARCH_LIST_ID) : null;
  return box ? searchInputEl() : null;
}

/** `Esc` lúc danh sách đã ẩn thì đóng cả hộp; lúc danh sách đang mở thì `ListPicker` chỉ ẩn danh sách. */
function searchEscape() { return searchClose(); }

var searchPicker = ListPicker.create({
  name: 'search',
  isInput: searchIsInput,
  listOf: searchListEl,
  inputOfRow: searchInputOfRow,
  fill: searchFill,
  onEscape: searchEscape
});


/* ─── Mở, đóng, và dấu bật trên nút ─── */

/** Dán dấu bật/tắt lên nút mở hộp. Phải dán lại sau mỗi lượt vẽ, vì vùng header bị thay sạch ruột và mang theo cả dấu của lượt trước. */
function searchStampToggle() {
  var nut = document.querySelector('[data-action="' + SEARCH_TOGGLE_ACTION + '"]');
  if (!nut) { return null; }

  nut.setAttribute('aria-pressed', searchIsOpen() ? 'true' : 'false');
  return nut;
}

/**
 * Mở hộp. Trả về `focusId` chứ không tự đặt con trỏ: đặt con trỏ là việc của bộ phát click, và mọi hành động khác cũng xin con trỏ theo đúng cách đó. Con trỏ vào ô thì `ListPicker` bôi đen chữ cũ (nếu có) và bung danh sách.
 */
function searchOpen() {
  var panel = searchPanelEl();
  panel.hidden = false;
  searchStampToggle();
  return { focusId: SEARCH_INPUT_ID };
}

/** Đóng hộp: ẩn danh sách và khung, **giữ chữ đã gõ** cho lần mở sau. Không vẽ lại màn xem — hộp là lớp nổi nên thân màn chưa từng bị thay. */
function searchClose() {
  var panel = document.getElementById(SEARCH_PANEL_ID);
  if (!panel) { return null; }

  var inp = searchInputEl();
  if (inp) { searchPicker.hide(inp); }

  panel.hidden = true;
  searchHeldOpen = false;
  searchStampToggle();
  return null;
}

function searchToggle() {
  return searchIsOpen() ? searchClose() : searchOpen();
}


/* ─── Nối dây ─── */

/**
 * Việc dọn sau mỗi hành động, do bộ phát click gọi: hộp tìm chỉ sống trên màn xem, nhưng **không mất đi** khi rời màn xem.
 *
 * Quyết định 08/09/2026 của chủ dự án: tìm một khách rồi bấm Sửa thì quay lại màn xem hộp phải còn nguyên chữ đã gõ, không bắt tìm lại từ đầu. Nhưng hộp cũng không được nổi đè lên màn form — nên rời màn xem thì hộp **tạm ẩn** (giữ chữ, giữ danh sách), về màn xem thì hiện lại nguyên trạng. Đóng hẳn chỉ bằng nút kính lúp hoặc `Esc`.
 *
 * Đặt ở đây chứ không ở `formScreen`: các tệp trong `client/screen/` không được chạm DOM.
 */
function searchSyncScreen() {
  if (ScreenState.screen !== SCREEN_VIEW) {
    if (searchIsOpen()) {
      searchHeldOpen = true;
      searchPanelEl().hidden = true;
    }
    searchStampToggle();
    return false;
  }

  if (searchHeldOpen) {
    searchHeldOpen = false;
    searchPanelEl().hidden = false;
  }
  searchStampToggle();
  return true;
}

/** Gắn tai nghe cho hộp tìm. Gọi nhiều lần cũng chỉ gắn một lần. */
function searchInstall() {
  if (!searchInputEl()) {
    throw new Error('Khung sidebar thiếu ô gõ "' + SEARCH_INPUT_ID + '" nên hộp tìm khách không nhận chữ. Kiểm tra `client/Sidebar.html`.');
  }

  var installed = searchPicker.install(document.getElementById(DISPATCH_ROOT_ID));
  searchStampToggle();
  return installed;
}
</script>
