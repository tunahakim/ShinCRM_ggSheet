<script>
/*
 * `SLOTS` — ba vùng nội dung mà `UI_SCHEMA` không khai được bằng dòng dữ liệu. Tài liệu 04 Phần 7.
 *
 * Chữ ký là `(ctx) => mảng Block`, với `ctx` là `{entity, records, screen}` do engine truyền vào. Slot **không** dựng chuỗi HTML: nó dựng Block rồi engine vẽ, nên mọi luật thoát ký tự và mọi lớp CSS vẫn có đúng một chỗ.
 *
 * Vì sao ba vùng này không khai được: danh sách giao dịch dài bao nhiêu là do dữ liệu, hộp gợi ý phụ thuộc chữ đang gõ, và khối thông tin chung đổi theo trạng thái khách. Cả ba đều là "tùy lúc chạy", còn schema là "biết trước".
 */

var SLOTS = {};

/** Chữ hiện ra khi không có gì để hiện. Một dòng chữ nhạt, không phải khoảng trắng — khoảng trắng khiến người dùng tưởng đang nạp dở. */
function slotEmpty(chu) {
  return [Text({ text: chu, className: 'shin-empty' })];
}

/** Mã khách của ngữ cảnh đang vẽ. Lấy từ bản ghi trong `ctx` chứ không đọc `ScreenState`, để slot kiểm được offline. */
function slotCustomerId(ctx) {
  var ban = ctx && ctx.records ? ctx.records.customer : null;
  return ban && ban.id ? ban.id : '';
}

/** Lọc theo nấc đang chọn. Không sắp lại và không trộn: mảng trong RAM đã đúng thứ tự thời gian, tài liệu 03 Phần 8 **`[RÀNG BUỘC CỨNG]`**. */
function slotFilterActivities(list, nac) {
  if (nac === 'all') { return list.slice(); }
  var muon = nac === 'deleted' ? STORE_DELETED : STORE_ACTIVE;
  return list.filter(function (a) { return (a.recordStatus || STORE_ACTIVE) === muon; });
}

/** Số dòng nội dung một giao dịch hiện ra trước khi thu gọn. Chủ dự án chốt khoảng mười tới mười lăm ngày 06/09/2026, mười hai là giữa thang. */
var SLOT_ACTIVITY_LINES = 12;

/**
 * Nhóm bên trái của hàng đầu: ngày, chip "Đã xóa" nếu có, rồi tên sản phẩm.
 *
 * Ngày xanh đậm là mốc để mắt nhảy dọc, sản phẩm đỏ đậm là thứ để phân loại nhanh — đúng cặp `.tx-date` với `.tx-prod` của bản cũ. **Không có cột giá trị hợp đồng**: chủ dự án bỏ nó ngày 06/09/2026, vì một dòng lịch sử là để nhớ đã nói gì với khách, còn tiền thì tra ở form.
 */
function slotActivityLeft(a, daXoa) {
  var phan = [Text({ text: valueTextDate(a.workDate), className: 'shin-act-date' })];
  if (daXoa) { phan.push(Text({ text: 'Đã xóa', className: 'shin-badge shin-badge-deleted' })); }
  if (a.product) { phan.push(Text({ text: a.product, className: 'shin-act-prod' })); }
  return Block({ className: 'shin-act-left', elements: phan });
}

/**
 * Nhóm bên phải của hàng đầu: chip loại việc, rồi thùng rác, rồi **bút chì ngoài cùng**.
 *
 * Bút chì ngoài cùng là chỗ chủ dự án chỉ ra ngày 06/09/2026, và nó đúng: sửa là việc làm mười lần thì xóa mới một lần, nên cái hay bấm phải là cái gần mép nhất, còn cái xóa được thì phải nằm sâu hơn một nhịp.
 *
 * Hai nút mang `className` riêng thay vì để CSS đếm thứ tự bằng `.shin-icon + .shin-icon`. Đếm thứ tự thì hôm nay đổi chỗ hai nút là mai màu đỏ nhảy sang cái bút chì.
 */
function slotActivityRight(a) {
  var phan = [];
  if (a.taskType) { phan.push(Text({ text: a.taskType, className: 'shin-act-type' })); }
  phan.push(Icon({ icon: 'trash', tooltip: 'Xóa giao dịch', action: 'deleteActivity', pick: a.id, className: 'shin-act-del' }));
  phan.push(Icon({ icon: 'pencil', tooltip: 'Sửa giao dịch', action: 'openActivityForm', pick: a.id, className: 'shin-act-edit' }));
  return Block({ className: 'shin-act-right', elements: phan });
}

/**
 * Một dòng lịch sử: hàng đầu chia **hai nhóm ghim hai mép**, hàng dưới là nội dung có trần chiều cao.
 *
 * Hai nhóm chứ không phải một hàng phẳng, đúng cặp `.tx-meta-left` với nhóm phải của bản cũ. Một hàng phẳng thì mọi mẩu chữ cùng đứng cạnh nhau và hai cái nút bị đẩy tràn khỏi mép card — chính cái chủ dự án chụp ảnh chỉ ra. Hai nhóm thì nhóm phải luôn ghim mép phải, và lúc trỏ chuột vào thì hai nút hiện ra **đẩy chip loại việc co vào**, đúng nếp bản cũ.
 *
 * **Hai nút bút chì và thùng rác, chỉ hiện khi trỏ chuột vào dòng** — không có ô đánh dấu và không có nút xóa hàng loạt. Chủ dự án chốt vậy 06/09/2026: ô đánh dấu ăn chỗ ở mọi dòng để phục vụ một việc hiếm, còn xóa hàng loạt thì bắt người dùng làm hai bước (tích rồi bấm) cho việc mà chín phần mười lần chỉ xóa một dòng. Nút nằm ngay trên dòng cần xóa nên không có đường nhấn sai dòng.
 *
 * Nội dung khai `overflow: 'collapse'` nên một giao dịch dài bị cắt ở `SLOT_ACTIVITY_LINES` dòng và `client/ui/collapse.html` gắn nút "Xem thêm" cho riêng dòng đó. Thu gọn chứ không cuộn nội bộ: một khung cuộn lồng trong khung cuộn của vùng thân sẽ ăn mất cú lăn chuột đang muốn cuộn cả danh sách.
 */
function slotActivityRow(a) {
  var daXoa = (a.recordStatus || STORE_ACTIVE) === STORE_DELETED;

  return Block({
    className: 'shin-act-row' + (daXoa ? ' shin-act-deleted' : ''),
    elements: [
      Row({ className: 'shin-act-head', elements: [slotActivityLeft(a, daXoa), slotActivityRight(a)] }),
      Text({
        text: a.content || '',
        className: 'shin-act-content',
        spatialConfig: { overflow: 'collapse', collapsedLines: SLOT_ACTIVITY_LINES }
      })
    ]
  });
}

/**
 * Danh sách giao dịch của khách đang xem, lọc theo nấc đang nhớ ở `Prefs.activityView`.
 *
 * Ba dòng chữ khi rỗng nói ba chuyện khác nhau — chưa chọn khách, đang nạp, khách này không có giao dịch nào ở nấc đang xem — vì cả ba đều là ca thật và người dùng phải phân biệt được.
 *
 * Dòng đang chờ xóa bị bỏ ra ở đây, ở **tầng hiện**, chứ không bị bỏ khỏi `Store`: bấm Hoàn tác thì không phải dựng lại gì cả, chỉ bỏ mặt nạ đi — tài liệu 06 Phần 6 **`[RÀNG BUỘC CỨNG]`**. Dò bằng `typeof` vì bộ chờ nằm ở `client/save/`, ngoài hộp cát của bộ kiểm tầng vẽ.
 */
SLOTS.activityList = function (ctx) {
  var id = slotCustomerId(ctx);
  if (!id) { return slotEmpty('Chưa chọn khách hàng nào.'); }
  if (Store.activityState === STORE_LOADING) { return slotEmpty('Đang nạp lịch sử làm việc…'); }

  var list = slotFilterActivities(Store.getActivities(id), Prefs.activityView);
  if (typeof pendingDeleteFilter === 'function') { list = pendingDeleteFilter(list); }
  if (!list.length) {
    return slotEmpty(Prefs.activityView === 'deleted' ? 'Khách này không có giao dịch nào đã xóa.' : 'Khách này chưa có giao dịch nào.');
  }

  return list.map(slotActivityRow);
};

/**
 * Hộp gợi ý của ô tìm khách. Mỗi dòng bấm được, mang `data-pick` là mã khách để phần bàn phím đọc.
 *
 * `ctx.records.search` là kết quả bên gọi đã tra sẵn bằng `Store.searchCustomers`. Slot không tự tra vì nó không biết người dùng đang gõ gì — chữ đang gõ nằm trong DOM, và tệp này không chạm DOM.
 */
SLOTS.searchSuggestions = function (ctx) {
  var ket = (ctx && ctx.records && ctx.records.search) || [];
  if (!ket.length) { return slotEmpty('Không có khách nào khớp.'); }

  return ket.map(function (c) {
    var phu = [c.id];
    if (c.phone) { phu.push(c.phone); }
    if (c.province) { phu.push(c.province); }

    return Block({
      className: 'shin-suggest' + ((c.recordStatus || STORE_ACTIVE) === STORE_DELETED ? ' shin-suggest-deleted' : ''),
      action: 'setCurrentCustomer',
      pick: c.id,
      elements: [
        Text({ text: c.companyName || '(chưa có tên)', className: 'shin-suggest-name' }),
        Text({ text: phu.join(' • '), className: 'shin-suggest-meta' })
      ]
    });
  });
};

/** Một hàng phụ hai cột của khối thông tin. Rỗng cả hai bên thì trả `null` để bên gọi bỏ hàng — một hàng trắng vẫn ăn chiều cao. */
function slotInfoRow(trai, phai) {
  if (!trai && !phai) { return null; }
  return Row([
    Text({ text: trai || '', className: 'shin-info-left' }),
    Text({ text: phai || '', className: 'shin-info-right' })
  ]);
}

/**
 * Khối thông tin chung: đang làm việc cho khách nào. Tài liệu 03 Phần 8 — bật ở ba màn để người dùng luôn thấy.
 *
 * **Đây là khối chữ to nhất của sidebar, không phải một dải phụ.** Chủ dự án nhìn bản trước liền nói "phần thông tin chung khách hàng: quá nhỏ, tôi cần nó như code gốc" — bản trước nhồi mã khách, người liên hệ và điện thoại vào một dòng chữ 11 pixel màu nhạt. Bản cũ làm ngược: tên công ty 15 pixel xanh đậm, rồi hai hàng chữ 13 pixel màu đen chia hai cột.
 *
 * Hai hàng phụ chia **hai cột** để tiết kiệm chiều cao, và cột phải giữ đúng hai thứ hay phải chép ra nhất: mã số thuế với số điện thoại. Chỗ cố định thì mắt tìm được mà không phải đọc hết dòng.
 *
 * Khách đã xóa mềm thì thêm chip "Đã xóa". Việc khóa ba cửa mở form là của `ACTIONS`, không phải của slot này — slot chỉ hiện, không chặn.
 */
SLOTS.infoBarContent = function (ctx) {
  var ban = ctx && ctx.records ? ctx.records.customer : null;
  if (!ban || !ban.id) { return slotEmpty('Chưa chọn khách hàng nào.'); }

  var dong = [Text({ text: ban.companyName || '(chưa có tên)', className: 'shin-info-name' })];
  if ((ban.recordStatus || STORE_ACTIVE) === STORE_DELETED) {
    dong.push(Text({ text: 'Đã xóa', className: 'shin-badge shin-badge-deleted' }));
  }

  var ra = [Row(dong)];
  var hang = [slotInfoRow(ban.id, ban.taxNumber), slotInfoRow(ban.contactPerson, ban.phone)];
  hang.forEach(function (h) { if (h) { ra.push(h); } });
  return ra;
};
</script>
