<script>
/*
 * Chín glyph SVG nội tuyến. Schema gọi glyph bằng tên, engine tra bảng này. Tài liệu 03 Phần 9.
 *
 * Nội tuyến chứ không tải phông biểu tượng từ mạng: sidebar nằm trong iframe, mỗi lần tải ngoài là một lần chờ thêm đúng lúc người dùng đang chờ nạp dữ liệu.
 */

/** Thuộc tính chung của mọi glyph. Gom một chỗ nên chín glyph không lệch nét nhau; màu lấy theo màu chữ của nút chứa nó. */
var ICON_SVG_OPEN = '<svg class="shin-glyph" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"'
  + ' fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';

/** Ruột từng glyph — chỉ hình, không màu và không kích thước. Ba dấu chấm của `more` phải tự khai `fill` vì nét viền không vẽ được hình đặc. */
var ICON_PATHS = {
  close: '<path d="M4 4 12 12M12 4 4 12"/>',
  check: '<path d="M3.2 8.6 6.4 11.8 12.8 4.4"/>',
  search: '<circle cx="7" cy="7" r="4.2"/><path d="M10.1 10.1 13.8 13.8"/>',
  table: '<rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.2"/><path d="M2.2 6.6h11.6M6.4 6.6v6.2"/>',
  refresh: '<path d="M13.2 8a5.2 5.2 0 1 1-1.8-3.9"/><path d="M13.2 2.4V5h-2.6"/>',
  more: '<circle cx="8" cy="3.4" r="1.15" fill="currentColor" stroke="none"/>'
    + '<circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none"/>'
    + '<circle cx="8" cy="12.6" r="1.15" fill="currentColor" stroke="none"/>',
  pencil: '<path d="M3 13l.9-3 6.4-6.4 2.1 2.1L6 12.1z"/><path d="M9.6 4.3l2.1 2.1"/>',
  addUser: '<circle cx="6.4" cy="5.2" r="2.4"/><path d="M2.2 13.2c0-2.4 1.9-4 4.2-4 .9 0 1.8.2 2.5.7"/><path d="M11.6 9.4v4.2M9.5 11.5h4.2"/>',
  plus: '<path d="M8 3.2v9.6M3.2 8h9.6"/>'
};

/** Tên chín glyph theo thứ tự khai. Phép tự kiểm tên icon trong schema dùng chung hàm này nên không có hai bản danh sách lệch nhau. */
function iconNames() {
  return Object.keys(ICON_PATHS);
}

/** Một glyph thành chuỗi SVG. Tên lạ thì ném lỗi kèm danh sách tên đúng — vẽ ô trống thì lỗi hiện ra dưới dạng "nút không có hình", loại lỗi phải đoán. */
function iconSvg(ten) {
  if (!Object.prototype.hasOwnProperty.call(ICON_PATHS, ten)) {
    throw new Error('Không có glyph "' + ten + '". Chín tên hiện có: ' + iconNames().join(', ') + '.');
  }
  return ICON_SVG_OPEN + ICON_PATHS[ten] + '</svg>';
}
</script>
