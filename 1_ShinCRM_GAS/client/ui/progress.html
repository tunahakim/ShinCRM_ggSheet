<script>
/**
 * Dải tiến trình: bật khi có bất kỳ lời gọi máy chủ nào đang chờ, tắt khi hết. Tài liệu 04 Phần 3, tài liệu 05 Phần 5.
 *
 * Nó đếm số lời gọi đang chờ chứ không giữ một cờ bật tắt. Với một cờ, hai lời gọi chồng nhau thì lời gọi xong trước sẽ
 * tắt dải trong khi lời gọi kia còn đang chạy — người dùng thấy hệ thống báo xong rồi vẫn phải chờ, và đó là kiểu chỉ báo
 * làm mất lòng tin vào mọi chỉ báo khác. Trên đường nạp nền, các gói `activity` gọi liên tiếp nên ca này là ca thường, không phải ca lạ.
 *
 * Đếm xuống dưới 0 thì kẹp lại ở 0. Một lần `progressEnd` gọi hai lần do lỗi ở chỗ khác không được biến dải tiến trình
 * thành thứ không bao giờ chạy nữa.
 */

/** Số lời gọi máy chủ đang chờ. */
var progressPending = 0;
var SIDEBAR_BUSY = { next: 0, operations: [] };

/** Bật dải nếu đang có việc, tắt nếu không. Đọc lại thẻ mỗi lần thay vì giữ tham chiếu, vì tệp này nạp trước khi thân trang có thẻ. */
function progressPaint() {
  var strip = document.getElementById('sidebar-progress');
  if (!strip) { return; }

  if (progressPending > 0) { strip.classList.add('is-running'); } else { strip.classList.remove('is-running'); }
}

/** Ghi nhận một lời gọi máy chủ vừa bắt đầu. */
function progressBegin() {
  progressPending += 1;
  progressPaint();
}

/** Ghi nhận một lời gọi máy chủ vừa xong, dù xuôi hay lỗi. */
function progressEnd() {
  progressPending = Math.max(0, progressPending - 1);
  progressPaint();
}

function sidebarBusyActive() {
  return SIDEBAR_BUSY.operations.length > 0;
}

function sidebarBusyPaint() {
  var root = document.getElementById('sidebar-root');
  var overlay = document.getElementById('shin-busy-overlay');
  var message = document.getElementById('shin-busy-message');
  var active = sidebarBusyActive();
  var current = active ? SIDEBAR_BUSY.operations[SIDEBAR_BUSY.operations.length - 1] : null;

  if (root) {
    root.setAttribute('aria-busy', active ? 'true' : 'false');
    if (active) { root.setAttribute('inert', ''); }
    else { root.removeAttribute('inert'); }
  }
  if (message && current) { message.textContent = current.message; }
  if (overlay) { overlay.hidden = !active; }
}

/** Khóa toàn sidebar; trả về một hàm chỉ mở đúng lượt đã khóa, kể cả khi có hai việc chồng nhau. */
function sidebarBusyBegin(message) {
  var operation = { id: ++SIDEBAR_BUSY.next, message: String(message || 'Đang xử lý dữ liệu…'), done: false };
  SIDEBAR_BUSY.operations.push(operation);
  if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
  sidebarBusyPaint();

  return function () {
    if (operation.done) { return; }
    operation.done = true;
    SIDEBAR_BUSY.operations = SIDEBAR_BUSY.operations.filter(function (item) { return item.id !== operation.id; });
    sidebarBusyPaint();
  };
}

/** Đổi lời báo của việc đang nằm trên cùng, dùng cho từng bước của lượt nạp dài. */
function sidebarBusyMessage(message) {
  if (!sidebarBusyActive()) { return; }
  SIDEBAR_BUSY.operations[SIDEBAR_BUSY.operations.length - 1].message = String(message || 'Đang xử lý dữ liệu…');
  sidebarBusyPaint();
}

/** Bọc cả phần cập nhật RAM và vẽ lại, không chỉ thời gian lời gọi máy chủ đang bay. */
function sidebarBusyRun(message, work) {
  var finish = sidebarBusyBegin(message);
  var result;
  try {
    result = work();
  } catch (err) {
    finish();
    throw err;
  }
  if (result && typeof result.then === 'function') {
    return result.then(function (value) {
      finish();
      return value;
    }, function (err) {
      finish();
      throw err;
    });
  }
  finish();
  return result;
}
</script>
