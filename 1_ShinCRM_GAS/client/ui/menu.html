<script>
/*
 * Lớp menu nổi — nửa chạm DOM mà engine cố ý không nhận, tài liệu 04 Phần 4B và `Câu hỏi đêm.md` mục 2.1.
 *
 * Engine chỉ để lại hai dấu: `data-menu="<khóa>"` trên nút mở, và mảng mục con nằm ở `RENDER_INDEX.menus[khóa]`. Tệp này dựng lớp nổi từ hai dấu đó.
 *
 * Ba luật của tài liệu 04 Phần 4B mà code dưới đây phải giữ: chỉ một menu mở tại một lúc; `Esc` hoặc bấm ra ngoài thì đóng; và menu **không mở thêm đường gọi hàm nào** — mọi mục con vẫn mang `data-action` để đi qua đúng bộ phát click, nên nó chịu chung phép kiểm tên hành động lúc khởi động.
 */

/** Lớp nổi chỉ có một, đặt trong khung để cú bấm mục con bay lên tới tai nghe của bộ phát click. */
var MENU_LAYER_ID = 'shin-menu-layer';

/**
 * Tên hành động của mục menu ứng với núm nào trong `Prefs`. Dấu tích và dấu chấm tròn đọc ở đây, không hỏi máy chủ và không đọc `UserProperties` — `Câu hỏi đêm.md` mục 3.9.
 *
 * Bảng tra tường minh chứ không cắt chữ từ tên hành động: `toggleFollowSelection` → `followSelection` thì cắt được, nhưng `setActivityView` → `activityView` thì không, và một luật đúng hai phần ba là luật sẽ sai lúc có núm thứ tư.
 */
var MENU_PREF_BY_ACTION = {
  toggleFollowSelection: 'followSelection',
  toggleAutoRenderView: 'autoRenderView',
  setActivityView: 'activityView'
};

/**
 * Mục con đang được đánh dấu hay không, và đánh bằng hình gì.
 *
 * Hai hình dạng của tài liệu 04 Phần 4B loại trừ nhau: `toggle: true` là công tắc nên đánh dấu tích theo trạng thái bật/tắt; có `value` là một nấc của nhóm nên đánh chấm tròn khi giá trị đang nhớ trùng nấc đó. Các mục cùng `action` trong một menu tự thành một nhóm loại trừ, không cần khai tên nhóm.
 *
 * Không tra được núm thì trả `null` — mục vẫn bấm được, chỉ là không có ô đánh dấu. Đó là ca mục menu thường, ví dụ một mục chỉ mở form.
 */
function menuMark(muc) {
  var num = MENU_PREF_BY_ACTION[muc.action];
  if (!num || !Object.prototype.hasOwnProperty.call(Prefs, num)) { return null; }
  if (muc.toggle) { return { hinh: 'check', bat: Prefs[num] === true }; }
  if (muc.value !== undefined) { return { hinh: 'radio', bat: Prefs[num] === muc.value }; }
  return null;
}

/**
 * Một mục con thành một `<button>`.
 *
 * Dựng bằng DOM chứ không nối chuỗi HTML: nhãn mục menu là chữ do bản khai đặt, và `textContent` cùng `setAttribute` tự lo phần thoát ký tự mà không cần nhớ gọi hàm nào.
 */
function menuItemElement(muc) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'shin-popup-item';
  b.setAttribute('data-action', muc.action || '');
  if (muc.value !== undefined) { b.setAttribute('data-value', muc.value); }

  var dau = menuMark(muc);
  var o = document.createElement('span');
  o.className = 'shin-popup-mark';
  o.setAttribute('aria-hidden', 'true');
  o.textContent = dau && dau.bat ? (dau.hinh === 'check' ? '✓' : '●') : '';
  b.appendChild(o);

  var chu = document.createElement('span');
  chu.className = 'shin-popup-label';
  chu.textContent = muc.label || '';
  b.appendChild(chu);

  if (dau) {
    b.setAttribute('role', dau.hinh === 'check' ? 'menuitemcheckbox' : 'menuitemradio');
    b.setAttribute('aria-checked', dau.bat ? 'true' : 'false');
  }
  return b;
}

/** Lấy lớp nổi, chưa có thì dựng. Con của khung, nên mọi cú bấm trong đó vẫn tới bộ phát click. */
function menuLayer() {
  var lop = document.getElementById(MENU_LAYER_ID);
  if (lop) { return lop; }

  var khung = document.getElementById(DISPATCH_ROOT_ID);
  if (!khung) { throw new Error('Khung sidebar thiếu phần tử "' + DISPATCH_ROOT_ID + '" nên không đặt được lớp menu.'); }

  lop = document.createElement('div');
  lop.id = MENU_LAYER_ID;
  lop.className = 'shin-popup-list';
  lop.setAttribute('role', 'menu');
  lop.hidden = true;
  khung.appendChild(lop);
  return lop;
}

/** Đóng menu đang mở. Gọi lúc chưa có menu nào cũng không sao — bộ phát click gọi hàm này ở mọi cú bấm. */
function menuClose() {
  var lop = document.getElementById(MENU_LAYER_ID);
  if (!lop) { return null; }

  var khoa = lop.getAttribute('data-of');
  if (khoa) {
    var nut = document.querySelector('[data-menu="' + khoa + '"]');
    if (nut) { nut.setAttribute('aria-expanded', 'false'); }
  }

  if (typeof PopupList !== 'undefined') { PopupList.hide(lop); } else { lop.hidden = true; }
  var root = document.getElementById(DISPATCH_ROOT_ID);
  if (root && lop.parentNode !== root) { root.appendChild(lop); }
  lop.removeAttribute('data-of');
  lop.textContent = '';
  return lop;
}

/* A body menu must be a descendant of the scrolling region so that its
   overflow clips it together with the trigger. Header menus stay in the root
   and keep the viewport coordinate system. */
function menuPlaceLayer(lop, trigger) {
  if (!lop || !trigger) { return; }
  var root = document.getElementById(DISPATCH_ROOT_ID);
  var bodyId = typeof RENDER_REGIONS !== 'undefined' && RENDER_REGIONS.body ? RENDER_REGIONS.body : 'sidebar-body';
  var body = document.getElementById(bodyId);
  var host = body && body.contains && body.contains(trigger) ? body : root;
  if (host && lop.parentNode !== host) { host.appendChild(lop); }
}

/**
 * Mở menu của một nút.
 *
 * PopupList hiện lớp trước khi đo và tự neo/lật theo vùng nhìn thấy.
 */
function menuOpen(nut) {
  var khoa = nut.getAttribute('data-menu');
  var muc = RENDER_INDEX.menus[khoa];
  if (!muc || !muc.length) {
    throw new Error('Nút "' + (nut.getAttribute('aria-label') || nut.textContent || khoa) + '" khai có menu nhưng sổ tra không còn mục nào. Lượt vẽ vừa rồi và cú bấm này đang lệch nhau.');
  }

  var lop = menuClose() || menuLayer();
  for (var i = 0; i < muc.length; i += 1) { lop.appendChild(menuItemElement(muc[i])); }

  lop.setAttribute('data-of', khoa);
  nut.setAttribute('aria-expanded', 'true');
  menuPlaceLayer(lop, nut);
  PopupList.show(lop, nut, {
    region: document.getElementById(typeof RENDER_REGIONS !== 'undefined' && RENDER_REGIONS.body ? RENDER_REGIONS.body : 'sidebar-body'),
    onClose: function () {
      var active = lop.getAttribute('data-of');
      var trigger = active ? document.querySelector('[data-menu="' + active + '"]') : null;
      if (trigger) { trigger.setAttribute('aria-expanded', 'false'); }
      lop.removeAttribute('data-of');
      lop.textContent = '';
    }
  });
  return lop;
}

/** Bấm nút mở menu: đang mở menu của chính nó thì đóng, còn lại thì mở. */
function menuToggle(nut) {
  var lop = document.getElementById(MENU_LAYER_ID);
  if (lop && !lop.hidden && lop.getAttribute('data-of') === nut.getAttribute('data-menu')) { return menuClose(); }
  return menuOpen(nut);
}

/** `Esc` đóng menu. Đặt ở `document` vì con trỏ lúc đó thường vẫn ở nút mở, không ở trong lớp nổi. */
function menuInstall() {
  if (document.body.getAttribute('data-menu-esc') === '1') { return false; }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.keyCode === 27) { menuClose(); }
  });
  document.body.setAttribute('data-menu-esc', '1');
  return true;
}
</script>
