<script>
/*
 * `ACTIONS` — mười lăm hành động của cả hệ thống, tài liệu 04 Phần 7. Nhìn một phát là thấy hết những gì sidebar làm được.
 *
 * Chữ ký `(payload) => any`, với `payload` là `{pick, value}` do bộ phát click đọc từ `data-pick` và `data-value`. Tài liệu 04 Phần 7 viết `=> void`, nhưng phần lớn hành động phải trả kết quả vẽ để bộ phát click lấy `focusId`, còn bốn núm đổi cách xem trả về Promise để nó bắt được lượt gửi thất bại — `Câu hỏi đêm.md` mục 6.1. Schema chỉ chứa **tên hàm dạng chuỗi** và engine tra bảng này, nên một tên gõ sai bị bắt lúc khởi động chứ không hiện ra dưới dạng "bấm nút không có gì xảy ra".
 *
 * Tài liệu 04 Phần 7 khai mười lăm tên, trong đó có `deleteSelectedActivities` cho việc xóa hàng loạt; chủ dự án bỏ việc đó ngày 06/09/2026 nên tên ấy rời bảng, và `setCurrentCustomer` mà tài liệu 04 Phần 2 khai riêng vào thay chỗ. Ràng buộc của tài liệu là bảng **đóng và tra theo tên**, không phải bảng có đúng bao nhiêu dòng.
 *
 * Tệp này không chạm DOM và không gọi `google.script.run` trực tiếp: việc vẽ đã nằm trong `renderScreen`, còn hai việc còn lại — đặt con trỏ vào ô đầu, hiện lỗi lên mắt người — thì trả về cho bộ phát click. Nhờ vậy mọi thân hàm kiểm được offline, và một bảng tra tên đúng là loại chỗ mà lỗi chính tả nằm im được rất lâu.
 */

var ACTIONS = {};

/** Giá trị của mục menu vừa bấm. Thiếu là hỏng bảng khai, không phải người dùng làm sai. */
function actionsValue(payload, viec) {
  var value = payload ? payload.value : undefined;
  if (value === undefined || value === '') {
    throw new Error(viec + ' cần `value` của mục menu nhưng `data-value` rỗng. Sửa bảng khai `menu` trong `UI_SCHEMA`.');
  }
  return value;
}

/** Mã bản ghi mà dòng vừa bấm mang theo. Cũng vậy: thiếu `pick` là Block khai thiếu. */
function actionsPick(payload, viec) {
  var pick = payload ? payload.pick : '';
  if (!pick) {
    throw new Error(viec + ' cần mã bản ghi của dòng vừa bấm nhưng `data-pick` rỗng. Block gọi hành động này phải khai `pick`.');
  }
  return pick;
}

/**
 * Gửi núm chọn vừa đổi lên máy chủ rồi nhận lại cả khối.
 *
 * Đổi RAM trước rồi mới gửi là cố ý — tài liệu 07 Phần 6. Núm chọn là thói dùng chứ không phải dữ liệu nghiệp vụ, nên giao diện phản hồi ngay quan trọng hơn; gửi thất bại thì lần mở sau tự về đúng.
 */
function actionsPrefSend(kq) {
  return callServer('userPrefsWrite', [kq.name, kq.value]).then(function (res) {
    return prefsIngest(res.prefs);
  });
}

/** Khách đang xem, cho những hành động không có khách thì vô nghĩa. Ném lỗi thay vì mở một form trắng. */
function actionsCustomer() {
  var ban = screenViewCustomer();
  if (!ban) {
    throw new Error('Chọn khách hàng trước đã — bấm vào ô của khách trên sheet, hoặc tìm bằng hộp tìm khách.');
  }
  return ban;
}

/** Ba cửa sửa đóng lại khi khách đã xóa mềm — tài liệu 03 Phần 8. `openCustomerFormBlank` không đi qua đây: thêm khách mới thì không liên quan tới khách đang xem. */
function actionsCustomerAlive() {
  var ban = actionsCustomer();
  if (screenViewDeleted()) {
    throw new Error('Khách "' + ban.id + '" đang ở trạng thái đã xóa nên không sửa được. Hoàn tác việc xóa trước, hoặc thêm khách mới.');
  }
  return ban;
}

/** Một giao dịch theo mã. Chỉ tìm trong danh sách của khách đang xem, vì nút bút chì luôn nằm trên một dòng của chính danh sách ấy. */
function actionsActivity(id) {
  var list = Store.getActivities(ScreenState.currentCustomerId);
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) { return list[i]; }
  }
  throw new Error('Không có giao dịch mã "' + id + '" trong danh sách của khách đang xem. Bấm Nạp lại rồi thử lần nữa.');
}

/** Hành động đã có tên trong bảng nhưng thân hàm thuộc chặng sau. Ném lỗi để bộ phát click hiện lên — im lặng đúng là ca mà tài liệu 04 Phần 7 chống. */
function actionsChuaDung(viec, chang) {
  throw new Error(viec + ' chưa dựng — thuộc chặng ' + chang + '. Tên đã có trong bảng ACTIONS để phép kiểm khởi động xanh, thân hàm nối ở chặng đó.');
}


/* ─── Bốn núm đổi cách xem ─── */

ACTIONS.toggleFollowSelection = function () {
  return actionsPrefSend(prefsToggle('followSelection'));
};

ACTIONS.toggleAutoRenderView = function () {
  return actionsPrefSend(prefsToggle('autoRenderView'));
};

/** Mở hoặc đóng hộp tìm khách. Hộp tìm là món đồ cố định ngoài bốn vùng nên mở nó không phải một lượt vẽ — DOM vẫn do `client/ui/search.html` tự chạm, tệp này chỉ gọi tên việc. */
ACTIONS.toggleSearchPanel = function () {
  return searchToggle();
};

/** Đổi nấc xem card lịch sử. Vẽ lại **riêng card đó** chứ không cả màn: khối thông tin chung và card ghi chú không đổi theo nấc. */
ACTIONS.setActivityView = function (payload) {
  var kq = prefsSet('activityView', actionsValue(payload, 'Nấc xem lịch sử'));
  screenViewActivityCard();
  return actionsPrefSend(kq);
};


/* ─── Sheet quản trị và nạp lại ─── */

ACTIONS.renderActiveViewSheet = function () {
  actionsChuaDung('Vẽ lại sheet quản trị', '1.5');
};

/** Nạp lại từ đầu. Đóng hết form trước khi gọi, vì `sidebarBoot` dọn sạch `Store` và một form đang mở sẽ trỏ vào bản ghi vừa bị bỏ. */
ACTIONS.reloadAll = function () {
  screenStateGoView();
  return sidebarBoot();
};


/* ─── Bốn cửa mở form ─── */

ACTIONS.openCustomerForm = function () {
  return screenFormOpen('customerForm', actionsCustomerAlive());
};

ACTIONS.openCustomerFormBlank = function () {
  return screenFormOpenNew('customerForm');
};

/** Có `pick` là sửa dòng đó, không có là thêm mới. Một hành động hai đường vì cùng một form, và `UI_SCHEMA` khai đúng một tên. */
ACTIONS.openActivityForm = function (payload) {
  var khach = actionsCustomerAlive();
  var id = payload ? payload.pick : '';
  return id
    ? screenFormOpen('activityForm', actionsActivity(id))
    : screenFormOpenNew('activityForm', { customerId: khach.id });
};

ACTIONS.openNoteForm = function () {
  return screenFormOpen('noteForm', actionsCustomerAlive());
};


/* ─── Lưu và hủy ─── */

ACTIONS.saveForm = function () {
  actionsChuaDung('Nút Lưu', '1.4');
};

ACTIONS.cancelForm = function () {
  return screenFormClose();
};


/* ─── Xóa mềm và hoàn tác ─── */

ACTIONS.deleteActivity = function (payload) {
  actionsPick(payload, 'Xóa giao dịch');
  actionsChuaDung('Xóa một giao dịch', '1.4');
};

ACTIONS.undoDelete = function () {
  actionsChuaDung('Hoàn tác việc xóa', '1.4');
};


/* ─── Nguồn-chọn khách ─── */

/** Đích của cả hai nguồn-chọn: Extension bắt click ô trên sheet, và hộp gợi ý tìm khách. */
ACTIONS.setCurrentCustomer = function (payload) {
  return screenViewSetCustomer(actionsPick(payload, 'Chọn khách hàng'));
};


/** Mười lăm tên, tính từ chính bảng. Phép kiểm khởi động và các thông báo lỗi đều đọc ở đây, nên không có bản danh sách thứ hai để lệch. */
var ACTIONS_NAMES = Object.keys(ACTIONS);
</script>
