<script>
/*
 * Ô gõ-để-lọc — nguồn dòng và việc chọn của hai control `select` và `customerPicker`. Bàn phím, bung/ẩn và bôi đen nằm ở `client/ui/listPicker.html`, dùng chung với hộp tìm khách.
 *
 * Engine chỉ để lại cái vỏ: một `<input role="combobox">` và một `<div class="shin-popup-list" hidden>` rỗng. Tệp này đổ nội dung vào cái vỏ đó.
 *
 * **Không có mũi tên sổ xuống.** Sidebar rộng khoảng 300 pixel; một mũi tên cộng khoảng chừa cho nó ăn 24 pixel, bằng ba bốn chữ — mà mấy chữ cuối của tên công ty mới là thứ phân biệt hai khách trùng đầu tên. Bù lại: **con trỏ vào ô là danh sách tự bung**, nên không mất đường mở nào. Nếp này lấy nguyên của bản cũ `9_Code_cu_tham_chieu/src/ui/UI_Logic.html`.
 *
 * Dòng danh sách **không mang `data-action`**: nó không phải một hành động, nó chỉ điền chữ vào một ô.
 */

/* ─── Tra thẻ ─── */

/** Khung `.shin-combo` của một ô nhập, `null` nếu thẻ vừa nhận không phải ô nhập của một combo. Dòng danh sách không mang lớp `shin-input` nên nó không lọt qua đây. */
function comboWrap(el) {
  if (!el || !el.closest || !el.classList || !el.classList.contains('shin-input')) { return null; }
  return el.closest('.shin-combo');
}

function comboListOf(inp) {
  var khung = comboWrap(inp);
  return khung ? khung.querySelector('.shin-popup-list') : null;
}

/** Đọc từ chính DOM chứ không giữ thêm một biến cờ — hai chỗ nhớ một việc thì có ngày lệch. */
function comboIsOpen(inp) {
  var box = comboListOf(inp);
  return !!box && !box.hidden;
}

/** Ô tra khách hay ô danh mục. Ô tra khách chỉ bung khi đã gõ, ô danh mục bung ngay để người dùng xem có những gì. */
function comboIsPicker(inp) {
  return customerPickerIsInput(inp);
}


/* ─── Nguồn giá trị ─── */

/** Bảng khai của trường, tra từ `data-field`. Trả `null` khi chưa nạp schema — lúc đó danh sách rỗng chứ không nổ. */
function comboDecl(inp) {
  var duong = String(inp.getAttribute('data-field') || '').split('.');
  if (duong.length !== 2 || typeof Schema === 'undefined' || !Schema || !Schema[duong[0]]) { return null; }
  return Schema[duong[0]][duong[1]] || null;
}

function comboStandaloneOptions(inp) {
  if (!inp || inp.getAttribute('data-standalone-select') !== '1') { return []; }
  if (typeof renderStandaloneOptions === 'function') { return renderStandaloneOptions(inp); }
  try {
    var parsed = JSON.parse(inp.getAttribute('data-standalone-options') || '[]');
    return Array.isArray(parsed) ? parsed.filter(function (item) { return item && item.value !== undefined && item.label !== undefined; }) : [];
  } catch (ignore) { return []; }
}

/**
 * Nguồn giá trị của một ô danh mục: hoặc `options` khai thẳng trong bảng khai trường, hoặc danh mục trong `Store`.
 *
 * Hỏi bảng khai chứ không hỏi `data-source` trên thẻ, vì `data-source` chỉ có ở ca danh mục — trường khai `options` thì thẻ không mang gì và một ô như thế sẽ bung ra danh sách rỗng mà không ai biết vì sao.
 */
function comboSource(inp) {
  var standalone = comboStandaloneOptions(inp);
  if (standalone.length) { return standalone; }
  var khai = comboDecl(inp);
  if (!khai) { return []; }
  if (khai.options) { return khai.options; }
  if (khai.source && Store.categories && Store.categories[khai.source]) { return Store.categories[khai.source]; }
  return [];
}

/**
 * Các dòng khớp với chữ đang gõ. Trả `{ rows, con }` — `con` là dấu "còn nữa", để danh sách nói ra thay vì cắt im lặng.
 *
 * Lọc bằng `normalizeText` nên gõ `ha noi` ra `Hà Nội`, và lọc theo `includes` chứ không theo đầu chuỗi nên gõ `thep` ra `Công ty thép Việt`.
 *
 * Mục khớp **đúng** chữ đang có trong ô thì kéo lên đầu: mở lại một ô đã điền là thấy ngay giá trị hiện tại, không phải cuộn đi tìm.
 */
function comboMatches(inp, chu, mode) {
  var can = normalizeText(chu);

  if (comboIsPicker(inp)) {
    var picker = customerPickerMatches(chu);
    return { rows: picker.rows, con: picker.more };
  }

  var source = comboSource(inp), standalone = comboStandaloneOptions(inp);
  if (standalone.length) {
    var selected = standalone.filter(function (item) { return String(item.value) === String(inp.getAttribute('data-value') || ''); })[0];
    var queryStandalone = mode === 'open' ? '' : can;
    return { rows: standalone.filter(function (item) { return !queryStandalone || normalizeText(item.label).indexOf(queryStandalone) !== -1; }).map(function (item) { return { value: item.value, label: item.label, meta: '' }; }), con: false, hasExact: !!selected };
  }
  // Khi quay lại một giá trị hợp lệ, mở lại toàn bộ danh mục; chỉ khi giá trị đang gõ chưa hợp lệ mới lọc theo nó.
  var hasExact = can && source.some(function (v) { return normalizeText(v) === can; });
  var showAll = mode === 'open' && (!can || hasExact);
  var query = showAll ? '' : can;
  var rows = [];
  source.forEach(function (v) {
    if (!query || normalizeText(v).indexOf(query) !== -1) { rows.push({ value: v, meta: '' }); }
  });

  if (can) {
    for (var i = 1; i < rows.length; i += 1) {
      if (normalizeText(rows[i].value) === can) { rows.unshift(rows.splice(i, 1)[0]); break; }
    }
  }

  return { rows: rows, con: false, hasExact: hasExact };
}


/* ─── Dòng của danh sách ─── */

/** Một dòng chọn được. Dựng bằng DOM chứ không nối chuỗi HTML: giá trị là chữ người dùng gõ vào sheet `Category`, và `textContent` tự lo phần thoát ký tự. */
function comboItemElement(o) {
  var d = document.createElement('div');
  d.className = 'shin-popup-item';
  d.setAttribute('data-value', o.value);

  var chu = document.createElement('div');
  chu.textContent = o.label === undefined ? o.value : o.label;
  d.appendChild(chu);

  if (o.meta) {
    var phu = document.createElement('div');
    phu.className = 'shin-combo-meta';
    phu.textContent = o.meta;
    d.appendChild(phu);
  }
  return d;
}

/** Dòng chú thích, không chọn được. */
function comboNoteElement(chu, lop) {
  var d = document.createElement('div');
  d.className = lop;
  d.textContent = chu;
  return d;
}

/** Dòng đầu là lựa chọn tạm khi đang lọc; danh sách mở lại chỉ sáng giá trị đã hợp lệ. */
function comboShouldMarkFirst(ket, mode, can) {
  return !!(ket && ket.rows && ket.rows.length) && (ket.hasExact || (mode === 'search' && !!can));
}


/* ─── Khai báo cho ListPicker ─── */

/** Vẽ nội dung danh sách theo chữ đang có trong ô. Ô tra khách còn trống thì không có gì để hiện. */
function comboFill(inp, mode) {
  var box = comboListOf(inp);
  var can = normalizeText(inp.value);
  if (comboIsPicker(inp) && !can) { return null; }

  var ket = comboMatches(inp, inp.value, mode);
  box.textContent = '';

  if (!ket.rows.length) {
    box.appendChild(comboNoteElement('Không tìm thấy', 'shin-combo-empty'));
  } else {
    for (var i = 0; i < ket.rows.length; i += 1) { box.appendChild(comboItemElement(ket.rows[i])); }
    if (ket.con) { box.appendChild(comboNoteElement('Gõ thêm để lọc hẹp', 'shin-combo-more')); }
  }

  return { markFirst: comboShouldMarkFirst(ket, mode, can), show: { region: document.getElementById(RENDER_REGIONS.body) } };
}

/** Chọn một mục: điền rồi **nhảy luôn sang ô kế tiếp**. Một mục là một lần bấm, không có bước xác nhận. Việc ẩn danh sách do `ListPicker` làm trong cùng cú chọn. */
function comboPick(inp, dong) {
  var giaTri = dong.getAttribute('data-value');
  var standalone = comboStandaloneOptions(inp), option = standalone.filter(function (item) { return String(item.value) === String(giaTri); })[0];
  inp.setAttribute('data-value', giaTri);
  inp.value = option ? String(option.label) : giaTri;
  inp.classList.remove('is-filled');
  if (typeof inp.dispatchEvent === 'function' && typeof Event === 'function') { inp.dispatchEvent(new Event('change', { bubbles: true })); }
  if (typeof inputsFocusNext === 'function') { inputsFocusNext(inp); }
  return giaTri;
}

/** Ô chỉ đọc thì không mở gì: nó không nhận chữ nên một danh sách bung ra là một lời hứa hão. */
function comboCanOpen(inp) {
  return !((inp.readOnly && inp.getAttribute('data-standalone-select') !== '1') || inp.disabled);
}

function comboInputOfRow(dong) {
  var khung = dong && dong.closest ? dong.closest('.shin-combo') : null;
  return khung ? khung.querySelector('.shin-input') : null;
}

var comboPicker = ListPicker.create({
  name: 'combo',
  isInput: comboWrap,
  listOf: comboListOf,
  inputOfRow: comboInputOfRow,
  canOpen: comboCanOpen,
  fill: comboFill,
  pick: comboPick
});

function comboInstall() {
  return comboPicker.install(document.getElementById(DISPATCH_ROOT_ID));
}
</script>
