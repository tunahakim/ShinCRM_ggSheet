<script>
/*
 * Dịch cây Block thành HTML rồi gán vào các vùng của sidebar. Tài liệu 04 Phần 5, 6, 9.
 *
 * Đúng bốn việc: thoát ký tự, dịch `spatialConfig` thành style nội tuyến, dựng chuỗi HTML đệ quy, và `renderTarget` vẽ lại một vùng theo `id`. Menu sổ xuống (Phần 4B) và phép đo của chế độ thu gọn (Phần 5) ở tệp anh em — nhồi vào đây là dựng đúng cái tệp giao diện phình to mà luật nhà cấm.
 *
 * Nửa dựng chuỗi **không chạm DOM**: chỉ ba hàm cuối tệp gọi `document`. Nhờ vậy bộ kiểm offline gọi được hàm thật thay vì phải mở sidebar trên Google.
 */

/* --- Việc 1 — thoát ký tự --------------------------------------- */

var RENDER_ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

/** Thoát chuỗi trước khi ghép vào HTML. `[RÀNG BUỘC CỨNG]` tài liệu 04 Phần 1: một tên công ty chứa dấu ngoặc kép là đủ làm vỡ form. */
function renderEscape(giaTri) {
  if (giaTri === null || giaTri === undefined) { return ''; }
  return String(giaTri).replace(/[&<>"']/g, function (ky) { return RENDER_ESCAPE_MAP[ky]; });
}

/** Một thuộc tính HTML đã thoát. Giá trị rỗng thì không sinh thuộc tính, vì `data-field=""` vẫn khớp bộ chọn `[data-field]` và làm bộ thu thập nhận cả ô không có tên trường. */
function renderAttr(ten, giaTri) {
  if (giaTri === null || giaTri === undefined || giaTri === '') { return ''; }
  return ' ' + ten + '="' + renderEscape(giaTri) + '"';
}

/* --- Việc 2 — spatialConfig thành style nội tuyến ---------------- */

/** Số đo thành chuỗi CSS: số trần hiểu là px, chuỗi giữ nguyên đơn vị đã gõ (`"70%"`, `"160px"`). */
function renderLength(giaTri) {
  return typeof giaTri === 'number' ? giaTri + 'px' : String(giaTri).trim();
}

/** Số dòng còn lại khi thu gọn, mặc định 3 theo tài liệu 04 Phần 5. */
function renderCollapsedLines(kg) {
  var n = kg.collapsedLines === undefined ? 3 : Number(kg.collapsedLines);
  if (!(n > 0)) { throw new Error('`collapsedLines` phải là số dòng lớn hơn 0, đang nhận "' + kg.collapsedLines + '".'); }
  return n;
}

/** Hai giá trị của núm `overflow`. Một núm hai nấc chứ không hai cờ đúng-sai, vì cuộn và thu gọn loại trừ nhau. */
var RENDER_OVERFLOW_VALUES = ['scroll', 'collapse'];

/** Năm khóa của tài liệu 04 Phần 5, không có khóa thứ sáu. Khai tên lạ thì ném lỗi, vì một khóa engine không biết là một dòng schema không làm gì mà cũng không báo gì. */
var RENDER_SPATIAL_KEYS = ['width', 'autoExpand', 'maxHeight', 'overflow', 'collapsedLines'];

/**
 * `spatialConfig` thành phần ruột của `style`. Khai rỗng thì trả chuỗi rỗng: độ rộng chia đều và chiều cao theo nội dung là mặc định, mà mặc định thì để CSS nói một lần ở `components.html` chứ không lặp vào từng thẻ.
 *
 * `autoExpand: false` cần `maxHeight` mới có số để ghim chiều cao; thiếu thì ném lỗi chứ không lặng lẽ không làm gì. Khai cả `maxHeight` lẫn `overflow: "collapse"` thì trần lúc thu gọn là `maxHeight`, còn `collapsedLines` là đường dự phòng khi không khai trần.
 */
function renderSpatialStyle(kg) {
  var c = kg || {};
  var out = [];
  var thuGon = c.overflow === 'collapse';
  var tran = c.maxHeight === undefined ? '' : renderLength(c.maxHeight);

  Object.keys(c).forEach(function (k) {
    if (RENDER_SPATIAL_KEYS.indexOf(k) === -1) {
      throw new Error('`spatialConfig` không có khóa "' + k + '". Năm khóa: ' + RENDER_SPATIAL_KEYS.join(', ') + '.');
    }
  });
  if (c.overflow !== undefined && RENDER_OVERFLOW_VALUES.indexOf(c.overflow) === -1) {
    throw new Error('`overflow` chỉ nhận "scroll" hoặc "collapse", đang nhận "' + c.overflow + '".');
  }
  if (c.width !== undefined && c.width !== 'auto') {
    out.push('flex: 0 0 ' + renderLength(c.width), 'max-width: ' + renderLength(c.width));
  }

  if (c.autoExpand === false) {
    if (!tran) { throw new Error('`autoExpand: false` cần `maxHeight` để biết ghim chiều cao ở đâu.'); }
    out.push('height: ' + tran);
  } else if (tran && !thuGon) {
    out.push('max-height: ' + tran);
  }

  if (thuGon) {
    out.push('overflow: hidden', 'max-height: ' + (tran || 'calc(' + renderCollapsedLines(c) + 'em * var(--shin-line-height))'));
  } else if (tran || c.autoExpand === false) {
    out.push('overflow-y: auto');
  }

  return out.join('; ');
}

/** Style không gian cộng dấu `data-collapse`: hai thứ đi cùng nhau vì phép đo của chế độ thu gọn phải tìm đúng phần tử đang bị ghim trần. */
function renderSpatialAttrs(kg) {
  var c = kg || {};
  var ra = renderAttr('style', renderSpatialStyle(c));
  if (c.overflow === 'collapse') { ra += renderAttr('data-collapse', renderCollapsedLines(c)); }
  return ra;
}

/* --- Việc 3 — dựng chuỗi HTML đệ quy ---------------------------- */

/** Sổ tra của lượt vẽ hiện tại: Block theo `id` để `renderTarget` tìm lại, `menu` theo khóa để tệp menu tra. Dựng lại mỗi lượt vẽ cả màn. */
var RENDER_INDEX = { nodes: {}, menus: {}, ctx: null, dem: 0 };

/** Thẻ HTML của từng vai. */
var RENDER_TAG_BY_ROLE = { box: 'div', card: 'section', row: 'div', text: 'div', field: 'div', button: 'button', icon: 'button', check: 'label', standaloneControl: 'div' };

/** Control suy từ `type` khi `UI_SCHEMA` không khai. Tài liệu 03 Phần 7. */
var RENDER_CONTROL_BY_TYPE = { TEXT: 'text', NUMBER: 'number', DATE: 'date', SELECT: 'select' };

/** Danh sách lớp CSS của một node: lớp theo vai, lớp trang trí của schema, và ba lớp engine tự thêm. */
function renderClassList(node) {
  var lop = ['shin-' + node.role];
  if (node.className) { lop.push(node.className); }
  if (node.align === 'right') { lop.push('shin-align-right'); }
  if (node.menu) { lop.push('shin-has-menu'); }
  if (node.role === 'icon' && node.toggle) { lop.push('shin-toggle'); }
  return lop.join(' ');
}

/** Các adapter có thể đặt dấu nhận diện sự kiện qua Block, nhưng không tự ghép thuộc tính HTML. */
function renderDataAttrs(data) {
  if (!data) { return ''; }
  return Object.keys(data).map(function (key) { return renderAttr('data-' + key, data[key]); }).join('');
}

/** `action`, `menu` và trạng thái công tắc thành thuộc tính. Menu vào sổ tra theo khóa thay vì nhồi cả mảng mục con vào một thuộc tính HTML. */
function renderActionAttrs(node) {
  var ra = renderAttr('data-action', node.action);
  if (node.menu) {
    var khoa = node.id || ('shin-menu-' + (RENDER_INDEX.dem += 1));
    RENDER_INDEX.menus[khoa] = node.menu;
    ra += renderAttr('data-menu', khoa);
  }
  if (node.toggle) {
    var bat = typeof Prefs !== 'undefined' && Prefs && Prefs[node.toggle] === true;
    ra += renderAttr('aria-pressed', bat ? 'true' : 'false');
  }
  return ra;
}

/**
 * Thuộc tính của thẻ ngoài, theo vai.
 *
 * Ba chỗ lệch, mỗi chỗ một lý do: `card` nhường style không gian cho thẻ ruột để hàng tiêu đề không bị cuộn mất; `field` không nhận `data-action` vì `action` của trường là nút bút chì cạnh nhãn chứ không phải cả ô bấm được; hai vai nút cần `type="button"` để khỏi tự gửi form.
 */
function renderNodeAttrs(node) {
  var ra = (node.role === 'button' || node.role === 'icon') ? ' type="button"' : '';
  ra += (node.role === 'standaloneControl' ? renderAttr('class', 'shin-standalone-control') : renderAttr('id', node.id) + renderAttr('class', renderClassList(node)));

  if (node.role !== 'card') { ra += renderSpatialAttrs(node.spatialConfig); }
  if (node.role !== 'field') { ra += renderActionAttrs(node); }
  if (node.role !== 'standaloneControl') { ra += renderDataAttrs(node.data); }
  if (node.ariaValueNow !== null && node.ariaValueNow !== undefined) { ra += renderAttr('aria-valuenow', node.ariaValueNow); }
  if (node.role === 'icon') { ra += renderAttr('title', node.tooltip) + renderAttr('aria-label', node.tooltip || node.label); }
  if ((node.role === 'button' || node.role === 'icon') && node.disabled) { ra += ' disabled'; }
  if (node.hidden) { ra += ' hidden'; }
  if (node.role !== 'check') { ra += renderAttr('data-pick', node.pick); }

  return ra;
}

/** Gọi một hàm slot theo tên rồi vẽ các Block nó dựng. Tài liệu 04 Phần 6: hàm slot trả về node, không bao giờ trả về chuỗi HTML. */
function renderSlot(ten, ctx) {
  if (typeof SLOTS === 'undefined' || !SLOTS) {
    throw new Error('Schema gọi slot "' + ten + '" mà bảng SLOTS chưa có. Thiếu `include` của tệp bảng slot.');
  }
  if (!Object.prototype.hasOwnProperty.call(SLOTS, ten)) {
    throw new Error('Slot "' + ten + '" không có trong bảng SLOTS. Các tên hiện có: ' + Object.keys(SLOTS).join(', ') + '.');
  }

  var con = SLOTS[ten](ctx);
  if (!Array.isArray(con)) {
    throw new Error('Hàm slot "' + ten + '" phải trả về mảng Block, đang trả về ' + typeof con + '.');
  }
  return renderNodes(con, ctx);
}

/** Con của một node: mảng node, hoặc một chuỗi tên slot. */
function renderChildren(node, ctx) {
  if (node.elements === null || node.elements === undefined) { return ''; }
  return typeof node.elements === 'string' ? renderSlot(node.elements, ctx) : renderNodes(node.elements, ctx);
}

/** Mũi tên sổ xuống của Block có `menu`. Lớp nổi và việc mở đóng là của tệp menu. */
function renderMenuCaret(node) {
  // Icon đồng bộ có action trực tiếp; giữ menu cũ trong schema để tương thích dữ liệu nhưng không vẽ menu trung gian.
  return node.menu && !node.action ? '<span class="shin-caret" aria-hidden="true">▾</span>' : '';
}

/** Ruột một card: hàng tiêu đề rồi thẻ ruột. `titleActions` là mảng khai thô nên đi qua `screenBar` để thành Block, cùng đường với mục header. */
function renderCardInner(node, ctx) {
  var muc = screenBar(node.titleActions, 'titleActions của card');
  var dau = '';

  if (node.title || muc.length) {
    dau = '<div class="shin-card-head"><div class="shin-card-title">' + renderEscape(node.title) + '</div>'
      + (muc.length ? '<div class="shin-card-actions">' + renderNodes(muc, ctx) + '</div>' : '')
      + '</div>';
  }

  return dau + '<div class="shin-card-body"' + renderSpatialAttrs(node.spatialConfig) + '>' + renderChildren(node, ctx) + '</div>';
}

/** Đường dẫn đầy đủ của một trường. Khai cụt thì lấy `entity` của màn — tài liệu 03 Phần 8. */
function renderFieldPath(node, ctx) {
  var khai = String(node.field || '');
  if (!khai) { throw new Error('Block vai "field" thiếu khóa `field`.'); }

  var phan = khai.split('.');
  if (phan.length === 2) { return { entity: phan[0], name: phan[1] }; }
  if (phan.length > 2) { throw new Error('Đường dẫn trường "' + khai + '" phải là `tên trường` hoặc `thực thể.tên trường`.'); }
  if (!ctx || !ctx.entity) { throw new Error('Trường "' + khai + '" khai cụt mà ngữ cảnh vẽ không có `entity` để suy ra thực thể.'); }

  return { entity: ctx.entity, name: khai };
}

/** Giá trị của trường, lấy từ bản ghi trong ngữ cảnh. Không có bản ghi thì rỗng — đó là ca form thêm mới, không phải lỗi. */
function renderFieldValue(ctx, duong) {
  var ban = ctx && ctx.records ? ctx.records[duong.entity] : null;
  var v = ban ? ban[duong.name] : null;
  return v === null || v === undefined ? '' : v;
}

/** Lớp màu của `badge`, suy theo danh mục chứ không theo giá trị: `@CAT_CONG_VIEC` ra `shin-badge-cong-viec`. Trường khai bằng `options` không có danh mục nên chip xám. */
function renderBadgeClass(khai) {
  if (!khai.source) { return ''; }
  return ' shin-badge-' + String(khai.source).replace(/^@CAT_/, '').toLowerCase().replace(/_/g, '-');
}

/** Thuộc tính chung của mọi ô: id để nhãn trỏ tới, `data-field` mang đường dẫn đầy đủ, và dấu chỉ-đọc cho bộ thu thập. */
function renderControlAttrs(o, lop) {
  return renderAttr('class', lop + (o.carried ? ' shin-carried' : '')) + renderAttr('id', o.id)
    + renderAttr('data-field', o.path) + (o.readonly ? ' data-readonly="1"' : '');
}

/**
 * Hai thuộc tính tắt trợ giúp của trình duyệt, đặt trên mọi ô nhập.
 *
 * `autocomplete="new-password"`: Chrome coi `autocomplete="off"` là góp ý và vẫn có thể bật hộp autofill địa chỉ/email. Token này
 * ngăn Chrome dựng popup đen đè lên popup của sidebar; nó không biến ô nhập thành ô mật khẩu.
 *
 * `spellcheck="false"`: tên riêng và mã khách gạch chân đỏ hết, mà không có chữ nào để sửa.
 * `autocomplete="new-password"` được dùng vì Chrome có thể bỏ qua `off` và tự mở popup autofill địa chỉ/email.
 */
function renderInputGuard() {
  return ' autocomplete="new-password" spellcheck="false"';
}

/**
 * Khung chung của hai control gõ-để-lọc: ô nhập và một hộp danh sách rỗng để phần bàn phím đổ nội dung vào sau. Không mũi tên — bù lại bằng phép tự bung lúc ô nhận con trỏ, xem `client/ui/inputs.html`.
 *
 * `goi` là chữ mờ trong ô lúc ô còn rỗng, và nó là **thứ duy nhất nói cho người dùng biết ô này có danh sách**: không có mũi tên thì một ô trống của `select` trông y hệt một ô chữ tự do. Bản cũ đặt `--Chọn--` cho ô chỉ chọn được trong danh sách và `--Chọn hoặc nhập--` cho ô cho phép gõ giá trị mới; hai chữ khác nhau vì hai luật khác nhau, và người dùng biết trước mình có được gõ tay hay không.
 */
function renderCombo(o, lop, goi, them) {
  return '<div class="shin-combo ' + lop + '">'
    + '<input type="text" role="combobox" aria-expanded="false"'
    + renderControlAttrs(o, 'shin-input') + renderAttr('value', o.value) + renderAttr('placeholder', goi)
    + renderInputGuard() + them
    + (o.readonly ? ' readonly' : '') + '>'
    + '<div class="shin-popup-list shin-combo-list" hidden></div>'
    + '</div>';
}

/** Tám control của tài liệu 03 Phần 7. Ô nào cũng mang `data-field`, kể cả ô chỉ đọc, vì bộ thu thập lọc theo `data-readonly` chứ không theo việc có hay không có `data-field`. */
var RENDER_CONTROLS = {
  text: function (o) {
    return '<input type="text"' + renderControlAttrs(o, 'shin-input') + renderAttr('value', o.value)
      + renderInputGuard() + (o.readonly ? ' readonly' : '') + '>';
  },
  textarea: function (o) {
    return '<textarea rows="3"' + renderControlAttrs(o, 'shin-input shin-textarea')
      + renderInputGuard() + (o.readonly ? ' readonly' : '') + '>' + renderEscape(o.value) + '</textarea>';
  },
  /**
   * Chữ chỉ đọc, cao theo nội dung. Control thứ tám, thêm vào vì card GHI CHÚ của màn xem khai `overflow: 'collapse'` mà một ô nhập thì cao cố định nên phép thu gọn không bao giờ chạm tới — nút "Xem thêm" không bao giờ hiện, và một ghi chú dài nằm gọn trong một dòng ô nhập.
   *
   * Luôn chỉ đọc, không phải theo cờ ở bản khai: nó vẽ ra `div` nên không có đường gõ, và để bộ thu thập lúc lưu chắc chắn bỏ qua thay vì đọc ra chuỗi rỗng rồi xóa mất ghi chú cũ.
   *
   * Đây là control **duy nhất** được mang `data-action` trên chính thẻ ô, vì nó là control duy nhất vẽ ra một thẻ không bấm được sẵn: cả khối chữ thành chỗ bấm thì mở form ghi chú dễ hơn nhắm một cái bút chì 20 pixel ở góc. Ô nhập thì tuyệt đối không — bấm vào ô để gõ mà nó nhảy sang màn khác là một cái bẫy.
   */
  readText: function (o) {
    o.readonly = true;
    return '<div' + renderControlAttrs(o, 'shin-readtext')
      + (o.action ? renderAttr('data-action', o.action) + ' title="Sửa"' : '')
      + '>' + renderEscape(o.value) + '</div>';
  },
  number: function (o) {
    return '<input type="text" inputmode="numeric"' + renderControlAttrs(o, 'shin-input shin-number')
      + renderAttr('value', valueTextNumber(o.value)) + renderInputGuard() + (o.readonly ? ' readonly' : '') + '>';
  },
  date: function (o) {
    return '<input' + renderAttr('type', o.khai.precision === 'minute' ? 'datetime-local' : 'date')
      + renderControlAttrs(o, 'shin-input shin-date') + renderAttr('value', valueTextDateInput(o.value))
      + renderInputGuard() + (o.readonly ? ' readonly' : '') + '>';
  },
  select: function (o) {
    return renderCombo(o, 'shin-combo-select', '--Chọn--', renderAttr('data-source', o.khai.source));
  },
  customerPicker: function (o) {
    return renderCombo(o, 'shin-combo-picker', '--Chọn hoặc nhập--', ' data-picker="customer"');
  },
  badge: function (o) {
    return '<span' + renderControlAttrs(o, 'shin-badge' + renderBadgeClass(o.khai)) + '>' + renderEscape(o.value) + '</span>';
  }
};

/** Bảng khai của một trường. Tên thực thể hay tên trường sai thì chính `Schema` ném lỗi kèm gợi ý, nên ở đây chỉ canh ca schema chưa nạp. */
function renderFieldSchema(duong) {
  if (typeof Schema === 'undefined' || !Schema) {
    throw new Error('Vẽ trường "' + duong.name + '" mà `Schema` chưa nạp — bản khai trường đi cùng gói nạp đầu tiên.');
  }
  return Schema[duong.entity][duong.name];
}

/** Id của ô một trường. Công thức nằm ở một chỗ duy nhất vì bên vẽ và bên đặt con trỏ đều cần. */
function renderFieldId(duong) {
  return 'shin-f-' + duong.entity + '-' + duong.name;
}

/** Chỉ-đọc là hoặc bảng khai trường hoặc dòng `UI_SCHEMA`, không có đường ngược lại: `node.readonly` chỉ cộng thêm chứ không mở khóa được trường mà `DATA_SCHEMA` đã khóa — **`[RÀNG BUỘC CỨNG]`** tài liệu 03 Phần 7. */
function renderFieldReadonly(node, khai) {
  return khai.readonly === true || node.readonly === true;
}

/**
 * Ô này có đang mang giá trị kế tục từ bản ghi trước không — tài liệu 03 dòng 96 giao việc đánh dấu cho engine.
 *
 * `ctx.carried` là danh sách tên trường của chính thực thể màn đang mở, nên phải so cả `entity`: `customer.note` nằm trên màn giao dịch không được ăn dấu vì `activity` tình cờ cũng có trường tên `note`.
 */
function renderFieldCarried(ctx, duong) {
  if (!ctx.carried || duong.entity !== ctx.entity) { return false; }
  return ctx.carried.indexOf(duong.name) !== -1;
}


/** Ruột một trường: hàng nhãn, kèm nút bút chì khi trường khai `action`, rồi tới ô. Ô loại `readText` thì tự nhận việc lên chính nó và hàng nhãn thôi mọc bút chì — xem bên dưới. */
function renderFieldInner(node, ctx) {
  var duong = renderFieldPath(node, ctx);
  var khai = renderFieldSchema(duong);
  var control = node.control || RENDER_CONTROL_BY_TYPE[khai.type];

  if (!Object.prototype.hasOwnProperty.call(RENDER_CONTROLS, control)) {
    throw new Error('Trường "' + duong.name + '" khai control "' + control + '" không có. Các control: ' + Object.keys(RENDER_CONTROLS).join(', ') + '.');
  }

  var o = {
    path: duong.entity + '.' + duong.name,
    id: renderFieldId(duong),
    value: renderFieldValue(ctx, duong),
    readonly: renderFieldReadonly(node, khai),
    carried: renderFieldCarried(ctx, duong),
    khai: khai
  };
  // `readText` vẽ ra một khối chữ, nên nó tự nhận `action` lên chính thẻ mình: cả khối là chỗ bấm, và hàng nhãn không mọc thêm bút chì để cùng một việc có hai cửa cạnh nhau. Mọi control còn lại là ô nhập nên việc phải nằm ở một nút riêng.
  var tuNhanViec = control === 'readText' && !!node.action;
  if (tuNhanViec) { o.action = node.action; }

  var but = node.action && !tuNhanViec
    ? '<button type="button" class="shin-field-edit" title="Sửa"' + renderAttr('data-action', node.action) + '>' + iconSvg('pencil') + '</button>'
    : '';

  return '<div class="shin-field-head"><label class="shin-label"' + renderAttr('for', o.id) + '>'
    + renderEscape(node.label === null ? khai.label : node.label)
    + (khai.required ? '<span class="shin-label-req" aria-hidden="true"> *</span>' : '')
    + '</label>' + but + '</div>'
    + RENDER_CONTROLS[control](o);
}

/** StandaloneControl không mang `data-field`, nên không bao giờ đi vào luồng lưu dữ liệu nghiệp vụ. */
function renderStandaloneControlInner(node) {
  var kind = String(node.kind || 'input'), className = String(node.className || ''), common = renderAttr('id', node.id) + renderDataAttrs(node.data) + renderAttr('aria-label', node.ariaLabel || node.label) + (node.disabled ? ' disabled' : '') + (node.hidden ? ' hidden' : '');
  if (!node.id) { throw new Error('Block vai "standaloneControl" cần `id` để thao tác và giữ node ổn định.'); }
  if (kind === 'input') {
    var inputType = String(node.inputType || 'text');
    if (['text', 'password', 'number'].indexOf(inputType) < 0) { throw new Error('StandaloneControl input chỉ nhận inputType text, password hoặc number.'); }
    return '<input' + renderAttr('type', inputType) + renderAttr('class', 'shin-input' + (className ? ' ' + className : '')) + common + ' value="' + renderEscape(node.value === null || node.value === undefined ? '' : node.value) + '"' + renderAttr('placeholder', node.placeholder) + '>';
  }
  if (kind === 'select') {
    if (!Array.isArray(node.options)) { throw new Error('StandaloneControl select cần `options` là mảng.'); }
    node.options.forEach(function (option) {
      if (!option || typeof option !== 'object' || option.value === undefined || option.label === undefined) { throw new Error('Mỗi option của StandaloneControl select cần `value` và `label`.'); }
    });
    var selected = node.options.filter(function (option) { return String(option.value) === String(node.value); })[0] || null;
    var selectedValue = selected ? selected.value : (node.options[0] ? node.options[0].value : '');
    var selectedLabel = selected ? selected.label : (node.options[0] ? node.options[0].label : '');
    var attrs = renderAttr('class', 'shin-input shin-combo-select' + (className ? ' ' + className : ''))
      + renderAttr('id', node.id) + renderDataAttrs(node.data)
      + renderAttr('aria-label', node.ariaLabel || node.label)
      + renderAttr('aria-expanded', 'false') + renderAttr('data-standalone-select', '1')
      + renderAttr('data-value', selectedValue) + renderAttr('data-standalone-options', JSON.stringify(node.options))
      + (node.disabled ? ' disabled' : '') + (node.hidden ? ' hidden' : '')
      + renderAttr('value', selectedLabel) + renderAttr('placeholder', node.placeholder || '--Chọn--')
      + renderInputGuard() + ' readonly';
    return '<div class="shin-combo shin-combo-standalone">'
      + '<input type="text" role="combobox"' + attrs + '>'
      + '<div class="shin-popup-list shin-combo-list" hidden></div>'
      + '</div>';
  }
  if (kind === 'toggle') {
    return '<button type="button"' + renderAttr('class', 'shin-toggle-control' + (className ? ' ' + className : '')) + common + renderAttr('aria-pressed', node.pressed ? 'true' : 'false') + '>'
      + '<span class="shin-toggle-label">' + (node.pressed ? 'ON' : 'OFF') + '</span><span class="shin-toggle-knob"></span></button>';
  }
  throw new Error('StandaloneControl có `kind` không hợp lệ: "' + kind + '".');
}

/** Ruột từng vai. Nút và icon tự thêm mũi nhọn khi có menu, còn hộp và hàng thì chỉ có con. */
var RENDER_INNER_BY_ROLE = {
  box: renderChildren,
  card: renderCardInner,
  row: renderChildren,
  text: function (node) { return renderEscape(node.text); },
  field: renderFieldInner,
  standaloneControl: renderStandaloneControlInner,
  button: function (node) { return '<span class="shin-btn-label">' + renderEscape(node.label) + '</span>' + renderMenuCaret(node); },
  /**
   * Glyph **và** chữ, cả hai khi cả hai được khai — chứ không phải chọn một.
   *
   * Trước đây lá này vẽ glyph rồi bỏ hẳn `label`, nên `{ icon: 'pencil', label: 'Sửa' }` ở `titleActions` ra một cái bút chì trơ trọi: đúng cái đã làm hàng tiêu đề card lệch khỏi bản cũ, nơi mục đó là một đường dẫn chữ xanh `✎ Sửa`. Chính docstring của `Icon` cũng đã hứa "có thể kèm chữ" từ đầu.
   *
   * Không khai gì thì chặn ngay: một nút không glyph không chữ vẫn nhận `data-action` và vẫn bấm được, nên nó là một chỗ bấm vô hình — loại lỗi chỉ lộ ra khi người dùng bấm trượt.
   */
  icon: function (node) {
    if (!node.icon && !node.label) {
      throw new Error('Block vai "icon" không khai cả `icon` lẫn `label` — nút sẽ vẽ ra rỗng mà vẫn bấm được. Các glyph dùng được: ' + iconNames().join(', ') + '.');
    }
    return (node.icon ? iconSvg(node.icon) : '')
      + (node.label ? '<span class="shin-btn-label">' + renderEscape(node.label) + '</span>' : '')
      + renderMenuCaret(node);
  },
  check: function (node) {
    if (!node.pick) { throw new Error('Block vai "check" thiếu khóa `pick` — ô đánh dấu phải biết nó chọn bản ghi nào.'); }
    return '<input type="checkbox" class="shin-check-box"' + renderAttr('data-pick', node.pick)
      + renderAttr('aria-label', node.label || 'Chọn dòng') + '>';
  }
};

/** Một Block thành chuỗi HTML. Có `id` thì cất vào sổ tra để `renderTarget` vẽ lại được đúng nút đó về sau. */
function renderNode(node, ctx) {
  if (!node || BLOCK_ROLES.indexOf(node.role) === -1) {
    throw new Error('Block phải có `role` thuộc: ' + BLOCK_ROLES.join(', ') + '. Đang nhận "' + (node && node.role) + '".');
  }
  if (node.id && node.role !== 'standaloneControl') { RENDER_INDEX.nodes[node.id] = node; }

  var the = RENDER_TAG_BY_ROLE[node.role];
  return '<' + the + renderNodeAttrs(node) + '>' + RENDER_INNER_BY_ROLE[node.role](node, ctx) + '</' + the + '>';
}

function renderNodes(nodes, ctx) {
  var out = '';
  for (var i = 0; i < nodes.length; i += 1) { out += renderNode(nodes[i], ctx); }
  return out;
}

/** Gắn một cây Block vào vùng động; mọi module ngoài màn chính dùng cổng này thay vì tự dựng HTML/DOM. */
function renderBlockInto(parent, node, ctx) {
  if (!parent || !node) { throw new Error('renderBlockInto cần vùng đích và Block.'); }
  var range = document.createRange();
  var fragment = range.createContextualFragment(renderNode(node, ctx || {}));
  var first = fragment.firstElementChild;
  parent.appendChild(fragment);
  return first;
}

/** Đặt giá trị điều khiển qua renderer, dùng cho dữ liệu tự điền mà không được dựng lại form. */
function renderControlValue(id, value) {
  var control = document.getElementById(id);
  if (!control || ['INPUT', 'SELECT', 'TEXTAREA'].indexOf(control.tagName) < 0) { return false; }
  if (control.getAttribute && control.getAttribute('data-standalone-select') === '1') {
    var options = renderStandaloneOptions(control);
    var selected = options.filter(function (option) { return option && String(option.value) === String(value); })[0];
    control.setAttribute('data-value', value === null || value === undefined ? '' : String(value));
    control.value = selected ? String(selected.label) : (value === null || value === undefined ? '' : String(value));
    return true;
  }
  control.value = value === undefined || value === null ? '' : String(value);
  return true;
}

function renderStandaloneOptions(control) {
  if (!control || !control.getAttribute) { return []; }
  var raw = control.getAttribute('data-standalone-options') || '[]';
  try { return JSON.parse(String(raw).replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&')); } catch (ignore) { return []; }
}

/* ─── Việc 4: gán chuỗi vào khung. Từ đây trở xuống mới có `document`. ─── */

/** Bốn vùng engine được phép vẽ. Dải tiến trình không có trong bảng: nó bật tắt theo lượt gọi máy chủ, không thuộc màn nào. */
var RENDER_REGIONS = { header: 'sidebar-header', info: 'sidebar-info', body: 'sidebar-body', footer: 'sidebar-footer' };

function renderRegionElement(ten) {
  var el = document.getElementById(RENDER_REGIONS[ten]);
  if (!el) { throw new Error('Khung sidebar thiếu vùng "' + RENDER_REGIONS[ten] + '".'); }
  return el;
}

/**
 * Vẽ cả một màn. Trả về bốn chuỗi đã dựng để bộ kiểm đọc được mà không cần DOM.
 *
 * Dựng đủ bốn chuỗi trong RAM rồi mới gán — chống nháy, `[RÀNG BUỘC CỨNG]` tài liệu 04 Phần 6. Gán dần từng vùng thì người dùng thấy màn hiện theo mảnh, và một lỗi ở vùng cuối để lại màn nửa cũ nửa mới.
 */
function renderScreen(man, boiCanh) {
  var nen = {
    entity: man.entity,
    records: (boiCanh && boiCanh.records) || {},
    carried: (boiCanh && boiCanh.carried) || null,
    screen: man
  };
  RENDER_INDEX = { nodes: {}, menus: {}, ctx: nen, dem: 0 };

  var html = {
    header: renderNodes(man.header, nen),
    info: man.infoBar ? renderSlot('infoBarContent', nen) : '',
    body: renderNodes(man.body, nen),
    footer: renderNodes(man.footer, nen)
  };

  Object.keys(RENDER_REGIONS).forEach(function (ten) { renderRegionElement(ten).innerHTML = html[ten]; });
  renderRegionElement('info').hidden = !man.infoBar;
  renderRegionElement('footer').hidden = man.footer.length === 0;
  if (typeof selectionPollPaint === 'function') { selectionPollPaint(); }

  return html;
}

/**
 * Vẽ lại đúng một vùng theo `id` — cách duy nhất đổi nội dung màn, `[RÀNG BUỘC CỨNG]` tài liệu 04 Phần 6.
 *
 * Chỉ thay **ruột**, giữ thẻ ngoài: `style` không gian và `data-collapse` còn nguyên nên vùng không nhảy chiều cao lúc thay.
 */
function renderTarget(id) {
  var node = RENDER_INDEX.nodes[id];
  if (!node) { throw new Error('Màn đang mở không có Block nào mang id "' + id + '". Muốn vẽ lại thì Block phải khai `id`.'); }

  var el = document.getElementById(id);
  if (!el) { throw new Error('Block "' + id + '" có trong sổ tra nhưng không có trên màn — màn đã bị vẽ lại mà sổ tra chưa theo.'); }

  el.innerHTML = RENDER_INNER_BY_ROLE[node.role](node, RENDER_INDEX.ctx);
  return el;
}

/** Cập nhật trạng thái của một node đã được renderer dựng. Sync dùng cổng này cho
 * hidden/disabled/class/aria thay vì tự sửa DOM ở từng màn hình. */
function renderTargetState(id, state) {
  var el = document.getElementById(id);
  if (!el || !state) { return false; }
  if (state.hidden !== undefined) { el.hidden = !!state.hidden; }
  if (state.disabled !== undefined) { el.disabled = !!state.disabled; }
  if (state.ariaPressed !== undefined) { el.setAttribute('aria-pressed', state.ariaPressed ? 'true' : 'false'); }
  if (state.ariaValueNow !== undefined && state.ariaValueNow !== null) { el.setAttribute('aria-valuenow', String(state.ariaValueNow)); }
  if (state.removeAriaValueNow) { el.removeAttribute('aria-valuenow'); }
  if (state.ariaLabel !== undefined) { el.setAttribute('aria-label', String(state.ariaLabel || '')); }
  if (state.title !== undefined) { el.title = String(state.title || ''); }
  if (state.text !== undefined) { el.textContent = String(state.text === null || state.text === undefined ? '' : state.text); }
  if (state.value !== undefined && 'value' in el) {
    if (el.getAttribute && el.getAttribute('data-standalone-select') === '1') { renderControlValue(id, state.value); }
    else { el.value = state.value === null || state.value === undefined ? '' : String(state.value); }
  }
  if (state.childText && typeof state.childText === 'object') {
    Object.keys(state.childText).forEach(function (selector) { var child = el.querySelector(selector); if (child) { child.textContent = String(state.childText[selector] === null || state.childText[selector] === undefined ? '' : state.childText[selector]); } });
  }
  if (state.className !== undefined) { el.className = String(state.className || ''); }
  if (Array.isArray(state.addClass)) { state.addClass.forEach(function (name) { if (name) { el.classList.add(String(name)); } }); }
  if (Array.isArray(state.removeClass)) { state.removeClass.forEach(function (name) { if (name) { el.classList.remove(String(name)); } }); }
  if (state.style && typeof state.style === 'object') {
    Object.keys(state.style).forEach(function (name) { el.style[name] = String(state.style[name]); });
  }
  if (state.disabledDescendants !== undefined) {
    var blocked = !!state.disabledDescendants, except = Array.isArray(state.except) ? state.except : [];
    el.querySelectorAll('button, select, input, textarea').forEach(function (control) {
      if (except.indexOf(control.id) >= 0) { return; }
      if (blocked) {
        if (!control.hasAttribute('data-render-disabled-from')) { control.setAttribute('data-render-disabled-from', control.disabled ? 'true' : 'false'); }
        control.disabled = true;
      } else if (control.hasAttribute('data-render-disabled-from')) {
        control.disabled = control.getAttribute('data-render-disabled-from') === 'true';
        control.removeAttribute('data-render-disabled-from');
      }
    });
  }
  return el;
}

/** Thay các con của một vùng bằng danh sách Block. Đây là phép thay toàn vùng
 * duy nhất mà Sync được dùng khi chuyển màn hình hoặc khởi tạo lần đầu. */
function renderReplaceChildren(parent, nodes, ctx) {
  if (!parent || !Array.isArray(nodes)) { throw new Error('renderReplaceChildren cần vùng đích và mảng Block.'); }
  /* Một vùng động có thể được thay sau khi callback nền đã đăng ký các Block con. Xóa dấu tra của chính vùng đó trước khi
     dựng cây mới; nếu giữ lại, lượt callback kế tiếp sẽ tìm thấy node cũ trong RENDER_INDEX nhưng không tìm thấy phần tử DOM. */
  if (typeof RENDER_INDEX !== 'undefined' && RENDER_INDEX && RENDER_INDEX.nodes && typeof document !== 'undefined') {
    Object.keys(RENDER_INDEX.nodes).forEach(function (id) {
      var element = document.getElementById(id);
      if (!element || element === parent || (typeof parent.contains === 'function' && parent.contains(element))) {
        delete RENDER_INDEX.nodes[id];
      }
    });
  }
  var range = document.createRange();
  var fragment = range.createContextualFragment(renderNodes(nodes, ctx || RENDER_INDEX.ctx || {}));
  parent.innerHTML = '';
  parent.appendChild(fragment);
  return parent;
}
</script>
