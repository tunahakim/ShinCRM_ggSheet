<script>
/*
 * Cổng duy nhất bảo vệ bản nháp Sidebar trước action có thể làm mất dữ liệu.
 * Module này chỉ điều phối cảnh báo và presentation; provider của form/FBM vẫn giữ snapshot, draft và cửa lưu riêng.
 */
var UNSAVED_CHANGES = { dialogOpen: false, highlighted: false, provider: null, pending: null, busy: false, returnFocus: null, surfaces: {} };

/**
 * Cổng điều phối duy nhất cho mọi vùng có thể chỉnh sửa. Adapter của màn hình
 * chỉ mô tả state và khả năng chạy một intent; nó không được tự chặn click hay
 * tự mở modal. Nhờ vậy màn hình mới không thể tạo thêm một biến thể guard.
 */
function unsavedChangesRegisterSurface(id, factory) {
  var key = String(id || '').trim();
  if (!key || typeof factory !== 'function') { throw new Error('Edit surface phải có id và factory hợp lệ.'); }
  UNSAVED_CHANGES.surfaces[key] = factory;
  return key;
}

function unsavedChangesEnsureDefaultSurfaces() {
  if (!UNSAVED_CHANGES.surfaces.core) {
    unsavedChangesRegisterSurface('core', function () { return unsavedChangesReadProvider('core'); });
  }
  if (!UNSAVED_CHANGES.surfaces.fbm) {
    unsavedChangesRegisterSurface('fbm', function () { return unsavedChangesReadProvider('fbm'); });
  }
}

function unsavedChangesSurfaceCanRun(surface, intent, state) {
  var provider = surface.provider;
  if (!provider || typeof provider.canRun !== 'function') {
    throw new Error('Edit surface "' + surface.id + '" thiếu adapter `canRun`.');
  }
  return provider.canRun(intent || {}, state) === true;
}

/**
 * Component dùng chung cho mọi cảnh báo bản nháp. Sidebar chỉ giữ host cố định;
 * toàn bộ nội dung nhìn thấy và action phải đi qua Block renderer để không có
 * màn nào tự chép lại một hộp thoại riêng.
 */
function unsavedChangesDialogBlocks() {
  return [
    Box({ className: 'shin-unsaved-backdrop', data: { 'unsaved-choice': 'continue' } }),
    Box({ className: 'shin-unsaved-panel', elements: [
      Text({ id: 'shin-unsaved-title', className: 'shin-unsaved-title', text: 'Có thay đổi chưa lưu' }),
      Text({ id: 'shin-unsaved-message', className: 'shin-unsaved-message', text: 'Phát hiện thay đổi chưa lưu. Bạn muốn làm gì trước khi tiếp tục?' }),
      Stack({ className: 'shin-unsaved-actions', elements: [
        Button({ className: 'shin-unsaved-save', data: { 'unsaved-choice': 'save' }, label: 'Lưu thay đổi' }),
        Button({ className: 'shin-unsaved-discard', data: { 'unsaved-choice': 'discard' }, label: 'Hủy bỏ thay đổi' }),
        Button({ className: 'shin-unsaved-continue', data: { 'unsaved-choice': 'continue' }, label: 'Tiếp tục sửa' })
      ] })
    ] })
  ];
}

function unsavedChangesRenderDialog() {
  var dialog = unsavedChangesDialog();
  if (!dialog) { throw new Error('Sidebar thiếu host cảnh báo thay đổi chưa lưu.'); }
  if (!dialog.querySelector('[data-unsaved-choice]')) {
    if (typeof renderReplaceChildren !== 'function') { throw new Error('Sidebar chưa nạp component renderer cho cảnh báo thay đổi chưa lưu.'); }
    renderReplaceChildren(dialog, unsavedChangesDialogBlocks(), {});
  }
  return dialog;
}

function unsavedChangesNormalize(value) {
  if (value === null || value === undefined) { return ''; }
  if (typeof value === 'boolean') { return value ? 'true' : 'false'; }
  if (typeof value === 'number') { return String(value); }
  return String(value).trim();
}

function unsavedChangesEqual(left, right) {
  return unsavedChangesNormalize(left) === unsavedChangesNormalize(right);
}

function unsavedChangesApplyFields(fieldIds) {
  unsavedChangesClearFields();
  (fieldIds || []).forEach(function (id) {
    var control = document.getElementById(String(id || ''));
    if (!control) { return; }
    var field = control.closest && control.closest('.shin-form-field');
    field = field || control;
    if (field.classList) { field.classList.add('shin-field-changed'); }
    control.setAttribute('data-unsaved-changed', '1');
  });
  UNSAVED_CHANGES.highlighted = !!(fieldIds && fieldIds.length);
}

function unsavedChangesClearFields() {
  if (typeof document === 'undefined' || !document.querySelectorAll) { return; }
  document.querySelectorAll('.shin-field-changed').forEach(function (field) { if (field.classList) { field.classList.remove('shin-field-changed'); } });
  document.querySelectorAll('[data-unsaved-changed]').forEach(function (control) { control.removeAttribute('data-unsaved-changed'); });
  UNSAVED_CHANGES.highlighted = false;
}

function unsavedChangesDialog() { return document.getElementById('shin-unsaved-dialog'); }

function unsavedChangesSetBusy(busy) {
  var dialog = unsavedChangesDialog();
  UNSAVED_CHANGES.busy = busy === true;
  if (!dialog) { return; }
  dialog.setAttribute('aria-busy', UNSAVED_CHANGES.busy ? 'true' : 'false');
  dialog.querySelectorAll('[data-unsaved-choice]').forEach(function (button) { button.disabled = UNSAVED_CHANGES.busy; });
}

function unsavedChangesOpen() {
  var dialog = unsavedChangesDialog();
  if (!dialog) { throw new Error('Sidebar thiếu host cảnh báo thay đổi chưa lưu.'); }
  dialog.hidden = false;
  dialog.setAttribute('aria-hidden', 'false');
  UNSAVED_CHANGES.dialogOpen = true;
  var stay = dialog.querySelector('[data-unsaved-choice="continue"]');
  if (stay && stay.focus) { stay.focus(); }
}

function unsavedChangesClose(preserveBusy) {
  var dialog = unsavedChangesDialog();
  if (dialog) {
    dialog.hidden = true;
    dialog.setAttribute('aria-hidden', 'true');
  }
  UNSAVED_CHANGES.dialogOpen = false;
  if (preserveBusy !== true) { unsavedChangesSetBusy(false); }
  var focus = UNSAVED_CHANGES.returnFocus;
  UNSAVED_CHANGES.returnFocus = null;
  if (focus && focus.focus && focus.isConnected !== false) { focus.focus(); }
}

function unsavedChangesNotifyFailure(error) {
  if (typeof alert === 'function') { alert(error && error.message ? error.message : 'Không xử lý được thay đổi chưa lưu.'); }
}

function unsavedChangesReadProvider(kind) {
  if (kind === 'fbm' && typeof FBM_SYNC_CLIENT !== 'undefined' && typeof fbmSyncConfigUnsavedProvider === 'function') { return fbmSyncConfigUnsavedProvider(); }
  if (kind === 'core' && typeof saveFlowUnsavedProvider === 'function') { return saveFlowUnsavedProvider(); }
  return null;
}

function unsavedChangesRefresh() {
  var provider = UNSAVED_CHANGES.provider;
  if (!provider || !UNSAVED_CHANGES.highlighted || typeof provider.read !== 'function') { return; }
  var state = provider.read();
  if (!state || !state.dirty) { unsavedChangesClearFields(); return; }
  unsavedChangesApplyFields(state.fieldIds || []);
}

function unsavedChangesFinish(operation) {
  var provider = UNSAVED_CHANGES.provider, pending = UNSAVED_CHANGES.pending;
  if (!provider) { return; }
  unsavedChangesClose(true);
  var result;
  try { result = typeof provider[operation] === 'function' ? provider[operation]() : null; } catch (error) {
    UNSAVED_CHANGES.pending = pending;
    unsavedChangesSetBusy(false);
    unsavedChangesNotifyFailure(error);
    return;
  }
  Promise.resolve(result).then(function (value) {
    if (value && value.ok === false) {
      UNSAVED_CHANGES.pending = pending;
      unsavedChangesSetBusy(false);
      unsavedChangesNotifyFailure(value.message || value.error || 'Không lưu được thay đổi chưa lưu.');
      return;
    }
    /* discard đã là quyết định bỏ bản nháp của provider. Không đọc lại DOM cũ
       sau đó, vì form chưa render lại có thể vẫn trả dirty dù nháp đã bị bỏ. */
    var state = operation === 'save' && typeof provider.read === 'function' ? provider.read() : null;
    if (operation === 'save' && state && state.dirty) { UNSAVED_CHANGES.pending = pending; unsavedChangesSetBusy(false); return; }
    unsavedChangesClearFields();
    UNSAVED_CHANGES.provider = null;
    UNSAVED_CHANGES.pending = null;
    unsavedChangesSetBusy(false);
    if (typeof pending === 'function') { return pending(); }
    return null;
  }, function (error) {
    UNSAVED_CHANGES.pending = pending;
    unsavedChangesSetBusy(false);
    unsavedChangesNotifyFailure(error);
  });
}

function unsavedChangesResolve(choice) {
  if (!UNSAVED_CHANGES.dialogOpen || UNSAVED_CHANGES.busy) { return; }
  if (choice === 'continue') {
    unsavedChangesClose();
    unsavedChangesRefresh();
    UNSAVED_CHANGES.provider = null;
    UNSAVED_CHANGES.pending = null;
    return;
  }
  if (choice !== 'save' && choice !== 'discard') { return; }
  unsavedChangesSetBusy(true);
  unsavedChangesFinish(choice);
}

function unsavedChangesInstall() {
  if (UNSAVED_CHANGES.installed) { return; }
  UNSAVED_CHANGES.installed = true;
  unsavedChangesRenderDialog();
  document.addEventListener('click', function (event) {
    var target = event.target && event.target.closest ? event.target.closest('[data-unsaved-choice]') : null;
    if (!target) { return; }
    event.preventDefault();
    unsavedChangesResolve(target.getAttribute('data-unsaved-choice'));
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && UNSAVED_CHANGES.dialogOpen && !UNSAVED_CHANGES.busy) {
      event.preventDefault();
      unsavedChangesResolve('continue');
    }
  });
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('beforeunload', function (event) {
      var dirty = false;
      ['core', 'fbm'].some(function (kind) {
        var provider = unsavedChangesReadProvider(kind), state;
        if (!provider || typeof provider.read !== 'function') { return false; }
        try { state = provider.read(); } catch (ignore) { return false; }
        dirty = !!(state && state.dirty);
        return dirty;
      });
      if (!dirty) { return; }
      event.preventDefault();
      event.returnValue = '';
      return '';
    });
  }
}

/** Trả true khi action đã bị giữ lại ở hộp cảnh báo; false nghĩa là bên gọi được chạy ngay. */
function unsavedChangesGuard(kind, pending) {
  var provider = unsavedChangesReadProvider(kind);
  if (!provider || typeof provider.read !== 'function') { return false; }
  var state;
  try { state = provider.read(); } catch (error) { unsavedChangesNotifyFailure(error); return true; }
  if (!state || !state.dirty) {
    if (UNSAVED_CHANGES.provider === provider || (!UNSAVED_CHANGES.provider && UNSAVED_CHANGES.highlighted)) { unsavedChangesClearFields(); UNSAVED_CHANGES.provider = null; UNSAVED_CHANGES.pending = null; }
    return false;
  }
  if (UNSAVED_CHANGES.dialogOpen) { return true; }
  UNSAVED_CHANGES.provider = provider;
  UNSAVED_CHANGES.pending = pending;
  UNSAVED_CHANGES.returnFocus = document.activeElement;
  unsavedChangesApplyFields(state.fieldIds || []);
  unsavedChangesOpen();
  return true;
}

function unsavedChangesGuardTransition(intent, pending) {
  unsavedChangesEnsureDefaultSurfaces();
  var active = [];
  Object.keys(UNSAVED_CHANGES.surfaces).forEach(function (id) {
    var provider;
    try { provider = UNSAVED_CHANGES.surfaces[id](); } catch (error) { unsavedChangesNotifyFailure(error); active.push({ error: true }); return; }
    if (!provider || typeof provider.read !== 'function') { return; }
    var state;
    try { state = provider.read(); } catch (error) { unsavedChangesNotifyFailure(error); active.push({ error: true }); return; }
    if (state && state.editing) { active.push({ id: id, provider: provider, state: state }); }
  });
  if (active.some(function (item) { return item.error; })) { return true; }
  /* Hai vùng cùng edit là trạng thái không hợp lệ. Chặn fail-closed thay vì
     đoán vùng nào được ưu tiên rồi để một action chạy nhầm dữ liệu. */
  if (active.length > 1) {
    unsavedChangesNotifyFailure(new Error('Có nhiều edit surface đang mở đồng thời.'));
    return true;
  }
  if (!active.length) { return false; }

  var surface = active[0];
  var canRun;
  try { canRun = unsavedChangesSurfaceCanRun(surface, intent || {}, surface.state); } catch (error) {
    unsavedChangesNotifyFailure(error);
    return true;
  }
  if (canRun) {
    if (!surface.state.dirty) { unsavedChangesClearFields(); UNSAVED_CHANGES.provider = null; UNSAVED_CHANGES.pending = null; }
    return false;
  }
  if (UNSAVED_CHANGES.dialogOpen) { return true; }
  UNSAVED_CHANGES.provider = surface.provider;
  UNSAVED_CHANGES.pending = pending;
  UNSAVED_CHANGES.returnFocus = document.activeElement;
  unsavedChangesApplyFields(surface.state.fieldIds || []);
  unsavedChangesOpen();
  return true;
}

function unsavedChangesGuardCore(action, pending) {
  return unsavedChangesGuardTransition({ surfaceId: 'core', action: action }, pending);
}

function unsavedChangesGuardFbmTarget(target, pending) {
  return unsavedChangesGuardTransition({ surfaceId: 'fbm', target: target }, pending);
}
</script>
