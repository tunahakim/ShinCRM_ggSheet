<style>
/*
 * Bố cục năm vùng cố định của sidebar, theo bảng ở tài liệu 04 Phần 3.
 *
 * Nhờ khung này, bố cục "bánh kẹp" — thân cuộn được, nút Lưu luôn nhìn thấy ở đáy — có sẵn cho mọi màn mà schema không
 * phải khai gì. `spatialConfig` chỉ còn việc ở các Block bên trong thân.
 *
 * Tệp này cố tình **không** chứa màu chữ, không chứa cỡ chữ, không chứa style của thành phần nào bên trong thân: nó chỉ
 * chia không gian, cộng màu nền của từng vùng vì nền là thuộc tính của cái khung chứ không của cái nằm trong khung. Mọi
 * con số ở đây lấy từ biến trong `client/style/tokens.html`.
 *
 * **Lề ngang là 8 pixel ở mọi vùng trừ vùng thân, nơi nó bằng không.** Sidebar rộng khoảng 300 pixel, mà một card còn một
 * lớp lề riêng bên trong nữa: 12 cộng 12 là 24 pixel mỗi bên, tức một phần sáu bề ngang tiêu cho khoảng trắng. Bản cũ đặt 8
 * và đó là con số đúng — chủ dự án nhìn bản mới liền nói "lề 2 bên còn khá rộng". Riêng vùng thân thì chủ dự án chốt tiếp
 * ngày 06/09/2026 là card ăn hết bề ngang, nên ở đó lề ngang về không; lý do đầy đủ ghi tại chính `#sidebar-body` bên dưới.
 *
 * Ẩn một vùng thì đặt thuộc tính `hidden` lên chính thẻ đó, không đổi `class`. Dùng thuộc tính có sẵn của HTML thì trình
 * đọc màn hình cũng hiểu là vùng đó không còn, còn một lớp CSS tự đặt thì chỉ mắt người thấy.
 */

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--shin-bg);
  color: var(--shin-text);
  font-family: var(--shin-font);
  font-size: var(--shin-text-md);
  line-height: var(--shin-line-height);
}

*, *::before, *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

/*
  Thanh cuộn mảnh, dùng cho mọi vùng cuộn được: vùng thân, danh sách gợi ý, lớp menu, ô nhập nhiều dòng.

  Thanh cuộn mặc định của Chrome rộng 15 pixel. Trên một sidebar rộng 300, đó là 5% bề ngang tiêu cho một cái máng
  trượt. Bản cũ đặt 4 pixel; ở đây 6, vì 4 pixel thì khó bấm đúng vào con trượt bằng chuột — đổi 2 pixel bề ngang lấy
  một con trượt kéo được là đáng.

  **Không** khai `scrollbar-width: thin` cạnh đây: từ Chrome 121, hễ có mặt thuộc tính chuẩn đó thì trình duyệt bỏ qua
  hết nhóm `::-webkit-scrollbar`, và `thin` của Chrome là khoảng 11 pixel — khai thêm cho Firefox thì mất luôn 6 pixel
  ở Chrome, mà sidebar này đi cùng một Extension của Chrome.
*/
::-webkit-scrollbar { width: 6px; height: 6px; }

::-webkit-scrollbar-track { background: transparent; }

::-webkit-scrollbar-thumb { background: var(--shin-border-strong); border-radius: 3px; }

::-webkit-scrollbar-thumb:hover { background: var(--shin-text-faint); }

/* Gốc của khung: một cột cao đúng bằng khung sidebar, không cuộn — phần cuộn là việc của vùng thân. */
#sidebar-root {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

/* Thông báo bận nằm trong luồng bố cục: hiện ra dưới dải tiến trình và đẩy toàn bộ nội dung phía sau xuống. */
.shin-busy-notice {
  flex: 0 0 auto;
  padding: var(--shin-gap-2);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg);
  color: var(--shin-text);
  font-size: var(--shin-text-md);
  font-weight: 500;
}

/* Lớp bận nằm ngoài `sidebar-root`; cạnh trên được JavaScript đặt ngay dưới thông báo bận. */
.shin-busy-overlay {
  position: fixed;
  z-index: 100;
  inset: auto 0 0;
  background: rgba(0, 0, 0, 0.08);
  cursor: wait;
}

.shin-sync-screen {
  position: fixed;
  z-index: 40;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--shin-bg-sunken);
}
.shin-sync-screen-header {
  flex: 0 0 var(--shin-header-height);
  display: flex;
  align-items: center;
  gap: var(--shin-gap-1);
  padding: 0 var(--shin-gap-2);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg);
}
.shin-sync-screen-header strong { margin-left: var(--shin-gap-1); }
.shin-sync-screen-content {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: var(--shin-gap-2);
}
.shin-sync-title { font-weight: 600; }
.shin-sync-phase { margin-top: 2px; color: var(--shin-primary); }
.shin-sync-operation, .shin-sync-count, .shin-sync-current, .shin-sync-message { margin-top: 3px; font-size: var(--shin-text-sm); color: var(--shin-text-soft); overflow-wrap: anywhere; }
.shin-sync-progress { margin-top: var(--shin-gap-2); }
.shin-sync-progress-label { font-size: var(--shin-text-sm); color: var(--shin-text-soft); }
.shin-sync-progress-track { position: relative; height: 5px; margin-top: 4px; overflow: hidden; border-radius: 3px; background: var(--shin-border); }
.shin-sync-progress-fill { height: 100%; border-radius: inherit; background: var(--shin-primary); transition: width 180ms ease; }
.shin-sync-progress-fill.is-indeterminate { position: absolute; animation: shin-sync-progress-slide 1.1s ease-in-out infinite; }
@keyframes shin-sync-progress-slide { 0% { left: -35%; } 100% { left: 100%; } }
.shin-sync-preview { margin-top: var(--shin-gap-2); padding-top: var(--shin-gap-2); border-top: 1px solid var(--shin-border); }
.shin-sync-preview-title { font-weight: 600; }
.shin-sync-preview-list { max-height: 240px; overflow-y: auto; padding-right: var(--shin-gap-1); }
.shin-sync-preview-row, .shin-sync-preview-more { margin-top: 3px; font-size: var(--shin-text-sm); overflow-wrap: anywhere; }
.shin-sync-preview-more { color: var(--shin-text-soft); }
.shin-sync-actions { display: flex; flex-wrap: wrap; gap: var(--shin-gap-1); margin-top: var(--shin-gap-2); }
.shin-sync-actions .shin-button { flex: 1 1 96px; min-width: 0; min-height: 28px; padding: 0 var(--shin-gap-2); white-space: normal; overflow-wrap: anywhere; }
.shin-sync-write-gate { display: block; margin-top: var(--shin-gap-1); font-size: var(--shin-text-sm); color: var(--shin-text-soft); }

/* Vùng 1 — Header. Cao cố định, ghim đỉnh, hàng icon xếp ngang. Khe 4 pixel đúng như bản cũ: nút icon đã tròn 32 pixel nên
   mắt tự tách chúng ra, khe rộng thêm chỉ ăn chỗ của cái nút thứ bảy sau này. */
#sidebar-header {
  flex: 0 0 var(--shin-header-height);
  display: flex;
  align-items: center;
  gap: var(--shin-gap-1);
  padding: 0 var(--shin-gap-2);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg);
}

/* Thuộc tính `align: "right"` của Block dịch ra lớp này: nó đẩy chính nó và mọi thứ sau nó sang phải. */
#sidebar-header .shin-align-right { margin-left: auto; }

/* Vùng 2 — Dải tiến trình. Đường ray luôn chiếm đúng chiều cao của nó, kể cả lúc rỗng, nên lúc dải chạy hiện lên thì không
   có gì bị đẩy xuống. Ẩn bằng cách bỏ `is-running` chứ không bằng `display: none`, vì `display: none` làm nội dung nhảy 3px. */
#sidebar-progress {
  flex: 0 0 var(--shin-progress-height);
  position: relative;
  overflow: hidden;
  background: transparent;
}

#sidebar-progress.is-running { background: var(--shin-primary-soft); }

#sidebar-progress.is-running::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 40%;
  background: var(--shin-primary);
  animation: shin-progress-slide 1.1s ease-in-out infinite;
}

@keyframes shin-progress-slide {
  0%   { left: -40%; }
  100% { left: 100%; }
}

/* Hộp tìm khách — món đồ cố định thứ sáu, không phải một trong năm vùng nên nó không có `flex` co giãn, chỉ cao theo nội dung. */
#shin-search {
  flex: 0 0 auto;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg-sunken);
}

/* Mốc để danh sách gợi ý neo vào, nhờ vậy nó rơi xuống **đè lên** thân màn thay vì đẩy thân xuống. */
.shin-search-wrap { position: relative; }

/* Trần 60% chiều cao khung: đủ dài để thấy hết 20 dòng gợi ý mà vẫn để hở phần dưới, nên người dùng không mất dấu mình đang ở đâu.
   `z-index` cao hơn danh sách của ô combo, vì hộp tìm nằm trên cùng khung và không bao giờ mở cùng lúc với một form. */
.shin-search-list {
  position: absolute;
  z-index: 20;
  top: calc(100% + 2px);
  left: 0;
  right: 0;
  max-height: 60vh;
  overflow-y: auto;
  padding: var(--shin-gap-1);
  border: 1px solid var(--shin-border-strong);
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg);
  box-shadow: var(--shin-shadow);
}

/* Vùng 3 — Khối thông tin chung. Cao theo nội dung, **nền trắng như một card**: đây là khối chữ to nhất và quan trọng nhất
   của cả sidebar, nên nó đứng cùng hạng với card chứ không phải một dải phụ màu xám. Cỡ chữ và màu chữ của ruột khối thì ở
   `client/style/slots.html`, cùng chỗ với slot dựng ra nó. */
#sidebar-info {
  flex: 0 0 auto;
  padding: var(--shin-gap-2);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg);
}

/* Khoảng giữa ba hàng của khối: tên công ty, rồi hai hàng hai cột. Bốn pixel, đúng con số bản cũ đặt cho `.info-row` — dày
   hơn thì khối này chiếm chỗ của phần thân, mỏng hơn thì ba hàng dính thành một mảng chữ. */
#sidebar-info .shin-row + .shin-row { margin-top: var(--shin-gap-1); }

/* Vùng 4 — Thân. Chiếm hết phần dư và cuộn dọc khi tràn. `min-height: 0` là điều kiện để một con flex biết cuộn; thiếu nó
   thì thân nở ra theo nội dung và đẩy vùng chân ra khỏi khung.

   Nền **lõm** chứ không trắng: mọi thứ trong thân đều nằm trong card trắng, nên một nền lõm là cách làm mép card hiện ra mà
   không phải kẻ thêm một đường viền nào. Đúng nếp bản cũ — trang màu #f8f9fa, card màu trắng.

   **Lề chỉ có trên và dưới, hai bên bằng không**: card ăn hết bề ngang sidebar. Chủ dự án chốt vậy ngày 06/09/2026 — "cho nó
   rộng hết, rồi bo góc cũng được". Sidebar chỉ rộng chừng 300 pixel nên tám pixel mỗi bên là mười sáu pixel bề ngang chữ,
   đủ để một tên công ty dài xuống thêm một dòng. Card vẫn bo góc nên mắt vẫn thấy đó là một khối riêng dù nó chạm hai mép.

   Bỏ lề hai bên là an toàn vì **mọi thứ trong vùng thân đều nằm trong card**: `screenBody` gói từng cụm của form vào một
   `Card`, còn màn xem thì bản khai đã là hai `Card`. Không có mẩu chữ trần nào để chạm mép.

   Đổi lại, thanh cuộn đứng chiếm sáu pixel bên phải nên khe phải hở hơn khe trái sáu pixel khi danh sách dài. Chấp nhận:
   đổi lấy mười sáu pixel chữ thì hơn. */
#sidebar-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--shin-gap-2) 0;
  background: var(--shin-bg-sunken);
}

/* Vùng 5 — Chân. Ghim đáy. */
#sidebar-footer {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--shin-gap-2);
  padding: var(--shin-gap-2);
  border-top: 1px solid var(--shin-border);
  background: var(--shin-bg);
}

/* Dải hoàn tác việc xóa — món đồ cố định thứ bảy, nằm dưới cùng và **đè lên** vùng chân trong lúc đếm ngược.
   Nền vàng cảnh báo chứ không đỏ: việc chưa xảy ra, người dùng còn đường lùi. */
.shin-undo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--shin-gap-2);
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border-top: 1px solid var(--shin-warn);
  background: var(--shin-warn-soft);
  color: var(--shin-warn);
  font-size: var(--shin-text-sm);
}

/* Chữ ăn hết phần dư để nút Hoàn tác luôn ghim mép phải, không nhảy ngang theo từng giây đếm. */
.shin-undo-text { flex: 1 1 auto; }

.shin-undo-btn {
  flex: 0 0 auto;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border: 1px solid var(--shin-warn);
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg);
  color: var(--shin-warn);
  font-family: inherit;
  font-size: var(--shin-text-sm);
  font-weight: 500;
  cursor: pointer;
}

.shin-undo-btn:hover { background: var(--shin-warn-soft); }

.shin-extension-warning {
  flex: 0 0 auto;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border-top: 1px solid var(--shin-warn);
  background: var(--shin-warn-soft);
  color: var(--shin-warn);
  font-size: clamp(var(--shin-text-2xs), 3.4vw, var(--shin-text-xs));
  line-height: var(--shin-line-height);
  text-align: center;
  white-space: nowrap;
}
</style>
