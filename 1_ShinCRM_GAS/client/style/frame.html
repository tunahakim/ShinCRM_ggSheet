<style>
/*
 * Bố cục năm vùng cố định của sidebar, theo bảng ở tài liệu 04 Phần 3.
 *
 * Nhờ khung này, bố cục "bánh kẹp" — thân cuộn được, nút Lưu luôn nhìn thấy ở đáy — có sẵn cho mọi màn mà schema không
 * phải khai gì. `spatialConfig` chỉ còn việc ở các Block bên trong thân.
 *
 * Tệp này cố tình **không** chứa màu chữ, không chứa cỡ chữ, không chứa style của thành phần nào bên trong thân: nó chỉ
 * chia không gian, cộng màu nền của từng vùng vì nền là thuộc tính của cái khung chứ không của cái nằm trong khung. Mọi
 * con số ở đây lấy từ biến trong `client/style/tokens.html`.
 *
 * Các vùng cố định dùng lề ngang theo token. Vùng cuộn chuẩn giữ `scrollbar-gutter: stable both-edges`, nên phần nội dung
 * luôn có cùng một khoảng 4 pixel ở hai mép, bất kể scrollbar đang hiện hay chưa. Section bên trong không tự cộng thêm lề
 * ngang; nếu không, scrollbar sẽ làm nội dung lệch trục.
 *
 * Ẩn một vùng thì đặt thuộc tính `hidden` lên chính thẻ đó, không đổi `class`. Dùng thuộc tính có sẵn của HTML thì trình
 * đọc màn hình cũng hiểu là vùng đó không còn, còn một lớp CSS tự đặt thì chỉ mắt người thấy.
 */

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--shin-bg);
  color: var(--shin-text);
  font-family: var(--shin-font);
  font-size: var(--shin-text-md);
  line-height: var(--shin-line-height);
}

*, *::before, *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

/*
  Thanh cuộn mảnh, dùng cho mọi vùng cuộn được: vùng thân, danh sách gợi ý, lớp menu, ô nhập nhiều dòng.

  Thanh cuộn mặc định của Chrome rộng 15 pixel. Trên một sidebar rộng 300, đó là 5% bề ngang tiêu cho một cái máng
  trượt. Bản dùng chung đặt 4 pixel để ưu tiên bề ngang nội dung trong Sidebar hẹp.

  **Không** khai `scrollbar-width: thin` cạnh đây: từ Chrome 121, hễ có mặt thuộc tính chuẩn đó thì trình duyệt bỏ qua
  hết nhóm `::-webkit-scrollbar`, và `thin` của Chrome là khoảng 11 pixel — khai thêm cho Firefox thì mất luôn 4 pixel
  ở Chrome, mà sidebar này đi cùng một Extension của Chrome.
*/
::-webkit-scrollbar { width: var(--shin-scrollbar-size); height: var(--shin-scrollbar-size); }

::-webkit-scrollbar-track { background: transparent; }

::-webkit-scrollbar-thumb { background: var(--shin-border-strong); border-radius: 3px; }

::-webkit-scrollbar-thumb:hover { background: var(--shin-text-faint); }

/* Gốc của khung: một cột cao đúng bằng khung sidebar, không cuộn — phần cuộn là việc của vùng thân. */
#sidebar-root {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

/* Thông báo bận nằm trong luồng bố cục: hiện ra dưới dải tiến trình và đẩy toàn bộ nội dung phía sau xuống. */
.shin-busy-notice {
  flex: 0 0 auto;
  padding: var(--shin-gap-2);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg);
  color: var(--shin-text);
  font-size: var(--shin-text-md);
  font-weight: 500;
}

/* Lớp bận nằm ngoài `sidebar-root`; cạnh trên được JavaScript đặt ngay dưới thông báo bận. */
.shin-busy-overlay {
  position: fixed;
  z-index: 100;
  inset: auto 0 0;
  background: rgba(0, 0, 0, 0.08);
  cursor: wait;
}

.shin-scroll-region {
  overflow-y: auto;
  scrollbar-gutter: stable both-edges;
}

/* Vùng 1 — Header. Cao cố định, ghim đỉnh, hàng icon xếp ngang. Khe 4 pixel đúng như bản cũ: nút icon đã tròn 32 pixel nên
   mắt tự tách chúng ra, khe rộng thêm chỉ ăn chỗ của cái nút thứ bảy sau này. */
#sidebar-header,
.shin-shell-header,
.shin-box.shin-shell-header {
  flex: 0 0 var(--shin-header-height);
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--shin-gap-1);
  padding: 0 var(--shin-gap-2);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg);
}

/* Thuộc tính `align: "right"` của Block dịch ra lớp này: nó đẩy chính nó và mọi thứ sau nó sang phải. */
.shin-shell-header .shin-align-right { margin-left: auto; }

/* Vùng 2 — Dải tiến trình. Đường ray luôn chiếm đúng chiều cao của nó, kể cả lúc rỗng, nên lúc dải chạy hiện lên thì không
   có gì bị đẩy xuống. Ẩn bằng cách bỏ `is-running` chứ không bằng `display: none`, vì `display: none` làm nội dung nhảy 3px. */
#sidebar-progress {
  flex: 0 0 var(--shin-progress-height);
  position: relative;
  overflow: hidden;
  background: transparent;
}

#sidebar-progress.is-running { background: var(--shin-primary-soft); }

#sidebar-progress.is-running::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 40%;
  background: var(--shin-primary);
  animation: shin-progress-slide 1.1s ease-in-out infinite;
}

@keyframes shin-progress-slide {
  0%   { left: -40%; }
  100% { left: 100%; }
}

/* Hộp tìm khách — món đồ cố định thứ sáu, không phải một trong năm vùng nên nó không có `flex` co giãn, chỉ cao theo nội dung. */
#shin-search {
  flex: 0 0 auto;
  padding: var(--shin-gap-1) var(--shin-scrollbar-size);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg-sunken);
}

/* Mốc để danh sách gợi ý neo vào, nhờ vậy nó rơi xuống **đè lên** thân màn thay vì đẩy thân xuống. */
.shin-search-wrap { position: relative; }

/* Popup dùng chung cho tìm kiếm, dropdown, customer picker và menu module. Mỗi controller chỉ chọn kiểu neo/rộng riêng. */
.shin-popup-list {
  position: fixed;
  z-index: 20;
  min-width: 0;
  max-width: calc(100vw - 2 * var(--shin-gap-2));
  max-height: 60vh;
  overflow-y: auto;
  padding: var(--shin-gap-1);
  border: 1px solid var(--shin-border-strong);
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg);
  box-shadow: var(--shin-shadow);
}

/* Popup width and position are set by PopupList after the anchor is measured. */

/* Vùng 3 — Khối thông tin chung. Cao theo nội dung, **nền trắng như một card**: đây là khối chữ to nhất và quan trọng nhất
   của cả sidebar, nên nó đứng cùng hạng với card chứ không phải một dải phụ màu xám. Cỡ chữ và màu chữ của ruột khối thì ở
   `client/style/slots.html`, cùng chỗ với slot dựng ra nó. */
#sidebar-info {
  flex: 0 0 auto;
  padding: var(--shin-gap-2) var(--shin-scrollbar-size);
  border-bottom: 1px solid var(--shin-border);
  background: var(--shin-bg);
}

/* Khoảng giữa ba hàng của khối: tên công ty, rồi hai hàng hai cột. Bốn pixel, đúng con số bản cũ đặt cho `.info-row` — dày
   hơn thì khối này chiếm chỗ của phần thân, mỏng hơn thì ba hàng dính thành một mảng chữ. */
#sidebar-info .shin-row + .shin-row { margin-top: var(--shin-gap-1); }

/* Vùng 4 — Thân. Chiếm hết phần dư và cuộn dọc khi tràn. `min-height: 0` là điều kiện để một con flex biết cuộn; thiếu nó
   thì thân nở ra theo nội dung và đẩy vùng chân ra khỏi khung.

   Nền **lõm** chứ không trắng: mọi thứ trong thân đều nằm trong card trắng, nên một nền lõm là cách làm mép card hiện ra mà
   không phải kẻ thêm một đường viền nào. Đúng nếp bản cũ — trang màu #f8f9fa, card màu trắng.

   Các card giữ cùng trục trái/phải nhờ `scrollbar-gutter: stable both-edges` ở chính vùng cuộn. Không đặt padding ngang
   riêng ở đây, vì một lớp lề nữa sẽ cộng dồn với gutter và làm card lệch hoặc mất bề ngang cần thiết. */
#sidebar-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 0;
  min-height: 0;
  overflow-x: hidden;
  padding: var(--shin-gap-2) 0 var(--shin-gap-4);
  background: var(--shin-bg-sunken);
}
#sidebar-body > * + * { margin-top: var(--shin-gap-2); }

/* Vùng 5 — Chân. Ghim đáy. */
#sidebar-footer {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--shin-gap-2);
  padding: var(--shin-gap-2) var(--shin-scrollbar-size);
  border-top: 1px solid var(--shin-border);
  background: var(--shin-bg);
}

/* Dải hoàn tác việc xóa — món đồ cố định thứ bảy, nằm dưới cùng và **đè lên** vùng chân trong lúc đếm ngược.
   Nền vàng cảnh báo chứ không đỏ: việc chưa xảy ra, người dùng còn đường lùi. */
.shin-undo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--shin-gap-2);
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border-top: 1px solid var(--shin-warn);
  background: var(--shin-warn-soft);
  color: var(--shin-warn);
  font-size: var(--shin-text-sm);
}

/* Chữ ăn hết phần dư để nút Hoàn tác luôn ghim mép phải, không nhảy ngang theo từng giây đếm. */
.shin-undo-text { flex: 1 1 auto; }

.shin-undo-btn {
  flex: 0 0 auto;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border: 1px solid var(--shin-warn);
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg);
  color: var(--shin-warn);
  font-family: inherit;
  font-size: var(--shin-text-sm);
  font-weight: 500;
  cursor: pointer;
}

.shin-undo-btn:hover { background: var(--shin-warn-soft); }

.shin-extension-warning {
  flex: 0 0 auto;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border-top: 1px solid var(--shin-warn);
  background: var(--shin-warn-soft);
  color: var(--shin-warn);
  font-size: clamp(var(--shin-text-2xs), 3.4vw, var(--shin-text-xs));
  line-height: var(--shin-line-height);
  text-align: center;
  white-space: nowrap;
}
</style>
