<style>
/*
 * Khối biến CSS của cả sidebar: màu, khoảng cách, cỡ chữ, bán kính, bóng.
 *
 * Vì sao tách khỏi tệp bố cục và khỏi tệp trang trí: một biến đổi ở đây thì cả giao diện đổi theo, nên đây là chỗ người
 * ta tìm đến khi muốn đổi diện mạo — còn bố cục năm vùng thì gần như không bao giờ đổi. Trộn hai thứ vào một tệp nghĩa là
 * mỗi lần muốn đổi màu lại phải đọc qua phần bố cục để tìm.
 *
 * Tài liệu 04 Phần 10 ghi một tệp `client/ui/styles.html`; ở đây nó tách thành `client/style/tokens.html` (biến) và
 * `client/style/frame.html` (bố cục năm vùng), rồi chặng dựng form sẽ thêm tệp thứ ba cho các thành phần. Thư mục
 * `client/style/` chỉ giữ hình thức **dùng chung cho mọi màn**; style của riêng một màn thì ở cùng tệp màn đó trong
 * `client/screen/`. Luật "đẹp bằng CSS thuần, không framework" giữ nguyên.
 *
 * Không dùng thư viện nào, không tải phông từ mạng: sidebar Apps Script nằm trong iframe và mọi thứ tải từ ngoài đều
 * thêm một lần chờ vào đúng lúc người dùng đang chờ nạp dữ liệu.
 */

:root {
  /*
   * Màu nền và màu chữ — **đúng thang xám Material của bản cũ**, không phải một thang tự chọn.
   *
   * Bản trước dùng một thang xám hơi ngả xanh (#f6f7f9, #dfe3e8, #1f2933). Từng màu đều dùng được, nhưng sidebar nằm trong
   * bảng tính Google mà chính bảng tính dùng thang Material, nên lệch thang là lệch với thứ bao quanh nó. Chủ dự án chốt
   * ngày 06/09/2026: vẻ ngoài bản cũ là đích. `9_Code_cu_tham_chieu/src/ui/Styles.html` là bản đặc tả của khối này.
   */
  --shin-bg: #ffffff;
  --shin-bg-sunken: #f8f9fa;
  --shin-bg-hover: #f1f3f4;
  --shin-border: #dadce0;
  --shin-border-strong: #bdc1c6;
  /* Vạch mờ nhất của thang: dùng để **chia** chứ không để **khoanh**. Đường ngăn hai dòng lịch sử và gạch dưới tiêu đề card
     đều lấy màu này — đậm hơn một nấc thì vài chục dòng liền nhau nhìn ra thành một bảng kẻ ô, đúng chỗ chủ dự án nói "mỗi
     lịch sử lại ở trong một khung chữ nhật bo viền". Bản cũ đặt #f1f3f4 cho đúng việc này. */
  --shin-border-faint: #f1f3f4;
  --shin-text: #202124;
  --shin-text-soft: #5f6368;
  --shin-text-faint: #80868b;

  /* Màu nhấn và màu nghĩa. Bốn màu nghĩa khớp bốn giá trị cột `Kết quả` của sheet `Log`, để một thứ trên màn hình và một
     dòng log nói về cùng một tình trạng thì cùng màu. */
  --shin-primary: #1a73e8;
  --shin-primary-dark: #1557b0;
  --shin-primary-soft: #e8f0fe;
  --shin-bolt: #f9ab00;
  --shin-ok: #137333;
  --shin-warn: #b06000;
  --shin-warn-soft: #fef7e0;
  --shin-error: #c5221f;
  --shin-error-soft: #fce8e6;

  /* Khoảng cách theo thang 4px. Mọi số đo không gian trong hệ lấy từ đây, không gõ số rời. */
  --shin-gap-1: 4px;
  --shin-gap-2: 8px;
  --shin-gap-3: 12px;
  --shin-gap-4: 16px;
  --shin-gap-5: 24px;

  /*
   * Phông và cỡ chữ — **đúng bản cũ**: Roboto, cỡ nền 14px.
   *
   * Roboto đứng đầu vì bảng tính Google dùng chính phông đó, nên sidebar và thứ bao quanh nó cùng một nét chữ. Không tải từ
   * mạng: máy nào có Roboto thì dùng, không có thì lùi về Arial. Bản trước để `-apple-system` với `"Segoe UI"` đứng trước
   * nên trên Windows nó ra Segoe UI, tức khác phông với chính bảng tính đang chứa nó.
   *
   * Năm nấc cỡ chữ khớp năm nấc bản cũ dùng thật: 10 cho chip, 11 cho tiêu đề card và đường dẫn phụ, 13 cho hàng thông tin
   * và chữ phụ, 14 cho chữ nền và nội dung công việc, 15 cho tên công ty. Bản trước hạ mỗi nấc đi một bậc để chứa thêm chữ
   * trên sidebar hẹp; cộng lại thì ra một sidebar trông khác hẳn, và chủ dự án nhìn ra ngay.
   */
  --shin-font: Roboto, Arial, sans-serif;
  --shin-font-mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  --shin-text-2xs: 10px;
  --shin-text-xs: 11px;
  --shin-text-sm: 13px;
  --shin-text-md: 14px;
  --shin-text-lg: 15px;
  /* Chiều cao dòng là biến vì bộ máy render nhân nó với số dòng để tính trần của khối đang thu gọn. Bản cũ đặt 1.4. */
  --shin-line-height: 1.4;

  /* Hình khối. Bán kính card 8px và bóng rất nhạt đều là số của bản cũ. */
  --shin-radius: 8px;
  --shin-radius-sm: 4px;
  --shin-shadow: 0 2px 6px rgba(60, 64, 67, 0.15);
  /* Bóng của card: nhạt hơn hẳn bóng của lớp nổi. Card không nổi lên trên gì cả, nó chỉ cần **tách khỏi nền lõm** của vùng
     thân; một cái bóng thật thì mười cái card xếp dọc thành mười lớp kính chồng nhau. */
  --shin-shadow-card: 0 1px 2px rgba(60, 64, 67, 0.05);

  /* Lề trong của card, bằng số của bản cũ. Hàng tiêu đề và thẻ ruột đều lấy theo nó nên chữ hai chỗ thẳng một cột. */
  --shin-card-pad: 10px;

  /* Trần chiều cao ô nhập nhiều dòng, tính bằng **số dòng chữ**. Chủ dự án chốt mười: dưới trần thì ô tự cao theo nội dung,
     quá trần mới sinh thanh cuộn nội bộ. Để ở đây vì cả CSS lẫn phần tự cao của `client/ui/inputs.html` đều đo theo nó. */
  --shin-textarea-lines: 10;

  /* Trần của khối **chữ chỉ đọc** dài: card GHI CHÚ ở màn xem. Cùng mười dòng với ô nhập, để cái người dùng đọc và cái họ
     sửa cao bằng nhau — bấm Sửa mà khối chữ đổi chiều cao thì mắt phải tìm lại chỗ đang đọc.

     Là một độ dài chứ không phải một con số, vì `spatialConfig.maxHeight` của bản khai cần đúng một giá trị CSS. Đơn vị `em`
     nên nó co theo cỡ chữ của khối, không phải một số pixel gõ cứng. */
  --shin-read-max-height: calc(10em * var(--shin-line-height));

  /* Số đo của khung. Vùng header và dải tiến trình cao cố định, nên chúng là biến chứ không phải số gõ trong bố cục. Header
     48px và nút glyph tròn 32px là số của bản cũ; bản trước hạ xuống 40 và 28 nên cả dải đầu sidebar thấp hơn một nấc. */
  --shin-header-height: 48px;
  --shin-icon-btn: 32px;
  --shin-progress-height: 3px;
}
</style>
