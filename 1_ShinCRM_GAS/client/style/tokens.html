<style>
/*
 * Khối biến CSS của cả sidebar: màu, khoảng cách, cỡ chữ, bán kính, bóng.
 *
 * Vì sao tách khỏi tệp bố cục và khỏi tệp trang trí: một biến đổi ở đây thì cả giao diện đổi theo, nên đây là chỗ người
 * ta tìm đến khi muốn đổi diện mạo — còn bố cục năm vùng thì gần như không bao giờ đổi. Trộn hai thứ vào một tệp nghĩa là
 * mỗi lần muốn đổi màu lại phải đọc qua phần bố cục để tìm.
 *
 * Tài liệu 04 Phần 10 ghi một tệp `client/ui/styles.html`; ở đây nó tách thành `client/style/tokens.html` (biến) và
 * `client/style/frame.html` (bố cục năm vùng), rồi chặng dựng form sẽ thêm tệp thứ ba cho các thành phần. Thư mục
 * `client/style/` chỉ giữ hình thức **dùng chung cho mọi màn**; style của riêng một màn thì ở cùng tệp màn đó trong
 * `client/screen/`. Luật "đẹp bằng CSS thuần, không framework" giữ nguyên.
 *
 * Không dùng thư viện nào, không tải phông từ mạng: sidebar Apps Script nằm trong iframe và mọi thứ tải từ ngoài đều
 * thêm một lần chờ vào đúng lúc người dùng đang chờ nạp dữ liệu.
 */

:root {
  /* Màu nền và màu chữ. Thang xám đi từ nền trắng tới chữ đen mềm, không dùng đen tuyệt đối vì nó làm chữ nhỏ bị gắt. */
  --shin-bg: #ffffff;
  --shin-bg-sunken: #f6f7f9;
  --shin-bg-hover: #eef1f5;
  --shin-border: #dfe3e8;
  --shin-border-strong: #c3cad3;
  /* Vạch mờ nhất của thang: dùng để **chia** chứ không để **khoanh**. Đường ngăn hai dòng lịch sử và gạch dưới tiêu đề card
     đều lấy màu này — đậm hơn một nấc thì vài chục dòng liền nhau nhìn ra thành một bảng kẻ ô, đúng chỗ chủ dự án nói "mỗi
     lịch sử lại ở trong một khung chữ nhật bo viền". Bản cũ đặt #f1f3f4 cho đúng việc này. */
  --shin-border-faint: #f1f3f4;
  --shin-text: #1f2933;
  --shin-text-soft: #52606d;
  --shin-text-faint: #7b8794;

  /* Màu nhấn và màu nghĩa. Bốn màu nghĩa khớp bốn giá trị cột `Kết quả` của sheet `Log`, để một thứ trên màn hình và một
     dòng log nói về cùng một tình trạng thì cùng màu. */
  --shin-primary: #1a73e8;
  --shin-primary-dark: #1557b0;
  --shin-primary-soft: #e8f0fe;
  --shin-ok: #137333;
  --shin-warn: #b06000;
  --shin-warn-soft: #fef7e0;
  --shin-error: #c5221f;
  --shin-error-soft: #fce8e6;

  /* Khoảng cách theo thang 4px. Mọi số đo không gian trong hệ lấy từ đây, không gõ số rời. */
  --shin-gap-1: 4px;
  --shin-gap-2: 8px;
  --shin-gap-3: 12px;
  --shin-gap-4: 16px;
  --shin-gap-5: 24px;

  /* Cỡ chữ. Sidebar rộng khoảng 300px nên cỡ nền là 13px chứ không phải 16px; to hơn thì một dòng chứa được quá ít chữ. */
  --shin-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --shin-font-mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  --shin-text-xs: 11px;
  --shin-text-sm: 12px;
  --shin-text-md: 13px;
  --shin-text-lg: 15px;
  /* Chiều cao dòng là biến vì bộ máy render nhân nó với số dòng để tính trần của khối đang thu gọn. */
  --shin-line-height: 1.45;

  /* Hình khối. */
  --shin-radius: 6px;
  --shin-radius-sm: 4px;
  --shin-shadow: 0 1px 3px rgba(31, 41, 51, 0.12);
  /* Bóng của card: nhạt hơn hẳn bóng của lớp nổi. Card không nổi lên trên gì cả, nó chỉ cần **tách khỏi nền lõm** của vùng
     thân; một cái bóng thật thì mười cái card xếp dọc thành mười lớp kính chồng nhau. */
  --shin-shadow-card: 0 1px 2px rgba(31, 41, 51, 0.06);

  /* Trần chiều cao ô nhập nhiều dòng, tính bằng **số dòng chữ**. Chủ dự án chốt mười: dưới trần thì ô tự cao theo nội dung,
     quá trần mới sinh thanh cuộn nội bộ. Để ở đây vì cả CSS lẫn phần tự cao của `client/ui/inputs.html` đều đo theo nó. */
  --shin-textarea-lines: 10;

  /* Số đo của khung. Vùng header và dải tiến trình cao cố định, nên chúng là biến chứ không phải số gõ trong bố cục. */
  --shin-header-height: 40px;
  --shin-progress-height: 3px;
}
</style>
