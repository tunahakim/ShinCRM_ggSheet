<style>
/*
 * Diện mạo của ba vùng do `client/ui/slots.html` dựng: dòng lịch sử, dòng gợi ý tìm khách, khối thông tin chung.
 *
 * Tách khỏi `components.html` vì tệp đó chỉ tả những lớp **engine** sinh ra cho mọi màn. Các lớp ở đây do slot đặt qua `className`, nên chúng đi cùng slot: đổi cách bày một dòng lịch sử thì mở đúng hai tệp cạnh nhau, không phải lục tệp dùng chung.
 */

/* --- Dòng lịch sử làm việc --------------------------------------- */

/*
  **Không viền quanh, không lề hai bên, chỉ một gạch mờ dưới chân.** Chủ dự án nhìn bản trước liền nói "mỗi lịch sử lại ở
  trong một khung chữ nhật bo viền — lại còn có lề với hai bên, với tôi khá xấu"; bản cũ chỉ có `border-bottom` màu #f1f3f4
  và `padding-bottom: 6px`, còn hai bên thì dòng chữ ăn sát mép trong của card. Card đã là cái khung rồi, kẻ thêm khung cho
  từng dòng bên trong nó là kẻ khung trong khung.

  Gạch dưới lấy vạch **mờ nhất** của thang màu: đậm hơn một nấc thì ba chục dòng liền nhau nhìn ra thành một bảng kẻ ô.
  Dòng cuối bỏ cả gạch lẫn lề dưới, vì card đã tự có lề dưới của nó.
*/
.shin-act-row {
  padding-bottom: 6px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--shin-border-faint);
}

.shin-act-row:last-of-type { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }

/*
  Hàng đầu **ghim hai mép**: nhóm trái ngày với sản phẩm, nhóm phải chip loại việc với hai nút. Đây là bố cục `.tx-meta` của
  bản cũ, và nó giải đúng cái chủ dự án chụp ảnh chỉ ra — bản trước xếp mọi mẩu chữ thành một hàng phẳng rồi đẩy nút bằng
  `margin-left: auto`, nên khi tổng bề ngang vượt lòng card thì cái thùng rác lòi ra ngoài mép.

  Nhóm trái `flex: 0 1 auto` nên **nó là bên chịu co**; nhóm phải `flex: 0 0 auto` nên chip và nút không bao giờ bị bóp. Cặp
  số này chính là hành vi chủ dự án đòi: "khi dê chuột vào thì các nội dung ở hàng đầu sẽ co vào để hiện biểu tượng".

  `align-items: center` đè `flex-start` của `.shin-row`: chip loại việc cao hơn dòng chữ thuần, để mép trên thì ngày và chip
  lệch nhau một hai pixel, đủ để nhìn ra là lệch.
*/
.shin-act-head { justify-content: space-between; align-items: center; }

.shin-act-left,
.shin-act-right {
  display: flex;
  align-items: center;
  gap: var(--shin-gap-2);
  min-width: 0;
}

.shin-act-left { flex: 0 1 auto; }

.shin-act-right { flex: 0 0 auto; }

/*
  Hai nút **ẩn hẳn cho tới khi chuột dê vào dòng**, và ẩn bằng `display: none` chứ không bằng `opacity`.

  Bản trước dùng `opacity: 0` để chữ không giật ngang khi chuột đi qua. Chủ dự án chốt ngược lại ngày 06/09/2026: phải co
  đúng như bản cũ. Và họ đúng — chỗ giữ sẵn cho hai cái nút vô hình là chỗ lấy từ tên sản phẩm ở **mọi** dòng, kể cả mấy
  chục dòng chuột không bao giờ đi tới; đổi lại chỉ là một lần chữ co khi chuột đã vào đúng dòng đó.

  `:focus-within` cho đường bàn phím: Tab tới nút nào thì nút đó phải hiện ra, không thì con trỏ đi trong bóng tối.

  Nút ở đây **thấp 18 pixel**, không phải nút glyph vuông 28 pixel như ở thanh trên. Hàng đầu của một dòng lịch sử chỉ cao
  chừng 18 pixel; một cái nút 28 nong nó lên 28 và ba chục dòng cộng lại thành hơn 300 pixel trắng.

  Màu đặt theo `className` của từng nút, không đếm thứ tự bằng `.shin-icon + .shin-icon` như bản trước: bút chì nay đứng
  ngoài cùng nên phép đếm cũ sẽ tô đỏ đúng cái bút. Thùng rác đỏ, bút chì xanh — cái không hoàn tác được ngay là cái đỏ.
*/
.shin-act-row .shin-icon {
  display: none;
  height: 18px;
  width: 18px;
  min-width: 18px;
  padding: 0;
}

.shin-act-row:hover .shin-icon,
.shin-act-row:focus-within .shin-icon { display: inline-flex; }

.shin-act-edit { color: var(--shin-primary); }

.shin-act-del { color: var(--shin-error); }

.shin-act-row .shin-glyph { width: 14px; height: 14px; }

/*
  Ba mẩu chữ, ba màu — đúng nếp bản cũ. Ngày xanh đậm là mốc để mắt nhảy dọc; sản phẩm đỏ đậm là thứ để phân loại nhanh;
  loại việc là **chip xanh lá** nên nó đọc ra thành một cái nhãn chứ không lẫn vào chữ.

  Chỉ sản phẩm được cắt bằng ba chấm, ngày thì `flex: 0 0 auto`: một cái ngày cắt dở là một cái ngày sai, còn tên sản phẩm
  cắt dở vẫn đọc ra được. Không có `min-width: 0` thì `text-overflow` không bao giờ chạy, vì hộp flex mặc định không co
  xuống dưới bề rộng nội dung.
*/
.shin-act-date,
.shin-act-prod,
.shin-act-type {
  font-size: var(--shin-text-sm);
  font-weight: 700;
}

.shin-act-date { flex: 0 0 auto; color: var(--shin-primary); }

.shin-act-prod {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  color: var(--shin-error);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.shin-act-type {
  flex: 0 0 auto;
  padding: 2px 6px;
  border-radius: var(--shin-radius-sm);
  background: #e6f4ea;
  color: var(--shin-ok);
  font-size: var(--shin-text-2xs);
}

/* Nội dung là phần dài và là phần người ta đọc, nên nó cỡ chữ nền và màu chữ chính — không phải màu phụ. Trần chiều cao thì
   engine đặt bằng style nội tuyến từ `spatialConfig`, không phải ở đây. */
.shin-act-content {
  margin-top: 2px;
  color: var(--shin-text);
  font-size: var(--shin-text-md);
  white-space: pre-wrap;
}

/* Dòng đã xóa mềm mờ đi nhưng **không** ẩn: nó vẫn giữ đúng vị trí thời gian của mình trên dòng thời gian. */
.shin-act-deleted .shin-act-date,
.shin-act-deleted .shin-act-prod,
.shin-act-deleted .shin-act-content { color: var(--shin-text-soft); text-decoration: line-through; }

/* --- Khối ghi chú của khách -------------------------------------- */

/*
  **Một khối cảnh báo đỏ, không phải một đoạn chữ thường.** Bản cũ vẽ `.note-content` với nền đỏ nhạt, chữ đỏ và một vạch
  đỏ dày 3 pixel bên trái; bản trước chuyển thành chữ đen 14 pixel không nền không vạch, tức mất hẳn tín hiệu.

  Vì sao đỏ mới đúng: ghi chú của một khách là chỗ ghi "đừng quên" — nợ cũ, tính nết, điều đã hứa. Nó phải đập vào mắt trước
  cả lịch sử làm việc, và bản cũ đạt được điều đó bằng đúng ba thuộc tính này.

  `:not(:empty)` là chỗ then chốt: khách chưa có ghi chú thì **không** vẽ khối đỏ nào cả, để `(chưa có)` của `.shin-readtext`
  hiện ra dạng chữ xám nghiêng. Bản cũ ẩn hẳn khối này lúc rỗng vì một hộp đỏ trống là một lời cảnh báo không có nội dung.

  Cỡ chữ 13 chứ không phải 14: chữ trong khối đỏ đã nổi hẳn nhờ màu, nên nó không cần thêm cỡ để giành chỗ với tên công ty.
*/
.shin-note .shin-readtext:not(:empty) {
  padding: var(--shin-gap-2);
  border-radius: var(--shin-radius-sm);
  border-left: 3px solid #d93025;
  background: var(--shin-error-soft);
  color: var(--shin-error);
  font-size: var(--shin-text-sm);
}

/* Đè luật trỏ-chuột dùng chung của `.shin-readtext[data-action]` — nền xám của luật đó xóa mất màu đỏ. Đậm thêm một nấc là đủ để biết bấm được. */
.shin-note .shin-readtext[data-action]:hover:not(:empty) { background: #fad2cf; }

/* --- Dòng gợi ý tìm khách ---------------------------------------- */

.shin-suggest {
  padding: var(--shin-gap-2);
  border-radius: var(--shin-radius-sm);
  cursor: pointer;
}

.shin-suggest:hover { background: var(--shin-primary-soft); }

/* Dòng đang sáng vì bàn phím, cùng màu với dòng đang trỏ chuột: hai đường tới cùng một dòng thì không có lý do gì để trông khác nhau. */
.shin-suggest.is-active { background: var(--shin-primary-soft); }

.shin-suggest-name { color: var(--shin-text); font-size: var(--shin-text-md); font-weight: 600; }

.shin-suggest-meta { color: var(--shin-text-soft); font-size: var(--shin-text-xs); }

.shin-suggest-deleted .shin-suggest-name { text-decoration: line-through; color: var(--shin-text-soft); }

/* --- Khối thông tin chung ---------------------------------------- */

/*
  **Tên công ty là chữ to nhất của cả sidebar, và nó màu xanh.** Bản trước cho nó 13 pixel màu chữ thường, ngang với mọi
  dòng khác, và chủ dự án nói ngay "quá nhỏ, tôi cần nó như code gốc". Bản cũ đặt 15 pixel, đậm 700, màu xanh chủ đạo — to
  và có màu vì đây là câu trả lời cho câu hỏi "tôi đang làm việc cho ai", câu hỏi mà người dùng hỏi lại mỗi vài giây.

  `text-align: justify` là mẹo của bản cũ: tên công ty thường dài hơn một dòng trong 276 pixel, và dàn đều hai mép thì hai
  dòng đó thành một khối chữ gọn thay vì một bậc thang.
*/
.shin-info-name {
  color: var(--shin-primary);
  font-size: var(--shin-text-lg);
  font-weight: 700;
  line-height: 1.4;
  text-align: justify;
}

/*
  Hai hàng phụ: cỡ chữ nền và **màu chữ chính**, không phải màu phụ. Đây là mã số thuế và số điện thoại — thứ người ta chép
  ra để gọi và để xuất hóa đơn, nên chúng phải đọc được ngay chứ không phải là ghi chú bên lề.

  Bên phải căn mép phải và đậm hơn bên trái một nấc, đúng nếp `.info-row` của bản cũ: hai cột ghim hai mép thì mắt tìm số
  điện thoại ở đúng một chỗ mà không phải đọc hết dòng, và cái quan trọng hơn thì đậm hơn.
*/
.shin-info-left,
.shin-info-right {
  color: var(--shin-text);
  font-size: var(--shin-text-sm);
}

.shin-info-left { font-weight: 500; }

.shin-info-right { font-weight: 600; text-align: right; }
</style>
