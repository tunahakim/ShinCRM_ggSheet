<style>
/*
 * Hình thức của các thành phần bên trong thân sidebar: hàng, card, trường, ô nhập, chip, nút.
 *
 * Đây là tệp thứ ba của bộ style, sau `tokens.html` (biến) và `frame.html` (năm vùng). Ranh giới: tệp này trang trí thứ **engine dựng ra**, nên mỗi lớp ở đây khớp một lớp mà `renderEngine` sinh; style của riêng một màn thì ở cùng tệp màn đó.
 *
 * Mọi con số lấy từ biến trong `tokens.html`. Hai mặc định của `spatialConfig` — độ rộng chia đều và chiều cao theo nội dung — nói ở đây một lần, không dán style nội tuyến vào từng thẻ.
 */

/* --- Hàng và hộp ------------------------------------------------- */

.shin-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
}

/* `width: "auto"` nghĩa là chia đều phần dư. `min-width: 0` là điều kiện để một ô nhập dài không nong hàng rộng ra quá khung. */
.shin-row > * { flex: 1 1 0; min-width: 0; }
.shin-row > * + * { margin-left: var(--shin-gap-2); }
.shin-single-action-row { justify-content: center; }
.shin-single-action-row > * { flex: 0 1 auto; min-width: min(220px, 100%); }
.shin-box.shin-stack,
.shin-box.shin-action-stack { display: flex; flex-direction: column; align-self: stretch; gap: var(--shin-gap-2); width: 100%; min-width: 0; }
.shin-box.shin-stack { align-items: stretch; }
.shin-box.shin-action-stack { align-items: center; }
.shin-stack > * + *,
.shin-action-stack > * + * { margin-top: 0; }
.shin-action-stack > * { width: min(100%, 220px); }
.shin-inline-field-row { align-items: center; }
.shin-inline-field-row > .shin-form-label { flex: 1 1 auto; min-width: 0; }
.shin-inline-field-row > .shin-standalone-control { flex: 0 0 20%; max-width: 20%; min-width: 0; }
.shin-inline-field-row > .shin-standalone-control + .shin-standalone-control { flex-basis: 20%; }
.shin-form-field.is-invalid .shin-input { border-color: var(--shin-error); box-shadow: 0 0 0 1px var(--shin-error); }
.shin-form-field.is-invalid .shin-form-label { color: var(--shin-error); }

.shin-box { display: block; }

/* Vùng đích có id có thể phải tồn tại trước callback, nhưng vùng rỗng không được ăn nhịp của Card. Khi renderer bơm Block vào,
   pseudo-class này tự mất và vùng hiện lại mà không cần JS biết về layout. */
.shin-box:empty { display: none; }

/* Khối xếp dọc dùng cho các màn hình có nhiều Card; module chỉ chọn nội dung, không tự định nghĩa layout mới. */
/* Section không tự bù scrollbar: vùng cuộn cha đã giữ gutter ổn định ở cả hai mép. */
.shin-section { display: flex; flex-direction: column; gap: 0; min-width: 0; padding: 0 0 var(--shin-gap-4); }
.shin-section > * { min-width: 0; }

/* Trạng thái khóa của một vùng thao tác. Control tổng nằm ngoài vùng nên không cần ngoại lệ theo id module. */
.shin-content-disabled { opacity: .58; }
.shin-content-disabled button,
.shin-content-disabled select,
.shin-content-disabled input,
.shin-content-disabled textarea { pointer-events: none; }

/* Trạng thái chờ dùng chung, không gắn với pipeline riêng của FBM. */
.shin-loading { display: flex; align-items: center; justify-content: center; gap: var(--shin-gap-2); padding: var(--shin-gap-4) var(--shin-gap-2); color: var(--shin-text-soft); font-size: var(--shin-text-sm); text-align: center; white-space: nowrap; }
.shin-loading::before { content: ''; width: 14px; height: 14px; border: 2px solid var(--shin-primary-soft); border-top-color: var(--shin-primary); border-radius: 50%; animation: shin-spin .8s linear infinite; }
@keyframes shin-spin { to { transform: rotate(360deg); } }

/* Primitive loading dùng chung cho ray toàn Sidebar và progress trong card Sync. Track quyết định nền/kích thước, fill quyết định chuyển động hoặc phần trăm. */
.shin-loading-track { position: relative; overflow: hidden; height: 5px; margin-top: var(--shin-gap-1); border-radius: 3px; background: var(--shin-border); }
.shin-loading-fill { height: 100%; border-radius: inherit; background: var(--shin-primary); transition: width 180ms ease; }
.shin-loading-track.is-idle { visibility: hidden; background: transparent; }
.shin-loading-fill.is-indeterminate { position: absolute; top: 0; bottom: 0; width: 35%; animation: shin-loading-slide 1.1s ease-in-out infinite; }
.shin-loading-fill.is-waiting { background: linear-gradient(90deg, var(--shin-primary-soft), var(--shin-primary), var(--shin-primary-soft)); background-size: 200% 100%; animation: shin-loading-wait 1s linear infinite; }
@keyframes shin-loading-slide { 0% { left: -35%; } 100% { left: 100%; } }
@keyframes shin-loading-wait { 0% { background-position: 0 0; } 100% { background-position: 200% 0; } }

/* Ray dưới header luôn giữ chỗ để body không nhảy, nhưng lúc rảnh không vẽ gì cả. */
.shin-loading-global { height: var(--shin-progress-height); margin-top: 0; border-radius: 0; visibility: hidden; background: transparent; }
.shin-loading-global.is-running { visibility: visible; background: var(--shin-primary-soft); }
.shin-loading-global .shin-loading-fill { width: 40%; }

/* `align: "right"` đẩy chính nó và mọi thứ sau nó sang phải, ở bất cứ vùng nào chứ không riêng header. */
.shin-align-right { margin-left: auto; }

/* Ô nhập không thuộc DATA_SCHEMA, dùng chung cho các màn hình có trạng thái riêng. */
.shin-form-field { display: flex; flex-direction: column; gap: 0; margin-bottom: var(--shin-gap-2); }
.shin-form-field > * + * { margin-top: var(--shin-gap-1); }
.shin-form-label { min-width: 0; color: var(--shin-text-soft); font-size: var(--shin-text-xs); font-weight: 500; line-height: 1.2; text-transform: uppercase; }

/* Hàng bật/tắt dùng cho cấu hình và các màn hình trạng thái. */
.shin-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: var(--shin-gap-2); margin: var(--shin-gap-2) 0; }
.shin-toggle-copy { flex: 1 1 auto; min-width: 0; color: var(--shin-text); font-size: var(--shin-text-sm); }
.shin-toggle-control {
  position: relative;
  display: inline-flex;
  flex: 0 0 42px;
  align-items: center;
  justify-content: flex-start;
  width: 42px;
  height: 21px;
  padding: 2px;
  border: 1px solid var(--shin-border-strong);
  border-radius: 999px;
  background: var(--shin-border-strong);
  color: var(--shin-bg);
  cursor: pointer;
  font: 700 8px/1 var(--shin-font);
  transition: background .18s ease, border-color .18s ease;
}
.shin-toggle-control .shin-toggle-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; letter-spacing: .02em; }
.shin-toggle-control .shin-toggle-knob { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--shin-bg); box-shadow: 0 1px 2px rgba(60,64,67,.25); transition: transform .18s ease; }
.shin-toggle-control.is-on { border-color: var(--shin-ok); background: var(--shin-ok); justify-content: flex-end; }
.shin-toggle-control.is-on .shin-toggle-label { justify-content: flex-start; padding-left: 4px; padding-right: 0; }
.shin-toggle-control.is-on .shin-toggle-knob { transform: translateX(21px); }
.shin-toggle-control.is-off { border-color: var(--shin-border-strong); background: var(--shin-border-strong); }
.shin-toggle-control:disabled { opacity: .55; cursor: progress; }

/* Các thông báo ngắn đều là một dạng khối trạng thái, không thuộc riêng một module. */
.shin-notice { margin-top: var(--shin-gap-2); padding: var(--shin-gap-2); border-left: 3px solid var(--shin-primary); background: var(--shin-primary-soft); color: var(--shin-primary-dark); font-size: var(--shin-text-sm); }
.shin-notice-info, .shin-notice-pending { border-left-color: var(--shin-primary); background: var(--shin-primary-soft); color: var(--shin-primary-dark); }
.shin-notice-success { border-left-color: var(--shin-ok); background: var(--shin-ok-soft); color: var(--shin-ok); }
.shin-notice-warning { border-left-color: var(--shin-warn); background: var(--shin-warn-soft); color: var(--shin-warn); }
.shin-notice-error { border-left-color: var(--shin-error); background: var(--shin-error-soft); color: var(--shin-error); }
.shin-muted { color: var(--shin-text-soft); font-size: var(--shin-text-sm); }
.shin-preview-row { margin-top: 3px; font-size: var(--shin-text-sm); overflow-wrap: anywhere; }
.shin-error-message { margin-top: var(--shin-gap-2); color: var(--shin-error); font-size: var(--shin-text-sm); }
.shin-pass-row { margin-top: var(--shin-gap-1); color: var(--shin-ok); font-size: var(--shin-text-sm); }
.shin-action-status { margin-top: var(--shin-gap-2); color: var(--shin-primary-dark); font-size: var(--shin-text-sm); }
.shin-empty-state { padding: var(--shin-gap-3) 0; color: var(--shin-text-soft); font-size: var(--shin-text-sm); }
.shin-kv-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--shin-gap-2); padding: var(--shin-gap-2) 0; border-bottom: 1px solid var(--shin-border-faint); }
.shin-kv-row:last-of-type { border-bottom: 0; }
.shin-kv-label { color: var(--shin-text-soft); font-size: var(--shin-text-sm); }
.shin-kv-value { color: var(--shin-text); font-size: var(--shin-text-sm); font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.shin-pagination { margin-top: var(--shin-gap-2); }
.shin-pagination .shin-button { width: 100%; min-height: 32px; padding: var(--shin-gap-1) var(--shin-gap-2); }
.shin-pagination .shin-button:disabled { border-color: var(--shin-border-strong); background: var(--shin-bg-sunken); color: var(--shin-text-soft); cursor: not-allowed; opacity: 1; }

/* Tiêu đề trong thanh header dùng chung cho màn form và shell Đồng bộ. Chỉ màu sắc là do từng màn chọn. */
.shin-header-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  font-size: var(--shin-text-lg);
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* --- Card -------------------------------------------------------- */

.shin-card {
  display: block;
  margin: 0;
  border: 1px solid var(--shin-border);
  border-radius: var(--shin-radius);
  background: var(--shin-bg);
  box-shadow: var(--shin-shadow-card);
}

/* Khai sau `.shin-card { margin: 0; }` để luật section không bị reset Card xóa mất nhịp giữa các thẻ. */
.shin-section > * + * { margin-top: var(--shin-gap-2); }

/*
 * Hàng tiêu đề nằm ngoài thẻ ruột nên nó không bị cuộn mất khi ruột card bị ghim trần.
 *
 * **Không nền, không viền liền, chỉ một gạch đứt mờ** — và cao đúng 24 pixel. Bản trước làm nó thành một dải màu lõm chạy
 * hết bề ngang card, viền liền, lề 8 trên 12 dưới: cao 34 pixel cho một chữ 12 pixel, và ba card xếp dọc thành ba cái mũ.
 * Chủ dự án nói "phần tiêu đề của các thẻ đang khá cao"; bản cũ chỉ có `padding-bottom: 4px` với một gạch đứt #eee, tức
 * tiêu đề là **nhãn của khối chữ bên dưới** chứ không phải một thanh riêng.
 *
 * Lề ngang phải bằng lề ngang của `.shin-card-body`, không thì chữ tiêu đề lệch một nhịp so với chữ trong ruột.
 */
.shin-card-head {
  display: flex;
  align-items: center;
  gap: var(--shin-gap-2);
  min-height: 28px;
  padding: 4px var(--shin-card-pad);
  border-bottom: 1px dashed var(--shin-border-faint);
}

.shin-card-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--shin-text-xs);
  font-weight: 700;
  line-height: 1.2;
  color: var(--shin-text-soft);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.shin-card-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--shin-gap-2);
}

/*
 * Nút trong hàng tiêu đề card: **một đường dẫn chữ xanh, không phải một cái nút**.
 *
 * Bản cũ vẽ chỗ này thành `.action-link` — glyph 14 pixel liền một chữ, 11 pixel, đậm, màu xanh, không nền không viền
 * ("＋ Thêm", "✎ Sửa"). Nó là **lối phụ** của card: nhìn ra được nhưng không tranh chỗ với nội dung. Một nút glyph vuông 28
 * pixel như ở header thì nong hàng tiêu đề lên 39 pixel, tức bao nhiêu công cắt lề ở trên cũng vô nghĩa.
 *
 * `height: auto` để nó cao đúng bằng chữ, và `width: auto` thắng nút glyph vuông ở trên — cả hai đều cần vì `.shin-icon`
 * ghim cả hai chiều bằng biến khung.
 */
.shin-card-head .shin-icon {
  width: auto;
  height: auto;
  min-width: 0;
  gap: 3px;
  padding: 0;
  border-radius: 0;
  color: var(--shin-primary);
  font-size: var(--shin-text-xs);
  font-weight: 600;
}

.shin-card-head .shin-icon .shin-glyph { width: 14px; height: 14px; }

/* Action cua card cau hinh: nut sua la secondary trung tinh, khong nham voi nut luu primary. */
.shin-button.shin-config-edit { border-color: var(--shin-bg-hover); background: var(--shin-bg-hover); color: var(--shin-text); }
.shin-button.shin-config-edit:hover { border-color: var(--shin-bg-hover-strong); background: var(--shin-bg-hover-strong); }
.shin-card-head .shin-icon.shin-config-edit-icon { color: var(--shin-primary); }
.shin-card-head .shin-icon.shin-config-save { color: var(--shin-ok); }
.shin-card-head .shin-icon.shin-config-cancel { color: var(--shin-error); }
.shin-card-head .shin-icon.shin-config-save:hover { color: var(--shin-ok); }
.shin-card-head .shin-icon.shin-config-cancel:hover { color: var(--shin-error); }

/* Không đổi nền — bản cũ để nguyên. Gạch chân là dấu duy nhất, đúng nếp một đường dẫn chữ. */
.shin-card-head .shin-icon:hover { background: none; text-decoration: underline; }

/* Nút có menu trong tiêu đề Card không dùng chiều cao nút menu của thanh Sidebar. */
.shin-card-head .shin-icon.shin-has-menu:has(.shin-btn-label) {
  width: auto;
  height: auto;
  min-height: 0;
  padding: 0;
  border-radius: 0;
  line-height: 1.2;
}

.shin-card-body {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 6px var(--shin-card-pad) var(--shin-card-pad);
}

/* Card là nơi duy nhất quyết định nhịp giữa các Block con; component con không được cộng margin dọc lần nữa. */
.shin-card-body > * { margin-top: 0; margin-bottom: 0; }
.shin-card-body > * + * { margin-top: var(--shin-gap-2); }

/* --- Trường và nhãn ---------------------------------------------- */

.shin-field { display: block; }

.shin-field-head {
  display: flex;
  align-items: center;
  gap: var(--shin-gap-1);
  margin-bottom: 2px;
}

.shin-label {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--shin-text-xs);
  font-weight: 500;
  color: var(--shin-text-soft);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.shin-label-req {
  color: var(--shin-danger);
}

/* Nút bút chì cạnh nhãn: bé, mờ, chỉ đậm lên khi trỏ tới — nó là lối phụ, không phải việc chính của trường. */
.shin-field-edit {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  padding: 0;
  border: 0;
  background: none;
  color: var(--shin-text-faint);
  cursor: pointer;
}

.shin-field-edit:hover { color: var(--shin-primary); }

.shin-field-edit .shin-glyph { width: 13px; height: 13px; }

/* --- Ô nhập ------------------------------------------------------ */

.shin-input {
  display: block;
  width: 100%;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border: 1px solid var(--shin-border);
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg);
  color: var(--shin-text);
  font-family: inherit;
  font-size: var(--shin-text-md);
  line-height: var(--shin-line-height);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.shin-input:focus {
  outline: none;
  border-color: var(--shin-primary);
  box-shadow: 0 0 0 2px var(--shin-primary-soft);
}

/* Chữ mời trong ô còn rỗng: nhạt hơn hẳn chữ thật, vì nó là lời hướng dẫn chứ không phải dữ liệu. `font-style` để nghiêng cho chắc — người dùng phân biệt được cả khi màn hình đang chỉnh sáng lệch. */
.shin-input::placeholder { color: var(--shin-text-faint); font-style: italic; opacity: 1; }

/* Ô chỉ đọc vẫn là ô nhập chứ không thành chữ trơn: người dùng còn chọn và sao chép được nội dung. */
.shin-input[readonly] {
  background: var(--shin-bg-sunken);
  color: var(--shin-text-soft);
  border-color: var(--shin-border);
}

/* Ô cửa ghi trả về là thiếu hoặc sai — hai màu đúng bản cũ (`.inp-error`). Bộ chọn hai lớp và đứng sau `:focus` để dấu đỏ
   không bị viền xanh của ô đang chọn xóa mất: sau một lượt lưu trượt, chính ô sai là ô được đưa con trỏ tới. */
.shin-input.shin-input-error {
  border-color: var(--shin-error);
  background: var(--shin-error-soft);
}

.shin-input.shin-input-error:focus {
  border-color: var(--shin-error);
  box-shadow: 0 0 0 2px var(--shin-error-soft);
}

/*
 * Ô nhập nhiều dòng: **tự cao theo nội dung tới trần mười dòng, quá trần mới cuộn nội bộ.**
 *
 * Chia việc giữa hai chỗ. Ở đây khai trần — một chỗ duy nhất giữ con số mười, tính từ `--shin-textarea-lines` nhân chiều
 * cao dòng nhân cỡ chữ, cộng hai lớp lề trên dưới và hai nét viền. Còn phần cho ô **thấp lại khi ít chữ** thì ở
 * `client/ui/inputs.html`: nó đặt `height` bằng chiều cao nội dung thật, rồi `max-height` ở đây tự chặn lại.
 *
 * Vì sao không để nguyên `rows="3"` và cuộn: ba dòng là chỗ đủ cho một câu, mà ô nội dung giao dịch thường dài năm bảy
 * dòng — người dùng gõ xong không đọc lại được cái mình vừa gõ nếu không cuộn. Chủ dự án nói đúng chỗ đó.
 *
 * `resize: vertical` giữ lại làm đường lùi: nếu phần tự cao không chạy được vì lý do nào đó thì vẫn còn cách kéo tay.
 */
.shin-textarea {
  resize: vertical;
  max-height: calc(var(--shin-textarea-lines) * var(--shin-line-height) * var(--shin-text-md) + 2 * var(--shin-gap-1) + 2px);
  overflow-y: auto;
}

/* Chữ chỉ đọc: không viền, không nền, cao theo nội dung để phép thu gọn của card đo được đúng chiều cao thật. `pre-wrap` giữ các lần xuống dòng người dùng đã gõ, `break-word` chặn một địa chỉ web dài đẩy ngang cả sidebar 300 pixel. */
.shin-readtext {
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-size: var(--shin-text-md);
  line-height: var(--shin-line-height);
  color: var(--shin-text);
}

.shin-readtext:empty::before { content: '(chưa có)'; color: var(--shin-text-soft); font-style: italic; }

/*
 * Khối chữ chỉ đọc **có việc gắn kèm**, tức bấm vào là mở form. Chọn theo `[data-action]` chứ không đặt thêm một tên lớp riêng: cái làm nó bấm được chính là thuộc tính đó, nên luật hình thức bám đúng vào nó thì không có đường lệch nhau.
 *
 * Chỉ đổi nền lúc trỏ chuột tới, không thêm viền cũng không thêm lề: một khung viền quanh ghi chú làm nó trông như ô nhập đang tắt, còn thêm lề thì chữ lệch so với các card khác trong một sidebar rộng 300 pixel. Bút chì ở tiêu đề card vẫn còn — nó là cửa cho bàn phím, vì `div` này không nhận được con trỏ.
 */
.shin-readtext[data-action] { cursor: pointer; border-radius: var(--shin-radius-sm); }
.shin-readtext[data-action]:hover { background: var(--shin-bg-hover); }

/* Số căn phải để mắt so hàng nghìn theo cột, đúng nếp bảng tính. */
.shin-number { text-align: right; font-variant-numeric: tabular-nums; }

/* --- Hai control gõ-để-lọc --------------------------------------- */

/*
 * **Không có mũi tên sổ xuống.** Sidebar rộng khoảng 300 pixel, một mũi tên cộng khoảng chừa cho nó ăn 24 pixel bề ngang — bằng ba bốn chữ, mà ba bốn chữ cuối của tên công ty mới là thứ phân biệt hai khách trùng đầu tên. Bản cũ không vẽ mũi tên và bù lại bằng việc **chọn vào ô là tự bung danh sách**, nên người dùng không mất đường mở nào.
 *
 * PopupList tự tính vị trí nổi; lớp này chỉ giữ mốc bố cục của trigger.
 */
.shin-combo { position: relative; }
.shin-combo-standalone { cursor: pointer; }
.shin-combo-standalone::after { content: '▾'; position: absolute; top: 50%; right: var(--shin-gap-2); transform: translateY(-50%); color: var(--shin-text-soft); font-size: var(--shin-text-xs); pointer-events: none; }
.shin-combo-standalone .shin-input { padding-right: 24px; cursor: pointer; }

/* Lựa chọn ít mục dùng hình thức menu: trigger là nút hiển thị, không phải input nên không bôi đen nhãn khi mở popup. */
.shin-choice { position: relative; width: 100%; }
.shin-choice-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-width: 0;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border: 1px solid var(--shin-border);
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg);
  color: var(--shin-text);
  font: inherit;
  line-height: var(--shin-line-height);
  text-align: left;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.shin-choice-trigger:focus {
  outline: none;
  border-color: var(--shin-primary);
  box-shadow: 0 0 0 2px var(--shin-primary-soft);
}
.shin-choice-trigger:disabled { background: var(--shin-bg-sunken); color: var(--shin-text-soft); cursor: not-allowed; opacity: .7; }
.shin-choice-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shin-choice-caret { flex: 0 0 auto; margin-left: var(--shin-gap-2); color: var(--shin-text-soft); font-size: var(--shin-text-xs); }
/*
  PopupList giữ hộp nổi ngoài luồng bố cục, neo tối thiểu bằng trigger và cho phép giãn theo nội dung trong trần Sidebar.
*/
/*
  PopupList tự lật lên khi phía dưới không đủ chỗ và tự giới hạn chiều cao để phần danh sách cuộn bên trong.
*/
/* Một dòng của danh sách. Nội dung dòng do phần bàn phím đổ vào; hình thức thì thuộc về đây. */
/* Dòng phụ của ô tra khách: mã khách và tỉnh. Hai khách trùng tên là chuyện thường, và đây là chỗ phân biệt chúng. */
.shin-combo-meta {
  color: var(--shin-text-faint);
  font-size: var(--shin-text-xs);
}

/*
  Hai dòng chú thích, **không bấm được**: `Không tìm thấy` và `Gõ thêm để lọc hẹp`.

  Nói ra thay vì bỏ trống. Một hộp trống thì người dùng không biết là gõ sai, là danh mục chưa có mục đó, hay là sidebar
  vừa hỏng. `cursor: default` để con trỏ chuột nói luôn rằng bấm vào đây không có gì xảy ra.
*/
.shin-combo-empty,
.shin-combo-more {
  padding: var(--shin-gap-1) var(--shin-gap-2);
  color: var(--shin-text-faint);
  font-size: var(--shin-text-xs);
  font-style: italic;
  cursor: default;
}

.shin-combo-more { border-top: 1px solid var(--shin-border); }

/* Vệt vàng của ô vừa được điền tự động, giữ đúng thói quen của bản cũ. */
.shin-input.is-filled { background: var(--shin-warn-soft); }

/* --- Chip -------------------------------------------------------- */

/*
  Màu theo **danh mục**, không theo giá trị: `@CAT_UU_TIEN` ra một màu cho cả bốn mức, nên thêm một mức mới vào sheet `Category` thì không phải sửa CSS. Danh mục không có lớp riêng thì chip xám.

  `flex: 0 0 auto` cho chip **co theo chữ của nó**, thắng luật chia đều của `.shin-row > *` nhờ nằm sau trong tệp. Không có nó thì chip "Đã xóa" nằm cạnh tên công ty ăn đúng nửa bề ngang, và tên công ty — thứ dài nhất, quan trọng nhất trên khối thông tin chung — bị ép còn một nửa của 276 pixel.
*/
.shin-badge {
  display: inline-block;
  flex: 0 0 auto;
  max-width: 100%;
  padding: 2px 6px;
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg-hover);
  color: var(--shin-text-soft);
  font-size: var(--shin-text-2xs);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Chip loại công việc là chip **xanh lá** của bản cũ (`.tx-job`), không phải chip xanh dương. Nó nằm cạnh mọi dòng lịch sử nên nó là chip người dùng thấy nhiều nhất, và bản cũ tách nó khỏi màu nhấn để nó không đọc ra như một chỗ bấm được. */
.shin-badge-cong-viec { background: #e6f4ea; color: var(--shin-ok); }
.shin-badge-uu-tien { background: var(--shin-warn-soft); color: var(--shin-warn); }
.shin-badge-xac-thuc { background: var(--shin-primary-soft); color: var(--shin-primary-dark); }
.shin-badge-cho-phep-fbm { background: var(--shin-primary-soft); color: var(--shin-primary-dark); }

/* Chip "Đã xóa" không suy từ danh mục nào — `recordStatus` là trạng thái hệ thống, không phải một mức người dùng chọn. */
.shin-badge-deleted { background: var(--shin-error-soft); color: var(--shin-error); }

/* --- Nút chữ, nút glyph, chữ trơn -------------------------------- */

.shin-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--shin-gap-1);
  padding: var(--shin-gap-1) var(--shin-gap-3);
  border: 1px solid var(--shin-border-strong);
  border-radius: var(--shin-radius-sm);
  background: var(--shin-bg);
  color: var(--shin-text);
  font-family: inherit;
  font-size: var(--shin-text-md);
  line-height: var(--shin-line-height);
  white-space: nowrap;
  cursor: pointer;
}

.shin-button:hover { background: var(--shin-bg-hover); }

/* Hai lớp trang trí mà schema gọi tên qua `className`. */
.shin-button.shin-primary { border-color: var(--shin-primary); background: var(--shin-primary); color: #ffffff; }
.shin-button.shin-primary:hover { background: var(--shin-primary-dark); border-color: var(--shin-primary-dark); }
.shin-button.shin-danger { color: var(--shin-error); }

/*
 * Nút đang chờ máy chủ. `dispatch.html` tự đặt `disabled` cho nút mang `data-busy`, nên trạng thái này phải nhìn ra được là "đang chạy" chứ không phải "hỏng".
 *
 * Khai sau `.shin-primary` nên nó thắng mà không cần `!important`: hai luật cùng độ mạnh, luật viết sau ăn. Nút Thử lại là nút primary, mà một nút xanh đậm đang tắt thì không ai tin là nó đã tắt.
 */
.shin-button:disabled { border-color: var(--shin-border); background: var(--shin-bg-sunken); color: var(--shin-text-faint); cursor: progress; }
.shin-button:disabled:hover { background: var(--shin-bg-sunken); }

/*
 * Nút glyph tròn của header. **32 pixel, bo tròn hẳn, glyph 20 pixel** — đúng `.icon-btn` của bản cũ.
 *
 * Khai sau nút và sau hàng nên nó thắng luật chia đều của `.shin-row > *` mà không cần `!important`.
 */
.shin-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: var(--shin-icon-btn);
  height: var(--shin-icon-btn);
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--shin-text-soft);
  font-family: inherit;
  font-size: var(--shin-text-md);
  cursor: pointer;
}

.shin-icon .shin-glyph { width: 20px; height: 20px; }

.shin-icon:hover { background: var(--shin-bg-hover); color: var(--shin-text); }

/* Nút đang bật. Đánh dấu bằng `aria-pressed` để trình đọc màn hình cũng nghe được trạng thái đó. */
.shin-icon[aria-pressed="true"] { background: var(--shin-primary-soft); color: var(--shin-primary); }

/* Nút sét giữ đúng màu vàng của bản cũ. Khi thiếu Extension, chấm nhỏ giữ cảnh báo ngay cả lúc công tắc đang tắt. */
.shin-icon.shin-toggle[aria-pressed="true"] { background: var(--shin-warn-soft); color: var(--shin-bolt); }

.shin-icon.shin-toggle.shin-extension-missing { position: relative; }
.shin-icon.shin-toggle.shin-extension-missing[aria-pressed="true"] { color: var(--shin-warn); }
.shin-icon.shin-sync-status-running { color: var(--shin-primary); background: var(--shin-primary-soft); }
.shin-icon.shin-sync-status-running .shin-glyph { animation: shin-sync-icon-spin 1.2s linear infinite; }
.shin-icon.shin-sync-status-paused { color: var(--shin-warn); background: var(--shin-warn-soft); }
.shin-icon.shin-sync-status-error { color: var(--shin-danger); background: var(--shin-danger-soft); }
@keyframes shin-sync-icon-spin { to { transform: rotate(360deg); } }
.shin-icon.shin-toggle.shin-extension-missing::after {
  content: '';
  position: absolute;
  top: 3px;
  right: 3px;
  width: 6px;
  height: 6px;
  border: 1px solid var(--shin-bg);
  border-radius: 50%;
  background: var(--shin-warn);
}

/*
 * Có menu **và** có chữ thì nút nở theo nội dung: đó là ca `{ label: "Đang xem", menu: [...] }` ở hàng tiêu đề card lịch sử.
 *
 * Nút chỉ có glyph thì giữ nguyên hình tròn 32 pixel như năm nút cùng hàng, và mũi nhọn ẩn đi. Bản cũ không có mũi nhọn nào trên header: một nút ba chấm tự nó đã nói "còn nữa", nên thêm một dấu 11 pixel cạnh glyph 20 pixel chỉ ra một hạt bẩn, mà lại làm đúng một nút trong hàng lệch hình khỏi các nút còn lại. Mũi nhọn vẫn nằm trong HTML — hợp đồng của `renderEngine` là "Block có menu thì có mũi nhọn", còn bày nó ra hay không là việc của CSS; hôm nào một nút header có chữ thì nó tự hiện.
 */
.shin-icon.shin-has-menu:has(.shin-btn-label) { width: auto; height: var(--shin-icon-btn); border-radius: var(--shin-radius-sm); padding: 0 var(--shin-gap-1); }

.shin-icon.shin-has-menu:not(:has(.shin-btn-label)) .shin-caret { display: none; }

/* Glyph nội tuyến không mang `width`/`height` trên thẻ nữa — bản cũ cũng để CSS quyết cỡ, nên cùng một glyph dùng lại được ở ba cỡ khác nhau. Con số ở đây là cỡ mặc định cho chỗ nào không khai riêng. */
.shin-glyph { flex: 0 0 auto; display: block; width: 16px; height: 16px; }

.shin-caret { flex: 0 0 auto; font-size: var(--shin-text-xs); line-height: 1; }

.shin-button:focus-visible,
.shin-icon:focus-visible,
.shin-field-edit:focus-visible,
.shin-toggle-control:focus-visible { outline: 2px solid var(--shin-primary); outline-offset: 1px; }

.shin-text { min-width: 0; overflow-wrap: break-word; }

/* --- Ô đánh dấu chọn dòng ---------------------------------------- */

/* Thẻ ngoài là `<label>` nên bấm vào cả vùng đều lật được ô đánh dấu, dễ trúng hơn hẳn một ô 13px trên sidebar hẹp. */
.shin-check {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  padding: 2px;
  cursor: pointer;
}

.shin-check-box { width: 14px; height: 14px; margin: 0; cursor: pointer; accent-color: var(--shin-primary); }

/* --- Chữ khi rỗng ------------------------------------------------ */

.shin-empty { padding: var(--shin-gap-3) 0; color: var(--shin-text-soft); font-size: var(--shin-text-sm); font-style: italic; }

/* --- Lớp menu nổi ------------------------------------------------ */

/* PopupList đặt menu fixed để không bị cắt bởi vùng sidebar đang cuộn. */
/* Ô đánh dấu rộng cố định kể cả lúc rỗng, nên nhãn của mọi mục thẳng một cột dù mục nào đang được tích. */
/* --- Nút thu gọn và mở ------------------------------------------- */

/* Cả hàng vẫn bấm được — đây là mép của một khối chữ bị cắt, và một dải rộng suốt bề ngang là đích dễ bấm nhất — nhưng
   **chữ nằm bên phải và thụt vào một nhịp**. Chủ dự án chốt vậy ngày 06/09/2026: bản trước để chữ sát mép trái, nên nó
   đứng ngay dưới đầu dòng nội dung và đọc ra như một dòng nữa của chính đoạn văn. Bên phải thì nó rời khỏi cột chữ, và
   thụt vào tám pixel thì nó không dính mép trong của card. */
.shin-collapse-btn {
  display: block;
  width: 100%;
  padding: var(--shin-gap-1) var(--shin-gap-2);
  border: 0;
  background: none;
  color: var(--shin-primary);
  font-family: inherit;
  font-size: var(--shin-text-xs);
  font-weight: 600;
  text-align: right;
  cursor: pointer;
}

.shin-collapse-btn:hover { text-decoration: underline; }

.shin-collapse-btn:focus-visible { outline: 2px solid var(--shin-primary); outline-offset: 1px; }
</style>
