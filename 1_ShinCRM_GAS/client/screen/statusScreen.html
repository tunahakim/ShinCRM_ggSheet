<script>
/*
 * Điều phối dữ liệu cho các màn trạng thái. Tệp này không ghép HTML và không chạm DOM;
 * bố cục/nhãn nằm ở client/schema/status/*.html, còn renderScreen là cổng duy nhất ra sidebar.
 */

function statusNumber(value) {
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function statusMs(ms) {
  if (ms === null || ms === undefined) { return 'không đo được'; }
  return statusNumber(ms) + ' ms (' + (ms / 1000).toFixed(1) + ' s)';
}

function statusRender(name, model) {
  if (typeof STATUS_SCHEMA === 'undefined' || !STATUS_SCHEMA[name]) {
    throw new Error('Thiếu schema màn trạng thái "' + name + '".');
  }
  return renderScreen(STATUS_SCHEMA[name](model || {}), { records: {} });
}

function statusBudgetModel(budget) {
  return {
    total: statusNumber(budget.total),
    ceiling: statusNumber(budget.ceiling),
    sheets: (budget.sheets || []).map(function (sheet) {
      return {
        name: sheet.name,
        rows: statusNumber(sheet.rows),
        columns: statusNumber(sheet.columns),
        cells: statusNumber(sheet.cells)
      };
    })
  };
}

function statusBudgetBlocked(budget) {
  return statusRender('budgetBlocked', statusBudgetModel(budget));
}

function statusLoadError(message) {
  return statusRender('loadError', { message: message });
}

/** Một dòng ngắn trong khối thông tin chung, dùng để báo tiến độ nạp nền. */
function statusInfoLine(text) {
  if (typeof sidebarBusyActive === 'function' && sidebarBusyActive()) {
    sidebarBusyMessage(text);
    return;
  }
  if (typeof renderRegionText === 'function') { renderRegionText('info', text); }
}

function statusSummaryModel(info) {
  var core = info.core;
  var timing = info.timing || {};
  var categoryValues = Object.keys(Store.categories).reduce(function (sum, code) { return sum + Store.categories[code].length; }, 0);
  return {
    summary: [
      ['Khách', statusNumber(Object.keys(Store.customers).length) + ' bản ghi'],
      ['Giao dịch', statusNumber(info.activityRecords) + ' bản ghi / ' + info.activityChunks + ' gói'],
      ['Khách có giao dịch', statusNumber(Object.keys(Store.activitiesByCustomer).length)],
      ['Chỉ mục tìm kiếm', statusNumber(Store.searchIndex.length) + ' phần tử'],
      ['Danh mục', Object.keys(Store.categories).length + ' cột / ' + statusNumber(categoryValues) + ' giá trị'],
      ['Config', 'tham số ' + Object.keys(Store.config.params).length + ' · ngầm định ' + Object.keys(Store.config.defaults).length + ' · bộ đếm ' + Object.keys(Store.config.counters).length + ' · sắp xếp ' + Store.config.sort.length + ' cấp'],
      ['Ngân sách ô', statusNumber(core.budget.total) + ' / ' + statusNumber(core.budget.ceiling) + ' (' + core.budget.ceilingSource + ')'],
      ['Trạng thái giao dịch', Store.activityState]
    ],
    timing: [
      ['Tổng — thứ bạn chờ', statusMs(timing.msTong)],
      ['Tới khung hình đầu tiên', statusMs(timing.msKhungHinhDau)],
      ['Máy chủ tính toán', statusMs(timing.msMayChu) + ' — cộng cả ' + (timing.soVong || 0) + ' vòng'],
      ['Tiền đi đường', statusMs(timing.msDiDuong) + ' — mỗi vòng ' + statusMs(timing.msDiDuongMoiVong)],
      ['Trình duyệt bung và vẽ', statusMs(timing.msKhachLamViec)]
    ],
    warnings: (info.warnings || []).map(String),
    skipped: (info.skipped || []).map(String)
  };
}

function statusLoadSummary(info) {
  return statusRender('loadSummary', statusSummaryModel(info));
}
</script>
