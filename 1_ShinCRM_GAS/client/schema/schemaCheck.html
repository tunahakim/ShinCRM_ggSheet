<script>
/**
 * Bộ tự kiểm bảng khai schema, theo danh sách phép kiểm ở tài liệu 03 Phần 5.
 *
 * Nó ở phía sidebar vì tài liệu chốt vậy, và lý do là thực tế: phép kiểm `source` trỏ đúng danh mục cần nội dung sheet
 * `Category`, mà sidebar là nơi đầu tiên có đủ cả `DATA_SCHEMA`, `UI_SCHEMA` và `Category` trong tay cùng lúc.
 *
 * Chỉ có **một** bản của bộ kiểm này, và nó là bản này. Bộ kiểm Node nạp chính tệp này rồi chạy trên bảng khai thật cộng
 * dữ liệu giả, nên luật được kiểm lúc phát triển và lúc chạy thật là cùng một đoạn code, không phải hai bản anh em.
 *
 * Hàm trả về cả danh sách phép kiểm đã BỎ QUA vì thiếu đầu vào. Bỏ qua trong im lặng là cách chắc chắn nhất để có một
 * bộ kiểm xanh mà chẳng kiểm gì.
 */

/** Kiểu và độ chi tiết hợp lệ. Giữ bản sao ở đây vì tệp client không đọc được `DataSchema.gs`; bộ kiểm Node so hai bản với nhau. */
var SCHEMA_CHECK_TYPES = ['TEXT', 'NUMBER', 'DATE', 'SELECT'];
var SCHEMA_CHECK_PRECISIONS = ['day', 'minute'];

/** Mã cột đúng dạng: `@`, chữ HOA và số, phân tách bằng gạch dưới, không dấu chấm. Tài liệu 02 Phần 2.3. */
var SCHEMA_CHECK_CODE_PATTERN = /^@[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$/;

/**
 * Chạy toàn bộ phép kiểm khai được với những gì bên gọi đưa vào.
 *
 * `input.dataSchema` là bắt buộc. Các mục còn lại thiếu thì phép kiểm tương ứng bị bỏ qua và có tên trong `skipped`:
 * `categoryCodes` (mảng mã `@CAT_` có thật trên sheet), `functionTables` ({ DEFAULTS, NORMALIZERS, VALIDATORS }),
 * `configDefaultCodes` (mảng mã cột có dòng trong bảng ngầm định gõ tay của `Config`), và bộ ba `uiSchema` + `actions` + `slots`.
 *
 * Phần kiểm `UI_SCHEMA` gọi `screenBuild` và `renderFieldPath` của hai tệp nhúng **sau** tệp này. Chạy được vì lời gọi xảy ra
 * lúc khởi động, không phải lúc nạp tệp; đổi lại là không được gọi `checkSchema` ở tầng ngoài cùng của một thẻ script.
 */
function checkSchema(input) {
  var problems = [];
  var skipped = [];
  var dataSchema = input && input.dataSchema;

  if (!dataSchema) {
    throw new Error('checkSchema cần dataSchema. Không có bảng khai thì không có gì để kiểm.');
  }

  var codeOwner = {};

  Object.keys(dataSchema).forEach(function (entity) {
    var fields = dataSchema[entity];

    Object.keys(fields).forEach(function (fieldName) {
      var field = fields[fieldName];
      var at = entity + '.' + fieldName;

      if (!field.code) {
        problems.push(at + ' thiếu `code`.');
      } else if (!SCHEMA_CHECK_CODE_PATTERN.test(field.code)) {
        problems.push(at + ' có mã cột "' + field.code + '" sai dạng. Mã phải mở đầu bằng @, viết HOA, phân tách bằng gạch dưới, không dấu chấm.');
      } else if (codeOwner[field.code]) {
        problems.push('mã cột "' + field.code + '" khai ở hai chỗ: ' + codeOwner[field.code] + ' và ' + at + '.');
      } else {
        codeOwner[field.code] = at;
      }

      if (!field.label) {
        problems.push(at + ' thiếu `label`.');
      }

      if (SCHEMA_CHECK_TYPES.indexOf(field.type) === -1) {
        problems.push(at + ' có type "' + field.type + '", phải là một trong ' + SCHEMA_CHECK_TYPES.join(', ') + '.');
      }

      if (field.type === 'SELECT') {
        var hasSource = typeof field.source === 'string' && field.source !== '';
        var hasOptions = Array.isArray(field.options) && field.options.length > 0;
        if (hasSource && hasOptions) {
          problems.push(at + ' là SELECT nhưng có cả `source` lẫn `options`. Phải có đúng một trong hai.');
        } else if (!hasSource && !hasOptions) {
          problems.push(at + ' là SELECT nhưng không có `source` cũng không có `options`.');
        }
      } else if (field.source || field.options) {
        problems.push(at + ' không phải SELECT nhưng có `source` hoặc `options`.');
      }

      if (field.type === 'DATE') {
        if (SCHEMA_CHECK_PRECISIONS.indexOf(field.precision) === -1) {
          problems.push(at + ' là DATE nhưng `precision` là "' + field.precision + '", phải là day hoặc minute.');
        }
      } else if (field.precision) {
        problems.push(at + ' không phải DATE nhưng có `precision`.');
      }
    });
  });

  // Phép kiểm cần nội dung sheet Category.
  if (Array.isArray(input.categoryCodes)) {
    Object.keys(dataSchema).forEach(function (entity) {
      var fields = dataSchema[entity];
      Object.keys(fields).forEach(function (fieldName) {
        var source = fields[fieldName].source;
        if (source && input.categoryCodes.indexOf(source) === -1) {
          problems.push(entity + '.' + fieldName + ' trỏ `source` tới "' + source + '" nhưng sheet Category không có mã cột đó.');
        }
      });
    });
  } else {
    skipped.push('source trỏ đúng danh mục trên sheet Category');
  }

  // Phép kiểm cần ba bảng hàm của tài liệu 03 Phần 6.
  var tables = input.functionTables;
  if (tables && tables.DEFAULTS && tables.NORMALIZERS && tables.VALIDATORS) {
    var pairs = [['default', 'DEFAULTS'], ['normalize', 'NORMALIZERS'], ['validate', 'VALIDATORS']];
    Object.keys(dataSchema).forEach(function (entity) {
      var fields = dataSchema[entity];
      Object.keys(fields).forEach(function (fieldName) {
        pairs.forEach(function (pair) {
          var name = fields[fieldName][pair[0]];
          if (name && typeof tables[pair[1]][name] !== 'function') {
            problems.push(entity + '.' + fieldName + ' khai `' + pair[0] + ': "' + name + '"` nhưng bảng ' + pair[1] + ' không có hàm tên đó.');
          }
        });
      });
    });
  } else {
    skipped.push('tên hàm trong default, normalize, validate có trong bảng tra');
  }

  // Luật một nguồn ngầm định của tài liệu 03 Phần 2.
  if (Array.isArray(input.configDefaultCodes)) {
    Object.keys(dataSchema).forEach(function (entity) {
      var fields = dataSchema[entity];
      Object.keys(fields).forEach(function (fieldName) {
        var field = fields[fieldName];
        if (field.default && input.configDefaultCodes.indexOf(field.code) !== -1) {
          problems.push(entity + '.' + fieldName + ' có `default` trong DATA_SCHEMA và đồng thời có dòng trong bảng ngầm định của Config. Chỉ được một nơi.');
        }
      });
    });
  } else {
    skipped.push('luật một nguồn ngầm định giữa DATA_SCHEMA và Config');
  }

  // Bản khai bố cục: tên hành động, tên slot, đường dẫn trường. **`[RÀNG BUỘC CỨNG]`** tài liệu 04 Phần 7.
  if (input.uiSchema && input.actions && input.slots) {
    schemaCheckUi(input, problems);
  } else {
    skipped.push('tên hành động, tên slot và đường dẫn trường của UI_SCHEMA');
  }

  return { problems: problems, skipped: skipped };
}

/** Chỗ để người đọc nhận ra Block nào sai: nhãn, chữ, tên trường, tên icon — thứ gì có thì lấy. Nhờ nó mà câu báo lỗi đọc được như tài liệu hứa: nút "LƯU DỮ LIỆU" trỏ tới hàm không có trong bảng. */
function schemaCheckWhere(node, man) {
  return 'màn "' + man + '" · ' + (node.label || node.text || node.field || node.icon || node.role);
}

/** Một mục menu. Kiểm riêng vì `menu` không đi qua `Block` nên không tệp nào khác nhìn vào bên trong nó — tài liệu 03 Phần 9. */
function schemaCheckMenuItem(muc, cho, moi) {
  if (!muc || typeof muc !== 'object') {
    moi.problems.push(cho + ' có mục menu không phải object.');
    return;
  }
  if (!muc.label) { moi.problems.push(cho + ' có mục menu thiếu `label` nên hiện ra một dòng trắng.'); }
  if (!muc.action) {
    moi.problems.push(cho + ' có mục menu "' + muc.label + '" thiếu `action`.');
  } else if (!Object.prototype.hasOwnProperty.call(moi.actions, muc.action)) {
    moi.problems.push(cho + ' có mục menu "' + muc.label + '" trỏ tới hàm "' + muc.action + '" không có trong bảng ACTIONS.');
  }
  if (muc.toggle && muc.value !== undefined) {
    moi.problems.push(cho + ' có mục menu "' + muc.label + '" vừa là công tắc vừa mang `value`. Chọn một.');
  }
}

/** Một node và cả con cháu nó. `titleActions` đi qua `screenBar` đúng đường mà engine dùng, để bản khai thô cũng được soi. */
function schemaCheckNode(node, moi) {
  if (!node || !node.role) { return; }
  var cho = schemaCheckWhere(node, moi.man);

  if (node.action && !Object.prototype.hasOwnProperty.call(moi.actions, node.action)) {
    moi.problems.push(cho + ' trỏ tới hàm "' + node.action + '" không có trong bảng ACTIONS.');
  }

  if (node.menu) {
    if (!Array.isArray(node.menu)) { moi.problems.push(cho + ' có `menu` không phải mảng.'); }
    else { node.menu.forEach(function (muc) { schemaCheckMenuItem(muc, cho, moi); }); }
  }

  if (node.role === 'field') { schemaCheckFieldPath(node, cho, moi); }

  if (typeof node.elements === 'string') {
    if (!Object.prototype.hasOwnProperty.call(moi.slots, node.elements)) {
      moi.problems.push(cho + ' lấy nội dung từ slot "' + node.elements + '" không có trong bảng SLOTS.');
    }
  } else if (Array.isArray(node.elements)) {
    node.elements.forEach(function (con) { schemaCheckNode(con, moi); });
  }

  if (Array.isArray(node.titleActions)) {
    screenBar(node.titleActions, cho).forEach(function (con) { schemaCheckNode(con, moi); });
  }
}

/** Đường dẫn trường tra được trong `DATA_SCHEMA`. Dùng chính `renderFieldPath` của engine, và biến câu ném của nó thành một dòng báo — bộ kiểm này phải kể ra hết chứ không dừng ở lỗi đầu tiên. */
function schemaCheckFieldPath(node, cho, moi) {
  var duong;
  try {
    duong = renderFieldPath(node, { entity: moi.entity });
  } catch (err) {
    moi.problems.push(cho + ': ' + err.message);
    return;
  }

  if (!moi.dataSchema[duong.entity]) {
    moi.problems.push(cho + ' trỏ tới thực thể "' + duong.entity + '" không có trong DATA_SCHEMA.');
  } else if (!moi.dataSchema[duong.entity][duong.name]) {
    moi.problems.push(cho + ' trỏ tới trường "' + duong.entity + '.' + duong.name + '" không có trong DATA_SCHEMA.');
  }
}

/**
 * Duyệt cả `UI_SCHEMA` qua đúng bộ dịch mà engine dùng, nên không có bản sao thứ hai của lối viết tắt.
 *
 * Bản khai dịch không nổi thì ghi một dòng rồi đi màn khác: một màn hỏng không được che ba màn còn lại.
 */
function schemaCheckUi(input, problems) {
  Object.keys(input.uiSchema).forEach(function (man) {
    var decl = input.uiSchema[man];
    var moi = { man: man, entity: decl && decl.entity, dataSchema: input.dataSchema, actions: input.actions, slots: input.slots, problems: problems };

    var dung;
    try {
      dung = screenBuild(decl, man);
    } catch (err) {
      problems.push('màn "' + man + '" không dịch được: ' + err.message);
      return;
    }

    dung.header.concat(dung.body, dung.footer).forEach(function (node) { schemaCheckNode(node, moi); });
  });
}
</script>
