/* Schema tĩnh của màn Chạy đồng bộ. Trạng thái sống và pipeline do controller điền vào Block. */
/**
 * Menu Mức quét dựng từ danh sách gói GAS chèn lúc dựng khung (`SIDEBAR_SERVER_DATA.fbm_sync`). Gói GAS có mà thiếu lời giải thích, hay lời giải thích cho gói GAS không còn, thì ném ngay lúc nạp để không lọt menu thiếu chữ hoặc lời giải thích mồ côi.
 */
function fbmSyncPackSchema(hints) {
  var names = SIDEBAR_SERVER_DATA.fbm_sync;
  var options = names.packs.map(function (pack) {
    if (!hints[pack.value]) { throw new Error('Mức quét "' + pack.value + '" chưa có lời giải thích trong schema màn Chạy đồng bộ.'); }
    return { value: pack.value, label: pack.label, hint: hints[pack.value] };
  });
  Object.keys(hints).forEach(function (value) {
    if (!options.some(function (option) { return option.value === value; })) { throw new Error('Lời giải thích cho mức quét "' + value + '" không còn trong GAS.'); }
  });
  return { id: 'fbm-sync-pack', label: 'Mức quét', kind: 'menu', defaultValue: names.packDefault, modes: ['read', 'write'], options: options };
}
