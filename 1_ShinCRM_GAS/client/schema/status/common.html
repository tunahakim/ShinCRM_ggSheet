<script>
/* Primitive schema dùng chung cho các màn trạng thái; không có thao tác DOM hay ghép HTML. */
var STATUS_SCHEMA = {};

function statusSchemaText(text, variant) {
  var className = uiResolveStatusTextClass(variant);
  if (!className) { throw new Error('Vai trò text status không hợp lệ: "' + variant + '".'); }
  return Text({ className: className, text: text === null || text === undefined ? '' : String(text) });
}

function statusSchemaBox(elements, variant) {
  var className = uiResolveStatusBoxClass(variant);
  if (!className) { throw new Error('Vai trò box status không hợp lệ: "' + variant + '".'); }
  return Box({ className: className, elements: elements || [] });
}

/** `id` gắn vào khối gốc của thân để bên ngoài hỏi được màn này còn đang hiện hay đã bị màn khác vẽ đè. */
function statusSchemaRoot(infoText, elements, id) {
  return {
    entity: 'status',
    infoBar: true,
    infoSlot: 'statusInfo',
    infoText: infoText || '',
    header: [],
    body: [RowGroup({ id: id || null, className: uiResolveStatusClass('root'), elements: elements || [] })],
    footer: []
  };
}

function statusSchemaKeyValues(pairs) {
  return Box({ className: uiResolveStatusClass('kv'), elements: (pairs || []).reduce(function (nodes, pair) {
    nodes.push(Text({ className: uiResolveStatusTextClass('kvLabel'), text: pair[0] }));
    nodes.push(Text({ className: uiResolveStatusTextClass('kvValue'), text: pair[1] }));
    return nodes;
  }, []) });
}

function statusSchemaTable(sheets) {
  var rows = [Box({ className: uiClassJoin(uiResolveStatusClass('tableRow'), uiResolveStatusClass('tableHead')), elements: [
    Text({ text: 'Sheet' }), statusSchemaText('Hàng', 'tableNum'),
    statusSchemaText('Cột', 'tableNum'), statusSchemaText('Số ô', 'tableNum')
  ] })];
  (sheets || []).forEach(function (sheet) {
    rows.push(Box({ className: uiResolveStatusClass('tableRow'), elements: [
      Text({ text: sheet.name }), statusSchemaText(sheet.rows, 'tableNum'),
      statusSchemaText(sheet.columns, 'tableNum'), statusSchemaText(sheet.cells, 'tableNum')
    ] }));
  });
  return Box({ className: uiResolveStatusClass('table'), elements: rows });
}

SLOTS.statusInfo = function (ctx) {
  return [statusSchemaText(ctx && ctx.screen && ctx.screen.infoText || '', 'info')];
};
</script>
