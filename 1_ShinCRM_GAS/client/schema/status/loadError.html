    statusSchemaText('Lượt chạy này đã ghi một dòng vào sheet Log kèm vết gọi. Bấm Thử lại, hoặc đóng rồi mở lại bảng làm việc nếu bấm mấy lần vẫn vỡ.')
  ]);
};
</script>
