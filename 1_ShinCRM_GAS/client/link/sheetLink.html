<script>
/**
 * `sheetLink` — tai nghe tin context thô từ Extension, đối chiếu reads trong Sidebar,
 * rồi gọi `ACTIONS.setCurrentCustomer`.
 *
 * Ba tầng lọc trước khi dùng tin:
 *   1. nonce — chỉ nhận tin mang đúng nonce mà sidebar vừa sinh, bỏ mọi tin lạ.
 *   2. origin — chỉ nhận từ `docs.google.com`, bỏ tin từ iframe khác.
 *   3. seq — bỏ tin cũ (seq nhỏ hơn seq đã dùng), tránh tin đến muộn đè tin mới.
 *
 * Extension chỉ gửi Name Box, hàng 1 thô và kết quả đọc theo địa chỉ. Sidebar mới
 * đối chiếu reads với Store; GAS vẫn là nơi quyết định reload và scope nghiệp vụ.
 *
 * Chỉ gọi `setCurrentCustomer` khi `Prefs.followSelection` bật và đang ở màn `view` (không giật màn khi đang mở form).
 *
 * Tình trạng sống của Extension suy từ `CRM_HANDSHAKE_ACK`, **không** suy từ việc `CRM_CONTEXT` im lặng: sheet ngồi im thì Extension sống cũng không bắn tin nào, nên im lặng không phải bằng chứng vắng mặt.
 */

var SHEET_LINK_NONCE = '';
var SHEET_LINK_SEQ = 0;
var SHEET_LINK_SPREADSHEET_ID = '';
var SHEET_LINK_READ_PLAN = null;
/** Hàng dữ liệu đầu tiên, GAS gửi kèm read plan. 0 = chưa biết thì không phân loại hàng trống/không tìm thấy. */
var SHEET_LINK_SCHEMA = null;
var SHEET_LINK_LAST_ACK = 0;
var SHEET_LINK_EXTENSION_SESSION = '';
var SHEET_LINK_LAST_SHEET = '';
var SHEET_LINK_LAST_CONTEXT = null;
// sidebarBoot clears this synchronously before the first bridge message can be handled.
var SHEET_LINK_RAM_READY = true;
var SHEET_LINK_APPLY_TICKET = 0;
var SHEET_LINK_VIEW_STATES = {};
var SHEET_LINK_DATA_PENDING = null;
var SHEET_LINK_RELOAD_CHECKING = null;
var SHEET_LINK_WAKE_TIMER = null;
var SHEET_LINK_SELECTION_CONTEXT = null;
var SHEET_LINK_PREVIOUS_CUSTOMER_ID = '';
var SHEET_LINK_SELECTION_PENDING = null;
var SHEET_LINK_SELECTION_WAKE_QUEUED = false;
var SHEET_LINK_SELECTION_WAKE_NEEDS_READ = false;
var SHEET_LINK_FREE_SHEETS = {};
var SHEET_LINK_CONTEXT_GENERATION = 0;
var SHEET_LINK_LAST_SEEN_REVISION = 0;
var SHEET_LINK_PING_TIMER = null;
var SHEET_LINK_EXTENSION_READ = { status: '', reason: '' };
var SHEET_LINK_READER_FAILURE_REPORTED = false;
/** Công tắc `SETTINGS.SHOW_PROBE_PROGRESS_DEBUG`; chưa nạp `SETTINGS` thì chạy im lặng. */
function sheetLinkShowProbeProgress() {
  return typeof SETTINGS !== 'undefined' && !!SETTINGS && SETTINGS.SHOW_PROBE_PROGRESS_DEBUG === true;
}
var sheetLinkInstalled = false;

var SHEET_LINK_ORIGIN = 'https://docs.google.com';
// Lỗi của cả bộ đọc live model, khác lỗi một ô chưa tải; `LIVE_GRID_SEARCHING` chỉ là lượt dò đầu trang nên không tính.
var SHEET_LINK_READER_DOWN_REASONS = ['LIVE_GRID_NOT_FOUND', 'LIVE_GRID_CONFLICT', 'READER_ERROR', 'LIVE_MODEL_TIMEOUT'];

function sheetLinkNonceMake() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/** Số mili giây cho các nhịp bắt tay và ngưỡng kết luận vắng mặt, đọc từ `SETTINGS` máy chủ gửi về; chưa về thì dùng số ngầm định. */
function sheetLinkMs(ten, ngamDinh) {
  if (typeof SETTINGS === 'undefined' || !SETTINGS || !SETTINGS[ten]) { return ngamDinh; }
  return Number(SETTINGS[ten]) || ngamDinh;
}

function sheetLinkInstall() {
  if (sheetLinkInstalled) { return; }
  sheetLinkInstalled = true;
  SHEET_LINK_NONCE = sheetLinkNonceMake();
  window.addEventListener('message', sheetLinkOnMessage);
  sheetLinkHandshakePing();
  SHEET_LINK_PING_TIMER = setInterval(sheetLinkHandshakePing, sheetLinkMs('HANDSHAKE_PING_MS', 1000));
}

/** Gán id tệp sheet sau lượt nạp lõi, để tầng lọc thứ ba có gì mà lọc. */
function sheetLinkSetSpreadsheetId(id) {
  SHEET_LINK_SPREADSHEET_ID = String(id || '');
}

/** Tin bắt tay mang read plan dạng tọa độ và khoảng gộp nhịp sống của kênh; Extension không được nhận luật reload hay ý nghĩa token. */
function sheetLinkHandshakeMessage() {
  return {
    action: 'CRM_HANDSHAKE',
    nonce: SHEET_LINK_NONCE,
    spreadsheetId: SHEET_LINK_SPREADSHEET_ID,
    readPlan: SHEET_LINK_READ_PLAN,
    channelAliveMs: sheetLinkMs('CHANNEL_ALIVE_RELAY_MS', 0)
  };
}

function sheetLinkSetReadPlan(plan) {
  SHEET_LINK_READ_PLAN = plan && typeof plan === 'object' ? plan : null;
  if (window.top !== window) {
    try { window.top.postMessage(sheetLinkHandshakeMessage(), SHEET_LINK_ORIGIN); } catch (err) {}
  }
}

/**
 * Sheet xem tự do: mọi sheet ngoài các sheet kho (có khóa riêng trong plan GAS gửi) và sheet `!`.
 * Extension chỉ nhận plan theo đúng tên sheet hoặc khóa `!`, nên Sidebar chép mẫu `!` thành khóa theo tên sheet tự do; `SHEET_LINK_FREE_SHEETS` nhớ khóa nào do Sidebar thêm để không nhầm với sheet kho.
 */
function sheetLinkIsFreeSheet(sheetName) {
  var name = String(sheetName || '');
  if (!name || name.charAt(0) === '!' || !SHEET_LINK_READ_PLAN) { return false; }
  return SHEET_LINK_FREE_SHEETS[name] === true || !Object.prototype.hasOwnProperty.call(SHEET_LINK_READ_PLAN, name);
}

/** Đổi số cột thành chữ cột kiểu A, Z, AA. */
function sheetLinkColumnLetters(column) {
  var value = Number(column || 0);
  var letters = '';
  while (value > 0) { letters = String.fromCharCode(65 + ((value - 1) % 26)) + letters; value = Math.floor((value - 1) / 26); }
  return letters;
}

/**
 * Sửa read plan theo hàng 1 Extension vừa gửi, cho sheet `!` (khóa chung `!`) và sheet xem tự do (khóa theo tên, chép từ mẫu `!`).
 * Sheet tự do lần đầu xuất hiện thì thêm khóa từ mẫu `!` để Extension dò lưới bằng chính các mã cột trong mẫu; mã cột lấy từ `DATA_SCHEMA` qua GAS, Sidebar không gõ cứng.
 * Sheet tự do đã có hàng 1 thì chỉ giữ mục có mã thật ở hàng 1, để thiếu một trong hai mã không làm cả lượt đọc thành lệch.
 */
function sheetLinkRefreshViewReadPlan(context) {
  var name = String(context && context.sheetName || '');
  if (!name || !SHEET_LINK_READ_PLAN || !Array.isArray(SHEET_LINK_READ_PLAN['!'])) { return; }
  var free = sheetLinkIsFreeSheet(name);
  if (!free && name.charAt(0) !== '!') { return; }
  var key = free ? name : '!';
  var current = Array.isArray(SHEET_LINK_READ_PLAN[key]) ? SHEET_LINK_READ_PLAN[key] : SHEET_LINK_READ_PLAN['!'];
  var headers = Array.isArray(context.rawHeaderRow) ? context.rawHeaderRow : [];
  var dynamic = current;
  if (headers.length) {
    var template = free ? SHEET_LINK_READ_PLAN['!'] : current;
    dynamic = template.map(function (item) {
      var match = headers.filter(function (header) { return String(header.value || '').trim() === String(item.expectedValue || '').trim(); })[0];
      if (!match) { return free ? null : item; }
      var letters = sheetLinkColumnLetters(match.column);
      return Object.assign({}, item, { headerAddress: match.address, valueAddressTemplate: letters + '{row}' });
    }).filter(Boolean);
  }
  if (free && !SHEET_LINK_FREE_SHEETS[name]) { SHEET_LINK_FREE_SHEETS[name] = true; }
  else if (JSON.stringify(dynamic) === JSON.stringify(SHEET_LINK_READ_PLAN[key])) { return; }
  var next = Object.assign({}, SHEET_LINK_READ_PLAN);
  next[key] = dynamic;
  sheetLinkSetReadPlan(next);
}

/** Đồng bộ hint cột từ payload core; dùng lại sau mỗi fullCore để schema mới không giữ map cũ. */
function sheetLinkApplyCoreHints(core) {
  if (!core || !core.selectionHints || typeof sheetLinkSetReadPlan !== 'function') { return; }
  sheetLinkSetSpreadsheetId(core.spreadsheetId);
  SHEET_LINK_SCHEMA = core.schema || SHEET_LINK_SCHEMA;
  SHEET_LINK_FREE_SHEETS = {};
  sheetLinkSetReadPlan(core.selectionHints.readPlan || null);
}

/** Context chỉ được giải mã sau khi Customer đã vào RAM. */
function sheetLinkSetRamReady(ready) { SHEET_LINK_RAM_READY = ready === true; }

/**
 * Ghi kết quả đọc của Extension cho sheet có read plan; trả true khi Extension đã tự đọc được.
 * Sheet không có read plan không cần mã khách nên không đổi tình trạng bộ đọc. Sheet xem tự do cũng vậy: Extension không tìm thấy lưới ở đó thường chỉ vì sheet không có cột mã, nên không hỏi GAS và không báo bộ đọc hỏng; bộ đọc hỏng thật vẫn lộ ra ở sheet kho.
 */
function sheetLinkRecordExtensionRead(context) {
  var sheetName = context && context.sheetName;
  if (!sheetLinkPlanForSheet(sheetName).length) { return true; }
  var free = sheetLinkIsFreeSheet(sheetName);
  // Sheet tự do không có cột mã là ca thường chứ không phải bộ đọc hỏng: vẫn ghi trạng thái để biết ai giữ vị trí, nhưng bỏ lý do để không bật băng cảnh báo và không đánh thức GAS.
  var next = { status: String(context.readStatus || ''), reason: free ? '' : String(context.readReason || '') };
  var changed = next.status !== SHEET_LINK_EXTENSION_READ.status || next.reason !== SHEET_LINK_EXTENSION_READ.reason;
  SHEET_LINK_EXTENSION_READ = next;
  if (changed && typeof selectionPollPaint === 'function') { selectionPollPaint(); }
  return free || next.status === 'ok';
}

/** Extension sống nhưng bộ đọc live model hỏng cả lưới, thường do Google đổi cấu trúc nội bộ của Sheets. */
function sheetLinkExtensionReaderDown(now) {
  return sheetLinkExtensionAlive(now) && SHEET_LINK_READER_DOWN_REASONS.indexOf(SHEET_LINK_EXTENSION_READ.reason) >= 0;
}

/** Báo GAS ghi `Log` một lần mỗi phiên Sidebar; ghi mỗi lần click sẽ đẩy các dòng khác ra khỏi `Log`. */
function sheetLinkReaderFailureInput() {
  if (SHEET_LINK_READER_FAILURE_REPORTED || !sheetLinkExtensionReaderDown()) { return ''; }
  SHEET_LINK_READER_FAILURE_REPORTED = true;
  return SHEET_LINK_EXTENSION_READ.reason;
}

/** Extension còn sống không: ACK về trong ngưỡng, tính từ nhịp ping gần nhất. */
function sheetLinkExtensionAlive(now) {
  if (!SHEET_LINK_LAST_ACK) { return false; }
  return (now === undefined ? Date.now() : now) - SHEET_LINK_LAST_ACK < sheetLinkMs('EXTENSION_ACK_TIMEOUT_MS', 3000);
}

function sheetLinkHandshakePing() {
  if (window.top !== window) {
    try {
      window.top.postMessage(sheetLinkHandshakeMessage(), SHEET_LINK_ORIGIN);
    } catch (err) {
      // Extension chưa cài hoặc trang chưa sẵn sàng — không sao, ping lại ở nhịp sau.
    }
  }
  if (typeof selectionPollHeartbeat === 'function') { selectionPollHeartbeat(); }
  if (typeof changeSignalWatchdog === 'function') { changeSignalWatchdog(); }
}

function sheetLinkOnMessage(event) {
  var data = event.data;
  if (!data) { return; }

  // Tầng origin đi trước cả ACK: tin sai nguồn thì không được phép đụng tới trạng thái sống.
  if (event.origin !== SHEET_LINK_ORIGIN) { return; }

  if (data.action === 'CRM_HANDSHAKE_ACK') {
    if (data.nonce !== SHEET_LINK_NONCE) { return; }
    var ackSession = String(data.sessionId || '');
    if (ackSession && ackSession !== SHEET_LINK_EXTENSION_SESSION) {
      SHEET_LINK_EXTENSION_SESSION = ackSession;
      SHEET_LINK_SEQ = 0;
    }
    SHEET_LINK_LAST_ACK = Date.now();
    if (typeof fbmSyncNotifyBridgeReady === 'function') { fbmSyncNotifyBridgeReady(); }
    if (typeof selectionPollOnAck === 'function') { selectionPollOnAck(); }
    return;
  }

  // Kênh `/bind`: chỉ đánh thức, không mang revision hay dữ liệu; lời hỏi GAS mới là nguồn đúng.
  if (data.action === 'CRM_RELOAD' || data.action === 'CRM_CHANNEL_ALIVE') {
    if (data.nonce !== SHEET_LINK_NONCE) { return; }
    if (SHEET_LINK_EXTENSION_SESSION && String(data.sessionId || '') !== SHEET_LINK_EXTENSION_SESSION) { return; }
    if (data.action === 'CRM_RELOAD') { changeSignalReceive(data); } else { changeSignalOnFrame(); }
    return;
  }

  if (data.action !== 'CRM_CONTEXT') { return; }

  // Tầng 1: nonce
  if (data.nonce !== SHEET_LINK_NONCE) { return; }

  // Extension được tải lại thì seq bắt đầu lại từ 1. Chỉ nhận context của đúng phiên đã ACK để tin cũ không hạ mốc seq.
  if (SHEET_LINK_EXTENSION_SESSION && String(data.sessionId || '') !== SHEET_LINK_EXTENSION_SESSION) { return; }

  // Tầng 2: spreadsheetId — chỉ nhận tin từ đúng tệp sheet sidebar đang phục vụ
  if (SHEET_LINK_SPREADSHEET_ID && data.spreadsheetId !== SHEET_LINK_SPREADSHEET_ID) { return; }

  // Tầng 3: seq — bỏ tin cũ
  if (data.seq <= SHEET_LINK_SEQ) { return; }
  SHEET_LINK_SEQ = data.seq;

  var previousPosition = sheetLinkPositionKey(SHEET_LINK_LAST_CONTEXT || {});
  sheetLinkRefreshViewReadPlan(data);
  var positionChanged = previousPosition !== sheetLinkPositionKey(data);
  // Extension gửi lại cùng vị trí khi nhận lại read plan; chỉ vị trí mới mới làm cũ câu trả lời selection GAS đang bay.
  if (positionChanged) { SHEET_LINK_CONTEXT_GENERATION += 1; }
  var applied = sheetLinkApplyContext(data);
  // Nhấp, gõ hay đổi vị trí không đánh thức GAS: thay đổi dữ liệu đến qua kênh `/bind`. Chỉ khi Extension không đọc được mã ở vị trí mới thì GAS phải đọc thay.
  if (positionChanged && !sheetLinkRecordExtensionRead(data)) { sheetLinkScheduleWake(); }
  if (applied && typeof applied.then === 'function') {
    applied.then(null, function (err) {
      // Context arrives from the background bridge; never interrupt the user with an alert.
      if (typeof console !== 'undefined' && console.error) { console.error(err); }
    });
  }
}

function sheetLinkViewState(sheetName) {
  if (!SHEET_LINK_VIEW_STATES[sheetName]) {
    SHEET_LINK_VIEW_STATES[sheetName] = { pending: null, renderRequestedRevision: 0 };
  }
  return SHEET_LINK_VIEW_STATES[sheetName];
}

/**
 * Hai thông báo của sheet `!` đang đứng: khối lỗi vẽ do GAS gửi (thay hẳn thân Sidebar) và dòng "chưa cập nhật" khi tự làm mới đang tắt. Có lỗi thì không báo chưa cập nhật, vì sửa lỗi xong mới vẽ được.
 * Kết quả của sheet đã rời bị bỏ qua: thông báo chỉ nói về sheet người dùng đang đứng.
 */
function sheetLinkViewNotices(sheetName, problems, stale) {
  if (typeof noticeSet !== 'function' || sheetName !== SHEET_LINK_LAST_SHEET) { return; }
  var list = Array.isArray(problems) ? problems : [];
  noticeSet('viewStale', stale && !list.length ? {
    line: 'Sheet ' + sheetName + ' chưa cập nhật',
    button: { label: 'Làm mới', action: 'renderActiveViewSheet' },
    blocks: [{ variant: 'warning', title: 'Sheet ' + sheetName + ' chưa cập nhật', lines: ['Dữ liệu đã đổi nhưng tự động làm mới sheet quản trị đang tắt.'], button: { label: 'Làm mới', action: 'renderActiveViewSheet' } }]
  } : null);
  noticeSet('viewProblems', list.length ? {
    line: 'Sheet ' + sheetName + ' chưa vẽ được — đang giữ dữ liệu cũ',
    takeover: true,
    blocks: list.map(function (problem) { return { variant: 'error', title: problem.title, lines: problem.lines || [], hint: problem.hint || '' }; })
  } : null);
}

/** Rời sheet `!` thì bỏ thông báo của nó. */
function sheetLinkViewNoticesClear() {
  if (typeof noticeSet !== 'function') { return; }
  noticeSet('viewStale', null);
  noticeSet('viewProblems', null);
}

/** Kết quả một lượt vẽ (tự động hay bấm Làm mới): lỗi thì hiện khối lỗi, vẽ được hoặc sheet đã mới thì bỏ mọi thông báo của sheet đó. */
function sheetLinkViewApplyResult(sheetName, result) {
  if (!result) { return result; }
  sheetLinkViewNotices(sheetName, result.ok === false ? result.problems : [], false);
  return result;
}

/**
 * GAS đã quyết sheet `!` đang xem cũ hay mới, có được tự vẽ, và gửi kèm khối lỗi của lượt vẽ hỏng gần nhất; Sidebar chỉ thực hiện.
 * Mỗi revision chỉ xin vẽ một lần: hai câu trả lời liên tiếp cùng revision (lời hỏi thứ hai gửi đi trước khi lượt vẽ đầu xong) không sinh lượt vẽ thứ hai.
 */
function sheetLinkApplyViewDecision(result) {
  var view = result && result.view;
  if (!view || !view.sheetName) { return null; }
  if (view.action !== 'render') { sheetLinkViewNotices(view.sheetName, view.problems, view.action === 'notify'); return null; }
  var state = sheetLinkViewState(view.sheetName);
  if (state.pending) { return state.pending; }
  var revision = Number(sheetLinkReloadState(result).revision || 0);
  if (revision && state.renderRequestedRevision === revision) { return null; }
  state.renderRequestedRevision = revision;
  var run = function () { return sheetLinkSyncView(view.sheetName); };
  var message = 'Đang cập nhật sheet ' + view.sheetName + '…';
  return typeof sidebarBusyRun === 'function' ? sidebarBusyRun(message, run, { block: false, progress: true }) : run();
}

function sheetLinkParseNameBox(value) {
  var text = String(value || '').trim().toUpperCase().split('!').pop();
  var match = text.match(/^([A-Z]+)([0-9]+)(?::([A-Z]+)([0-9]+))?$/);
  function columnNumber(value) {
    var result = 0;
    for (var i = 0; i < value.length; i++) { result = result * 26 + value.charCodeAt(i) - 64; }
    return result;
  }
  if (match) { return { row: Number(match[2]), col: columnNumber(match[1]), rowEnd: Number(match[4] || match[2]), colEnd: columnNumber(match[3] || match[1]) }; }
  var parts = text.split(':');
  if (parts.length === 2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) {
    return { row: Number(parts[0]), col: 1, rowEnd: Number(parts[1]), colEnd: 0 };
  }
  if (parts.length === 2 && /^[A-Z]+$/.test(parts[0]) && /^[A-Z]+$/.test(parts[1])) {
    return { row: 1, col: columnNumber(parts[0]), rowEnd: 0, colEnd: columnNumber(parts[1]) };
  }
  return null;
}

function sheetLinkPlanForSheet(sheetName) {
  if (!SHEET_LINK_READ_PLAN) { return []; }
  if (Array.isArray(SHEET_LINK_READ_PLAN[sheetName])) { return SHEET_LINK_READ_PLAN[sheetName]; }
  return String(sheetName || '').indexOf('!') === 0 && Array.isArray(SHEET_LINK_READ_PLAN['!']) ? SHEET_LINK_READ_PLAN['!'] : [];
}

function sheetLinkReloadState(payload) {
  if (!payload) { return {}; }
  return payload.reload || payload;
}

/** Sổ nhật ký đã có revision mới hơn revision Sidebar này đã nạp: chỉ GAS biết đổi gì, nên việc của Sidebar là hỏi GAS. */
function sheetLinkReloadIsNewer(state) {
  var revision = Number(state && state.revision || 0);
  return revision > SHEET_LINK_LAST_SEEN_REVISION;
}

/**
 * Rời sheet kho chỉ đáng một lời hỏi ngay khi còn việc chờ: tín hiệu chưa hỏi hoặc lời hỏi đang bay. Không có gì chờ mà kênh sống thì thay đổi nào chưa tới sẽ tự đến qua kênh; hỏi thêm chỉ tốn một lượt GAS. Kênh chết hoặc vắng Extension thì không biết có việc chờ hay không nên vẫn hỏi.
 */
function sheetLinkLeaveNeedsFlush() {
  if (SHEET_LINK_SELECTION_PENDING || SHEET_LINK_DATA_PENDING) { return true; }
  if (typeof changeSignalPending !== 'function' || !sheetLinkExtensionAlive() || changeSignalChannelDead()) { return true; }
  return changeSignalPending();
}

/** Extension không đọc được mã ở vị trí mới: hỏi GAS đọc thay sau khi vị trí đứng yên `POSITION_WAKE_MS`, để lướt qua nhiều ô chỉ sinh một lời hỏi. */
function sheetLinkScheduleWake() {
  if (!SHEET_LINK_RAM_READY || typeof setTimeout !== 'function') { return null; }
  if (SHEET_LINK_WAKE_TIMER !== null && typeof clearTimeout === 'function') { clearTimeout(SHEET_LINK_WAKE_TIMER); }
  SHEET_LINK_WAKE_TIMER = setTimeout(function () {
    SHEET_LINK_WAKE_TIMER = null;
    sheetLinkProbeSelectionAndReload('position', { needsSelection: true });
  }, sheetLinkMs('POSITION_WAKE_MS', 1000));
  return SHEET_LINK_WAKE_TIMER;
}

function sheetLinkLocalDraftInput() {
  var ids = typeof refreshLocalDraftIds === 'function' ? refreshLocalDraftIds() : [];
  return { recordIds: ids };
}

/**
 * Áp kết quả lời hỏi: gói mới hơn revision đã thấy thì áp rồi nâng revision đã thấy lên đúng revision GAS đã xử lý (07A bất biến 4). Không gói (không có gì mới, hoặc hoãn vì bản nháp) thì giữ nguyên revision để lời hỏi sau nhận lại đủ.
 * Lượt nạp do tín hiệu chỉ hiện thanh loading, không chặn người đang thao tác.
 */
function sheetLinkApplyDecisionResult(result) {
  sheetLinkDeferredNotice(result);
  if (!result || !result.payload || typeof refreshReloadPayload !== 'function') { return result; }
  // Hai lời hỏi bay song song: phản hồi về muộn mang dữ liệu đọc trước gói đã áp, áp vào sẽ ghi đè RAM bằng dữ liệu cũ.
  if ((Number(result.processedRevision) || 0) <= SHEET_LINK_LAST_SEEN_REVISION) { return result; }
  var payloadWork = function () { return refreshReloadPayload(result.payload); };
  var payloadRun = typeof sidebarBusyRun === 'function' ? sidebarBusyRun('Đang đồng bộ dữ liệu vừa thay đổi…', payloadWork, { progress: true, block: false }) : payloadWork();
  var payloadDone = function (value) {
    if (value) { SHEET_LINK_LAST_SEEN_REVISION = Math.max(SHEET_LINK_LAST_SEEN_REVISION, Number(result.processedRevision) || 0); }
    return value || result;
  };
  return payloadRun && typeof payloadRun.then === 'function' ? payloadRun.then(payloadDone) : payloadDone(payloadRun);
}

/** GAS đang hoãn nạp vì form đang mở: lời hỏi sau khi đóng form mới nạp được. */
var SHEET_LINK_DEFERRED = false;

/**
 * Dòng báo đáy khi GAS hoãn nạp vì form đang mở, lấy từ chính kết quả lời hỏi nên không thêm lời gọi GAS; lời hỏi không hoãn nữa thì bỏ dòng báo. Hoãn theo mã thì khách đang sửa vừa đổi trên Sheet và lần lưu sẽ hỏi lại qua kiểm xung đột; hoãn nạp trọn (cấu hình, cả thực thể) thì chỉ chờ đóng form.
 */
function sheetLinkDeferredNotice(result) {
  var ram = result && result.decision && result.decision.ram;
  if (!ram || typeof noticeSet !== 'function') { return; }
  SHEET_LINK_DEFERRED = ram.action === 'defer';
  var title = ram.mode === 'records' ? 'Khách này vừa được sửa trên Sheet, khi lưu sẽ hỏi lại' : 'Dữ liệu vừa đổi trên Sheet, sẽ nạp lại khi đóng form';
  noticeSet('recordDeferred', SHEET_LINK_DEFERRED ? {
    line: title,
    blocks: [{ variant: 'warning', title: title, lines: ['Sidebar giữ nguyên chữ đang gõ và chưa nạp dữ liệu mới vào form đang mở.'] }]
  } : null);
}

/** Đóng một form lúc GAS đang hoãn nạp thì hỏi lại ngay, để dữ liệu mới vào RAM thay vì chờ lượt hỏi định kỳ; không hoãn thì không tốn lời gọi nào. GAS quyết lại theo các form còn mở. */
function sheetLinkFormClosed() {
  if (!SHEET_LINK_DEFERRED) { return null; }
  return sheetLinkProbeSelectionAndReload('form-closed', { silent: true });
}

/** Lời đánh thức xếp hàng khi lời hỏi trước còn bay phải giữ cờ đọc vị trí, nếu không GAS so vị trí thấy không đổi và trả mã khách cũ. */
function sheetLinkTakeQueuedWake() {
  var needsSelection = SHEET_LINK_SELECTION_WAKE_NEEDS_READ;
  SHEET_LINK_SELECTION_WAKE_NEEDS_READ = false;
  return needsSelection ? { needsSelection: true } : undefined;
}

/** Extension chỉ giữ quyền chọn khách khi tự đọc được ở sheet đang đứng; đọc hỏng hoặc sheet chưa có plan thì mã do GAS đọc thay mới là nguồn đúng. */
function sheetLinkExtensionOwnsContext() {
  return sheetLinkExtensionAlive() && !!SHEET_LINK_LAST_CONTEXT && sheetLinkPlanForSheet(SHEET_LINK_LAST_CONTEXT.sheetName).length > 0 && SHEET_LINK_EXTENSION_READ.status === 'ok';
}

/** Hỏi selection + ReloadState trong đúng một round-trip; GAS tự quyết định đọc mã và scope RAM. */
function sheetLinkProbeSelectionAndReload(reason, options) {
  if (!SHEET_LINK_RAM_READY || typeof callServer !== 'function') { return null; }
  if (SHEET_LINK_SELECTION_PENDING) {
    // Chỉ giữ tín hiệu đánh thức; GAS vẫn tự đọc ReloadState mới nhất.
    SHEET_LINK_SELECTION_WAKE_QUEUED = true;
    if (options && options.needsSelection === true) { SHEET_LINK_SELECTION_WAKE_NEEDS_READ = true; }
    return SHEET_LINK_SELECTION_PENDING;
  }
  var opts = options || {};
  var contextGeneration = SHEET_LINK_CONTEXT_GENERATION;
  var input = {
    previousSelectionContext: SHEET_LINK_SELECTION_CONTEXT,
    previousCustomerId: SHEET_LINK_PREVIOUS_CUSTOMER_ID,
    lastSeenRevision: SHEET_LINK_LAST_SEEN_REVISION,
    localDraft: sheetLinkLocalDraftInput(),
    reason: reason || 'wake',
    needsSelection: opts.needsSelection === true,
    skipPosition: sheetLinkExtensionOwnsContext(),
    extensionReadFailure: sheetLinkReaderFailureInput(),
    channelSilence: typeof changeSignalDeadReportInput === 'function' && changeSignalDeadReportInput()
  };
  var request = callServer('probeSelectionAndReload', [input], {
    silent: !sheetLinkShowProbeProgress()
  });
  var settled = request.then(function (result) {
    var extensionOwnsContext = sheetLinkExtensionOwnsContext();
    var contextIsCurrent = contextGeneration === SHEET_LINK_CONTEXT_GENERATION;
    if (result && result.selection && contextIsCurrent && !extensionOwnsContext) {
      SHEET_LINK_SELECTION_CONTEXT = Object.assign({}, result.selection);
      SHEET_LINK_PREVIOUS_CUSTOMER_ID = String(result.selection.customerId || '').trim();
      sheetLinkApplyContext(Object.assign({}, result.selection), { fromProbe: true });
    }
    var applied = sheetLinkApplyDecisionResult(result, opts);
    var applyView = function () {
      var drawn = sheetLinkApplyViewDecision(result);
      return drawn && typeof drawn.then === 'function' ? drawn.then(function () { return result; }) : result;
    };
    return applied && typeof applied.then === 'function' ? applied.then(applyView) : applyView();
  }, function (error) {
    if (typeof console !== 'undefined' && console.warn) { console.warn('Không kiểm tra được selection/reload; sẽ thử lại ở nhịp sau.', error); }
    return null;
  });
  var completion = settled.then(function (result) {
    SHEET_LINK_SELECTION_PENDING = null;
    if (SHEET_LINK_SELECTION_WAKE_QUEUED) {
      SHEET_LINK_SELECTION_WAKE_QUEUED = false;
      var followUp = sheetLinkProbeSelectionAndReload('queued-wake', sheetLinkTakeQueuedWake());
      if (followUp && typeof followUp.then === 'function') {
        return followUp.then(function () { return result; });
      }
    }
    if (typeof selectionPollResetSafety === 'function') { selectionPollResetSafety(); }
    return result;
  }, function (error) {
    SHEET_LINK_SELECTION_PENDING = null;
    if (SHEET_LINK_SELECTION_WAKE_QUEUED) {
      SHEET_LINK_SELECTION_WAKE_QUEUED = false;
      sheetLinkProbeSelectionAndReload('queued-wake', sheetLinkTakeQueuedWake());
    }
    if (typeof selectionPollResetSafety === 'function') { selectionPollResetSafety(); }
    throw error;
  });
  SHEET_LINK_SELECTION_PENDING = completion;
  return SHEET_LINK_SELECTION_PENDING;
}

/** Đồng bộ dữ liệu kho cũng chỉ có một lượt đang bay; chỉ khóa sidebar sau khi máy chủ xác nhận có dữ liệu bẩn. */
function sheetLinkSyncDirtyData(options) {
  var opts = options || {};
  if (SHEET_LINK_DATA_PENDING) { return SHEET_LINK_DATA_PENDING; }
  var request = sheetLinkProbeSelectionAndReload(opts.reason || 'dirty-state', opts);
  SHEET_LINK_DATA_PENDING = request;
  if (request && typeof request.then === 'function') {
    request.then(function () { if (SHEET_LINK_DATA_PENDING === request) { SHEET_LINK_DATA_PENDING = null; } }, function () { if (SHEET_LINK_DATA_PENDING === request) { SHEET_LINK_DATA_PENDING = null; } });
  }
  return request;
}

/** Được gọi sau một lời gọi máy chủ tự nhiên; không chạy theo nhịp riêng và không gọi lại chính getReloadState. */
function sheetLinkObserveReloadPayload(payload, serverName) {
  if (!payload || payload.reloadObservation === false || !SHEET_LINK_RAM_READY || serverName === 'getReloadState' || serverName === 'reloadRecords' || serverName === 'probeSelectionAndReload' || serverName === 'saveRecord' || serverName === 'deleteRecords') { return null; }
  var state = sheetLinkReloadState(payload);
  if (!sheetLinkReloadIsNewer(state)) { return null; }
  if (SHEET_LINK_RELOAD_CHECKING) { return SHEET_LINK_RELOAD_CHECKING; }
  var check = sheetLinkSyncDirtyData();
  SHEET_LINK_RELOAD_CHECKING = check;
  check.then(function (result) { SHEET_LINK_RELOAD_CHECKING = null; return result; }, function (err) { SHEET_LINK_RELOAD_CHECKING = null; if (typeof console !== 'undefined' && console.warn) { console.warn(err); } });
  return check;
}

function sheetLinkPositionKey(ctx) {
  var value = ctx || {};
  var coordinates = sheetLinkParseNameBox(value.cellRef);
  return [value.sheetName || '', value.cellRef || '', coordinates ? coordinates.row : value.row || 0, coordinates ? coordinates.col : value.col || 0, coordinates ? coordinates.rowEnd : value.rowEnd || 0, coordinates ? coordinates.colEnd : value.colEnd || 0].join('|');
}

/** Một sheet chỉ có một lượt làm mới đang bay; mọi lựa chọn đến trong lúc đó cùng chờ đúng lượt này. */
function sheetLinkSyncView(sheetName) {
  var state = sheetLinkViewState(sheetName);
  if (state.pending) { return state.pending; }
  var settled = false;
  var request = callServer('renderViewIfDirty', [sheetName]).then(function (result) {
    settled = true;
    state.pending = null;
    return sheetLinkViewApplyResult(sheetName, result);
  }, function (err) {
    settled = true;
    state.pending = null;
    throw err;
  });
  if (!settled) { state.pending = request; }
  return request;
}

/** `fromProbe`: vị trí do chính lời hỏi GAS trả về, lời hỏi đó đã mang quyết định cho sheet `!` nên không hỏi lại. */
function sheetLinkApplyContext(ctx, options) {
  if (!ctx) { return null; }
  var fromProbe = !!(options && options.fromProbe);
  SHEET_LINK_LAST_CONTEXT = Object.assign({}, ctx);
  SHEET_LINK_SELECTION_CONTEXT = Object.assign({}, ctx);
  if (Array.isArray(ctx.reads)) { SHEET_LINK_PREVIOUS_CUSTOMER_ID = sheetLinkCustomerIdFromContext(ctx); }
  else if (Object.prototype.hasOwnProperty.call(ctx, 'customerId')) { SHEET_LINK_PREVIOUS_CUSTOMER_ID = String(ctx.customerId || '').trim(); }
  var ticket = ++SHEET_LINK_APPLY_TICKET;
  var previousSheet = SHEET_LINK_LAST_SHEET;
  var changedSheet = ctx.sheetName !== previousSheet;
  var isView = ctx.sheetName && ctx.sheetName.charAt(0) === '!';
  var viewState = isView ? sheetLinkViewState(ctx.sheetName) : null;

  SHEET_LINK_LAST_SHEET = ctx.sheetName || '';
  if (changedSheet && previousSheet.charAt(0) === '!') { sheetLinkViewNoticesClear(); }
  if (!SHEET_LINK_RAM_READY) { return; }

  // Đổi khách từ context Extension là đường cục bộ và không được chờ RPC
  // kiểm tra dirty khi người dùng vừa chuyển sheet. Lượt server phía dưới vẫn
  // chạy nền để xử lý reload/view; nếu Store chưa có mã, applyLatest sẽ thử lại
  // sau khi lượt nạp hoàn tất.
  var immediateCustomerApplied = sheetLinkApplyCustomerContext(ctx);

  var leavingDataSheet = changedSheet && (previousSheet === 'Customer' || previousSheet === 'Activity');
  var work = function () {
    var pending = null;
    var queue = function (next) { pending = pending ? pending.then(next) : next(); };

    if (viewState && changedSheet) {
      // Sheet cũ hay mới, có được tự vẽ và đang lỗi gì đều do GAS quyết trong lời hỏi chung.
      if (!fromProbe) { queue(function () { return sheetLinkProbeSelectionAndReload('view-enter'); }); }
    } else {
      if (leavingDataSheet && typeof callServer === 'function') {
        if (sheetLinkLeaveNeedsFlush()) { queue(function () { return changeSignalFlush(function () { return sheetLinkSyncDirtyData(); }); }); }
      }
      else if (SHEET_LINK_DATA_PENDING) { queue(function () { return SHEET_LINK_DATA_PENDING; }); }

      if (viewState && viewState.pending) { queue(function () { return viewState.pending; }); }
    }

    var applyLatest = function () {
      if (ticket !== SHEET_LINK_APPLY_TICKET) { return null; }
      if (immediateCustomerApplied) { return null; }
      return sheetLinkApplyCustomerContext(ctx);
    };
    return pending ? pending.then(applyLatest) : applyLatest();
  };

  return work();
}

/** Áp lại context cuối sau bootstrap để tin đến quá sớm không bỏ mất mã khách. Chưa có context Extension thì vẫn hỏi GAS một lần để sheet `!` đang mở được vẽ hoặc báo cũ. */
function sheetLinkReplayContext() {
  return SHEET_LINK_LAST_CONTEXT ? sheetLinkApplyContext(SHEET_LINK_LAST_CONTEXT) : sheetLinkProbeSelectionAndReload('sidebar-open', { silent: true });
}

/** Tab hiện lại: trình duyệt có thể đã bỏ đói kênh `/bind` khi tab ẩn, nên hỏi một lần cho cả RAM lẫn sheet `!` đang xem. */
function sheetLinkOnVisible() {
  return changeSignalAsk('visible');
}

/** Công tắc tự động làm mới vừa bật: chỉ sheet `!` đang xem mới cần hỏi; sheet khác vẽ khi có người xem. */
function sheetLinkOnAutoRenderOn() {
  if (SHEET_LINK_LAST_SHEET.charAt(0) !== '!') { return null; }
  return sheetLinkProbeSelectionAndReload('auto-render-on');
}

function sheetLinkApplyCustomerContext(ctx) {
  // Sync overlays the normal `view` screen; changing the selected customer must
  // never repaint the underlying screen while that module owns the shell.
  if (!Prefs.followSelection || ScreenState.screen !== SCREEN_VIEW || (typeof FBM_SYNC_CLIENT !== 'undefined' && FBM_SYNC_CLIENT.active)) { return false; }
  // Đứng ở sheet `!` đang lỗi thì thân Sidebar là màn lỗi; nhấp dòng trên sheet đó (dữ liệu cũ) không thay màn. Tìm khách bằng icon vẫn mở khách như thường.
  if (typeof NOTICES !== 'undefined' && NOTICES.viewProblems && noticeScreenShowing()) { return false; }

  var ma = sheetLinkCustomerIdFromContext(ctx);
  if (ma) {
    if (ma === ScreenState.currentCustomerId) { return false; }
    ACTIONS.setCurrentCustomer({ pick: ma });
    return true;
  }

  var miss = sheetLinkSelectionMiss(ctx);
  if (!miss || JSON.stringify(miss) === JSON.stringify(ScreenState.selectionMiss)) { return false; }
  screenViewSetSelectionMiss(miss);
  return true;
}

/**
 * Giá trị ô mã khách của hàng đang chọn, một luật cho mọi sheet và mọi hàng: chuỗi mã (rỗng là ô trống hoặc chỗ không có cột mã), hoặc `null` khi chưa biết.
 *
 * "Chưa biết" không phải ngoại lệ nghiệp vụ mà là chưa có giá trị để tra: Extension không thấy ô (lưới chưa nạp tới, xung đột lưới) thì chờ GAS đọc thay, vì hàng có khách mà lưới chưa nạp cũng trông như ô trống. Sheet xem tự do không đánh thức GAS khi Extension đọc hụt, nên ô vắng khỏi lưới ở đó là ô trống.
 */
function sheetLinkSelectionCode(ctx) {
  if (!ctx) { return null; }
  if (!Array.isArray(ctx.reads)) {
    if (ctx.customerCell !== 'value' && ctx.customerCell !== 'empty') { return null; }
    return ctx.customerCell === 'value' ? String(ctx.customerId || '').trim().toUpperCase() : '';
  }
  if (ctx.readReason === 'LIVE_GRID_CONFLICT') { return null; }
  var cells = ctx.reads.filter(function (read) { return read && read.valueAddress && read.matched === true; });
  // Không có ô mã nào: Extension đọc trọn (`ok`) thì chỗ này không có cột mã; đọc hỏng thì chưa biết.
  if (!cells.length) { return ctx.readStatus === 'ok' ? '' : null; }
  var absentIsEmpty = sheetLinkIsFreeSheet(ctx.sheetName);
  var unknown = false;
  for (var i = 0; i < cells.length; i++) {
    var code = String(cells[i].value || '').trim().toUpperCase();
    if (cells[i].status === 'ok' && code) { return code; }
    if (cells[i].status !== 'ok' && !(absentIsEmpty && cells[i].status === 'unavailable' && !code)) { unknown = true; }
  }
  return unknown ? null : '';
}

/** Mã có mà RAM chưa có: `{ kind: 'notFound', code }`; ô rỗng: `{ kind: 'empty' }`; chưa biết: `null`. */
function sheetLinkSelectionMiss(ctx) {
  var code = sheetLinkSelectionCode(ctx);
  if (code === null) { return null; }
  return code ? { kind: 'notFound', code: code } : { kind: 'empty' };
}

function sheetLinkCustomerIdFromContext(ctx) {
  var reads = Array.isArray(ctx && ctx.reads) ? ctx.reads : [];
  for (var i = 0; i < reads.length; i++) {
    var read = reads[i] || {};
    var value = String(read.value || '').trim().toUpperCase();
    if (read.status === 'ok' && read.matched === true && value && Store.hasCustomer(value)) { return value; }
  }
  // GAS selection response vẫn có thể mang mã khách; đây không phải payload Extension.
  var direct = String(ctx.customerId || '').trim().toUpperCase();
  if (direct && Store.hasCustomer(direct)) { return direct; }

  return '';
}
</script>
