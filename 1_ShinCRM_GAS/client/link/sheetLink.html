<script>
/**
 * `sheetLink` — tai nghe tin context thô từ Extension, đối chiếu reads trong Sidebar,
 * rồi gọi `ACTIONS.setCurrentCustomer`.
 *
 * Ba tầng lọc trước khi dùng tin:
 *   1. nonce — chỉ nhận tin mang đúng nonce mà sidebar vừa sinh, bỏ mọi tin lạ.
 *   2. origin — chỉ nhận từ `docs.google.com`, bỏ tin từ iframe khác.
 *   3. seq — bỏ tin cũ (seq nhỏ hơn seq đã dùng), tránh tin đến muộn đè tin mới.
 *
 * Extension chỉ gửi Name Box, hàng 1 thô và kết quả đọc theo địa chỉ. Sidebar mới
 * đối chiếu reads với Store; GAS vẫn là nơi quyết định reload và scope nghiệp vụ.
 *
 * Chỉ gọi `setCurrentCustomer` khi `Prefs.followSelection` bật và đang ở màn `view` (không giật màn khi đang mở form).
 *
 * Tình trạng sống của Extension suy từ `CRM_HANDSHAKE_ACK`, **không** suy từ việc `CRM_CONTEXT` im lặng: sheet ngồi im thì Extension sống cũng không bắn tin nào, nên im lặng không phải bằng chứng vắng mặt.
 */

var SHEET_LINK_NONCE = '';
var SHEET_LINK_SEQ = 0;
var SHEET_LINK_SPREADSHEET_ID = '';
var SHEET_LINK_READ_PLAN = null;
/** Hàng dữ liệu đầu tiên, GAS gửi kèm read plan. 0 = chưa biết thì không phân loại hàng trống/không tìm thấy. */
var SHEET_LINK_FIRST_DATA_ROW = 0;
var SHEET_LINK_SCHEMA = null;
var SHEET_LINK_LAST_ACK = 0;
var SHEET_LINK_EXTENSION_SESSION = '';
var SHEET_LINK_LAST_SHEET = '';
var SHEET_LINK_LAST_CONTEXT = null;
// sidebarBoot clears this synchronously before the first bridge message can be handled.
var SHEET_LINK_RAM_READY = true;
var SHEET_LINK_APPLY_TICKET = 0;
var SHEET_LINK_VIEW_STATES = {};
// Sheet `!` đang hiện dòng báo "View chưa cập nhật"; rỗng là không báo. Chỉ `sheetLinkSetViewNotice` được đổi.
var SHEET_LINK_VIEW_NOTICE_SHEET = '';
var SHEET_LINK_VIEW_NOTICE_ID = 'shin-view-stale';
var SHEET_LINK_DATA_PENDING = null;
var SHEET_LINK_RELOAD_TIMER = null;
var SHEET_LINK_RELOAD_CHECKING = null;
var SHEET_LINK_WAKE_TIMER = null;
var SHEET_LINK_SELECTION_CONTEXT = null;
var SHEET_LINK_PREVIOUS_CUSTOMER_ID = '';
var SHEET_LINK_SELECTION_PENDING = null;
var SHEET_LINK_SELECTION_WAKE_QUEUED = false;
var SHEET_LINK_SELECTION_WAKE_NEEDS_READ = false;
var SHEET_LINK_FREE_SHEETS = {};
var SHEET_LINK_CONTEXT_GENERATION = 0;
var SHEET_LINK_LAST_SEEN_REVISION = 0;
var SHEET_LINK_PING_TIMER = null;
var SHEET_LINK_EXTENSION_READ = { status: '', reason: '' };
var SHEET_LINK_READER_FAILURE_REPORTED = false;
/** Công tắc `SETTINGS.SHOW_PROBE_PROGRESS_DEBUG`; chưa nạp `SETTINGS` thì chạy im lặng. */
function sheetLinkShowProbeProgress() {
  return typeof SETTINGS !== 'undefined' && !!SETTINGS && SETTINGS.SHOW_PROBE_PROGRESS_DEBUG === true;
}
var sheetLinkInstalled = false;

var SHEET_LINK_ORIGIN = 'https://docs.google.com';
var SHEET_LINK_CODE_PATTERN = /^[A-Z]{2,4}-?[0-9]{6}$/;
// Lỗi của cả bộ đọc live model, khác lỗi một ô chưa tải; `LIVE_GRID_SEARCHING` chỉ là lượt dò đầu trang nên không tính.
var SHEET_LINK_READER_DOWN_REASONS = ['LIVE_GRID_NOT_FOUND', 'LIVE_GRID_CONFLICT', 'READER_ERROR', 'LIVE_MODEL_TIMEOUT'];

function sheetLinkNonceMake() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/** Số mili giây cho các nhịp bắt tay và ngưỡng kết luận vắng mặt, đọc từ `SETTINGS` máy chủ gửi về; chưa về thì dùng số ngầm định. */
function sheetLinkMs(ten, ngamDinh) {
  if (typeof SETTINGS === 'undefined' || !SETTINGS || !SETTINGS[ten]) { return ngamDinh; }
  return Number(SETTINGS[ten]) || ngamDinh;
}

function sheetLinkInstall() {
  if (sheetLinkInstalled) { return; }
  sheetLinkInstalled = true;
  SHEET_LINK_NONCE = sheetLinkNonceMake();
  window.addEventListener('message', sheetLinkOnMessage);
  sheetLinkHandshakePing();
  SHEET_LINK_PING_TIMER = setInterval(sheetLinkHandshakePing, sheetLinkMs('HANDSHAKE_PING_MS', 1000));
}

/** Gán id tệp sheet sau lượt nạp lõi, để tầng lọc thứ ba có gì mà lọc. */
function sheetLinkSetSpreadsheetId(id) {
  SHEET_LINK_SPREADSHEET_ID = String(id || '');
}

/** Tin bắt tay mang read plan dạng tọa độ và khoảng gộp nhịp sống của kênh; Extension không được nhận luật reload hay ý nghĩa token. */
function sheetLinkHandshakeMessage() {
  return {
    action: 'CRM_HANDSHAKE',
    nonce: SHEET_LINK_NONCE,
    spreadsheetId: SHEET_LINK_SPREADSHEET_ID,
    readPlan: SHEET_LINK_READ_PLAN,
    channelAliveMs: sheetLinkMs('CHANNEL_ALIVE_RELAY_MS', 0)
  };
}

function sheetLinkSetReadPlan(plan) {
  SHEET_LINK_READ_PLAN = plan && typeof plan === 'object' ? plan : null;
  if (window.top !== window) {
    try { window.top.postMessage(sheetLinkHandshakeMessage(), SHEET_LINK_ORIGIN); } catch (err) {}
  }
}

/**
 * Sheet xem tự do: mọi sheet ngoài các sheet kho (có khóa riêng trong plan GAS gửi) và sheet `!`.
 * Extension chỉ nhận plan theo đúng tên sheet hoặc khóa `!`, nên Sidebar chép mẫu `!` thành khóa theo tên sheet tự do; `SHEET_LINK_FREE_SHEETS` nhớ khóa nào do Sidebar thêm để không nhầm với sheet kho.
 */
/** Hàng tiêu đề (trên hàng dữ liệu đầu) của sheet có cột mã khách hoặc sheet `!`: chắc chắn không có khách, nên báo như hàng trống thay vì giữ khách của hàng trước. Sheet xem tự do không có quy ước hàng tiêu đề nên không xét. */
function sheetLinkIsHeaderRow(ctx) {
  var name = String(ctx && ctx.sheetName || '');
  var plan = SHEET_LINK_READ_PLAN && !sheetLinkIsFreeSheet(name) ? SHEET_LINK_READ_PLAN[name] : null;
  // Sheet có cột mã khách là sheet mà bản đồ đọc khai ô giá trị theo hàng (Customer, Activity); Category, Config không có khách nên không xét.
  var known = name.charAt(0) === '!' || (Array.isArray(plan) && plan.some(function (item) { return item && item.valueAddressTemplate; }));
  if (!known || !SHEET_LINK_FIRST_DATA_ROW) { return false; }
  var coordinates = sheetLinkParseNameBox(ctx.cellRef);
  var row = coordinates ? coordinates.row : Number(ctx.row) || 0;
  return row > 0 && row < SHEET_LINK_FIRST_DATA_ROW;
}

function sheetLinkIsFreeSheet(sheetName) {
  var name = String(sheetName || '');
  if (!name || name.charAt(0) === '!' || !SHEET_LINK_READ_PLAN) { return false; }
  return SHEET_LINK_FREE_SHEETS[name] === true || !Object.prototype.hasOwnProperty.call(SHEET_LINK_READ_PLAN, name);
}

/** Đổi số cột thành chữ cột kiểu A, Z, AA. */
function sheetLinkColumnLetters(column) {
  var value = Number(column || 0);
  var letters = '';
  while (value > 0) { letters = String.fromCharCode(65 + ((value - 1) % 26)) + letters; value = Math.floor((value - 1) / 26); }
  return letters;
}

/**
 * Sửa read plan theo hàng 1 Extension vừa gửi, cho sheet `!` (khóa chung `!`) và sheet xem tự do (khóa theo tên, chép từ mẫu `!`).
 * Sheet tự do lần đầu xuất hiện thì thêm khóa từ mẫu `!` để Extension dò lưới bằng chính các mã cột trong mẫu; mã cột lấy từ `DATA_SCHEMA` qua GAS, Sidebar không gõ cứng.
 * Sheet tự do đã có hàng 1 thì chỉ giữ mục có mã thật ở hàng 1, để thiếu một trong hai mã không làm cả lượt đọc thành lệch.
 */
function sheetLinkRefreshViewReadPlan(context) {
  var name = String(context && context.sheetName || '');
  if (!name || !SHEET_LINK_READ_PLAN || !Array.isArray(SHEET_LINK_READ_PLAN['!'])) { return; }
  var free = sheetLinkIsFreeSheet(name);
  if (!free && name.charAt(0) !== '!') { return; }
  var key = free ? name : '!';
  var current = Array.isArray(SHEET_LINK_READ_PLAN[key]) ? SHEET_LINK_READ_PLAN[key] : SHEET_LINK_READ_PLAN['!'];
  var headers = Array.isArray(context.rawHeaderRow) ? context.rawHeaderRow : [];
  var dynamic = current;
  if (headers.length) {
    var template = free ? SHEET_LINK_READ_PLAN['!'] : current;
    dynamic = template.map(function (item) {
      var match = headers.filter(function (header) { return String(header.value || '').trim() === String(item.expectedValue || '').trim(); })[0];
      if (!match) { return free ? null : item; }
      var letters = sheetLinkColumnLetters(match.column);
      return Object.assign({}, item, { headerAddress: match.address, valueAddressTemplate: letters + '{row}' });
    }).filter(Boolean);
  }
  if (free && !SHEET_LINK_FREE_SHEETS[name]) { SHEET_LINK_FREE_SHEETS[name] = true; }
  else if (JSON.stringify(dynamic) === JSON.stringify(SHEET_LINK_READ_PLAN[key])) { return; }
  var next = Object.assign({}, SHEET_LINK_READ_PLAN);
  next[key] = dynamic;
  sheetLinkSetReadPlan(next);
}

/** Đồng bộ hint cột từ payload core; dùng lại sau mỗi fullCore để schema mới không giữ map cũ. */
function sheetLinkApplyCoreHints(core) {
  if (!core || !core.selectionHints || typeof sheetLinkSetReadPlan !== 'function') { return; }
  sheetLinkSetSpreadsheetId(core.spreadsheetId);
  SHEET_LINK_SCHEMA = core.schema || SHEET_LINK_SCHEMA;
  SHEET_LINK_FREE_SHEETS = {};
  sheetLinkSetReadPlan(core.selectionHints.readPlan || null);
  SHEET_LINK_FIRST_DATA_ROW = Number(core.selectionHints.firstDataRow) || 0;
}

/** Context chỉ được giải mã sau khi Customer đã vào RAM. */
function sheetLinkSetRamReady(ready) { SHEET_LINK_RAM_READY = ready === true; }

/**
 * Ghi kết quả đọc của Extension cho sheet có read plan; trả true khi Extension đã tự đọc được.
 * Sheet không có read plan không cần mã khách nên không đổi tình trạng bộ đọc. Sheet xem tự do cũng vậy: Extension không tìm thấy lưới ở đó thường chỉ vì sheet không có cột mã, nên không hỏi GAS và không báo bộ đọc hỏng; bộ đọc hỏng thật vẫn lộ ra ở sheet kho.
 */
function sheetLinkRecordExtensionRead(context) {
  var sheetName = context && context.sheetName;
  if (!sheetLinkPlanForSheet(sheetName).length) { return true; }
  var free = sheetLinkIsFreeSheet(sheetName);
  // Sheet tự do không có cột mã là ca thường chứ không phải bộ đọc hỏng: vẫn ghi trạng thái để biết ai giữ vị trí, nhưng bỏ lý do để không bật băng cảnh báo và không đánh thức GAS.
  var next = { status: String(context.readStatus || ''), reason: free ? '' : String(context.readReason || '') };
  var changed = next.status !== SHEET_LINK_EXTENSION_READ.status || next.reason !== SHEET_LINK_EXTENSION_READ.reason;
  SHEET_LINK_EXTENSION_READ = next;
  if (changed && typeof selectionPollPaint === 'function') { selectionPollPaint(); }
  return free || next.status === 'ok';
}

/** Extension sống nhưng bộ đọc live model hỏng cả lưới, thường do Google đổi cấu trúc nội bộ của Sheets. */
function sheetLinkExtensionReaderDown(now) {
  return sheetLinkExtensionAlive(now) && SHEET_LINK_READER_DOWN_REASONS.indexOf(SHEET_LINK_EXTENSION_READ.reason) >= 0;
}

/** Báo GAS ghi `Log` một lần mỗi phiên Sidebar; ghi mỗi lần click sẽ đẩy các dòng khác ra khỏi `Log`. */
function sheetLinkReaderFailureInput() {
  if (SHEET_LINK_READER_FAILURE_REPORTED || !sheetLinkExtensionReaderDown()) { return ''; }
  SHEET_LINK_READER_FAILURE_REPORTED = true;
  return SHEET_LINK_EXTENSION_READ.reason;
}

/** Extension còn sống không: ACK về trong ngưỡng, tính từ nhịp ping gần nhất. */
function sheetLinkExtensionAlive(now) {
  if (!SHEET_LINK_LAST_ACK) { return false; }
  return (now === undefined ? Date.now() : now) - SHEET_LINK_LAST_ACK < sheetLinkMs('EXTENSION_ACK_TIMEOUT_MS', 3000);
}

function sheetLinkHandshakePing() {
  if (window.top !== window) {
    try {
      window.top.postMessage(sheetLinkHandshakeMessage(), SHEET_LINK_ORIGIN);
    } catch (err) {
      // Extension chưa cài hoặc trang chưa sẵn sàng — không sao, ping lại ở nhịp sau.
    }
  }
  if (typeof selectionPollHeartbeat === 'function') { selectionPollHeartbeat(); }
  if (typeof changeSignalWatchdog === 'function') { changeSignalWatchdog(); }
}

function sheetLinkOnMessage(event) {
  var data = event.data;
  if (!data) { return; }

  // Tầng origin đi trước cả ACK: tin sai nguồn thì không được phép đụng tới trạng thái sống.
  if (event.origin !== SHEET_LINK_ORIGIN) { return; }

  if (data.action === 'CRM_HANDSHAKE_ACK') {
    if (data.nonce !== SHEET_LINK_NONCE) { return; }
    var ackSession = String(data.sessionId || '');
    if (ackSession && ackSession !== SHEET_LINK_EXTENSION_SESSION) {
      SHEET_LINK_EXTENSION_SESSION = ackSession;
      SHEET_LINK_SEQ = 0;
    }
    SHEET_LINK_LAST_ACK = Date.now();
    if (typeof fbmSyncNotifyBridgeReady === 'function') { fbmSyncNotifyBridgeReady(); }
    if (typeof selectionPollOnAck === 'function') { selectionPollOnAck(); }
    return;
  }

  // Kênh `/bind`: chỉ đánh thức, không mang revision hay dữ liệu; lời hỏi GAS mới là nguồn đúng.
  if (data.action === 'CRM_RELOAD' || data.action === 'CRM_CHANNEL_ALIVE') {
    if (data.nonce !== SHEET_LINK_NONCE) { return; }
    if (SHEET_LINK_EXTENSION_SESSION && String(data.sessionId || '') !== SHEET_LINK_EXTENSION_SESSION) { return; }
    if (data.action === 'CRM_RELOAD') { changeSignalReceive(data); } else { changeSignalOnFrame(); }
    return;
  }

  if (data.action !== 'CRM_CONTEXT') { return; }

  // Tầng 1: nonce
  if (data.nonce !== SHEET_LINK_NONCE) { return; }

  // Extension được tải lại thì seq bắt đầu lại từ 1. Chỉ nhận context của đúng phiên đã ACK để tin cũ không hạ mốc seq.
  if (SHEET_LINK_EXTENSION_SESSION && String(data.sessionId || '') !== SHEET_LINK_EXTENSION_SESSION) { return; }

  // Tầng 2: spreadsheetId — chỉ nhận tin từ đúng tệp sheet sidebar đang phục vụ
  if (SHEET_LINK_SPREADSHEET_ID && data.spreadsheetId !== SHEET_LINK_SPREADSHEET_ID) { return; }

  // Tầng 3: seq — bỏ tin cũ
  if (data.seq <= SHEET_LINK_SEQ) { return; }
  SHEET_LINK_SEQ = data.seq;

  var previousPosition = sheetLinkPositionKey(SHEET_LINK_LAST_CONTEXT || {});
  sheetLinkRefreshViewReadPlan(data);
  var positionChanged = previousPosition !== sheetLinkPositionKey(data);
  // Extension gửi lại cùng vị trí khi nhận lại read plan; chỉ vị trí mới mới làm cũ câu trả lời selection GAS đang bay.
  if (positionChanged) { SHEET_LINK_CONTEXT_GENERATION += 1; }
  var applied = sheetLinkApplyContext(data);
  // Nhấp, gõ hay đổi vị trí không đánh thức GAS: thay đổi dữ liệu đến qua kênh `/bind`. Chỉ khi Extension không đọc được mã ở vị trí mới thì GAS phải đọc thay.
  if (positionChanged && !sheetLinkRecordExtensionRead(data)) { sheetLinkScheduleWake(); }
  if (applied && typeof applied.then === 'function') {
    applied.then(null, function (err) {
      // Context arrives from the background bridge; never interrupt the user with an alert.
      if (typeof console !== 'undefined' && console.error) { console.error(err); }
    });
  }
}

function sheetLinkViewState(sheetName) {
  if (!SHEET_LINK_VIEW_STATES[sheetName]) {
    SHEET_LINK_VIEW_STATES[sheetName] = { revision: 0, metaReady: false, filterColumns: [], sortColumns: [], watch: null, needsSync: false, pending: null, inspecting: null, renderRequestedRevision: 0 };
  }
  return SHEET_LINK_VIEW_STATES[sheetName];
}

function sheetLinkViewControlCell(state, row, col) {
  if (row === 1) { return true; }
  if (!state.metaReady) { return row === 3; }
  if (row === 3) { return state.filterColumns.indexOf(col) >= 0; }
  return row >= 4 && state.sortColumns.indexOf(col) >= 0;
}

function sheetLinkViewApplyResult(sheetName, result) {
  if (!result) { return result; }
  if (result.viewMeta) {
    var state = sheetLinkViewState(sheetName);
    state.needsSync = false;
    state.revision = Number(result.viewMeta.revision) || 0;
    state.filterColumns = result.viewMeta.filterColumns || [];
    state.sortColumns = result.viewMeta.sortColumns || [];
    state.metaReady = true;
    if (state.watch && !sheetLinkViewControlCell(state, state.watch.row, state.watch.col)) { state.watch = null; }
  }
  if (result.ok && !result.skipped && SHEET_LINK_VIEW_NOTICE_SHEET === sheetName) { sheetLinkSetViewNotice(''); }
  return result;
}

/** Dòng báo nằm ở host tĩnh của Sidebar; nút trong đó mang action làm mới thủ công sẵn có. */
function sheetLinkSetViewNotice(sheetName) {
  SHEET_LINK_VIEW_NOTICE_SHEET = String(sheetName || '');
  var host = typeof document !== 'undefined' && document.getElementById ? document.getElementById(SHEET_LINK_VIEW_NOTICE_ID) : null;
  if (!host) { return; }
  var syncOwnsShell = typeof FBM_SYNC_CLIENT !== 'undefined' && !!FBM_SYNC_CLIENT && FBM_SYNC_CLIENT.active === true;
  host.hidden = !SHEET_LINK_VIEW_NOTICE_SHEET || syncOwnsShell;
}

/**
 * GAS đã quyết sheet `!` đang xem cũ hay mới và có được tự vẽ theo núm người dùng; Sidebar chỉ thực hiện.
 * Mỗi revision chỉ xin vẽ một lần: hai câu trả lời liên tiếp cùng revision (lời hỏi thứ hai gửi đi trước khi lượt vẽ đầu xong) không sinh lượt vẽ thứ hai. Vẽ lỗi cũng không xin lại cùng revision, để lỗi công thức hay cú pháp lọc không lặp ở mỗi lời hỏi.
 */
function sheetLinkApplyViewDecision(result) {
  var view = result && result.view;
  if (!view || !view.sheetName) { return null; }
  if (view.action !== 'render') { sheetLinkSetViewNotice(view.action === 'notify' ? view.sheetName : ''); return null; }
  var state = sheetLinkViewState(view.sheetName);
  if (state.pending) { return state.pending; }
  var revision = Number(sheetLinkReloadState(result).revision || 0);
  if (revision && state.renderRequestedRevision === revision) { return null; }
  state.renderRequestedRevision = revision;
  var run = function () { return sheetLinkSyncView(view.sheetName); };
  var message = 'Đang cập nhật sheet ' + view.sheetName + '…';
  return typeof sidebarBusyRun === 'function' ? sidebarBusyRun(message, run) : run();
}

function sheetLinkParseNameBox(value) {
  var text = String(value || '').trim().toUpperCase().split('!').pop();
  var match = text.match(/^([A-Z]+)([0-9]+)(?::([A-Z]+)([0-9]+))?$/);
  function columnNumber(value) {
    var result = 0;
    for (var i = 0; i < value.length; i++) { result = result * 26 + value.charCodeAt(i) - 64; }
    return result;
  }
  if (match) { return { row: Number(match[2]), col: columnNumber(match[1]), rowEnd: Number(match[4] || match[2]), colEnd: columnNumber(match[3] || match[1]) }; }
  var parts = text.split(':');
  if (parts.length === 2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) {
    return { row: Number(parts[0]), col: 1, rowEnd: Number(parts[1]), colEnd: 0 };
  }
  if (parts.length === 2 && /^[A-Z]+$/.test(parts[0]) && /^[A-Z]+$/.test(parts[1])) {
    return { row: 1, col: columnNumber(parts[0]), rowEnd: 0, colEnd: columnNumber(parts[1]) };
  }
  return null;
}

function sheetLinkPlanForSheet(sheetName) {
  if (!SHEET_LINK_READ_PLAN) { return []; }
  if (Array.isArray(SHEET_LINK_READ_PLAN[sheetName])) { return SHEET_LINK_READ_PLAN[sheetName]; }
  return String(sheetName || '').indexOf('!') === 0 && Array.isArray(SHEET_LINK_READ_PLAN['!']) ? SHEET_LINK_READ_PLAN['!'] : [];
}

function sheetLinkReloadState(payload) {
  if (!payload) { return {}; }
  return payload.reload || payload.dirty || payload;
}

function sheetLinkDirtyNeedsData(dirty) {
  return !!(dirty && (dirty.allCore || dirty.all || dirty.schema || dirty.config || dirty.category || (dirty.records && dirty.records.length) || (dirty.entities && dirty.entities.length)));
}

function sheetLinkApplyDirtyData(dirty, decision) {
  if (!sheetLinkDirtyNeedsData(dirty)) { return null; }
  var localDraftIds = typeof refreshLocalDraftIds === 'function' ? refreshLocalDraftIds() : [];
  var draft = {};
  localDraftIds.forEach(function (id) { draft[id] = true; });
  var mode = decision && decision.ram ? decision.ram.mode : '';
  if ((dirty.allCore || dirty.all || dirty.schema || dirty.config || mode === 'fullCore') && typeof sidebarBoot === 'function') {
    if (localDraftIds.length) { return { deferred: true, reason: 'Sidebar đang giữ bản nháp, chưa nạp lại full core.' }; }
    return sidebarBoot({ preserveView: true });
  }
  if (mode === 'entity' && decision.ram.entity && typeof refreshEntity === 'function') {
    if (localDraftIds.length) { return { deferred: true, reason: 'Sidebar đang giữ bản nháp, chưa nạp trọn ' + decision.ram.entity + '.' }; }
    return refreshEntity(decision.ram.entity, dirty.revision);
  }

  var coordinates = sheetLinkParseNameBox(ctx.cellRef);
  var row = coordinates ? coordinates.row : Number(ctx.row) || 0;
  if (!SHEET_LINK_FIRST_DATA_ROW || row < SHEET_LINK_FIRST_DATA_ROW || ctx.readReason === 'LIVE_GRID_CONFLICT') { return null; }
  // Sheet xem tự do không đánh thức GAS khi Extension đọc hụt, nên ô mã vắng khỏi lưới dưới một cột mã đúng tiêu đề được coi là ô trống. Sheet kho để GAS đọc thay rồi mới báo, tránh báo "trống" cho một hàng có khách mà lưới chưa nạp tới.
  var absentIsEmpty = sheetLinkIsFreeSheet(ctx.sheetName);
  var cells = ctx.reads.filter(function (read) {
    return read && read.valueAddress && read.matched === true && (read.status === 'ok' || (absentIsEmpty && read.status === 'unavailable' && !String(read.value || '').trim()));
  });
  if (!cells.length) { return null; }
  for (var i = 0; i < cells.length; i++) {
    var code = String(cells[i].value || '').trim().toUpperCase();
    if (code) { return { kind: 'notFound', code: code }; }
  }
  return { kind: 'empty' };
}

function sheetLinkCustomerIdFromContext(ctx) {
  var reads = Array.isArray(ctx && ctx.reads) ? ctx.reads : [];
  for (var i = 0; i < reads.length; i++) {
    var read = reads[i] || {};
    var value = String(read.value || '').trim().toUpperCase();
    if (read.status === 'ok' && read.matched === true && value && Store.hasCustomer(value)) { return value; }
  }
  // GAS selection response vẫn có thể mang mã khách; đây không phải payload Extension.
  var direct = String(ctx.customerId || '').trim().toUpperCase();
  if (direct && Store.hasCustomer(direct)) { return direct; }

  var text = String(ctx.cellText || '').trim().toUpperCase();
  if (SHEET_LINK_CODE_PATTERN.test(text) && Store.hasCustomer(text)) { return text; }
  return '';
}
</script>
