<script>
/**
 * `sheetLink` — tai nghe tin `CRM_CONTEXT` từ Extension, giải mã thành mã khách, rồi gọi `ACTIONS.setCurrentCustomer`.
 *
 * Ba tầng lọc trước khi dùng tin:
 *   1. nonce — chỉ nhận tin mang đúng nonce mà sidebar vừa sinh, bỏ mọi tin lạ.
 *   2. origin — chỉ nhận từ `docs.google.com`, bỏ tin từ iframe khác.
 *   3. seq — bỏ tin cũ (seq nhỏ hơn seq đã dùng), tránh tin đến muộn đè tin mới.
 *
 * Extension gửi `customerId` đã đọc trực tiếp từ model live của Sheets. Sidebar chỉ
 * kiểm tra mã đó có trong Store; không tra theo số hàng và không dùng dữ liệu vị trí cũ.
 *
 * Chỉ gọi `setCurrentCustomer` khi `Prefs.followSelection` bật và đang ở màn `view` (không giật màn khi đang mở form).
 *
 * Tình trạng sống của Extension suy từ `CRM_HANDSHAKE_ACK`, **không** suy từ việc `CRM_CONTEXT` im lặng: sheet ngồi im thì Extension sống cũng không bắn tin nào, nên im lặng không phải bằng chứng vắng mặt.
 */

var SHEET_LINK_NONCE = '';
var SHEET_LINK_SEQ = 0;
var SHEET_LINK_SPREADSHEET_ID = '';
var SHEET_LINK_READ_PLAN = null;
var SHEET_LINK_SCHEMA = null;
var SHEET_LINK_LAST_ACK = 0;
var SHEET_LINK_EXTENSION_SESSION = '';
var SHEET_LINK_LAST_SHEET = '';
var SHEET_LINK_LAST_CONTEXT = null;
// sidebarBoot clears this synchronously before the first bridge message can be handled.
var SHEET_LINK_RAM_READY = true;
var SHEET_LINK_APPLY_TICKET = 0;
var SHEET_LINK_VIEW_STATES = {};
var SHEET_LINK_DATA_PENDING = null;
var SHEET_LINK_RELOAD_TIMER = null;
var SHEET_LINK_RELOAD_CHECKING = null;
var SHEET_LINK_WAKE_TIMER = null;
var SHEET_LINK_WAKE_REASON = '';
var SHEET_LINK_SELECTION_CONTEXT = null;
var SHEET_LINK_PREVIOUS_CUSTOMER_ID = '';
var SHEET_LINK_SELECTION_PENDING = null;
var SHEET_LINK_SELECTION_WAKE_QUEUED = false;
var SHEET_LINK_CONTEXT_GENERATION = 0;
var SHEET_LINK_LAST_SEEN_REVISION = 0;
var SHEET_LINK_PING_TIMER = null;
// Bật tạm thời để nghiệm thu thấy mọi request probe/defer. Tắt sau khi chủ dự án kiểm tra xong.
var SHEET_LINK_SHOW_PROBE_PROGRESS_DEBUG = true;
var sheetLinkInstalled = false;

var SHEET_LINK_ORIGIN = 'https://docs.google.com';
var SHEET_LINK_CODE_PATTERN = /^[A-Z]{2,4}-?[0-9]{6}$/;

function sheetLinkNonceMake() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/** Số mili giây cho các nhịp bắt tay và ngưỡng kết luận vắng mặt, đọc từ `SETTINGS` máy chủ gửi về; chưa về thì dùng số ngầm định. */
function sheetLinkMs(ten, ngamDinh) {
  if (typeof SETTINGS === 'undefined' || !SETTINGS || !SETTINGS[ten]) { return ngamDinh; }
  return Number(SETTINGS[ten]) || ngamDinh;
}

function sheetLinkInstall() {
  if (sheetLinkInstalled) { return; }
  sheetLinkInstalled = true;
  SHEET_LINK_NONCE = sheetLinkNonceMake();
  window.addEventListener('message', sheetLinkOnMessage);
  sheetLinkHandshakePing();
  SHEET_LINK_PING_TIMER = setInterval(sheetLinkHandshakePing, sheetLinkMs('HANDSHAKE_PING_MS', 1000));
}

/** Gán id tệp sheet sau lượt nạp lõi, để tầng lọc thứ ba có gì mà lọc. */
function sheetLinkSetSpreadsheetId(id) {
  SHEET_LINK_SPREADSHEET_ID = String(id || '');
}

/** Gửi read plan dạng tọa độ; Extension không được nhận luật reload hay ý nghĩa token. */
function sheetLinkSetReadPlan(plan) {
  SHEET_LINK_READ_PLAN = plan && typeof plan === 'object' ? plan : null;
  if (window.top !== window) {
    try {
      window.top.postMessage({
        action: 'CRM_HANDSHAKE',
        nonce: SHEET_LINK_NONCE,
        spreadsheetId: SHEET_LINK_SPREADSHEET_ID,
        readPlan: SHEET_LINK_READ_PLAN
      }, SHEET_LINK_ORIGIN);
    } catch (err) {}
  }
}

function sheetLinkRefreshViewReadPlan(context) {
  if (!context || String(context.sheetName || '').indexOf('!') !== 0 || !Array.isArray(context.rawHeaderRow) || !SHEET_LINK_READ_PLAN || !Array.isArray(SHEET_LINK_READ_PLAN['!'])) { return; }
  var headers = context.rawHeaderRow;
  var dynamic = SHEET_LINK_READ_PLAN['!'].map(function (item) {
    var match = headers.filter(function (header) { return String(header.value || '').trim() === String(item.expectedValue || '').trim(); })[0];
    if (!match) { return item; }
    var column = Number(match.column || 0);
    var letters = '';
    while (column > 0) { letters = String.fromCharCode(65 + ((column - 1) % 26)) + letters; column = Math.floor((column - 1) / 26); }
    return Object.assign({}, item, { headerAddress: match.address, valueAddressTemplate: letters + '{row}' });
  });
  if (JSON.stringify(dynamic) !== JSON.stringify(SHEET_LINK_READ_PLAN['!'])) {
    var next = Object.assign({}, SHEET_LINK_READ_PLAN, { '!': dynamic });
    sheetLinkSetReadPlan(next);
  }
}

/** Đồng bộ hint cột từ payload core; dùng lại sau mỗi fullCore để schema mới không giữ map cũ. */
function sheetLinkApplyCoreHints(core) {
  if (!core || !core.selectionHints || typeof sheetLinkSetReadPlan !== 'function') { return; }
  sheetLinkSetSpreadsheetId(core.spreadsheetId);
  SHEET_LINK_SCHEMA = core.schema || SHEET_LINK_SCHEMA;
  sheetLinkSetReadPlan(core.selectionHints.readPlan || null);
}

/** Context chỉ được giải mã sau khi Customer đã vào RAM. */
function sheetLinkSetRamReady(ready) { SHEET_LINK_RAM_READY = ready === true; }

/** Extension còn sống không: ACK về trong ngưỡng, tính từ nhịp ping gần nhất. */
function sheetLinkExtensionAlive(now) {
  if (!SHEET_LINK_LAST_ACK) { return false; }
  return (now === undefined ? Date.now() : now) - SHEET_LINK_LAST_ACK < sheetLinkMs('EXTENSION_ACK_TIMEOUT_MS', 3000);
}

function sheetLinkHandshakePing() {
  if (window.top !== window) {
    try {
      window.top.postMessage({
        action: 'CRM_HANDSHAKE',
        nonce: SHEET_LINK_NONCE,
        spreadsheetId: SHEET_LINK_SPREADSHEET_ID,
        readPlan: SHEET_LINK_READ_PLAN
      }, SHEET_LINK_ORIGIN);
    } catch (err) {
      // Extension chưa cài hoặc trang chưa sẵn sàng — không sao, ping lại ở nhịp sau.
    }
  }
  if (typeof selectionPollHeartbeat === 'function') { selectionPollHeartbeat(); }
}

function sheetLinkOnMessage(event) {
  var data = event.data;
  if (!data) { return; }

  // Tầng origin đi trước cả ACK: tin sai nguồn thì không được phép đụng tới trạng thái sống.
  if (event.origin !== SHEET_LINK_ORIGIN) { return; }

  if (data.action === 'CRM_HANDSHAKE_ACK') {
    if (data.nonce !== SHEET_LINK_NONCE) { return; }
    var ackSession = String(data.sessionId || '');
    if (ackSession && ackSession !== SHEET_LINK_EXTENSION_SESSION) {
      SHEET_LINK_EXTENSION_SESSION = ackSession;
      SHEET_LINK_SEQ = 0;
    }
    SHEET_LINK_LAST_ACK = Date.now();
    if (typeof fbmSyncNotifyBridgeReady === 'function') { fbmSyncNotifyBridgeReady(); }
    if (typeof selectionPollOnAck === 'function') { selectionPollOnAck(); }
    return;
  }

  // GAS/Extension chỉ dùng event này để đánh thức Sidebar; dữ liệu thật vẫn
  // phải đọc lại qua getReloadState và API reload có guard revision.
  if (data.action === 'CRM_RELOAD') {
    if (data.nonce !== SHEET_LINK_NONCE) { return; }
    if (SHEET_LINK_EXTENSION_SESSION && String(data.sessionId || '') !== SHEET_LINK_EXTENSION_SESSION) { return; }
    if (SHEET_LINK_SPREADSHEET_ID && data.spreadsheetId && data.spreadsheetId !== SHEET_LINK_SPREADSHEET_ID) { return; }
    if (!SHEET_LINK_RAM_READY) { return; }
    var revision = Number(data.revision || 0);
    if (revision && revision <= SHEET_LINK_LAST_SEEN_REVISION) { return; }
    var wake = sheetLinkSyncDirtyData();
    if (wake && typeof wake.then === 'function') {
      wake.then(null, function (err) { if (typeof console !== 'undefined' && console.warn) { console.warn(err); } });
    }
    return;
  }

  if (data.action !== 'CRM_CONTEXT') { return; }

  // Tầng 1: nonce
  if (data.nonce !== SHEET_LINK_NONCE) { return; }

  // Extension được tải lại thì seq bắt đầu lại từ 1. Chỉ nhận context của đúng phiên đã ACK để tin cũ không hạ mốc seq.
  if (SHEET_LINK_EXTENSION_SESSION && String(data.sessionId || '') !== SHEET_LINK_EXTENSION_SESSION) { return; }

  // Tầng 2: spreadsheetId — chỉ nhận tin từ đúng tệp sheet sidebar đang phục vụ
  if (SHEET_LINK_SPREADSHEET_ID && data.spreadsheetId !== SHEET_LINK_SPREADSHEET_ID) { return; }

  // Tầng 3: seq — bỏ tin cũ
  if (data.seq <= SHEET_LINK_SEQ) { return; }
  SHEET_LINK_SEQ = data.seq;

  var previousPosition = sheetLinkPositionKey(SHEET_LINK_LAST_CONTEXT || {});
  sheetLinkRefreshViewReadPlan(data);
  var shouldWake = sheetLinkContextMayAffectReload(data);
  SHEET_LINK_CONTEXT_GENERATION += 1;
  var applied = sheetLinkApplyContext(data);
  var positionChanged = previousPosition !== sheetLinkPositionKey(data);
  var hasInteraction = data.hint === 'keyboardHint' || data.hint === 'keydown' || data.hint === 'canvasClick';
  if (shouldWake && (hasInteraction || positionChanged)) {
    sheetLinkScheduleWake(hasInteraction ? data.hint : 'position', data);
  }
  if (applied && typeof applied.then === 'function') {
    applied.then(null, function (err) {
      // Context arrives from the background bridge; never interrupt the user with an alert.
      if (typeof console !== 'undefined' && console.error) { console.error(err); }
    });
  }
}

function sheetLinkViewState(sheetName) {
  if (!SHEET_LINK_VIEW_STATES[sheetName]) {
    SHEET_LINK_VIEW_STATES[sheetName] = { revision: 0, metaReady: false, filterColumns: [], sortColumns: [], watch: null, needsSync: false, pending: null, inspecting: null };
  }
  return SHEET_LINK_VIEW_STATES[sheetName];
}

function sheetLinkViewControlCell(state, row, col) {
  if (row === 1) { return true; }
  if (!state.metaReady) { return row === 3; }
  if (row === 3) { return state.filterColumns.indexOf(col) >= 0; }
  return row >= 4 && state.sortColumns.indexOf(col) >= 0;
}

function sheetLinkViewApplyResult(sheetName, result) {
  if (!result) { return result; }
  if (result.viewMeta) {
    var state = sheetLinkViewState(sheetName);
    state.needsSync = false;
    state.revision = Number(result.viewMeta.revision) || 0;
    state.filterColumns = result.viewMeta.filterColumns || [];
    state.sortColumns = result.viewMeta.sortColumns || [];
    state.metaReady = true;
    if (state.watch && !sheetLinkViewControlCell(state, state.watch.row, state.watch.col)) { state.watch = null; }
  }
  return result;
}

function sheetLinkParseNameBox(value) {
  var text = String(value || '').trim().toUpperCase().split('!').pop();
  var match = text.match(/^([A-Z]+)([0-9]+)(?::([A-Z]+)([0-9]+))?$/);
  function columnNumber(value) {
    var result = 0;
    for (var i = 0; i < value.length; i++) { result = result * 26 + value.charCodeAt(i) - 64; }
    return result;
  }
  if (match) { return { row: Number(match[2]), col: columnNumber(match[1]), rowEnd: Number(match[4] || match[2]), colEnd: columnNumber(match[3] || match[1]) }; }
  var parts = text.split(':');
  if (parts.length === 2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) {
    return { row: Number(parts[0]), col: 1, rowEnd: Number(parts[1]), colEnd: 0 };
  }
  if (parts.length === 2 && /^[A-Z]+$/.test(parts[0]) && /^[A-Z]+$/.test(parts[1])) {
    return { row: 1, col: columnNumber(parts[0]), rowEnd: 0, colEnd: columnNumber(parts[1]) };
  }
  return null;
}

function sheetLinkPlanForSheet(sheetName) {
  if (!SHEET_LINK_READ_PLAN) { return []; }
  if (Array.isArray(SHEET_LINK_READ_PLAN[sheetName])) { return SHEET_LINK_READ_PLAN[sheetName]; }
  return String(sheetName || '').indexOf('!') === 0 && Array.isArray(SHEET_LINK_READ_PLAN['!']) ? SHEET_LINK_READ_PLAN['!'] : [];
}

function sheetLinkExpectedCodes(sheetName, plans) {
  var codes = plans.map(function (item) { return String(item.expectedValue || '').trim(); }).filter(Boolean);
  if (SHEET_LINK_SCHEMA) {
    var append = function (entity) {
      var fields = SHEET_LINK_SCHEMA[entity] || {};
      Object.keys(fields).forEach(function (name) { if (fields[name] && fields[name].code) { codes.push(String(fields[name].code).trim()); } });
    };
    if (sheetName === 'Customer') { append('customer'); }
    else if (sheetName === 'Activity') { append('activity'); }
    else if (String(sheetName || '').indexOf('!') === 0) { append('customer'); append('activity'); }
  }
  return codes.filter(function (code, index, array) { return array.indexOf(code) === index; });
}

function sheetLinkPlanColumn(address) {
  var match = String(address || '').toUpperCase().match(/^([A-Z]+)1$/);
  if (!match) { return 0; }
  var result = 0;
  for (var i = 0; i < match[1].length; i++) { result = result * 26 + match[1].charCodeAt(i) - 64; }
  return result;
}

function sheetLinkRelevantHeaders(context, plans, coordinates) {
  var current = Array.isArray(context.rawHeaderRow) ? context.rawHeaderRow : [];
  var previous = SHEET_LINK_LAST_CONTEXT && Array.isArray(SHEET_LINK_LAST_CONTEXT.rawHeaderRow) ? SHEET_LINK_LAST_CONTEXT.rawHeaderRow : [];
  var expectedCodes = sheetLinkExpectedCodes(context.sheetName, plans);
  var columns = current.concat(previous).map(function (item) { return Number(item && item.column || 0); }).filter(function (column, index, array) { return column > 0 && array.indexOf(column) === index; });
  columns = columns.filter(function (column) { return coordinates.colEnd === 0 || (column >= coordinates.col && column <= coordinates.colEnd); });
  if (!columns.length) { return false; }
  return columns.some(function (column) {
    return current.concat(previous).some(function (item) { return Number(item && item.column || 0) === column && expectedCodes.indexOf(String(item.value || '').trim()) >= 0; });
  });
}

/** Chỉ là tối ưu vận chuyển; GAS vẫn xác nhận onEdit/dirty/scope trong request. */
function sheetLinkContextMayAffectReload(context) {
  var value = context || {};
  var plans = sheetLinkPlanForSheet(value.sheetName);
  if (!plans.length) {
    var knownSheet = value.sheetName === 'Customer' || value.sheetName === 'Activity' || value.sheetName === 'Category' || value.sheetName === 'Config' || String(value.sheetName || '').indexOf('!') === 0;
    if (!knownSheet) { return false; }
    if (value.headerComplete === false || !Array.isArray(value.rawHeaderRow)) { return true; }
    var knownCoordinates = sheetLinkParseNameBox(value.cellRef);
    if (!knownCoordinates) { return true; }
    var knownCodes = sheetLinkExpectedCodes(value.sheetName, plans);
    var knownColumns = value.rawHeaderRow.map(function (item) {
      return knownCodes.indexOf(String(item.value || '').trim()) >= 0 ? Number(item.column || 0) : 0;
    }).filter(function (column) { return column > 0; });
    if (!knownColumns.length) { return false; }
    if (knownCoordinates.row === 1 || knownCoordinates.rowEnd === 0) {
      return sheetLinkRelevantHeaders(value, plans, knownCoordinates);
    }
    return knownCoordinates.colEnd === 0 || knownColumns.some(function (column) {
      return column >= knownCoordinates.col && column <= knownCoordinates.colEnd;
    });
  }
  if (value.headerComplete === false || !Array.isArray(value.rawHeaderRow)) { return true; }
  var coordinates = sheetLinkParseNameBox(value.cellRef);
  if (!coordinates) { return true; }
  if (coordinates.row === 1 || coordinates.rowEnd === 0) { return sheetLinkRelevantHeaders(value, plans, coordinates); }
  var expectedCodes = sheetLinkExpectedCodes(value.sheetName, plans);
  var columns = value.rawHeaderRow.map(function (item) { return expectedCodes.indexOf(String(item.value || '').trim()) >= 0 ? Number(item.column || 0) : 0; }).filter(function (column) { return column > 0; });
  // Metadata đã hoàn chỉnh mà không có cột mã hợp lệ nghĩa là sheet này không
  // có vùng reload cần theo dõi; không fail-open để tránh request thừa ở sheet trắng.
  if (!columns.length) { return false; }
  return coordinates.colEnd === 0 || columns.some(function (column) { return column >= coordinates.col && column <= coordinates.colEnd; });
}

function sheetLinkReloadState(payload) {
  if (!payload) { return {}; }
  return payload.reload || payload.dirty || payload;
}

function sheetLinkDirtyNeedsData(dirty) {
  return !!(dirty && (dirty.allCore || dirty.all || dirty.schema || dirty.config || dirty.category || (dirty.records && dirty.records.length)));
}

function sheetLinkDirtyNeedsView(dirty, sheetName) {
  return !!(dirty && dirty.viewSheets && dirty.viewSheets.indexOf(sheetName) >= 0);
}

function sheetLinkApplyDirtyData(dirty, decision) {
  if (!sheetLinkDirtyNeedsData(dirty)) { return null; }
  var localDraftIds = typeof refreshLocalDraftIds === 'function' ? refreshLocalDraftIds() : [];
  var draft = {};
  localDraftIds.forEach(function (id) { draft[id] = true; });
  var mode = decision && decision.ram ? decision.ram.mode : '';
  if ((dirty.allCore || dirty.all || dirty.schema || dirty.config || mode === 'fullCore') && typeof sidebarBoot === 'function') {
    if (localDraftIds.length) { return { deferred: true, reason: 'Sidebar đang giữ bản nháp, chưa nạp lại full core.' }; }
    return sidebarBoot({ preserveView: true });
  }
  if (dirty.category && typeof refreshCategory === 'function') {
    var categoryWork = refreshCategory(dirty.revision);
    if (dirty.records && dirty.records.length && typeof refreshDirtyRecords === 'function') {
      var categoryRecords = dirty.records.filter(function (id) { return !draft[String(id || '').trim()]; });
      if (!categoryRecords.length) { return categoryWork; }
      return categoryWork.then(function () { return refreshDirtyRecords(categoryRecords, dirty.revision); });
    }
    return categoryWork;
  }
  if (dirty.records && dirty.records.length && typeof refreshDirtyRecords === 'function') {
    var ready = dirty.records.filter(function (id) { return !draft[String(id || '').trim()]; });
    if (!ready.length) { return { deferred: true, reason: 'Các mã bẩn đều đang có bản nháp Sidebar.' }; }
    return refreshDirtyRecords(ready, dirty.revision);
  }
  return null;
}

function sheetLinkScheduleDirtyCheck(delayMs, forceImmediate) {
  if (SHEET_LINK_RELOAD_TIMER !== null && typeof clearTimeout === 'function') { clearTimeout(SHEET_LINK_RELOAD_TIMER); }
  SHEET_LINK_RELOAD_TIMER = null;
  if (typeof setTimeout !== 'function' || !SHEET_LINK_RAM_READY) { return null; }
  SHEET_LINK_RELOAD_TIMER = setTimeout(function () {
    SHEET_LINK_RELOAD_TIMER = null;
    if (typeof sheetLinkProbeSelectionAndReload === 'function') {
      sheetLinkProbeSelectionAndReload('ready-at', { forceImmediate: forceImmediate === true });
    } else {
      sheetLinkSyncDirtyData({ forceImmediate: forceImmediate === true });
    }
  }, Math.max(0, Number(delayMs) || 0));
  return SHEET_LINK_RELOAD_TIMER;
}

function sheetLinkCancelDirtyCheck() {
  if (SHEET_LINK_RELOAD_TIMER !== null && typeof clearTimeout === 'function') { clearTimeout(SHEET_LINK_RELOAD_TIMER); }
  SHEET_LINK_RELOAD_TIMER = null;
}

/** Một request đánh thức GAS sau khi hint cuối đã yên một giây. */
function sheetLinkScheduleWake(reason, context) {
  if (!SHEET_LINK_RAM_READY || typeof setTimeout !== 'function') { return null; }
  SHEET_LINK_WAKE_REASON = reason || 'hint';
  if (SHEET_LINK_WAKE_TIMER !== null && typeof clearTimeout === 'function') { clearTimeout(SHEET_LINK_WAKE_TIMER); }
  var coordinates = sheetLinkParseNameBox(context && context.cellRef);
  var range = coordinates && (coordinates.rowEnd !== coordinates.row || coordinates.colEnd !== coordinates.col || coordinates.rowEnd === 0);
  var editHint = reason === 'keyboardHint' || reason === 'keydown' || reason === 'canvasClick' || range;
  var delay = sheetLinkMs(editHint ? 'EDIT_SETTLE_MS' : 'POSITION_WAKE_MS', editHint ? 3000 : 1000);
  SHEET_LINK_WAKE_TIMER = setTimeout(function () {
    SHEET_LINK_WAKE_TIMER = null;
    sheetLinkProbeSelectionAndReload(SHEET_LINK_WAKE_REASON);
  }, delay);
  return SHEET_LINK_WAKE_TIMER;
}

function sheetLinkLocalDraftInput() {
  var ids = typeof refreshLocalDraftIds === 'function' ? refreshLocalDraftIds() : [];
  return { recordIds: ids };
}

/** Chỉ coi revision đã xử lý sau khi công việc nạp thực sự thành công. */
function sheetLinkReloadWorkSucceeded(value) {
  return !!value && value.deferred !== true && value.reloadFailed !== true && value.ok !== false;
}

function sheetLinkWorkRevision(value, fallbackState) {
  var candidates = [
    value && value.processedRevision,
    value && value.reload && value.reload.revision,
    fallbackState && fallbackState.revision
  ];
  return candidates.reduce(function (highest, candidate) {
    var revision = Number(candidate || 0);
    return isFinite(revision) && revision > highest ? revision : highest;
  }, 0);
}

function sheetLinkApplyDecisionResult(result, options) {
  if (!result) { return null; }
  var state = sheetLinkReloadState(result);
  var stateRevision = Number(state && state.revision || 0);
  var opts = options || {};
  if (stateRevision && stateRevision <= SHEET_LINK_LAST_SEEN_REVISION && opts.forceReload !== true) {
    return result;
  }
  if (result.payload && typeof refreshReloadPayload === 'function') {
    var payloadWork = function () { return refreshReloadPayload(result.payload); };
    var payloadRun = typeof sidebarBusyRun === 'function' ? sidebarBusyRun('Đang đồng bộ dữ liệu vừa thay đổi…', payloadWork, { progress: true }) : payloadWork();
    var payloadDone = function (value) {
      if (value && stateRevision) {
        SHEET_LINK_LAST_SEEN_REVISION = Math.max(SHEET_LINK_LAST_SEEN_REVISION, Number(result.processedRevision || stateRevision));
      }
      return value || result;
    };
    return payloadRun && typeof payloadRun.then === 'function' ? payloadRun.then(payloadDone) : payloadDone(payloadRun);
  }
  var decision = result.decision || (typeof reloadDecisionForState === 'function' ? reloadDecisionForState({ reloadState: state }) : null);
  if (!decision || !decision.ram || decision.ram.action === 'none') {
    return result;
  }
  var waitMs = Number(decision.ram.waitMs);
  if (!isFinite(waitMs) || waitMs < 0) { waitMs = 0; }
  if (decision.ram.action === 'defer' && waitMs === 0 && opts.forceImmediate !== true) {
    return { deferred: true, reason: decision.ram.reason, reload: state, decision: decision };
  }
  if (waitMs > 0 && opts.forceImmediate !== true) {
    sheetLinkScheduleDirtyCheck(waitMs, false);
    return { deferred: true, waitMs: waitMs, reload: state, decision: decision };
  }
  var refresh = function () { return sheetLinkApplyDirtyData(state, decision); };
  var work = typeof sidebarBusyRun === 'function' ? sidebarBusyRun('Đang đồng bộ dữ liệu vừa thay đổi…', refresh, { progress: true }) : refresh();
  if (!work || typeof work.then !== 'function') {
    if (sheetLinkReloadWorkSucceeded(work) && state && state.revision) {
      SHEET_LINK_LAST_SEEN_REVISION = Math.max(SHEET_LINK_LAST_SEEN_REVISION, sheetLinkWorkRevision(work, state));
    }
    return work;
  }
  return work.then(function (value) {
    // Chỉ ghi nhận revision sau khi Store đã nhận dữ liệu. Nếu reload thất bại
    // hoặc bị hoãn vì bản nháp, lần hỏi sau vẫn phải thấy signal cũ.
    if (sheetLinkReloadWorkSucceeded(value) && state && state.revision) {
      SHEET_LINK_LAST_SEEN_REVISION = Math.max(SHEET_LINK_LAST_SEEN_REVISION, sheetLinkWorkRevision(value, state));
    }
    return value;
  });
}

/** Hỏi selection + ReloadState trong đúng một round-trip; GAS tự quyết định đọc mã và scope RAM. */
function sheetLinkProbeSelectionAndReload(reason, options) {
  if (!SHEET_LINK_RAM_READY || typeof callServer !== 'function') { return null; }
  if (SHEET_LINK_SELECTION_PENDING) {
    // Chỉ giữ tín hiệu đánh thức; GAS vẫn tự đọc ReloadState mới nhất.
    SHEET_LINK_SELECTION_WAKE_QUEUED = true;
    return SHEET_LINK_SELECTION_PENDING;
  }
  var opts = options || {};
  var contextGeneration = SHEET_LINK_CONTEXT_GENERATION;
  var input = {
    previousSelectionContext: SHEET_LINK_SELECTION_CONTEXT,
    previousCustomerId: SHEET_LINK_PREVIOUS_CUSTOMER_ID,
    lastSeenRevision: SHEET_LINK_LAST_SEEN_REVISION,
    localDraft: sheetLinkLocalDraftInput(),
    reason: reason || 'wake',
    forceImmediate: opts.forceImmediate === true
  };
  var request = callServer('probeSelectionAndReload', [input], {
    silent: opts.silent === true || SHEET_LINK_SHOW_PROBE_PROGRESS_DEBUG !== true
  });
  var settled = request.then(function (result) {
    var extensionOwnsContext = sheetLinkExtensionAlive() && !!SHEET_LINK_LAST_CONTEXT;
    var contextIsCurrent = contextGeneration === SHEET_LINK_CONTEXT_GENERATION;
    if (result && result.selection && contextIsCurrent && !extensionOwnsContext) {
      SHEET_LINK_SELECTION_CONTEXT = Object.assign({}, result.selection);
      SHEET_LINK_PREVIOUS_CUSTOMER_ID = String(result.selection.customerId || '').trim();
      sheetLinkApplyContext(Object.assign({}, result.selection));
    }
    var applied = sheetLinkApplyDecisionResult(result, opts);
    return applied && typeof applied.then === 'function' ? applied.then(function () { return result; }) : result;
  }, function (error) {
    if (typeof console !== 'undefined' && console.warn) { console.warn('Không kiểm tra được selection/reload; sẽ thử lại ở nhịp sau.', error); }
    return null;
  });
  var completion = settled.then(function (result) {
    SHEET_LINK_SELECTION_PENDING = null;
    if (SHEET_LINK_SELECTION_WAKE_QUEUED) {
      SHEET_LINK_SELECTION_WAKE_QUEUED = false;
      var followUp = sheetLinkProbeSelectionAndReload('queued-wake');
      if (followUp && typeof followUp.then === 'function') {
        return followUp.then(function () { return result; });
      }
    }
    if (typeof selectionPollResetSafety === 'function') { selectionPollResetSafety(); }
    return result;
  }, function (error) {
    SHEET_LINK_SELECTION_PENDING = null;
    if (SHEET_LINK_SELECTION_WAKE_QUEUED) {
      SHEET_LINK_SELECTION_WAKE_QUEUED = false;
      sheetLinkProbeSelectionAndReload('queued-wake');
    }
    if (typeof selectionPollResetSafety === 'function') { selectionPollResetSafety(); }
    throw error;
  });
  SHEET_LINK_SELECTION_PENDING = completion;
  return SHEET_LINK_SELECTION_PENDING;
}

/** Đồng bộ dữ liệu kho cũng chỉ có một lượt đang bay; chỉ khóa sidebar sau khi máy chủ xác nhận có dữ liệu bẩn. */
function sheetLinkSyncDirtyData(options) {
  var opts = options || {};
  if (SHEET_LINK_DATA_PENDING) { return SHEET_LINK_DATA_PENDING; }
  var request = sheetLinkProbeSelectionAndReload(opts.reason || 'dirty-state', opts);
  SHEET_LINK_DATA_PENDING = request;
  if (request && typeof request.then === 'function') {
    request.then(function () { if (SHEET_LINK_DATA_PENDING === request) { SHEET_LINK_DATA_PENDING = null; } }, function () { if (SHEET_LINK_DATA_PENDING === request) { SHEET_LINK_DATA_PENDING = null; } });
  }
  return request;
}

/** Được gọi sau một lời gọi máy chủ tự nhiên; không chạy theo nhịp riêng và không gọi lại chính getReloadState. */
function sheetLinkObserveReloadPayload(payload, serverName) {
  if (!payload || payload.reloadObservation === false || !SHEET_LINK_RAM_READY || serverName === 'getReloadState' || serverName === 'reloadRecords' || serverName === 'probeSelectionAndReload' || serverName === 'saveRecord' || serverName === 'deleteRecords') { return null; }
  var state = sheetLinkReloadState(payload);
  var revision = Number(state && state.revision || 0);
  if (!revision || revision <= SHEET_LINK_LAST_SEEN_REVISION) { return null; }
  if (!sheetLinkDirtyNeedsData(state)) { return null; }
  if (SHEET_LINK_RELOAD_CHECKING) { return SHEET_LINK_RELOAD_CHECKING; }
  var check = sheetLinkSyncDirtyData();
  SHEET_LINK_RELOAD_CHECKING = check;
  check.then(function (result) { SHEET_LINK_RELOAD_CHECKING = null; return result; }, function (err) { SHEET_LINK_RELOAD_CHECKING = null; if (typeof console !== 'undefined' && console.warn) { console.warn(err); } });
  return check;
}

function sheetLinkPositionKey(ctx) {
  var value = ctx || {};
  var coordinates = sheetLinkParseNameBox(value.cellRef);
  return [value.sheetName || '', value.cellRef || '', coordinates ? coordinates.row : value.row || 0, coordinates ? coordinates.col : value.col || 0, coordinates ? coordinates.rowEnd : value.rowEnd || 0, coordinates ? coordinates.colEnd : value.colEnd || 0].join('|');
}

/** Một sheet chỉ có một lượt làm mới đang bay; mọi lựa chọn đến trong lúc đó cùng chờ đúng lượt này. */
function sheetLinkSyncView(sheetName) {
  var state = sheetLinkViewState(sheetName);
  if (state.pending) { return state.pending; }
  var settled = false;
  var request = callServer('renderViewIfDirty', [sheetName]).then(function (result) {
    settled = true;
    state.pending = null;
    return sheetLinkViewApplyResult(sheetName, result);
  }, function (err) {
    settled = true;
    state.pending = null;
    throw err;
  });
  if (!settled) { state.pending = request; }
  return request;
}

/** Rời ô cấu hình chỉ hỏi trạng thái; chỉ thay đổi thật mới bật overlay và làm mới view. */
function sheetLinkInspectView(sheetName) {
  var state = sheetLinkViewState(sheetName);
  if (state.pending) { return state.pending; }
  if (state.inspecting) { return state.inspecting; }
  var settled = false;
  var work = callServer('inspectViewState', [sheetName, state.revision], { silent: true }).then(function (result) {
    if (!result) { return result; }
    var dirty = sheetLinkReloadState(result);
    var refreshData = sheetLinkDirtyNeedsData(dirty);
    var refreshView = !state.metaReady || result.changed || result.needsRender || sheetLinkDirtyNeedsView(dirty, sheetName);
    if (!refreshData && !refreshView) { return result; }

    var sync = function () {
      var dataWork = sheetLinkApplyDirtyData(dirty);
      var afterData = function () { return refreshView ? sheetLinkSyncView(sheetName) : result; };
      return dataWork && typeof dataWork.then === 'function' ? dataWork.then(afterData) : afterData();
    };
    var message = refreshData ? 'Đang cập nhật dữ liệu và sheet ' + sheetName + '…' : 'Đang cập nhật sheet ' + sheetName + '…';
    return typeof sidebarBusyRun === 'function' ? sidebarBusyRun(message, sync) : sync();
  });
  var request = work.then(function (result) {
    settled = true;
    state.inspecting = null;
    return result;
  }, function (err) {
    settled = true;
    state.inspecting = null;
    throw err;
  });
  if (!settled) { state.inspecting = request; }
  return request;
}

function sheetLinkApplyContext(ctx) {
  if (!ctx) { return null; }
  SHEET_LINK_LAST_CONTEXT = Object.assign({}, ctx);
  SHEET_LINK_SELECTION_CONTEXT = Object.assign({}, ctx);
  if (Object.prototype.hasOwnProperty.call(ctx, 'customerId')) {
    SHEET_LINK_PREVIOUS_CUSTOMER_ID = String(ctx.customerId || '').trim();
  }
  var ticket = ++SHEET_LINK_APPLY_TICKET;
  var previousSheet = SHEET_LINK_LAST_SHEET;
  var changedSheet = ctx.sheetName !== previousSheet;
  var isView = ctx.sheetName && ctx.sheetName.charAt(0) === '!';
  var viewState = isView ? sheetLinkViewState(ctx.sheetName) : null;
  var positionKey = sheetLinkPositionKey(ctx);
  var inspectAfterControl = false;

  if (viewState && viewState.watch && viewState.watch.key !== positionKey) {
    inspectAfterControl = true;
    viewState.watch = null;
  }
  if (viewState && sheetLinkViewControlCell(viewState, ctx.row, ctx.col)) {
    viewState.watch = { key: positionKey, row: ctx.row, col: ctx.col };
  }
  if (viewState && changedSheet && !viewState.metaReady) { viewState.needsSync = true; }

  SHEET_LINK_LAST_SHEET = ctx.sheetName || '';
  if (!SHEET_LINK_RAM_READY) { return; }

  // Đổi khách từ context Extension là đường cục bộ và không được chờ RPC
  // kiểm tra dirty khi người dùng vừa chuyển sheet. Lượt server phía dưới vẫn
  // chạy nền để xử lý reload/view; nếu Store chưa có mã, applyLatest sẽ thử lại
  // sau khi lượt nạp hoàn tất.
  var immediateCustomerApplied = sheetLinkApplyCustomerContext(ctx);

  var leavingDataSheet = changedSheet && (previousSheet === 'Customer' || previousSheet === 'Activity');
  var work = function () {
    var pending = null;
    var queue = function (next) { pending = pending ? pending.then(next) : next(); };

    if (viewState && changedSheet) {
      if (!previousSheet && !viewState.metaReady && !SHEET_LINK_DATA_PENDING) {
        queue(function () { return sheetLinkSyncView(ctx.sheetName); });
      } else {
        if (SHEET_LINK_DATA_PENDING) { queue(function () { return SHEET_LINK_DATA_PENDING; }); }
        queue(function () { return sheetLinkInspectView(ctx.sheetName); });
      }
    } else {
      if (leavingDataSheet && typeof callServer === 'function') {
        // Rời sheet thắng debounce: hủy timer còn lại để không tạo thêm một
        // lượt hỏi sau khi lượt reload tức thời đã hoàn tất.
        sheetLinkCancelDirtyCheck();
        queue(function () { return sheetLinkSyncDirtyData({ forceImmediate: true }); });
      }
      else if (SHEET_LINK_DATA_PENDING) { queue(function () { return SHEET_LINK_DATA_PENDING; }); }

      if (viewState && (viewState.pending || viewState.inspecting)) {
        queue(function () { return viewState.pending || viewState.inspecting; });
      } else if (viewState && viewState.needsSync) {
        queue(function () { return sheetLinkSyncView(ctx.sheetName); });
      } else if (viewState && inspectAfterControl) {
        queue(function () { return sheetLinkInspectView(ctx.sheetName); });
      }
    }

    var applyLatest = function () {
      if (ticket !== SHEET_LINK_APPLY_TICKET) { return null; }
      if (immediateCustomerApplied) { return null; }
      return sheetLinkApplyCustomerContext(ctx);
    };
    return pending ? pending.then(applyLatest) : applyLatest();
  };

  return work();
}

/** Áp lại context cuối sau bootstrap để tin đến quá sớm không bỏ mất mã khách. */
function sheetLinkReplayContext() {
  return SHEET_LINK_LAST_CONTEXT ? sheetLinkApplyContext(SHEET_LINK_LAST_CONTEXT) : null;
}

function sheetLinkApplyCustomerContext(ctx) {
  // Sync overlays the normal `view` screen; changing the selected customer must
  // never repaint the underlying screen while that module owns the shell.
  if (!Prefs.followSelection || ScreenState.screen !== SCREEN_VIEW || (typeof FBM_SYNC_CLIENT !== 'undefined' && FBM_SYNC_CLIENT.active)) { return false; }

  var ma = sheetLinkCustomerIdFromContext(ctx);
  if (!ma || ma === ScreenState.currentCustomerId) { return false; }

  ACTIONS.setCurrentCustomer({ pick: ma });
  return true;
}

function sheetLinkCustomerIdFromContext(ctx) {
  // Mã do live model là nguồn chính; mã ngay ô active là đường tắt an toàn.
  var direct = String(ctx.customerId || '').trim().toUpperCase();
  if (direct && Store.hasCustomer(direct)) { return direct; }

  var text = String(ctx.cellText || '').trim().toUpperCase();
  if (SHEET_LINK_CODE_PATTERN.test(text) && Store.hasCustomer(text)) { return text; }
  return '';
}
</script>
