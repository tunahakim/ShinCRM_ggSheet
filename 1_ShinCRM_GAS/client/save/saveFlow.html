<script>
/*
 * Đường bấm Lưu: đọc form, gửi lên cửa ghi, rồi hoặc tô đỏ chỗ sai hoặc đóng form. Tài liệu 06 Phần 4.
 *
 * Hai chỗ dễ làm sai. Một: **chỉ gửi trường đang có mặt trên form** cộng `id` cộng trường chỉ-đọc mang theo — cửa ghi kiểm `required` trên đúng những khóa bên gọi gửi, nên gửi cả bản ghi RAM (ảnh chụp có thể đã bốn tiếng) là vừa làm khách thiếu trường không sửa nổi ghi chú, vừa ghi đè cột người khác vừa sửa. Hai: **không dùng `data-busy` trên nút ✓** — nút không có `.shin-btn-label` nên `dispatchBusy` ghi thẳng `textContent` và glyph mất vĩnh viễn; chống bấm đôi bằng cờ `SAVE_FLOW.dangGui`.
 */

/** Trường máy — cửa ghi tự điền. Bản đối chiếu máy chủ là `WRITE_GATE_MACHINE_FIELDS`; sửa một bên thì mở bên kia. */
var SAVE_FLOW_MACHINE = ['id', 'createdAt', 'recordStatus'];

/** Cờ đang gửi, để hai cú bấm liền nhau không thành hai bản ghi. */
var SAVE_FLOW = { dangGui: false };

/** Cất nội dung đang gõ vào bản nháp, gọi trước khi mở form lồng. Không có form nào đang mở thì không làm gì. */
function saveFlowStashDraft() {
  var top = screenStateTop();
  if (!top) { return null; }

  var draft = formCollectEntity(formCollectAll(), top.entity);
  screenStateSetDraft(draft);
  return draft;
}

/** Trường chỉ-đọc phải mang theo từ bản ghi cũ vì ô của nó không gửi giá trị. Viết thành luật chứ không viết cứng `activity.customerId` — bảng khai thêm trường thì luật vẫn đúng. */
function saveFlowCarryReadonly(top, record) {
  var fields = Schema[top.entity];

  Object.keys(fields).forEach(function (ten) {
    if (SAVE_FLOW_MACHINE.indexOf(ten) !== -1) { return; }
    if (fields[ten].readonly !== true) { return; }
    if (Object.prototype.hasOwnProperty.call(record, ten)) { return; }

    var cu = top.record ? top.record[ten] : '';
    if (cu === undefined || cu === null || cu === '') { return; }
    record[ten] = cu;
  });

  return record;
}

/**
 * Bản ghi gửi lên máy chủ. **Phải là object khác với bản nháp**: bản nháp được đắp lên bản ghi ở mọi lượt vẽ, nên một khóa `id` rỗng lọt vào đó là ô mã khách trắng bóc ngay lượt sau.
 *
 * `id` rỗng khi thêm mới dù `top.record.id` có giá trị — đó là mã xem trước của `fieldLogicNextCode`, gửi lên là tự nhận đã có dòng mang mã đó.
 */
function saveFlowRecord(top, thu) {
  var record = {};
  Object.keys(thu).forEach(function (ten) { record[ten] = thu[ten]; });

  record.id = top.themMoi ? '' : String((top.record && top.record.id) || '');
  return saveFlowCarryReadonly(top, record);
}

/**
 * Giá trị lúc mở form của mọi trường sắp gửi, để cửa ghi kiểm xung đột (tài liệu 06 Phần 4). Lấy từ `top.record` vì đó là ảnh chụp lúc mở: `Store.upsertRecord` thay hẳn object trong RAM chứ không sửa tại chỗ, nên lượt nạp nền không làm ảnh chụp này trôi theo Sheet.
 * Thêm mới thì không có giá trị cũ, trả `null`.
 */
function saveFlowOld(top, record) {
  if (top.themMoi) { return null; }
  var base = top.record || {};
  var old = {};
  Object.keys(record).forEach(function (ten) {
    if (ten === 'id') { return; }
    old[ten] = base[ten] === undefined || base[ten] === null ? '' : base[ten];
  });
  return old;
}

/** Câu báo xung đột tạm bằng chữ, cho tới khi có màn chọn giá trị từng trường. */
function saveFlowConflictMessage(conflicts) {
  var hien = function (v) { return v === '' ? '(trống)' : '"' + v + '"'; };
  return 'Có trường đã bị đổi trên Sheet trong lúc bạn sửa, nên chưa lưu gì:\n' +
    conflicts.map(function (c) { return '- ' + c.label + ': lúc mở form ' + hien(c.old) + ', trên Sheet giờ là ' + hien(c.current) + ', bạn đang gõ ' + hien(c.mine); }).join('\n') +
    '\n\nBấm Lưu lần nữa để ghi đè bằng giá trị bạn đang gõ. Muốn giữ giá trị trên Sheet thì bấm Hủy rồi mở lại form.';
}

/** Bỏ dấu đỏ ở mọi ô của form. Chạy trước mỗi lượt gửi, vì lượt trước có thể đã tô mà lần này chỗ đó đã sửa đúng. */
function saveFlowClearErrors(entity) {
  fieldInvalidClear(Object.keys(Schema[entity]).map(function (ten) { return renderFieldId({ entity: entity, name: ten }); }));
}

/** Tô đỏ ô cửa ghi trả về, trả `focusId` của ô sai đầu tiên. */
function saveFlowPaintInvalid(entity, invalid) {
  return fieldInvalidPaint((invalid || []).map(function (item) { return renderFieldId({ entity: entity, name: item.field }); }));
}

/** Đổ câu trả lời của cửa ghi vào RAM. Dùng `res.rows` chứ không dùng bản vừa gửi: hàng đọc lại có đủ mọi cột, kể cả mã vừa cấp. */
function saveFlowApply(entity, res) {
  var recs = ingestUnpack(res.fields, res.rows);
  recs.forEach(function (r) { Store.upsertRecord(entity, r); });
  if (typeof refreshCountersApply === 'function') { refreshCountersApply(res.counters); }

  return recs[0] || null;
}

/** Đóng **một** lớp form: đóng cả ngăn xếp thì lưu ghi chú lồng trên form giao dịch là mất giao dịch đang gõ dở. Lưu khách mới thì màn xem chuyển sang chính khách đó. */
function saveFlowClose(entity, ban, themMoi) {
  var duoi = screenStateCloseForm();
  if (duoi) { return screenFormRender(); }

  if (themMoi && entity === 'customer' && ban && ban.id) { screenStateSetCustomer(ban.id); }
  return screenViewRender();
}

/** Toàn bộ đường bấm Lưu, trả `Promise` để bộ phát click bắt được lượt gửi thất bại. Bấm lần hai lúc lượt đầu còn bay thì lặng lẽ bỏ qua — dải tiến trình đang chạy đã là câu trả lời. */
function saveFlowSubmit() {
  if (SAVE_FLOW.dangGui) { return null; }

  var top = screenStateTop();
  if (!top) { throw new Error('Không có form nào đang mở nên không có gì để lưu.'); }

  var entity = top.entity;
  var themMoi = top.themMoi;
  var thu = formCollectEntity(formCollectAll(), entity);
  var record = saveFlowRecord(top, thu);

  saveFlowClearErrors(entity);
  screenStateSetDraft(thu);

  SAVE_FLOW.dangGui = true;
  return sidebarBusyRun(entity === 'customer' ? 'Đang lưu khách hàng…' : 'Đang lưu giao dịch…', function () {
    return callServer('saveRecord', [entity, record, saveFlowOld(top, record)]).then(function (res) {
      SAVE_FLOW.dangGui = false;

      if (res.blocked) { throw new Error(res.message || 'Bản ghi đang được đồng bộ.'); }
      if (!res.ok && res.conflicts) {
        // Người dùng đã thấy giá trị trên Sheet: nhận nó làm mốc mới, bấm Lưu lần nữa là chủ ý ghi đè.
        screenStateSetBaseline(res.conflicts.reduce(function (acc, c) { acc[c.field] = c.current; return acc; }, {}));
        alert(saveFlowConflictMessage(res.conflicts));
        return { focusId: saveFlowPaintInvalid(entity, res.conflicts) };
      }
      if (!res.ok) {
        var focusId = saveFlowPaintInvalid(entity, res.invalid);
        // `alert` vì đó là đường hiện lỗi duy nhất của form bản ghi — xem `dispatchError`.
        alert(fieldInvalidMessage(res.invalid));
        return { focusId: focusId };
      }

      if (typeof screenFormSyncUnlock === 'function') { screenFormSyncUnlock(entity, top.record); }
      var ban = saveFlowApply(entity, res);
      return saveFlowClose(entity, ban, themMoi);
    }, function (err) {
      SAVE_FLOW.dangGui = false;
      throw err;
    });
  }, { block: true });
}

/* Provider dirty cho form lõi: dùng lại đúng bộ thu thập của luồng lưu, chỉ chạy khi dirty guard hỏi. */
var SAVE_FLOW_UNSAVED_PROVIDER = null;
function saveFlowUnsavedProvider() {
  if (SAVE_FLOW_UNSAVED_PROVIDER) { return SAVE_FLOW_UNSAVED_PROVIDER; }
  SAVE_FLOW_UNSAVED_PROVIDER = {
    read: function () {
      var top = typeof screenStateTop === 'function' ? screenStateTop() : null;
      if (!top || typeof formCollectAll !== 'function' || typeof formCollectEntity !== 'function') { return { editing: false, dirty: false, fieldIds: [] }; }
      var current = formCollectEntity(formCollectAll(), top.entity), baseline = top.record || {}, changed = [], fieldIds = [];
      Object.keys(current || {}).forEach(function (name) {
        var left = current[name], right = baseline[name], same = typeof unsavedChangesEqual === 'function' ? unsavedChangesEqual(left, right) : String(left === undefined || left === null ? '' : left).trim() === String(right === undefined || right === null ? '' : right).trim();
        if (!same) {
          changed.push(name);
          if (typeof renderFieldId === 'function') { fieldIds.push(renderFieldId({ entity: top.entity, name: name })); }
        }
      });
      return { editing: true, dirty: changed.length > 0, fields: changed, fieldIds: fieldIds, top: top };
    },
    canRun: function (intent, state) {
      if (!state || !state.editing) { return true; }
      var action = String(intent && intent.action || '');
      if (action === 'saveForm') { return true; }
      if (action === 'cancelForm') { return !state.dirty; }
      return false;
    },
    save: function () {
      var top = typeof screenStateTop === 'function' ? screenStateTop() : null, result = saveFlowSubmit();
      if (!result || typeof result.then !== 'function') { return { ok: false }; }
      return result.then(function () { return { ok: typeof screenStateTop !== 'function' || screenStateTop() !== top }; });
    },
    discard: function () {
      var top = typeof screenStateTop === 'function' ? screenStateTop() : null;
      if (top && typeof screenStateSetDraft === 'function') { screenStateSetDraft({}); }
      /* Pending action như mở form lồng sẽ gọi `screenFormStash` trước khi
         chạy. Khôi phục DOM ngay tại đây để giá trị đã bỏ không bị thu lại
         thành draft lần nữa. */
      if (top && typeof document !== 'undefined' && document.querySelectorAll) {
        document.querySelectorAll('[data-field]').forEach(function (control) {
          var path = String(control.getAttribute('data-field') || '').split('.');
          if (path.length !== 2 || path[0] !== top.entity) { return; }
          var value = top.record && top.record[path[1]];
          if (typeof renderControlValue === 'function' && control.id) {
            renderControlValue(control.id, value === undefined || value === null ? '' : value);
          } else if ('value' in control) {
            control.value = value === undefined || value === null ? '' : String(value);
          }
        });
      }
      return { ok: true };
    }
  };
  return SAVE_FLOW_UNSAVED_PROVIDER;
}
</script>
