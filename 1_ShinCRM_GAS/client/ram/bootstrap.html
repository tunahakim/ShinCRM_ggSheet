<script>
/**
 * Trình tự khởi động sidebar, theo tài liệu 05 Phần 4. Ba bước, bước sau chỉ bắt đầu khi bước trước xong.
 *
 * Tệp này biết **thứ tự**, không biết cách làm từng việc: gọi máy chủ là việc của `serverCall`, bung dữ liệu là việc của
 * `ingest`, vẽ là việc của màn hình. Giữ ranh giới đó vì thứ tự ba bước là thứ tài liệu chốt bằng ràng buộc cứng, nên nó
 * phải đọc được trong một màn hình code mà không phải lần qua chi tiết của ba việc kia.
 *
 * Vì sao tách `activity` xuống bước ba: nó là phần nặng nhất và không cần thiết để tra cứu một khách. Đẩy nó xuống sau kéo
 * thời gian tới khung hình đầu tiên xuống còn vài giây thay vì vài chục giây. Trong lúc nó chạy nền, sidebar dùng được bình
 * thường, riêng phần lịch sử làm việc bị hạn chế theo bảng ở tài liệu 05 Phần 5.
 *
 * Tệp này dùng `async` / `await`, khác với phần còn lại của dự án viết theo lối ES5. Lý do: trình tự ba bước nối tiếp nhau
 * viết bằng hàm gọi lại (callback) sẽ thành ba tầng lồng, và vòng lặp nạp gói — chạy tới khi máy chủ báo hết — thì lồng
 * không biết bao nhiêu tầng. Code chạy trong iframe của Apps Script, tức trình duyệt của người dùng, nên cú pháp này an
 * toàn ở đây; phía máy chủ thì vẫn ES5.
 */

/**
 * Chạy cả ba bước. Mọi lỗi đều rơi vào một chỗ, và chỗ đó vẽ ra màn báo lỗi đọc được.
 *
 * Bắt lỗi ở đây **không phải nuốt lỗi**: máy chủ đã ghi dòng log kèm vết gọi trước khi ném, còn việc còn lại của client là
 * hiện nó lên. Nếu không bắt thì thông báo chỉ nằm trong console của trình duyệt, chỗ mà chủ dự án không có lý do gì để mở.
 *
 * Bản đo thời gian chỉ gửi ở đường chạy xuôi. Đường lỗi thì không, vì lượt gửi đó cũng đi qua `google.script.run`: nếu thứ
 * vừa gãy chính là đường truyền thì nó gãy lần nữa và cuốn theo thông báo lỗi thật — đúng lúc người dùng cần đọc thông báo
 * đó nhất. Lượt chạy vỡ đã có dòng log kèm vết gọi do máy chủ tự ghi.
 */
async function sidebarBoot() {
  callTimingReset(Date.now());
  var finishBusy = typeof sidebarBusyBegin === 'function' ? sidebarBusyBegin('Đang nạp dữ liệu ShinCRM…') : null;
  bootClearStartupWarning();

  try {
    // Bộ phát click gắn **trước** mọi thứ khác, vì nó không cần một hạt dữ liệu nào mà màn báo lỗi thì có nút Thử lại. Gắn ở cuối như trước thì lượt nạp đầu tiên mà vỡ sẽ vẽ ra một cái nút bấm không kêu. Hàm này chạy nhiều lần cũng chỉ gắn một tai nghe.
    dispatchInstall();
    selectionPollInstall();
    sheetLinkInstall();
    selectionPollSetReady(false);

    statusInfoLine('Đang đo ngân sách ô và nạp lõi…');
    var core = await callServer('loadCore');
    bootTellPendingMessages(core.pendingMessages);

    if (core.blocked) {
      statusBudgetBlocked(core.budget);
      return;
    }

    var skipped = ingestCore(core);
    sheetLinkSetSpreadsheetId(core.spreadsheetId);
    selectionPollSetReady(true);
    statusInfoLine('Tra cứu khách đã chạy — đang nạp giao dịch ở chế độ nền…');
    callTimingFirstPaint(Date.now());

    var loaded = await bootLoadActivities(core.activity.total);

    ingestActivityDone();
    var timing = callTimingReport(Date.now());

    BOOT_LAST_SUMMARY = {
      core: core,
      activityRecords: loaded.records,
      activityChunks: loaded.chunks,
      warnings: core.warnings,
      skipped: skipped,
      timing: timing
    };

    menuInstall();
    collapseInstall();
    searchInstall();
    comboInstall();
    inputsInstall();

    screenViewDropStale();
    screenViewGo();
    if (typeof sheetLinkReplayContext === 'function') { await sheetLinkReplayContext(); }
    collapseScan();
    bootTellProblems(BOOT_LAST_SUMMARY);

    await callServer('logClientTiming', [timing]);
  } catch (err) {
    statusLoadError(err && err.message ? err.message : String(err));
  } finally {
    if (finishBusy) { finishBusy(); }
  }
}

/**
 * Tóm tắt của lượt nạp gần nhất, giữ lại sau khi màn tóm tắt thôi tự hiện.
 *
 * Từ chặng này lượt vẽ cuối là màn xem, nên con số của lượt nạp không còn nằm trên màn hình nữa. Giữ ở đây để `bootShowSummary()` gọi được từ console lúc nghiệm thu, và để chỗ nào cần thì tra lại mà không phải nạp lại.
 */
var BOOT_LAST_SUMMARY = null;

/** Hiện rồi bỏ các lỗi mà cửa chạy nền đã gửi vào kho chờ; gói `loadCore` đã lấy và xóa chúng ở phía máy chủ. */
function bootTellPendingMessages(messages) {
  var list = Array.isArray(messages) ? messages.filter(function (message) { return String(message || '').trim(); }) : [];
  if (!list.length) { return null; }

  var text = 'ShinCRM ghi nhận ' + list.length + ' lỗi từ các lượt chạy nền trước đó:\n\n• ' + list.join('\n• ');
  if (typeof dispatchError === 'function') { dispatchError(new Error(text)); }
  else { alert(text); }
  return text;
}

/** Vẽ lại màn tóm tắt của lượt nạp gần nhất. Không phải một trong mười lăm hành động, nên nó không có nút nào — đường vào là console lúc nghiệm thu, và nút Nạp lại đưa màn hình về lại màn xem. */
function bootShowSummary() {
  if (!BOOT_LAST_SUMMARY) { return null; }
  return statusLoadSummary(BOOT_LAST_SUMMARY);
}

/** Xóa cảnh báo cũ trước khi bắt đầu một lượt bootstrap mới. */
function bootClearStartupWarning() {
  var node = typeof document !== 'undefined' && document.getElementById ? document.getElementById('shin-startup-warning') : null;
  if (node) { node.hidden = true; node.textContent = ''; }
}

/** Hiện cảnh báo trong layout; fallback console chỉ dùng cho hộp cát không có DOM. */
function bootShowStartupWarning(text) {
  var node = typeof document !== 'undefined' && document.getElementById ? document.getElementById('shin-startup-warning') : null;
  if (node) { node.textContent = String(text || ''); node.hidden = false; return; }
  if (typeof console !== 'undefined' && console.warn) { console.warn(text); }
}

/**
 * Báo hai loại tin của lượt nạp, mỗi loại tới đúng người đọc của nó.
 *
 * `warnings` là **cảnh báo về dữ liệu** — máy chủ nói có gì đó lệch trong sheet — nên nó hiện trong dải cảnh báo của sidebar mà không chặn lượt nạp RAM.
 *
 * `skipped` là **phép kiểm không chạy được**, tức một câu nói về bộ kiểm chứ không phải về dữ liệu. Nó xuống console. Lý do: hai phép trong danh sách đó bỏ qua ở **mọi** lượt nạp và sẽ còn bỏ qua tới chặng 1.4, vì `NORMALIZERS` với `VALIDATORS` cố ý chỉ có một bản phía máy chủ nên sidebar không bao giờ nắm được chúng. Một hộp thoại nổ mỗi lần mở sidebar với đúng một câu mà người dùng không làm gì được là cách chắc chắn để tới tuần thứ hai họ bấm OK mà không đọc — rồi cái cảnh báo thật cũng chịu chung số phận đó.
 *
 * Chỗ giữ lời hứa "không bỏ qua trong im lặng" vẫn còn, chỉ dời đi: `tests/cases/schemaCheck.js` chốt cứng con số phép kiểm bị bỏ qua, nên thêm một phép bỏ qua mới là bộ kiểm đỏ ngay. Ngoài ra cả hai danh sách đều nằm trong `BOOT_LAST_SUMMARY` để `bootShowSummary()` kể lại đầy đủ.
 *
 * Trả về chuỗi đã hiện, hoặc `null` khi không có cảnh báo nào — bên kiểm cần biết hộp thoại có nổ hay không.
 */
function bootTellProblems(info) {
  var boQua = info.skipped || [];
  if (boQua.length && typeof console !== 'undefined' && console.info) {
    console.info('Lượt nạp bỏ qua ' + boQua.length + ' phép kiểm:\n• ' + boQua.join('\n• '));
  }

  var dong = info.warnings || [];
  if (!dong.length) { return null; }

  var chu = 'Lượt nạp xong nhưng có ' + dong.length + ' điều cần biết:\n\n• ' + dong.join('\n• ')
    + '\n\nMàn hình vẫn dùng được bình thường. Mở console rồi gọi bootShowSummary() để xem đầy đủ con số của lượt nạp.';
  bootShowStartupWarning(chu);
  return chu;
}

/**
 * Bậc thang cỡ gói: cỡ chuẩn trước, rồi các cỡ lùi. Một mảng để vòng nạp chỉ cần đi tới phần tử kế tiếp.
 *
 * Đọc từ `SETTINGS` đã nạp về chứ không gõ cứng ở đây, vì cỡ gói là hằng phía máy chủ và hai bản sao của một con số thì có ngày lệch nhau. `SETTINGS` chưa về — trường hợp chỉ xảy ra nếu ai đó gọi hàm này ngoài trình tự khởi động — thì trả về `[null]`, tức một bậc duy nhất để máy chủ tự chọn cỡ chuẩn.
 */
function bootChunkLadder() {
  if (typeof SETTINGS === 'undefined' || !SETTINGS || !SETTINGS.CHUNK_ROWS) { return [null]; }
  return [SETTINGS.CHUNK_ROWS].concat(SETTINGS.CHUNK_ROWS_FALLBACK || []);
}

/**
 * Xin một gói ở cỡ chuẩn, và **lùi cỡ rồi thử lại đúng con trỏ đó** nếu thất bại.
 *
 * Vì sao cần đường lùi: một gói thất bại vì nặng — hoặc chạm trần sáu phút mỗi lượt thực thi của Apps Script, hoặc khối kết quả quá lớn — thì gọi lại y nguyên chỉ thất bại y nguyên. Cùng con trỏ với cỡ nhỏ hơn thì đọc lại đúng chỗ vừa gãy mà không lệch một hàng nào, vì con trỏ mang số hàng.
 *
 * Hết bậc mà vẫn thất bại thì ném lỗi cuối cùng. Đường lùi là để cứu một gói nặng bất thường, không phải để che một máy chủ đang đổ.
 */
async function bootChunkWithFallback(cursor, onRetry) {
  var ladder = bootChunkLadder();

  for (var i = 0; i < ladder.length; i++) {
    try {
      return await callServer('loadActivityChunk', [cursor, ladder[i]]);
    } catch (err) {
      if (i === ladder.length - 1) { throw err; }
      if (onRetry) { onRetry(ladder[i], ladder[i + 1]); }
    }
  }
}

/**
 * Vòng nạp gói `activity`: gọi lại tới khi máy chủ báo hết, mỗi gói xếp vào bộ nhớ ngay.
 *
 * Con trỏ do máy chủ cấp và client chỉ truyền lại nguyên văn — client không tự tính gói tiếp theo, vì số hàng trên sheet có
 * thể đổi giữa hai lần gọi và chỉ máy chủ biết mình vừa đọc tới đâu.
 *
 * Chặn cứng ở 10.000 vòng: nếu máy chủ trả một con trỏ không tiến thì vòng này quay mãi và trình duyệt treo, còn người dùng
 * chỉ thấy dải tiến trình chạy không bao giờ hết. Thà ném một câu nói rõ là con trỏ có vấn đề.
 */
async function bootLoadActivities(total) {
  var cursor = null;
  var chunks = 0;
  var records = 0;
  var retries = 0;

  do {
    var chunk = await bootChunkWithFallback(cursor, function (hong, nho) {
      retries += 1;
      statusInfoLine('Gói ' + statusNumber(hong) + ' hàng không nạp được, đang thử lại với gói ' + statusNumber(nho) + ' hàng…');
    });

    records += ingestActivityChunk(chunk);
    chunks += 1;
    cursor = chunk.nextCursor;

    if (total) {
      statusInfoLine('Đang nạp giao dịch: ' + statusNumber(records) + '/' + statusNumber(total) + '…');
    }

    if (chunks > 10000) {
      throw new Error('Vòng nạp gói giao dịch không dừng sau 10.000 gói — con trỏ máy chủ trả về không tiến.');
    }
  } while (cursor);

  return { chunks: chunks, records: records, retries: retries };
}
</script>
