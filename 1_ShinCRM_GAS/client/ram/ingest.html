<script>
/**
 * Bung gói dữ liệu máy chủ gửi về thành `Store`. Tài liệu 05 Phần 3, 4, 7, 8.
 *
 * Vì sao tệp này đuôi `.html` chứ không phải `.js` như tài liệu 05 Phần 13 ghi: xem đoạn giải thích ở đầu `client/util/textNormalize.html`.
 *
 * Tệp này là chỗ duy nhất biết **hình dạng đường truyền** (Array of Arrays — mảng của mảng, gồm `fields` và `rows`). Từ đây trở đi, mọi nơi khác trong sidebar chỉ thấy object có khóa là tên trường. Giữ ranh giới đó vì hình dạng đường truyền tồn tại để tiết kiệm payload (khối dữ liệu truyền về), không phải để làm việc trên nó: một mảng giá trị xếp theo thứ tự cột thì đọc `row[7]` ở khắp nơi, và chèn một trường vào giữa bảng khai là làm sai mọi chỗ đọc mà không có gì báo.
 *
 * **Bung một lần, đúng ở đây.** Đây là ràng buộc cứng của tài liệu 05 Phần 3.
 *
 * Còn thứ tự các bước trong `ingestCore` thì không tùy ý: `Schema` phải có trước bộ tự kiểm, và bộ tự kiểm phải chạy trước khi bung bản ghi. Bung trước rồi kiểm sau nghĩa là một bảng khai sai vẫn kịp sinh ra một bộ nhớ trông như bình thường, và lỗi sẽ lộ ra ở một chỗ cách xa nguyên nhân.
 */

/** `SETTINGS` phía sidebar, bản sao của `SETTINGS` máy chủ, gán một lần lúc ingest. Nó không nằm trong `Store` vì `Store` giữ dữ liệu, còn đây là núm vặn. */
var SETTINGS = null;

/**
 * Bung một khối `{ fields, rows }` thành mảng object có khóa là tên trường.
 *
 * Không kiểm độ dài từng hàng: hàng do `EntityRead.gs` dựng nên luôn đủ cột, và thêm một phép kiểm ở đây là thêm chi phí lên đúng vòng lặp chạy nhiều nhất của cả hệ. Nếu một ngày nào đó hàng thiếu cột thì trường thiếu nhận `undefined`, và bộ tự kiểm schema cùng phép kiểm bắt buộc lúc lưu là chỗ bắt nó.
 */
function ingestUnpack(fields, rows) {
  var out = [];

  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var record = {};
    for (var c = 0; c < fields.length; c++) { record[fields[c]] = row[c]; }
    out.push(record);
  }

  return out;
}

/**
 * Đổi bảng tra hàng → mã của đường truyền (object khóa chuỗi) thành **mảng thưa** đánh chỉ số theo số hàng thật, đúng hình dạng chốt ở tài liệu 05 Phần 7.
 *
 * Ba phần tử đầu luôn rỗng vì hàng một tới ba là tiêu đề, và hàng nào không có bản ghi cũng rỗng. Tra vào chỗ rỗng trả về rỗng, và click vào đó không mở gì — đó là hành vi đúng, nên không cần cờ nào cho vùng tiêu đề.
 */
function ingestRowMapArray(map) {
  var arr = [];
  Object.keys(map).forEach(function (key) { arr[Number(key)] = map[key]; });
  return arr;
}

/**
 * Dựng bộ nhớ từ gói `loadCore`. Trả về danh sách phép kiểm đã bị bỏ qua, để bên gọi in ra chứ không im lặng.
 *
 * Bộ tự kiểm schema ném lỗi khi có vấn đề, và ném là đúng: một bảng khai sai không sửa được từ trong sidebar, nên chạy tiếp
 * chỉ để hỏng ở một chỗ khó truy hơn. Bên gọi bọc lời gọi này trong `try` và vẽ thông báo ra màn hình, nên lỗi vẫn tới mắt người.
 *
 * Ba bảng khai giao diện dò bằng `typeof` vì hộp cát tầng dữ liệu của bộ kiểm offline cố ý không nạp `client/ui/*`. Thiếu thì phần kiểm bố cục có tên trong `skipped`, và `tests/cases/schemaCheck.js` chốt rằng với đủ bốn bảng thì nó thật sự chạy. `DEFAULTS` dò cùng một kiểu và cũng vì cùng một lý do — nó nằm ở `client/schema/fieldLogic.html`, ngoài hộp cát đó.
 */
function ingestCore(payload) {
  storeReset();

  SETTINGS = payload.settings;
  Schema = buildSchema(payload.schema);
  Store.categories = payload.categories;
  Store.config = payload.config;
  prefsIngest(payload.prefs);

  var check = checkSchema({
    dataSchema: payload.schema,
    categoryCodes: Object.keys(payload.categories),
    configDefaultCodes: Object.keys(payload.config.defaults),
    functionTables: { DEFAULTS: typeof DEFAULTS === 'undefined' ? null : DEFAULTS },
    uiSchema: typeof UI_SCHEMA === 'undefined' ? null : UI_SCHEMA,
    actions: typeof ACTIONS === 'undefined' ? null : ACTIONS,
    slots: typeof SLOTS === 'undefined' ? null : SLOTS
  });

  if (check.problems.length) {
    throw new Error('Bảng khai schema có ' + check.problems.length + ' lỗi: ' + check.problems.join(' | '));
  }

  ingestUnpack(payload.customer.fields, payload.customer.rows).forEach(function (customer) {
    Store.customers[customer.id] = customer;
    Store.searchIndex.push({ id: customer.id, haystack: storeHaystack(customer) });
  });

  Object.keys(payload.rowMaps).forEach(function (sheetName) {
    Store.rowMaps[sheetName] = ingestRowMapArray(payload.rowMaps[sheetName]);
  });

  Store.activityState = STORE_LOADING;
  return check.skipped;
}

/**
 * Xếp một gói `activity` vào bộ nhớ. Trả về số bản ghi đã xếp.
 *
 * **Không sắp xếp ở đây.** Sắp mỗi gói nghĩa là sắp lại cùng một mảng vài chục lần trong một lượt nạp; tài liệu 05 Phần 8 chốt sắp **một lần** sau khi nạp xong, và `ingestActivityDone` là chỗ đó.
 *
 * Mọi giao dịch của một khách vào cùng một mảng, kể cả bản ghi đã xóa mềm, không chia loại. Đường nạp này và `Store.upsertRecord` là hai chỗ duy nhất chạm trực tiếp vào mảng đó.
 */
function ingestActivityChunk(chunk) {
  var records = ingestUnpack(chunk.fields, chunk.rows);

  records.forEach(function (activity) {
    var list = Store.activitiesByCustomer[activity.customerId];
    if (!list) { list = Store.activitiesByCustomer[activity.customerId] = []; }
    list.push(activity);
  });

  return records.length;
}

/**
 * Đóng lượt nạp `activity`: sắp mọi mảng một lần rồi bật cờ sẵn sàng. Trả về số mảng đã sắp.
 *
 * Bật cờ **sau** khi sắp xong, không phải trước. Giữa hai việc đó, hai default kế tục đọc "lần làm việc gần nhất" sẽ đọc phần tử đầu của một mảng chưa sắp — tức một giao dịch có thật nhưng không phải giao dịch gần nhất. Điền sẵn một giá trị sai mà trông như đúng là đúng thứ mà việc khóa nút Thêm giao dịch lúc đang nạp tồn tại để ngăn.
 */
function ingestActivityDone() {
  var names = Object.keys(Store.activitiesByCustomer);

  names.forEach(function (customerId) {
    Store.activitiesByCustomer[customerId].sort(activityCompare);
  });

  Store.activityState = STORE_READY;
  return names.length;
}
</script>
