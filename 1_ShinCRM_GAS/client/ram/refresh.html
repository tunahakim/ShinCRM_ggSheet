<script>
/** Làm mới đúng các mã do trạng thái bẩn trả về; không tự đọc sheet hay đổi Store ngoài hai cửa của Store. */
function refreshLocalDraftIds() {
  var out = [];
  var stack = typeof ScreenState !== 'undefined' && Array.isArray(ScreenState.formStack) ? ScreenState.formStack : [];
  stack.forEach(function (form) {
    if (!form || !form.draft || !Object.keys(form.draft).length) { return; }
    var id = String(form.record && form.record.id || '').trim();
    if (id && out.indexOf(id) < 0) { out.push(id); }
  });
  return out;
}

function refreshRecordsApply(result, requestedIds) {
  if (!result || !result.ok) { return; }
  var ids = (requestedIds || []).map(function (id) { return String(id || ''); });
  var affectedCustomerIds = result.affectedCustomerIds || ids;
  var customers = ingestUnpack(result.customer.fields, result.customer.rows);
  var activities = ingestUnpack(result.activity.fields, result.activity.rows);
  var customerIds = {};
  customers.forEach(function (record) { customerIds[record.id] = true; Store.upsertRecord('customer', record); });
  affectedCustomerIds.forEach(function (id) { if (!customerIds[id] && Store.customers[id]) { Store.removeRecord('customer', id); } });
  var activityIds = {};
  activities.forEach(function (record) { activityIds[record.id] = true; Store.upsertRecord('activity', record); });
  affectedCustomerIds.forEach(function (id) {
    var list = Store.activitiesByCustomer[id] || [];
    list.slice().forEach(function (record) { if (!activityIds[record.id] && record.customerId === id) { Store.removeRecord('activity', record.id); } });
  });
  (result.removedRecordIds || []).forEach(function (id) {
    var key = String(id || '').trim();
    if (Store.customers[key]) { Store.removeRecord('customer', key); }
    Store.removeRecord('activity', key);
  });
  renderScreen();
}

/** Áp dụng riêng bảng Category; Config và Schema vẫn đi qua full core để không lệch bảng khai. */
function refreshCategoryApply(result) {
  if (!result || !result.ok || !result.categories) { return; }
  Store.categories = result.categories;
  renderScreen();
}

function refreshDirtyRecords(ids, expectedRevision) {
  return callServer('reloadRecords', [ids, expectedRevision]).then(function (result) {
    if (result && result.reloadMode === 'fullCore') {
      return typeof sidebarBoot === 'function' ? sidebarBoot().then(function () { return result; }) : result;
    }
    refreshRecordsApply(result, ids);
    return result;
  });
}

function refreshCategory(expectedRevision) {
  return callServer('reloadCategory', [expectedRevision]).then(function (result) {
    if (result && result.reloadMode === 'fullCore') {
      return typeof sidebarBoot === 'function' ? sidebarBoot().then(function () { return result; }) : result;
    }
    refreshCategoryApply(result);
    return result;
  });
}

function refreshConfig(expectedRevision) {
  return callServer('reloadConfig', [expectedRevision]).then(function (result) {
    if (result && result.reloadMode === 'fullCore') {
      return typeof sidebarBoot === 'function' ? sidebarBoot().then(function () { return result; }) : result;
    }
    return result;
  });
}
</script>
