<script>
/** Làm mới đúng các mã do trạng thái bẩn trả về; không tự đọc sheet hay đổi Store ngoài hai cửa của Store. */
function refreshLocalDraftIds() {
  var out = [];
  var stack = typeof ScreenState !== 'undefined' && Array.isArray(ScreenState.formStack) ? ScreenState.formStack : [];
  stack.forEach(function (form) {
    if (!form || !form.draft || !Object.keys(form.draft).length) { return; }
    var id = String(form.record && form.record.id || '').trim();
    if (id && out.indexOf(id) < 0) { out.push(id); }
  });
  return out;
}

function refreshRecordsApply(result, requestedIds) {
  if (!result || !result.ok) { return { ok: false, applied: false }; }
  var ids = (requestedIds || []).map(function (id) { return String(id || ''); });
  var affectedCustomerIds = result.affectedCustomerIds || ids;
  var customers = ingestUnpack(result.customer.fields, result.customer.rows);
  var activities = ingestUnpack(result.activity.fields, result.activity.rows);
  var customerIds = {};
  customers.forEach(function (record) { customerIds[record.id] = true; Store.upsertRecord('customer', record); });
  affectedCustomerIds.forEach(function (id) { if (!customerIds[id] && Store.customers[id]) { Store.removeRecord('customer', id); } });
  var activityIds = {};
  activities.forEach(function (record) { activityIds[record.id] = true; Store.upsertRecord('activity', record); });
  affectedCustomerIds.forEach(function (id) {
    var list = Store.activitiesByCustomer[id] || [];
    list.slice().forEach(function (record) { if (!activityIds[record.id] && record.customerId === id) { Store.removeRecord('activity', record.id); } });
  });
  (result.removedRecordIds || []).forEach(function (id) {
    var key = String(id || '').trim();
    if (Store.customers[key]) { Store.removeRecord('customer', key); }
    Store.removeRecord('activity', key);
  });
  var applied = {
    ok: true,
    applied: true,
    mode: 'records',
    affectedCustomerIds: affectedCustomerIds.slice(),
    affectedRecordIds: ids.concat(result.removedRecordIds || []),
    revision: result.processedRevision
  };
  applied.render = refreshDecideAndRender(applied);
  return applied;
}

/**
 * Quyết định vẽ sau khi một payload đã được áp dụng trọn vào RAM. Hàm này chỉ
 * điều phối renderer của màn hiện tại; không gọi GAS, không reload và không
 * chọn scope nghiệp vụ.
 */
function refreshDecideAndRender(context) {
  var ctx = context || {};
  if (ctx.ok !== true || ctx.applied !== true) { return { rendered: false, reason: 'Payload chưa áp dụng thành công.' }; }

  var mode = String(ctx.mode || '');
  var screenState = typeof ScreenState !== 'undefined' ? ScreenState : null;
  var currentCustomerId = screenState ? String(screenState.currentCustomerId || '').trim() : '';
  var affectedCustomers = Array.isArray(ctx.affectedCustomerIds) ? ctx.affectedCustomerIds.map(function (id) { return String(id || '').trim(); }) : [];
  var affectedRecords = Array.isArray(ctx.affectedRecordIds) ? ctx.affectedRecordIds.map(function (id) { return String(id || '').trim(); }) : [];

  // The sync module overlays the normal view; a RAM refresh must not repaint
  // that underlying surface while the module owns the shell.
  if (typeof FBM_SYNC_CLIENT !== 'undefined' && FBM_SYNC_CLIENT.active) {
    if (FBM_SYNC_CLIENT.lastStatus && typeof fbmSyncPaint === 'function') { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus); }
    return { rendered: false, screen: 'sync', reason: 'Module Đồng bộ đang giữ shell.' };
  }

  // Reload records của khách khác không cần làm nhấp nháy màn đang xem. Các
  // scope cấu hình/full core và reload trọn thực thể thì luôn ảnh hưởng màn.
  if (mode === 'records') {
    var top = typeof screenStateTop === 'function' ? screenStateTop() : null;
    var formRecordId = top && top.record ? String(top.record.id || '').trim() : '';
    var related = (currentCustomerId && affectedCustomers.indexOf(currentCustomerId) >= 0)
      || (formRecordId && affectedRecords.indexOf(formRecordId) >= 0);
    if (!related) { return { rendered: false, reason: 'Payload không ảnh hưởng bản ghi đang hiển thị.' }; }
  }

  if (screenState && screenState.screen === SCREEN_VIEW && typeof screenViewRender === 'function') {
    if (typeof screenViewDropStale === 'function') { screenViewDropStale(); }
    return { rendered: true, screen: SCREEN_VIEW, output: screenViewRender() };
  }

  if (typeof screenFormRender === 'function' && typeof screenStateTop === 'function' && screenStateTop()) {
    return { rendered: true, screen: screenState ? screenState.screen : 'form', output: screenFormRender() };
  }

  return { rendered: false, reason: 'Không có renderer cho màn hình hiện tại.' };
}

/** Áp dụng payload đã được GAS đọc trong chính request probe; không gọi thêm API reload. */
function refreshReloadPayload(payload) {
  if (!payload || !payload.mode) { return null; }
  if (payload.mode === 'records') {
    refreshRecordsApply({
      ok: true,
      customer: payload.customer || { fields: [], rows: [] },
      activity: payload.activity || { fields: [], rows: [] },
      affectedCustomerIds: payload.affectedCustomerIds || [],
      removedRecordIds: payload.removedRecordIds || []
    }, payload.affectedCustomerIds || []);
    return payload;
  }
  if (payload.mode === 'category') {
    refreshCategoryApply({ ok: true, categories: payload.categories || {} });
    return payload;
  }
  if (payload.mode === 'config') {
    refreshConfigApply({ ok: true, config: payload.config || {} });
    return payload;
  }
  if (payload.mode === 'fullCore') {
    var core = payload.core;
    if (!core || core.ok === false || core.blocked) { return null; }
    ingestCore(core);
    if (typeof sheetLinkApplyCoreHints === 'function') { sheetLinkApplyCoreHints(core); }
    if (core.activity && Array.isArray(core.activity.rows) && core.activity.fields) {
      ingestActivityChunk(core.activity);
      ingestActivityDone();
    }
    refreshDecideAndRender({ ok: true, applied: true, mode: 'fullCore', revision: payload.processedRevision });
    return payload;
  }
  return null;
}

/** Áp dụng riêng bảng Category rồi để pipeline quyết định có vẽ màn hiện tại hay không. */
function refreshCategoryApply(result) {
  if (!result || !result.ok || !result.categories) { return { ok: false, applied: false }; }
  Store.categories = result.categories;
  var applied = { ok: true, applied: true, mode: 'category', revision: result.processedRevision };
  applied.render = refreshDecideAndRender(applied);
  return applied;
}

/** Thay toàn bộ Config trong RAM; không reset Store và không đọc lại Customer/Activity. */
function refreshConfigApply(result) {
  if (!result || !result.ok || !result.config) { return { ok: false, applied: false }; }
  Store.config = result.config;
  var applied = { ok: true, applied: true, mode: 'config', revision: result.processedRevision };
  applied.render = refreshDecideAndRender(applied);
  return applied;
}

/** Thay toàn bộ một thực thể theo payload máy chủ; mọi thay đổi Store vẫn đi qua hai cửa Store. */
function refreshEntityApply(entity, result) {
  if (!result || !result.ok) { return result; }
  var block = result[entity];
  if (!block) { return result; }
  var records = ingestUnpack(block.fields, block.rows);
  var seen = {};
  var affectedCustomerIds = [];
  records.forEach(function (record) {
    var id = String(record.id || '').trim();
    if (!id) { return; }
    seen[id] = true;
    var customerId = entity === 'customer' ? id : String(record.customerId || '').trim();
    if (customerId && affectedCustomerIds.indexOf(customerId) < 0) { affectedCustomerIds.push(customerId); }
    Store.upsertRecord(entity, record);
  });

  if (entity === 'customer') {
    Object.keys(Store.customers).forEach(function (id) {
      if (!seen[id]) { Store.removeRecord('customer', id); }
    });
  } else if (entity === 'activity') {
    Object.keys(Store.activitiesByCustomer).forEach(function (customerId) {
      (Store.activitiesByCustomer[customerId] || []).slice().forEach(function (record) {
        if (!seen[record.id]) { Store.removeRecord('activity', record.id); }
      });
    });
  }
  var applied = { ok: true, applied: true, mode: entity, affectedCustomerIds: affectedCustomerIds, affectedRecordIds: Object.keys(seen), revision: result.processedRevision };
  applied.render = refreshDecideAndRender(applied);
  result.render = applied.render;
  return result;
}

function refreshManualSheetApply(result) {
  if (!result || result.ok === false) { return result; }
  var target = result.target || result.reloadMode;
  if (result.reloadMode === 'fullCore') { return refreshFullCore(result); }
  if (target === 'config' || result.reloadMode === 'config') { return refreshConfigApply(result); }
  if (target === 'category') { refreshCategoryApply(result); return result; }
  if (target === 'customer' || target === 'activity') { return refreshEntityApply(target, result); }
  return result;
}

function refreshFullCore(result) {
  if (typeof sidebarBoot !== 'function') { return result; }
  return sidebarBoot({ preserveView: true }).then(function (bootResult) {
    if (!bootResult || bootResult.ok !== true) {
      return { ok: false, reloadFailed: true, reload: result, boot: bootResult || null };
    }
    return result;
  });
}

function refreshDirtyRecords(ids, expectedRevision, retryDepth) {
  return callServer('reloadRecords', [ids, expectedRevision]).then(function (result) {
    if (result && result.reloadMode === 'fullCore') {
      return refreshFullCore(result);
    }
    refreshRecordsApply(result, ids);
    // The server keeps a newer signal when the revision changed during the read.
    // Follow that signal immediately a bounded number of times so a concurrent
    // write is not stranded, without introducing a periodic ReloadState poll.
    var state = typeof sheetLinkReloadState === 'function' ? sheetLinkReloadState(result) : null;
    var nextIds = state && Array.isArray(state.records) ? state.records : [];
    var depth = Number(retryDepth) || 0;
    if (result && result.revisionMatched === false && nextIds.length && depth < 2) {
      return refreshDirtyRecords(nextIds, state.revision, depth + 1);
    }
    return result;
  });
}

function refreshCategory(expectedRevision) {
  return callServer('reloadCategory', [expectedRevision]).then(function (result) {
    if (result && result.reloadMode === 'fullCore') {
      return refreshFullCore(result);
    }
    refreshCategoryApply(result);
    return result;
  });
}

function refreshConfig(expectedRevision) {
  return callServer('reloadConfig', [expectedRevision]).then(function (result) {
    if (result && result.reloadMode === 'fullCore') {
      return refreshFullCore(result);
    }
    refreshConfigApply(result);
    return result;
  });
}
</script>
