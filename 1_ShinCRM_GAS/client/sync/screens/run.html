<script>
function fbmSyncPipelineFallback(status) {
  var phase = String(status && status.phase || ''), mode = String(status && status.mode || FBM_SYNC_CLIENT.mode || 'read');
  var steps = mode === 'push'
    ? [{ id: 'session', label: 'Kiểm tra phiên FBM' }, { id: 'category', label: 'Category' }, { id: 'record', label: 'Kiểm tra bản ghi' }, { id: 'form', label: 'Mở form FBM' }, { id: 'write', label: 'Ghi FBM' }, { id: 'verify', label: 'Đọc xác nhận' }, { id: 'baseline', label: 'Cập nhật baseline' }]
    : [{ id: 'session', label: 'Kiểm tra phiên FBM' }, { id: 'category', label: 'Category' }, { id: 'customer', label: 'Đọc Customer' }, { id: 'activity', label: 'Đọc Activity' }, { id: 'reconcile', label: 'Đối soát' }];
  if (mode !== 'check' && mode !== 'push') { steps.push({ id: 'sheet', label: 'Cập nhật Sheet' }); }
  var current = phase === 'pull_activity' ? 'activity' : phase === 'pull_customer' ? 'customer' : phase === 'reconcile' ? 'reconcile' : phase === 'push' ? 'write' : 'session', currentIndex = steps.map(function (step) { return step.id; }).indexOf(current);
  return { title: phase === 'done' ? 'Pipeline đã hoàn tất' : phase === 'error' ? 'Pipeline dừng vì lỗi' : phase === 'paused' ? 'Pipeline đã tạm dừng' : 'Pipeline đang chạy', steps: steps.map(function (step, index) { return { id: step.id, label: step.label, state: phase === 'done' ? 'done' : index < currentIndex ? 'done' : index === currentIndex ? (phase === 'error' ? 'error' : 'current') : 'pending' }; }) };
}
function fbmSyncPipelineData(status) {
  var pipeline = status && status.pipeline;
  return pipeline && Array.isArray(pipeline.steps) ? pipeline : fbmSyncPipelineFallback(status);
}
function fbmSyncPaintPipelineStep(step, item) {
  var state = String(item && item.state || 'pending'), marker = state === 'done' ? '✓' : state === 'error' ? '!' : state === 'current' || state === 'paused' ? '●' : '○';
  step.className = 'shin-sync-pipeline-step';
  if (state === 'done') { step.classList.add('is-done'); }
  if (state === 'current' || state === 'paused') { step.classList.add('is-current'); }
  if (state === 'error') { step.classList.add('is-error'); }
  var markerNode = step.querySelector('.shin-sync-pipeline-marker'), labelNode = step.querySelector('.shin-sync-pipeline-label');
  if (markerNode) { markerNode.textContent = marker; }
  if (labelNode) { labelNode.textContent = String(item && item.label || ''); }
}
function fbmSyncRenderPipeline(panel, status) {
  var pipeline = fbmSyncPipelineData(status);
  var box = fbmSyncAppendBox(panel, 'shin-sync-pipeline');
  box.setAttribute('data-fbm-sync-pipeline-kind', String(pipeline.kind || ''));
  fbmSyncAppendText(box, String(pipeline.title || 'Pipeline đang chạy'), 'shin-sync-pipeline-title');
  (pipeline.steps || []).forEach(function (item) {
    var step = fbmSyncAppendBox(box, 'shin-sync-pipeline-step');
    step.setAttribute('data-fbm-sync-pipeline-step', String(item.id || ''));
    fbmSyncAppendText(step, '', 'shin-sync-pipeline-marker');
    fbmSyncAppendText(step, '', 'shin-sync-pipeline-label');
    fbmSyncPaintPipelineStep(step, item);
  });
}
function fbmSyncPatchLivePipeline(panel, status) {
  var pipeline = fbmSyncPipelineData(status), box = panel && panel.querySelector('.shin-sync-pipeline');
  if (!box || !pipeline || !Array.isArray(pipeline.steps)) { return false; }
  var steps = box.querySelectorAll('[data-fbm-sync-pipeline-step]');
  if (steps.length !== pipeline.steps.length || String(box.getAttribute('data-fbm-sync-pipeline-kind') || '') !== String(pipeline.kind || '')) { return false; }
  var title = box.querySelector('.shin-sync-pipeline-title');
  if (title) { title.textContent = String(pipeline.title || 'Pipeline đang chạy'); }
  for (var index = 0; index < pipeline.steps.length; index += 1) {
    if (String(steps[index].getAttribute('data-fbm-sync-pipeline-step') || '') !== String(pipeline.steps[index].id || '')) { return false; }
    fbmSyncPaintPipelineStep(steps[index], pipeline.steps[index]);
  }
  return true;
}
function fbmSyncRenderRun(panel, status) {
  status = status || {};
  var section = fbmSyncAppendBox(panel, 'shin-sync-section');
  var card = fbmSyncAppendCard(section, 'Chọn loại đồng bộ'); var body = card.querySelector('.shin-card-body');
  var label = fbmSyncAppendBox(body, 'shin-sync-form-field'); fbmSyncAppendText(label, 'Loại đồng bộ', 'shin-sync-form-label');
  var mode = fbmSyncAppendSelect(label, 'fbm-sync-mode', FBM_SYNC_UI_SCHEMA.modes, FBM_SYNC_CLIENT.mode); mode.disabled = !!FBM_SYNC_CLIENT.running;
  var active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(status.phase) >= 0, awaiting = status.phase === 'awaiting_approval';
  var action = fbmSyncAppendButton(body, active ? 'fbm-sync-cancel' : awaiting ? 'fbm-sync-approve' : 'fbm-sync-start', active ? 'Dừng đồng bộ' : awaiting ? 'Chấp thuận và chạy' : 'Bắt đầu đồng bộ', true); action.disabled = status.masterEnabled === false;
  if (awaiting) { fbmSyncAppendText(body, 'Phiên có nhiều thay đổi; hãy xem kết quả rồi chấp thuận để tiếp tục.', 'shin-sync-muted'); }
  // Giữ pipeline cả khi preflight dừng để người dùng thấy chặng đã lỗi, thay vì
  // nút chạy xong làm thân màn hình trống không có lời giải thích.
  var hasRunSnapshot = active || awaiting || status.phase === 'done' ||
    ((status.phase === 'error' || status.phase === 'paused') && (status.runId || status.lastError || status.message || status.metadata && status.metadata.traceTail));
  if (hasRunSnapshot) {
    fbmSyncRenderPipeline(section, status);
    fbmSyncPaintStatusBlocks(section, status, status.counts || {});
  }
  panel.appendChild(section);
}
</script>
