<script>
function fbmSyncPipelineBlock(status, id) {
  var pipeline = status.pipeline;
  var classes = FBM_SYNC_RUN_UI.classes;
  return FBM_SYNC_RUN_UI.layout.pipeline(id, String(pipeline.title), (pipeline.steps || []).map(function (item) {
    var state = String(item && item.state || 'pending'), marker = FBM_SYNC_RUN_SCHEMA.pipeline.marker[state === 'paused' ? 'current' : state] || FBM_SYNC_RUN_SCHEMA.pipeline.marker.pending;
    return FBM_SYNC_RUN_UI.layout.pipelineStep(uiClassJoin(classes.pipelineStep, state === 'done' ? classes.stateDone : '', state === 'current' || state === 'paused' ? classes.stateCurrent : '', state === 'error' ? classes.stateError : ''), marker, String(item && item.label || ''));
  }));
}
/** Nút chạy theo `actions.run` GAS dựng: Bắt đầu, Dừng (lượt tay đang chạy), Đang dừng (cờ dừng đã ghi). Lượt nền đang chạy vẫn là nút Bắt đầu: bấm vào thì GAS trả mã để Sidebar hỏi dừng nền hay để chạy, không có đường hủy nền mà không hỏi. */
function fbmSyncRunActionBlock(status) {
  status = status || {};
  var schema = FBM_SYNC_RUN_SCHEMA.action, actions = status.actions || {}, run = String(actions.run || 'start'), statusReady = fbmSyncStatusReady();
  var pending = !!FBM_SYNC_CLIENT.commandPending;
  return Button({ id: run === 'start' ? schema.ids.start : schema.ids.cancel, label: !statusReady ? schema.loading : pending ? schema.sending : schema.labels[run], className: uiResolveActionClass(run === 'start' ? 'start' : 'cancel', 'button'), disabled: !statusReady || pending || actions.runDisabled === true });
}
function fbmSyncRunBackgroundSettingsBlock(status) {
  var schema = FBM_SYNC_RUN_SCHEMA.action;
  return FBM_SYNC_RUN_UI.layout.actionRow(Button({ id: schema.backgroundSettingsId, label: schema.backgroundSettings, className: uiResolveActionClass('edit', 'button'), disabled: fbmSyncBusy(status) || fbmSyncConfigIsEditing('connection'), data: { 'sync-screen': 'settings', 'sync-settings-target': 'background' } }));
}
/** Lối thoát khi GAS báo kho state hỏng (FBM-044): hiện lý do, lời giải thích và nút đặt lại; GAS quyết có mở hay không qua `actions.reset`. */
function fbmSyncRunResetBlocks(status) {
  if (!status || !status.actions || status.actions.reset !== true) { return []; }
  var schema = FBM_SYNC_RUN_SCHEMA.reset;
  return [Text({ text: String(status.message || status.lastError || '') }), Text({ className: FBM_SYNC_RUN_UI.classes.muted, text: schema.explain }), FBM_SYNC_RUN_UI.layout.actionRow(Button({ id: schema.id, label: schema.label, className: uiResolveActionClass('cancel', 'button') }))];
}
/** Nút hủy phiên cũ chỉ hiện khi GAS mở qua `actions.forceLogin` (FBM vừa từ chối đăng nhập, không có lượt đang chạy). */
function fbmSyncRunForceLoginBlocks(status) {
  if (!status || !status.actions || status.actions.forceLogin !== true) { return []; }
  var schema = FBM_SYNC_RUN_SCHEMA.forceLogin;
  return [FBM_SYNC_RUN_UI.layout.actionRow(Button({ id: schema.id, label: schema.label, className: uiResolveActionClass('cancel', 'button') }))];
}
/** Mức quét chỉ hiện với chiều có đọc FBM; dòng mô tả theo lựa chọn để người dùng biết gói đó bắt được gì và bỏ sót gì. */
function fbmSyncRunPackBlocks(status) {
  var schema = FBM_SYNC_RUN_SCHEMA.pack;
  if (schema.modes.indexOf(String(FBM_SYNC_CLIENT.mode || '')) < 0) { return []; }
  var chosen = schema.options.filter(function (option) { return option.value === FBM_SYNC_CLIENT.pack; })[0] || schema.options[0];
  return [
    StandaloneField(schema.label, { id: schema.id, kind: schema.kind, options: schema.options.map(function (option) { return { value: option.value, label: option.label }; }), value: chosen.value, disabled: fbmSyncBusy(status), ariaLabel: schema.label }),
    Text({ className: FBM_SYNC_RUN_UI.classes.muted, text: chosen.hint })
  ];
}
/** Gói gửi kèm lệnh chạy; chiều không có mức quét gửi rỗng để GAS dùng gói mặc định. */
function fbmSyncRunPack(mode) {
  return FBM_SYNC_RUN_SCHEMA.pack.modes.indexOf(String(mode || '')) >= 0 ? String(FBM_SYNC_CLIENT.pack || FBM_SYNC_RUN_SCHEMA.pack.defaultValue) : '';
}
function fbmSyncRunModeBlock(status) {
  return StandaloneField(FBM_SYNC_RUN_SCHEMA.mode.label, { id: FBM_SYNC_RUN_SCHEMA.mode.id, kind: FBM_SYNC_RUN_SCHEMA.mode.kind, options: FBM_SYNC_UI_SCHEMA.modes, value: FBM_SYNC_CLIENT.mode, disabled: fbmSyncBusy(status), ariaLabel: FBM_SYNC_RUN_SCHEMA.mode.label });
}
/** Đổi ô chọn thì vẽ lại theo status Sidebar đang hiện; cập nhật từ GAS thì truyền status mới. */
function fbmSyncPatchRunPack(status) {
  if (!RENDER_INDEX.nodes[FBM_SYNC_RUN_SCHEMA.regions.pack]) { return false; }
  status = status || FBM_SYNC_CLIENT.lastStatus;
  fbmSyncRenderTarget(FBM_SYNC_RUN_SCHEMA.regions.pack, fbmSyncRunPackBlocks(status));
  return true;
}
/** Băng cảnh báo phạm vi giới hạn (`scopeNotice` GAS dựng cả chữ), để người dùng luôn thấy lượt chạy chỉ chạy cho những khách nào. */
function fbmSyncRunScopeBlocks(status) {
  var notice = status && status.scopeNotice;
  return notice ? [Notice({ kind: notice.level, text: notice.text })] : [];
}
/** Lời báo máy chạy nền GAS trả (chưa giao máy, máy giao im quá ngưỡng, máy vừa tự nhận) kèm nút mở thẳng khối máy nền ở Cài đặt phiên. */
function fbmSyncRunMachineBlocks(status) {
  var notice = status && status.backgroundMachine && status.backgroundMachine.notice, schema = FBM_SYNC_RUN_SCHEMA.machine;
  if (!notice) { return []; }
  return [Notice({ kind: notice.level, text: notice.text }), FBM_SYNC_RUN_UI.layout.actionRow(Button({ id: schema.settingsId, label: schema.settings, className: uiResolveActionClass('edit', 'button'), data: { 'sync-screen': 'settings', 'sync-settings-target': 'machine' } }))];
}
/** Tập bản ghi chờ chấp thuận theo cổng chặng đẩy GAS (`status.pendingApproval`); nút Chấp thuận mang dấu tập đang hiện, GAS chỉ nhận khi dấu còn khớp. */
function fbmSyncRunApprovalBlocks(status) {
  var pending = status && status.pendingApproval, schema = FBM_SYNC_RUN_SCHEMA.approval;
  if (!pending) { return []; }
  return [Notice({ kind: 'warning', text: schema.text(pending.count) }), FBM_SYNC_RUN_UI.layout.actionRow(Button({ id: schema.id, label: schema.label, className: uiResolveActionClass('approve', 'button'), data: { fingerprint: pending.fingerprint }, disabled: !(status.actions && status.actions.approve === true) }))];
}
function fbmSyncRunDetailsBlocks(status) {
  var reset = fbmSyncRunScopeBlocks(status).concat(fbmSyncRunMachineBlocks(status), fbmSyncRunApprovalBlocks(status), fbmSyncRunResetBlocks(status), fbmSyncRunForceLoginBlocks(status));
  if (!fbmSyncRunHasSnapshot(status)) { return reset; }
  return reset.concat([fbmSyncPipelineBlock(status, FBM_SYNC_RUN_SCHEMA.regions.pipeline), FBM_SYNC_RUN_UI.layout.liveStatus(FBM_SYNC_RUN_SCHEMA.regions.liveStatus, fbmSyncStatusBlocks(status, status.counts || {}))]);
}
function fbmSyncRenderRun(panel, status) {
  status = status || {};
  return fbmSyncAppendBox(panel, FBM_SYNC_RUN_UI.rootClass, FBM_SYNC_RUN_SCHEMA.rootId, FBM_SYNC_RUN_UI.layout.screen({
    mode: fbmSyncRunModeBlock(status),
    pack: fbmSyncRunPackBlocks(status),
    action: FBM_SYNC_RUN_UI.layout.actionRow(fbmSyncRunActionBlock(status)),
    settings: fbmSyncRunBackgroundSettingsBlock(status),
    details: fbmSyncRunDetailsBlocks(status)
  }).elements);
}
function fbmSyncPatchRun(panel, status) {
  if (!panel || !RENDER_INDEX.nodes[FBM_SYNC_RUN_SCHEMA.rootId]) { return false; }
  fbmSyncRenderTarget(FBM_SYNC_RUN_SCHEMA.regions.action, [FBM_SYNC_RUN_UI.layout.actionStack([FBM_SYNC_RUN_UI.layout.actionRow(fbmSyncRunActionBlock(status)), fbmSyncRunBackgroundSettingsBlock(status)])]);
  fbmSyncRenderTarget(FBM_SYNC_RUN_SCHEMA.regions.details, fbmSyncRunDetailsBlocks(status));
  // Ô Loại đồng bộ không dựng lại để giữ node và focus khi người dùng đang chọn; chỉ đổi trạng thái khóa.
  fbmSyncSetTargetState(FBM_SYNC_RUN_SCHEMA.mode.id, { disabled: fbmSyncBusy(status) });
  fbmSyncPatchRunPack(status);
  return true;
}
/** Khối pipeline và trạng thái lượt hiện theo `pipeline.visible` của GAS; khung dựng trước khi có status GAS không có pipeline. */
function fbmSyncRunHasSnapshot(status) {
  return !!(status && status.pipeline && status.pipeline.visible === true);
}
</script>
