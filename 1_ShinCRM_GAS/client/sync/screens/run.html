<script>
function fbmSyncPipelineFallback(status) {
  var phase = String(status && status.phase || ''), mode = String(status && status.mode || FBM_SYNC_CLIENT.mode || 'read');
  var steps = mode === 'push'
    ? [{ id: 'session', label: 'Kiểm tra phiên FBM' }, { id: 'category', label: 'Category' }, { id: 'record', label: 'Kiểm tra bản ghi' }, { id: 'form', label: 'Mở form FBM' }, { id: 'write', label: 'Ghi FBM' }, { id: 'verify', label: 'Đọc xác nhận' }, { id: 'baseline', label: 'Cập nhật baseline' }]
    : [{ id: 'session', label: 'Kiểm tra phiên FBM' }, { id: 'category', label: 'Category' }, { id: 'customer', label: 'Đọc Customer' }, { id: 'activity', label: 'Đọc Activity' }, { id: 'reconcile', label: 'Đối soát' }];
  if (mode !== 'check' && mode !== 'push') { steps.push({ id: 'sheet', label: 'Cập nhật Sheet' }); }
  var current = phase === 'pull_activity' ? 'activity' : phase === 'pull_customer' ? 'customer' : phase === 'reconcile' ? 'reconcile' : phase === 'push' ? 'write' : 'session', currentIndex = steps.map(function (step) { return step.id; }).indexOf(current);
  return { title: phase === 'done' ? 'Pipeline đã hoàn tất' : phase === 'error' ? 'Pipeline dừng vì lỗi' : phase === 'paused' ? 'Pipeline đã tạm dừng' : 'Pipeline đang chạy', steps: steps.map(function (step, index) { return { id: step.id, label: step.label, state: phase === 'done' ? 'done' : index < currentIndex ? 'done' : index === currentIndex ? (phase === 'error' ? 'error' : 'current') : 'pending' }; }) };
}
function fbmSyncPipelineData(status) {
  var pipeline = status && status.pipeline;
  return pipeline && Array.isArray(pipeline.steps) ? pipeline : fbmSyncPipelineFallback(status);
}
function fbmSyncPipelineBlock(status, id) {
  var pipeline = fbmSyncPipelineData(status);
  return Box({ id: id || null, className: 'shin-sync-pipeline', elements: [Text({ className: 'shin-sync-pipeline-title', text: String(pipeline.title || 'Pipeline đang chạy') })].concat((pipeline.steps || []).map(function (item) {
    var state = String(item && item.state || 'pending'), marker = state === 'done' ? '✓' : state === 'error' ? '!' : state === 'current' || state === 'paused' ? '●' : '○';
    return Box({ className: 'shin-sync-pipeline-step' + (state === 'done' ? ' is-done' : '') + (state === 'current' || state === 'paused' ? ' is-current' : '') + (state === 'error' ? ' is-error' : ''), elements: [Text({ className: 'shin-sync-pipeline-marker', text: marker }), Text({ className: 'shin-sync-pipeline-label', text: String(item && item.label || '') })] });
  })) });
}
function fbmSyncRunActionBlock(status) {
  status = status || {};
  var active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(status.phase) >= 0, awaiting = status.phase === 'awaiting_approval';
  return Button({ id: active ? 'fbm-sync-cancel' : awaiting ? 'fbm-sync-approve' : 'fbm-sync-start', label: active ? 'Dừng đồng bộ' : awaiting ? 'Chấp thuận và chạy' : 'Bắt đầu đồng bộ', className: 'shin-primary', disabled: status.masterEnabled === false || status.enabled === false });
}
function fbmSyncRunDetailsBlocks(status) {
  if (!fbmSyncRunHasSnapshot(status)) { return []; }
  var awaiting = status.phase === 'awaiting_approval';
  return (awaiting ? [Text({ className: 'shin-muted', text: 'Phiên có nhiều thay đổi; hãy xem kết quả rồi chấp thuận để tiếp tục.' })] : []).concat([fbmSyncPipelineBlock(status, 'fbm-sync-pipeline-region'), Box({ id: 'fbm-sync-live-status-region', elements: fbmSyncStatusBlocks(status, status.counts || {}) })]);
}
function fbmSyncPatchLivePipeline(panel, status) {
  if (!panel || !RENDER_INDEX.nodes['fbm-sync-pipeline-region']) { return false; }
  var next = fbmSyncPipelineBlock(status);
  fbmSyncRenderTarget('fbm-sync-pipeline-region', next.elements);
  return true;
}
function fbmSyncRenderRun(panel, status) {
  status = status || {};
  return fbmSyncAppendBox(panel, 'shin-section', 'fbm-sync-run-root', [
    Card({ title: 'Chọn loại đồng bộ', elements: [
      StandaloneField('Loại đồng bộ', { id: 'fbm-sync-mode', kind: 'select', options: FBM_SYNC_UI_SCHEMA.modes, value: FBM_SYNC_CLIENT.mode, disabled: !!FBM_SYNC_CLIENT.running, ariaLabel: 'Loại đồng bộ' }),
      Box({ id: 'fbm-sync-run-action-region', elements: [fbmSyncRunActionBlock(status)] })
    ] }),
    Box({ id: 'fbm-sync-run-details-region', elements: fbmSyncRunDetailsBlocks(status) })
  ]);
}
function fbmSyncPatchRun(panel, status) {
  if (!panel || !RENDER_INDEX.nodes['fbm-sync-run-root']) { return false; }
  fbmSyncRenderTarget('fbm-sync-run-action-region', [fbmSyncRunActionBlock(status)]);
  fbmSyncRenderTarget('fbm-sync-run-details-region', fbmSyncRunDetailsBlocks(status));
  return true;
}
function fbmSyncRunHasSnapshot(status) {
  status = status || {};
  var active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(status.phase) >= 0, awaiting = status.phase === 'awaiting_approval';
  var explicitPipeline = status.pipeline && Array.isArray(status.pipeline.steps);
  return active || awaiting || !!explicitPipeline || ((status.phase === 'done' || status.phase === 'error' || status.phase === 'paused') && !!status.runId);
}
</script>
