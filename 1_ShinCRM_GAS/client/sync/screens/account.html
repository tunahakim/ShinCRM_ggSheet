<script>
function fbmSyncLoginConfiguredBlocks() {
  return [];
}
function fbmSyncLoginActionBlocks() {
  var active = !!FBM_SYNC_CLIENT.running, editing = fbmSyncConfigIsEditing('login');
  if (!editing) { return [fbmSyncConfigButtonRow('login', { edit: FBM_SYNC_ACCOUNT_SCHEMA.login.edit, save: FBM_SYNC_ACCOUNT_SCHEMA.login.save }, { primary: false })]; }
  return [FBM_SYNC_ACCOUNT_UI.layout.actionRow([Button({ id: FBM_SYNC_ACCOUNT_SCHEMA.login.actionIds.test, label: FBM_SYNC_ACCOUNT_SCHEMA.login.test, className: uiResolveActionClass('save', 'button'), disabled: active }), Button({ id: FBM_SYNC_ACCOUNT_SCHEMA.login.actionIds.save, label: FBM_SYNC_ACCOUNT_SCHEMA.login.save, className: uiResolveActionClass('save', 'button'), disabled: active, data: { 'sync-config-action': 'save', 'sync-config-key': 'login' } })])];
}
function fbmSyncLoginPolicyNavigationBlocks() {
  return [FBM_SYNC_ACCOUNT_UI.layout.singleAction(Button({ id: FBM_SYNC_ACCOUNT_SCHEMA.login.actionIds.policy, label: FBM_SYNC_ACCOUNT_SCHEMA.login.policy, className: uiResolveActionClass('edit', 'button'), disabled: !!FBM_SYNC_CLIENT.running || fbmSyncConfigIsEditing('login') }))];
}
function fbmSyncAccountSettingsBlocks() {
  var settings = (FBM_SYNC_CLIENT.syncSettings || {}).account || {}, draft = fbmSyncConfigDraft('accountSettings', FBM_SYNC_CLIENT.accountSettingsDraft || {}), invalid = FBM_SYNC_CLIENT.accountSettingsInvalid || {}, active = !!FBM_SYNC_CLIENT.running, editing = fbmSyncConfigIsEditing('accountSettings'), disabled = active || !editing;
  var value = function (name) { return draft[name] !== undefined ? draft[name] : settings[name] || ''; };
  var fields = FBM_SYNC_ACCOUNT_SCHEMA.account.fields.reduce(function (blocks, field) {
    blocks = blocks.concat(FBM_SYNC_ACCOUNT_UI.layout.fieldHelp(StandaloneField(field.label, { id: field.id, kind: 'input', inputType: field.inputType, value: value(field.key), placeholder: field.placeholder, disabled: disabled, ariaLabel: field.label }, { className: invalid[field.key] ? FBM_SYNC_ACCOUNT_UI.classes.invalid : '' }), field.help));
    return blocks;
  }, []);
  return FBM_SYNC_ACCOUNT_UI.layout.accountSettings({
    fields: fields,
    notice: fbmSyncAccountNoticeBlocks('accountSettings'),
    actions: fbmSyncConfigButtonRow('accountSettings', { edit: FBM_SYNC_ACCOUNT_SCHEMA.account.edit, save: FBM_SYNC_ACCOUNT_SCHEMA.account.save }, { id: FBM_SYNC_ACCOUNT_SCHEMA.account.saveId, disabled: active })
  });
}
function fbmSyncAccountSettingsCard() {
  return FBM_SYNC_ACCOUNT_UI.layout.accountCard(fbmSyncAccountSettingsBlocks(), fbmSyncConfigTitleActions('accountSettings'));
}
function fbmSyncLoginCard() {

  return FBM_SYNC_ACCOUNT_UI.layout.loginCard({
    titleActions: fbmSyncConfigTitleActions('login'), configured: fbmSyncLoginConfiguredBlocks(),

    actions: fbmSyncLoginActionBlocks(), notice: fbmSyncAccountNoticeBlocks('login'), policy: fbmSyncLoginPolicyNavigationBlocks()
  });

function fbmSyncRenderAccount(panel, status) {

}
function fbmSyncPatchAccount(panel, status) {

  var identityEditState = fbmSyncConfigState('identity');

  else { fbmSyncPatchIdentityBlock(panel, !!FBM_SYNC_CLIENT.running, status); }
  var accountSettingsRegion = document.getElementById(FBM_SYNC_ACCOUNT_SCHEMA.regions.accountSettings);
  var accountSettingsEditState = fbmSyncConfigState('accountSettings');
  if (!fbmSyncInteractiveControlIsEditing(accountSettingsRegion) && (!accountSettingsEditState.editing || accountSettingsEditState.needsRender)) { fbmSyncRenderTarget(FBM_SYNC_ACCOUNT_SCHEMA.regions.accountSettings, [fbmSyncAccountSettingsCard()]); accountSettingsEditState.needsRender = false; }

  var loginCard = document.getElementById(FBM_SYNC_ACCOUNT_SCHEMA.regions.loginCard);
  var loginPassword = document.getElementById(FBM_SYNC_ACCOUNT_SCHEMA.login.password.id), preserveLoginDraft = !!(loginPassword && loginPassword.value && loginPassword.value !== '****');
  var loginEditState = fbmSyncConfigState('login');
  if (!fbmSyncInteractiveControlIsEditing(loginCard) && !preserveLoginDraft && (!loginEditState.editing || loginEditState.needsRender)) { fbmSyncRenderTarget(FBM_SYNC_ACCOUNT_SCHEMA.regions.loginCard, [fbmSyncLoginCard()]); loginEditState.needsRender = false; }
  else {
    fbmSyncRenderTarget(FBM_SYNC_ACCOUNT_SCHEMA.regions.loginConfigured, fbmSyncLoginConfiguredBlocks());
    fbmSyncSetTargetState(FBM_SYNC_ACCOUNT_SCHEMA.login.username.id, { value: editing ? FBM_SYNC_CLIENT.loginDraft.username : fbmSyncLoginUsernameValue(login), disabled: !editing });
    fbmSyncSetTargetState(FBM_SYNC_ACCOUNT_SCHEMA.login.password.id, { value: configured && !editing ? FBM_SYNC_ACCOUNT_SCHEMA.login.password.maskedValue : undefined, disabled: !editing });
    fbmSyncRenderTarget(FBM_SYNC_ACCOUNT_SCHEMA.regions.loginActions, fbmSyncLoginActionBlocks());

  return true;
}
</script>
