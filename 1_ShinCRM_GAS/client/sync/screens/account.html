<script>
function fbmSyncRenderAccount(panel, status) {
  status = status || {};
  var section = fbmSyncAppendBox(panel, 'shin-sync-section');
  fbmSyncAppendText(section, 'Xác nhận đúng file ShinCRM và tài khoản FBM trước khi chạy phiên.', 'shin-sync-muted');
  if (status.message) { fbmSyncAppendText(section, String(status.message), status.phase === 'error' ? 'shin-sync-error-message' : 'shin-sync-message'); }
  fbmSyncPaintIdentityBlock(section, !!FBM_SYNC_CLIENT.running, status);

  var login = FBM_SYNC_CLIENT.loginStatus || status.login || {};
  var card = fbmSyncAppendCard(section, 'Đăng nhập tự động');
  var body = card.querySelector('.shin-card-body');
  fbmSyncAppendText(body, login.configured ? 'Đã lưu thông tin đăng nhập được mã hóa.' : 'Chưa thiết lập thông tin đăng nhập.', 'shin-sync-preview-row');

  fbmSyncAppendText(body, 'Chính sách tự đăng nhập, tự mở tab và thử lại được chỉnh trong Cài đặt phiên.', 'shin-sync-muted');

  var userField = fbmSyncAppendBox(body, 'shin-sync-form-field');
  fbmSyncAppendText(userField, 'Username FBM', 'shin-sync-form-label');
  fbmSyncAppendInput(userField, 'fbm-login-username', 'text', FBM_SYNC_CLIENT.loginDraft.username, 'Nhập username FBM');
  var passwordField = fbmSyncAppendBox(body, 'shin-sync-form-field');
  fbmSyncAppendText(passwordField, 'Mật khẩu FBM', 'shin-sync-form-label');
  // Mật khẩu chỉ sống trong DOM của lượt mở hiện tại; đăng nhập thử không được làm rơi bản nháp.
  fbmSyncAppendInput(passwordField, 'fbm-login-password', 'text', '', 'Nhập mật khẩu FBM');

  var actions = fbmSyncAppendBox(body, 'shin-sync-form-actions');
  var test = fbmSyncAppendButton(actions, 'fbm-sync-login-test', 'Đăng nhập thử', true); test.disabled = !!FBM_SYNC_CLIENT.running;
  var save = fbmSyncAppendButton(actions, 'fbm-sync-login-save', 'Lưu mã hóa', false); save.disabled = !!FBM_SYNC_CLIENT.running;
  fbmSyncRenderAccountNotice(body, 'login');
}
</script>
