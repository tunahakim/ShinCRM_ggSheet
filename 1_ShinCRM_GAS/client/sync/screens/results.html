<script>
function fbmSyncRenderResults(panel, status) {
  status = status || {};
  var section = fbmSyncAppendBox(panel, 'shin-sync-section');
  fbmSyncAppendText(section, 'Kết quả & xử lý', 'shin-sync-section-title');
  var tabs = fbmSyncAppendBox(section, 'shin-sync-tab-row');
  ['summary', 'conflict', 'errors', 'log', 'audit'].forEach(function (tab) {
    var label = tab === 'summary' ? 'Tổng hợp' : tab === 'conflict' ? 'Conflict' : tab === 'errors' ? 'Lỗi' : tab === 'log' ? 'Log' : 'Nghiệm thu phạm vi thử';
    var button = fbmSyncAppendButton(tabs, '', label, false); button.setAttribute('data-sync-results-tab', tab); if (tab === (FBM_SYNC_CLIENT.resultsTab || 'summary')) { button.classList.add('is-active'); }
  });
  var tab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  if (tab === 'conflict') { fbmSyncPaintConflictScreen(section, status); }
  else if (tab === 'audit') { fbmSyncPaintAuditBlocks(section, status); }
  else if (tab === 'errors') { fbmSyncRenderResultPage(section, status, 'errors'); }
  else if (tab === 'log') { fbmSyncRenderResultPage(section, status, 'log'); }
  else { fbmSyncPaintStatusBlocks(section, status, status.counts || {}); fbmSyncPaintRecordIssues(section, status.metadata || {}); }
}
function fbmSyncRenderResultPage(panel, status, kind) {
  var metadata = status.metadata || {}, rows = [];
  if (kind === 'errors') {
    Object.keys(metadata.pushFailureDetails || {}).forEach(function (key) { var detail = metadata.pushFailureDetails[key] || {}; rows.push(key + ' · ' + String(detail.reason || 'Lỗi đẩy')); });
    (metadata.preflightIssues || []).forEach(function (item) { rows.push('Preflight · ' + String(item.message || item.code || '')); });
    (metadata.categoryBlocks || []).forEach(function (item) { rows.push('Category · ' + String(item.reason || item.code || '')); });
  } else { rows = (metadata.traceTail || []).map(function (item) { return String(item.stage || item.action || 'Log') + ' · ' + String(item.operation || item.reason || ''); }); }
  var page = Number(FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages[kind] || 0), size = 20, totalPages = Math.max(1, Math.ceil(rows.length / size)), start = Math.min(page, totalPages - 1) * size;
  var card = fbmSyncAppendCard(panel, kind === 'errors' ? 'Lỗi phiên' : 'Log phiên'); var body = card.querySelector('.shin-card-body');
  fbmSyncAppendText(body, 'Trang ' + (Math.min(page, totalPages - 1) + 1) + '/' + totalPages + ' · tối đa 20 dòng mỗi trang.', 'shin-sync-muted');
  rows.slice(start, start + size).forEach(function (row) { fbmSyncAppendText(body, row, 'shin-sync-preview-row'); });
  var actions = fbmSyncAppendBox(body, 'shin-sync-form-actions');
  var prev = fbmSyncAppendButton(actions, '', 'Trang trước', false); prev.disabled = page <= 0; prev.setAttribute('data-sync-page', kind + ':-1');
  var next = fbmSyncAppendButton(actions, '', 'Trang sau', false); next.disabled = page >= totalPages - 1; next.setAttribute('data-sync-page', kind + ':1');
}
</script>
