<script>
function fbmSyncRenderResults(panel, status) {
  var section = fbmSyncElement('div', 'shin-sync-section'); section.appendChild(fbmSyncElement('h2', 'shin-sync-section-title', 'Kết quả & xử lý'));
  var tabs = fbmSyncElement('div', 'shin-sync-tab-row'); ['summary', 'conflict', 'errors', 'log', 'audit'].forEach(function (tab) { var b = fbmSyncElement('button', tab === (FBM_SYNC_CLIENT.resultsTab || 'summary') ? 'is-active' : '', tab === 'summary' ? 'Tổng hợp' : tab === 'conflict' ? 'Conflict' : tab === 'errors' ? 'Lỗi' : tab === 'log' ? 'Log' : 'Nghiệm thu phạm vi thử'); b.type = 'button'; b.setAttribute('data-sync-results-tab', tab); tabs.appendChild(b); }); section.appendChild(tabs);
  var tab = FBM_SYNC_CLIENT.resultsTab || 'summary'; if (tab === 'conflict') { fbmSyncPaintConflictScreen(section, status); } else if (tab === 'audit') { fbmSyncPaintAuditBlocks(section, status); } else if (tab === 'errors') { fbmSyncRenderResultPage(section, status, 'errors'); } else if (tab === 'log') { fbmSyncRenderResultPage(section, status, 'log'); } else { fbmSyncPaintStatusBlocks(section, status, status.counts || {}); fbmSyncPaintRecordIssues(section, status.metadata || {}); }
  panel.appendChild(section);
}
function fbmSyncRenderResultPage(panel, status, kind) {
  var metadata = status.metadata || {}, rows = [];
  if (kind === 'errors') { Object.keys(metadata.pushFailureDetails || {}).forEach(function (key) { var detail = metadata.pushFailureDetails[key] || {}; rows.push(key + ' · ' + String(detail.reason || 'Lỗi đẩy')); }); (metadata.preflightIssues || []).forEach(function (item) { rows.push('Preflight · ' + String(item.message || item.code || '')); }); (metadata.categoryBlocks || []).forEach(function (item) { rows.push('Category · ' + String(item.reason || item.code || '')); }); }
  else { rows = (metadata.traceTail || []).map(function (item) { return String(item.stage || item.action || 'Log') + ' · ' + String(item.operation || item.reason || ''); }); }
  var page = Number(FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages[kind] || 0), size = 20, totalPages = Math.max(1, Math.ceil(rows.length / size)), start = Math.min(page, totalPages - 1) * size, card = fbmSyncCard(kind === 'errors' ? 'Lỗi phiên' : 'Log phiên'); card.body.appendChild(fbmSyncElement('div', 'shin-sync-muted', 'Đang xem trang ' + (Math.min(page, totalPages - 1) + 1) + '/' + totalPages + ' · chỉ tải tối đa 20 dòng mỗi trang.')); rows.slice(start, start + size).forEach(function (row) { card.body.appendChild(fbmSyncElement('div', 'shin-sync-preview-row', row)); }); var actions = fbmSyncElement('div', 'shin-sync-form-actions'); var prev = fbmSyncMakeButton('', 'Trang trước', false); prev.disabled = page <= 0; prev.setAttribute('data-sync-page', kind + ':-1'); var next = fbmSyncMakeButton('', 'Trang sau', false); next.disabled = page >= totalPages - 1; next.setAttribute('data-sync-page', kind + ':1'); actions.appendChild(prev); actions.appendChild(next); card.body.appendChild(actions); panel.appendChild(card.card);
}
</script>
