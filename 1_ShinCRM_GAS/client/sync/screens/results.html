<script>
var FBM_SYNC_RESULT_TABS = [
  { id: 'summary', label: 'Tổng quan', description: 'Tóm tắt kết quả phiên' },
  { id: 'conflict', label: 'Xung đột', description: 'Các thay đổi chờ xử lý' },
  { id: 'errors', label: 'Lỗi', description: 'Bản ghi cần xem lại' },
  { id: 'log', label: 'Log', description: 'Nhật ký hoạt động' },
  { id: 'audit', label: 'Nghiệm thu', description: 'Kết quả kiểm tra dữ liệu thử nghiệm', multiline: true }
];
function fbmSyncResultsTabBlocks() {
  var activeTab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  return FBM_SYNC_RESULT_TABS.map(function (tab) {
    var active = tab.id === activeTab;
    return Button({ label: tab.label, className: 'shin-sync-tab-trigger' + (active ? ' is-active' : ''), data: { 'sync-results-tab': tab.id } });
  });
}
function fbmSyncResultsTabDescriptionBlock() {
  var activeTab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  var tab = FBM_SYNC_RESULT_TABS.filter(function (item) { return item.id === activeTab; })[0] || FBM_SYNC_RESULT_TABS[0];
  return Box({ id: 'fbm-sync-results-tab-description-region', className: 'shin-sync-tab-description-region' + (tab.multiline ? ' is-multiline' : ''), elements: [Text({ className: 'shin-sync-tab-description', text: tab.description })] });
}
function fbmSyncResultsBodyBlocks(status) {
  var tab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  if (tab === 'conflict') { return fbmSyncConflictContentBlocks(status); }
  if (tab === 'audit') { return fbmSyncAuditContentBlocks(status); }
  if (tab === 'errors') { return fbmSyncResultPageBlocks(status, 'errors'); }
  if (tab === 'log') { return fbmSyncResultPageBlocks(status, 'log'); }
  return fbmSyncStatusBlocks(status, status.counts || {}).concat(fbmSyncRecordIssueBlocks(status.metadata || {}));
}
function fbmSyncRenderResults(panel, status) {
  status = status || {};
  return fbmSyncAppendBox(panel, 'shin-section', 'fbm-sync-results-root', [Box({ className: 'shin-sync-tab-row', id: 'fbm-sync-results-tabs-region', elements: fbmSyncResultsTabBlocks() }), fbmSyncResultsTabDescriptionBlock(), Stack({ id: 'fbm-sync-results-body-region', elements: fbmSyncResultsBodyBlocks(status) })]);
}
function fbmSyncResultsSignature(status) {
  var metadata = status && status.metadata || {}, tab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  if (tab === 'summary') { return tab + '|' + JSON.stringify({ phase: status && status.phase, metadata: { conflicts: metadata.conflicts, conflictCount: metadata.conflictCount, preflightIssues: metadata.preflightIssues, pushFailures: metadata.pushFailures, categoryBlocks: metadata.categoryBlocks } }); }
  if (tab === 'conflict') { return tab + '|' + JSON.stringify({ count: metadata.conflictCount, conflicts: metadata.conflicts }); }
  if (tab === 'errors') { return tab + '|' + JSON.stringify({ failures: metadata.pushFailureDetails, preflightIssues: metadata.preflightIssues, categoryBlocks: metadata.categoryBlocks, page: FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages.errors }); }
  if (tab === 'log') { return tab + '|' + JSON.stringify({ trace: metadata.traceTail, page: FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages.log }); }
  return tab + '|' + JSON.stringify({ preview: metadata.preview, audit: metadata.audit });
}
function fbmSyncResultPageBlocks(status, kind) {
  var metadata = status.metadata || {}, rows = [];
  if (kind === 'errors') {
    Object.keys(metadata.pushFailureDetails || {}).forEach(function (key) { var detail = metadata.pushFailureDetails[key] || {}; rows.push(key + ' · ' + String(detail.reason || 'Lỗi đẩy')); });
    (metadata.preflightIssues || []).forEach(function (item) { rows.push('Preflight · ' + String(item.message || item.code || '')); });
    (metadata.categoryBlocks || []).forEach(function (item) { rows.push('Category · ' + String(item.reason || item.code || '')); });
  } else { rows = (metadata.traceTail || []).map(function (item) { return String(item.stage || item.action || 'Log') + ' · ' + String(item.operation || item.reason || ''); }); }
  var page = Number(FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages[kind] || 0), size = 20, totalPages = Math.max(1, Math.ceil(rows.length / size)), current = Math.min(page, totalPages - 1);
  return [Card({ title: kind === 'errors' ? 'Lỗi phiên' : 'Log phiên', elements: [Text({ className: 'shin-muted', text: 'Trang ' + (current + 1) + '/' + totalPages + ' · tối đa 20 dòng mỗi trang.' })].concat(rows.slice(current * size, current * size + size).map(function (row) { return Text({ className: 'shin-preview-row', text: row }); }), [Row({ className: 'shin-pagination', elements: [Button({ label: 'Trang trước', disabled: page <= 0, data: { 'sync-page': kind + ':-1' } }), Button({ label: 'Trang sau', disabled: page >= totalPages - 1, data: { 'sync-page': kind + ':1' } })] })]) })];
}
function fbmSyncPatchResults(panel, status) {
  if (!panel || !RENDER_INDEX.nodes['fbm-sync-results-root']) { return false; }
  if (FBM_SYNC_CLIENT.resultsTab === 'conflict' && fbmSyncInteractiveControlIsEditing(panel)) { FBM_SYNC_CLIENT.deferredPaint = status; return true; }
  fbmSyncRenderTarget('fbm-sync-results-tabs-region', fbmSyncResultsTabBlocks());
  fbmSyncRenderTarget('fbm-sync-results-tab-description-region', fbmSyncResultsTabDescriptionBlock().elements);
  fbmSyncRenderTarget('fbm-sync-results-body-region', fbmSyncResultsBodyBlocks(status));
  return true;
}
</script>
