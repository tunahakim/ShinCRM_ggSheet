<script>
var FBM_SYNC_RESULT_TABS = FBM_SYNC_RESULTS_SCHEMA.tabs;
function fbmSyncResultsTabBlocks() {
  var activeTab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  return FBM_SYNC_RESULT_TABS.map(function (tab) {
    var active = tab.id === activeTab;
    return Button({ label: tab.label, className: FBM_SYNC_RESULTS_SCHEMA.tabClass + (active ? ' ' + FBM_SYNC_RESULTS_SCHEMA.classes.active : ''), data: { 'sync-results-tab': tab.id } });
  });
}
function fbmSyncResultsTabDescriptionBlock() {
  var activeTab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  var tab = FBM_SYNC_RESULT_TABS.filter(function (item) { return item.id === activeTab; })[0] || FBM_SYNC_RESULT_TABS[0];
  return FBM_SYNC_RESULTS_SCHEMA.layout.description(tab);
}
function fbmSyncResultsBodyBlocks(status) {
  var tab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  if (tab === 'conflict') { return fbmSyncConflictContentBlocks(status); }
  if (tab === 'audit') { return fbmSyncAuditContentBlocks(status); }
  if (tab === 'errors') { return fbmSyncResultPageBlocks(status, 'errors'); }
  if (tab === 'log') { return fbmSyncResultPageBlocks(status, 'log'); }
  return fbmSyncStatusBlocks(status, status.counts || {}).concat(fbmSyncRecordIssueBlocks(status.metadata || {}));
}
function fbmSyncRenderResults(panel, status) {
  status = status || {};
  return fbmSyncAppendBox(panel, FBM_SYNC_RESULTS_SCHEMA.rootClass, FBM_SYNC_RESULTS_SCHEMA.rootId, FBM_SYNC_RESULTS_SCHEMA.layout.screen({ tabs: fbmSyncResultsTabBlocks(), description: fbmSyncResultsTabDescriptionBlock(), body: fbmSyncResultsBodyBlocks(status) }).elements);
}
function fbmSyncResultsSignature(status) {
  var metadata = status && status.metadata || {}, tab = FBM_SYNC_CLIENT.resultsTab || 'summary';
  if (tab === 'summary') { return tab + '|' + JSON.stringify({ phase: status && status.phase, metadata: { conflicts: metadata.conflicts, conflictCount: metadata.conflictCount, preflightIssues: metadata.preflightIssues, pushFailures: metadata.pushFailures, categoryBlocks: metadata.categoryBlocks } }); }
  if (tab === 'conflict') { return tab + '|' + JSON.stringify({ count: metadata.conflictCount, conflicts: metadata.conflicts }); }
  if (tab === 'errors') { return tab + '|' + JSON.stringify({ failures: metadata.pushFailureDetails, preflightIssues: metadata.preflightIssues, categoryBlocks: metadata.categoryBlocks, page: FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages.errors }); }
  if (tab === 'log') { return tab + '|' + JSON.stringify({ trace: metadata.traceTail, page: FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages.log }); }
  return tab + '|' + JSON.stringify({ preview: metadata.preview, audit: metadata.audit });
}
function fbmSyncResultPageBlocks(status, kind) {
  var metadata = status.metadata || {}, rows = [];
  if (kind === 'errors') {
    Object.keys(metadata.pushFailureDetails || {}).forEach(function (key) { var detail = metadata.pushFailureDetails[key] || {}; rows.push(key + FBM_SYNC_RESULTS_SCHEMA.rows.separator + String(detail.reason || FBM_SYNC_RESULTS_SCHEMA.rows.failureFallback)); });
    (metadata.preflightIssues || []).forEach(function (item) { rows.push(FBM_SYNC_RESULTS_SCHEMA.rows.preflightPrefix + String(item.message || item.code || '')); });
    (metadata.categoryBlocks || []).forEach(function (item) { rows.push(FBM_SYNC_RESULTS_SCHEMA.rows.categoryPrefix + String(item.reason || item.code || '')); });
  } else { rows = (metadata.traceTail || []).map(function (item) { return String(item.stage || item.action || FBM_SYNC_RESULTS_SCHEMA.rows.logFallback) + FBM_SYNC_RESULTS_SCHEMA.rows.separator + String(item.operation || item.reason || ''); }); }
  var page = Number(FBM_SYNC_CLIENT.resultPages && FBM_SYNC_CLIENT.resultPages[kind] || 0), size = FBM_SYNC_RESULTS_SCHEMA.pageSize, totalPages = Math.max(1, Math.ceil(rows.length / size)), current = Math.min(page, totalPages - 1);
  var pageText = FBM_SYNC_RESULTS_SCHEMA.pageText.replace('{current}', current + 1).replace('{total}', totalPages).replace('{size}', size);
  return [FBM_SYNC_RESULTS_SCHEMA.layout.page({ title: FBM_SYNC_RESULTS_SCHEMA.pageTitles[kind], pageText: pageText, rows: rows.slice(current * size, current * size + size).map(function (row) { return Text({ className: FBM_SYNC_RESULTS_SCHEMA.classes.row, text: row }); }), pagination: FBM_SYNC_RESULTS_SCHEMA.layout.pagination({ kind: kind, previousDisabled: page <= 0, nextDisabled: page >= totalPages - 1 }) })];
}
function fbmSyncPatchResults(panel, status) {
  if (!panel || !RENDER_INDEX.nodes['fbm-sync-results-root']) { return false; }
  if (FBM_SYNC_CLIENT.resultsTab === 'conflict' && fbmSyncInteractiveControlIsEditing(panel)) { FBM_SYNC_CLIENT.deferredPaint = status; return true; }
  fbmSyncRenderTarget(FBM_SYNC_RESULTS_SCHEMA.regions.tabs, fbmSyncResultsTabBlocks());
  fbmSyncRenderTarget(FBM_SYNC_RESULTS_SCHEMA.regions.description, fbmSyncResultsTabDescriptionBlock().elements);
  fbmSyncRenderTarget(FBM_SYNC_RESULTS_SCHEMA.regions.body, fbmSyncResultsBodyBlocks(status));
  return true;
}
</script>
