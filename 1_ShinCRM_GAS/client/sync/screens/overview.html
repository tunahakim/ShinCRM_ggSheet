<script>
function fbmSyncOverviewBlocks(status) {
  status = status || {};
  var count = status.counts || {};
  return [
    Text({ className: 'shin-sync-muted', text: 'Theo dõi phiên, tài khoản và đồng bộ nền tại một nơi.' }),
    Card({ title: 'Trạng thái phiên', className: 'shin-sync-overview-hero', elements: [Text({ className: 'shin-sync-overview-state', text: status.label || 'Sẵn sàng' }), Text({ className: 'shin-sync-overview-direction', text: 'Hướng chạy: ' + (status.direction || 'Chưa chọn') })] }),
    Box({ className: 'shin-sync-summary-grid', elements: [['Đã xử lý', Number(count.completed || 0)], ['Thành công', Number(count.succeeded || 0)], ['Lỗi', Number(count.error || 0)], ['Xung đột', Number(count.conflict || 0)]].map(function (item) { return Box({ className: 'shin-sync-summary-item', elements: [Text({ className: 'shin-sync-summary-label', text: item[0] }), Text({ className: 'shin-sync-summary-value', text: String(item[1]) })] }); }) }),
    Card({ title: 'Kết nối phiên', elements: [Text({ className: 'shin-sync-preview-row', text: 'Customer: ' + (status.session && status.session.customer ? 'Đã sẵn sàng' : 'Chưa xác nhận') }), Text({ className: 'shin-sync-preview-row', text: 'Giao dịch: ' + (status.session && status.session.activity ? 'Đã sẵn sàng' : 'Chưa xác nhận') })] }),
    Box({ className: 'shin-sync-action-row', elements: [Button({ label: 'Tài khoản FBM', data: { 'sync-screen': 'account' } }), Button({ label: 'Chạy đồng bộ', data: { 'sync-screen': 'run' } }), Button({ label: 'Kết quả & xử lý', data: { 'sync-screen': 'results' } })] }),
    Card({ title: 'Đồng bộ nền', elements: [Text({ className: 'shin-sync-muted', text: status.backgroundEnabled === false ? 'Lịch nền đang tắt.' : 'Lịch nền được cấu hình trong Cài đặt phiên.' }), Button({ label: 'Mở Cài đặt phiên', data: { 'sync-screen': 'settings' } })] })
  ];
}

function fbmSyncRenderOverview(panel, status) { return fbmSyncAppendBox(panel, 'shin-sync-section', 'fbm-sync-overview-root', fbmSyncOverviewBlocks(status)); }
function fbmSyncPatchOverview(panel, status) {
  if (!panel || !RENDER_INDEX.nodes['fbm-sync-overview-root']) { return false; }
  fbmSyncRenderTarget('fbm-sync-overview-root', fbmSyncOverviewBlocks(status));
  return true;
}
</script>
