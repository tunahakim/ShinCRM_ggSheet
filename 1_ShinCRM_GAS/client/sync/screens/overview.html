<script>
function fbmSyncRenderOverview(panel, status) {
  status = status || {};
  var section = fbmSyncAppendBox(panel, 'shin-sync-section');
  fbmSyncAppendText(section, 'Tổng quan', 'shin-sync-section-title');
  fbmSyncAppendText(section, 'Theo dõi phiên, tài khoản và đồng bộ nền tại một nơi.', 'shin-sync-muted');

  var grid = fbmSyncAppendBox(section, 'shin-sync-summary-grid');
  var count = status.counts || {};
  [['Trạng thái', status.label || 'Sẵn sàng'], ['Hướng chạy', status.direction || 'Chưa chọn'], ['Đã xử lý', String(Number(count.completed || 0))], ['Lỗi / conflict', String(Number(count.error || 0) + Number(count.conflict || 0))]].forEach(function (item) {
    var box = fbmSyncAppendBox(grid, 'shin-sync-summary-item');
    fbmSyncAppendText(box, item[0], 'shin-sync-summary-label');
    fbmSyncAppendText(box, item[1], 'shin-sync-summary-value');
  });

  var session = fbmSyncAppendCard(section, 'Kết nối phiên');
  var sessionBody = session.querySelector('.shin-card-body');
  fbmSyncAppendText(sessionBody, 'Customer: ' + (status.session && status.session.customer ? 'Đã sẵn sàng' : 'Chưa xác nhận'), 'shin-sync-preview-row');
  fbmSyncAppendText(sessionBody, 'Giao dịch: ' + (status.session && status.session.activity ? 'Đã sẵn sàng' : 'Chưa xác nhận'), 'shin-sync-preview-row');

  var actions = fbmSyncAppendBox(section, 'shin-sync-action-row');
  [['account', 'Tài khoản FBM'], ['run', 'Chạy đồng bộ'], ['results', 'Kết quả & xử lý']].forEach(function (item) {
    var button = fbmSyncAppendButton(actions, '', item[1], false);
    button.setAttribute('data-sync-screen', item[0]);
  });

  var background = fbmSyncAppendCard(section, 'Đồng bộ nền');
  var backgroundBody = background.querySelector('.shin-card-body');
  fbmSyncAppendText(backgroundBody, 'Chỉ đọc FBM và luôn tuân theo công tắc tổng.', 'shin-sync-muted');
  var toggle = fbmSyncAppendButton(backgroundBody, '', status.backgroundEnabled === false ? 'Bật lịch đồng bộ nền' : 'Tắt lịch đồng bộ nền', false);
  toggle.setAttribute('data-sync-background', 'true'); toggle.disabled = status.masterEnabled === false;

  var relay = fbmSyncAppendCard(section, 'Kết nối Extension');
  var relayBody = relay.querySelector('.shin-card-body');
  fbmSyncAppendText(relayBody, 'Chỉ dùng để chuyển request qua tab FBM; không chứa dữ liệu tài khoản.', 'shin-sync-muted');
  var rotate = fbmSyncAppendButton(relayBody, 'fbm-sync-rotate-relay', 'Đổi cấu hình kết nối', false); rotate.disabled = !!FBM_SYNC_CLIENT.running;
}
</script>
