<style>
.shin-sync-module-title { color:var(--shin-text); }
.shin-sync-phase { margin-top:2px; color:var(--shin-primary); }
.shin-sync-operation, .shin-sync-count, .shin-sync-current, .shin-sync-message { margin-top:3px; color:var(--shin-text-soft); font-size:var(--shin-text-sm); overflow-wrap:anywhere; }
.shin-sync-progress { margin-top:var(--shin-gap-2); }
.shin-sync-progress-label { color:var(--shin-text-soft); font-size:var(--shin-text-sm); }
.shin-sync-progress-track { position:relative; height:5px; margin-top:4px; overflow:hidden; border-radius:3px; background:var(--shin-border); }
.shin-sync-progress-fill { height:100%; border-radius:inherit; background:var(--shin-primary); transition:width 180ms ease; }
.shin-sync-progress-fill.is-indeterminate { position:absolute; animation:shin-sync-progress-slide 1.1s ease-in-out infinite; }
.shin-sync-progress-fill.is-waiting { background:linear-gradient(90deg,var(--shin-primary-soft),var(--shin-primary),var(--shin-primary-soft)); background-size:200% 100%; animation:shin-sync-progress-wait 1s linear infinite; }
@keyframes shin-sync-progress-slide { 0% { left:-35%; } 100% { left:100%; } }
@keyframes shin-sync-progress-wait { 0% { background-position:0 0; } 100% { background-position:200% 0; } }
.shin-sync-summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--shin-gap-2); }
.shin-sync-summary-item { padding:var(--shin-gap-2); border:1px solid var(--shin-border-faint); border-radius:var(--shin-radius-sm); background:var(--shin-bg); }
.shin-sync-summary-value { margin-top:2px; color:var(--shin-text); font-weight:700; }
.shin-sync-pipeline { margin-top:0; padding:var(--shin-gap-2); border:1px solid var(--shin-border-faint); border-radius:var(--shin-radius-sm); background:var(--shin-bg); }
.shin-sync-pipeline-title { margin-bottom:var(--shin-gap-1); font-weight:700; color:var(--shin-text); }
.shin-sync-pipeline-step { display:flex; align-items:center; gap:var(--shin-gap-1); padding:4px 0; color:var(--shin-text-soft); font-size:var(--shin-text-sm); }
.shin-sync-pipeline-step.is-current { color:var(--shin-primary); font-weight:700; }
.shin-sync-pipeline-step.is-done { color:var(--shin-ok); }
.shin-sync-pipeline-step.is-error { color:var(--shin-error); }
.shin-sync-tab-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:0; margin-bottom:0; border-bottom:1px solid var(--shin-border-faint); }
.shin-sync-tab-trigger { width:100%; min-width:0; min-height:40px; padding:var(--shin-gap-1) 3px; border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; color:var(--shin-text-soft); text-align:center; font:600 var(--shin-text-sm)/1.15 var(--shin-font); cursor:pointer; white-space:normal; overflow-wrap:anywhere; }
.shin-sync-tab-trigger:hover { background:var(--shin-bg-hover); color:var(--shin-text); }
.shin-sync-tab-trigger .shin-btn-label { display:block; white-space:normal; overflow-wrap:anywhere; }
.shin-sync-tab-trigger.is-active { border-color:var(--shin-primary); color:var(--shin-primary-dark); font-weight:700; }
#fbm-sync-results-root > .shin-sync-tab-description-region { margin-top:0; margin-bottom:0; padding:var(--shin-gap-2) 0 var(--shin-gap-1); border-bottom:1px solid var(--shin-border-faint); }
#fbm-sync-results-root > #fbm-sync-results-body-region { margin-top:var(--shin-gap-1); }
.shin-sync-tab-description { color:var(--shin-text-soft); font-size:var(--shin-text-sm); line-height:1.2; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.shin-sync-tab-description-region.is-multiline .shin-sync-tab-description { white-space:normal; }
@media (max-width:340px) { .shin-sync-summary-grid { grid-template-columns:1fr; } }
</style>
<style>
/* Module dong bo uu tien doc doc de vua sidebar hep van de doc va bam duoc. */
.shin-sync-active .shin-card-title { color:var(--shin-text); font-size:var(--shin-text-sm); text-transform:none; letter-spacing:0; }
.shin-sync-active .shin-card { background:var(--shin-bg); }
.shin-sync-nav { position:absolute; z-index:20; top:var(--shin-header-height); left:var(--shin-scrollbar-size); right:var(--shin-scrollbar-size); display:flex; flex-direction:column; gap:0; width:auto; min-width:0; max-width:none; max-height:min(66.666vh, calc(100vh - var(--shin-header-height) - var(--shin-gap-2))); overflow-y:auto; overscroll-behavior:contain; }
.shin-sync-nav button + button { margin-top: 2px; }
.shin-sync-nav { background:var(--shin-bg); border:1px solid var(--shin-border-strong); border-radius:var(--shin-radius-sm); box-shadow:var(--shin-shadow); padding:var(--shin-gap-1); opacity:1; }
.shin-sync-nav button { width:100%; min-height:34px; border:0; border-radius:var(--shin-radius-sm); padding:var(--shin-gap-2) var(--shin-gap-3); background:transparent; color:var(--shin-text-soft); text-align:left; font:500 var(--shin-text-sm)/1.2 var(--shin-font); }
.shin-sync-nav button:hover { background:var(--shin-bg-hover); }
.shin-sync-nav button.is-active { background:var(--shin-primary-soft); color:var(--shin-primary-dark); font-weight:700; }
.shin-sync-schedule-row, .shin-sync-conflict-field { min-width:0; }
.shin-sync-schedule-row { display:grid; grid-template-columns:42px minmax(0,1fr) 20%; align-items:center; gap:var(--shin-gap-2); padding:var(--shin-gap-1) 0; }
.shin-sync-schedule-row > .shin-standalone-control { min-width:0; }
.shin-sync-schedule-row > .shin-standalone-control:last-child .shin-input { width:100%; box-sizing:border-box; }
.shin-sync-detail-controls { margin-left:44px; padding-left:var(--shin-gap-2); border-left:2px solid var(--shin-border-faint); }
.shin-sync-conflict-choice { width:100%; }
.shin-sync-summary-label { color:var(--shin-text); font-size:var(--shin-text-sm); font-weight:600; }
.shin-sync-conflict-head { display:flex; align-items:center; justify-content:space-between; gap:var(--shin-gap-2); margin-bottom:var(--shin-gap-2); }
.shin-sync-conflict-count { color:var(--shin-error); font-size:var(--shin-text-md); font-weight:700; }
.shin-sync-conflict-meta { margin-bottom:var(--shin-gap-2); color:var(--shin-text-soft); font-size:var(--shin-text-sm); }
.shin-sync-conflict-field { margin-top:var(--shin-gap-2); padding:var(--shin-gap-2); border:1px solid var(--shin-border); border-radius:var(--shin-radius-sm); background:var(--shin-bg-sunken); }
.shin-sync-conflict-field-name { color:var(--shin-text); font-size:var(--shin-text-sm); font-weight:700; }
.shin-sync-conflict-value { margin-top:3px; font-size:var(--shin-text-sm); overflow-wrap:anywhere; }
.shin-sync-conflict-value-shin { color:var(--shin-primary-dark); }
.shin-sync-conflict-value-fbm { color:var(--shin-warn); }
.shin-sync-pipeline-marker { flex:0 0 14px; }
.shin-sync-pipeline-label { min-width:0; }
</style>
<script>
function fbmSyncStatusReady() { return FBM_SYNC_CLIENT.statusReady === true; }
function fbmSyncShellEnabled(status) { return !(status && (status.masterEnabled === false || status.enabled === false)); }
function fbmSyncShellTitle() {
  var item = (FBM_SYNC_UI_SCHEMA.screens || []).filter(function (screen) { return screen.id === FBM_SYNC_CLIENT.subscreen; })[0];
  return item ? item.label : 'Đồng bộ FBM';
}
function fbmSyncShellHeaderBlocks(status) {
  var enabled = fbmSyncShellEnabled(status);
  return [
    Icon({ id: 'fbm-sync-back', icon: 'back', tooltip: 'Quay lại' }),
    Text({ id: 'fbm-sync-module-title', className: 'shin-header-title shin-sync-module-title', text: fbmSyncShellTitle() }),
    StandaloneControl({ id: 'fbm-sync-master-switch', kind: 'toggle', pressed: enabled, className: enabled ? 'is-on' : 'is-off', disabled: !fbmSyncStatusReady(), ariaLabel: 'Bật hoặc tắt đồng bộ' }),
    Icon({ id: 'fbm-sync-module-menu', icon: 'more', tooltip: 'Mở menu đồng bộ', disabled: !fbmSyncStatusReady() })
  ];
}
function fbmSyncShellNavBlock() {
  return Box({ id: 'fbm-sync-nav', className: 'shin-popup-list shin-sync-nav', hidden: FBM_SYNC_CLIENT.navOpen !== true, elements: (FBM_SYNC_UI_SCHEMA.screens || []).map(function (item) {
    return Button({ label: item.label, className: item.id === FBM_SYNC_CLIENT.subscreen ? 'is-active' : '', data: { 'sync-screen': item.id } });
  }) });
}
function fbmSyncRenderShell(status) {
  var headerMount = document.getElementById('sidebar-header'), panel = document.getElementById('sidebar-body');
  if (!headerMount || !panel || typeof RENDER_INDEX === 'undefined') { return; }
  fbmSyncSetTargetState('sidebar-root', { addClass: ['shin-sync-active'] });
  fbmSyncSetTargetState('sidebar-info', { hidden: true });
  fbmSyncSetTargetState('sidebar-footer', { hidden: true });
  if (!document.getElementById('fbm-sync-module-title')) { fbmSyncReplaceBlocks(headerMount, fbmSyncShellHeaderBlocks(status)); }
  else {
    fbmSyncSetTargetState('fbm-sync-module-title', { text: fbmSyncShellTitle() });
    var enabled = fbmSyncShellEnabled(status);
    fbmSyncSetTargetState('fbm-sync-master-switch', { ariaPressed: enabled, disabled: !fbmSyncStatusReady(), addClass: [enabled ? 'is-on' : 'is-off'], removeClass: [enabled ? 'is-off' : 'is-on'], childText: { '.shin-toggle-label': enabled ? 'ON' : 'OFF' }, title: enabled ? 'Đồng bộ đang bật' : 'Đồng bộ đang tắt' });
  }
  if (!RENDER_INDEX.nodes['fbm-sync-nav'] || !document.getElementById('fbm-sync-nav')) {
    fbmSyncAppendBlock(headerMount, fbmSyncShellNavBlock());
  }
  else { fbmSyncRenderTarget('fbm-sync-nav', fbmSyncShellNavBlock().elements); }
  fbmSyncSetTargetState('fbm-sync-nav', { hidden: FBM_SYNC_CLIENT.navOpen !== true });
  fbmSyncSetTargetState('fbm-sync-module-menu', { disabled: !fbmSyncStatusReady() });
  fbmSyncSetTargetState('sidebar-body', { addClass: fbmSyncShellEnabled(status) ? [] : ['shin-content-disabled'], removeClass: fbmSyncShellEnabled(status) ? ['shin-content-disabled'] : [] });
}
/** Dựng ngay khung màn mặc định bằng trạng thái trung tính; snapshot GAS sẽ vá vào sau. */
function fbmSyncRenderInitial() {
  var panel = document.getElementById('sidebar-body'); if (!panel) { return; }
  fbmSyncRenderShell(FBM_SYNC_CLIENT.lastStatus || {});
  panel.removeAttribute('data-fbm-sync-screen');
  fbmSyncReplaceBlocks(panel, []);
  if (typeof fbmSyncRenderRun === 'function') {
    fbmSyncRenderRun(panel, { phase: 'initializing', mode: FBM_SYNC_CLIENT.mode || 'read', counts: {} });
    panel.setAttribute('data-fbm-sync-screen', 'run');
  }
  fbmSyncApplyMasterDisabled({});
}
function fbmSyncSetScreen(screenId) {
  var ids = FBM_SYNC_UI_SCHEMA.screens.map(function (item) { return item.id; });
  if (typeof fbmSyncCaptureAccountDraft === 'function') { fbmSyncCaptureAccountDraft(); }
  FBM_SYNC_CLIENT.subscreen = ids.indexOf(screenId) >= 0 ? screenId : 'run';
  if (FBM_SYNC_CLIENT.lastStatus) { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus); }
}
function fbmSyncToggleMaster() {
  if (!fbmSyncStatusReady()) { return Promise.resolve(null); }
  var current = FBM_SYNC_CLIENT.lastStatus || {}, enabled = !(current.masterEnabled === false || current.enabled === false), next = Object.assign({}, current, { masterEnabled: !enabled, enabled: !enabled });
  fbmSyncPaint(next);
  return callServer('fbmSetMasterSwitch', [!enabled]).then(fbmSyncStatusOnce).catch(function (error) {
    var rollback = Object.assign({}, FBM_SYNC_CLIENT.lastStatus || current, { masterEnabled: enabled, enabled: enabled, message: String(error && error.message || error) }); fbmSyncPaint(rollback); return null;
  });
}
function fbmSyncApplyMasterDisabled(status) {
  var ready = fbmSyncStatusReady(), disabled = !ready || !!(status && (status.masterEnabled === false || status.enabled === false));
  fbmSyncSetTargetState('fbm-sync-master-switch', { disabled: !ready });
  fbmSyncSetTargetState('fbm-sync-module-menu', { disabled: !ready });
  fbmSyncSetTargetState('sidebar-body', { disabledDescendants: disabled, except: ready ? ['fbm-sync-settings-master-switch'] : [] });
}
</script>
