<style>

<style>

<script>
function fbmSyncStatusReady() { return FBM_SYNC_CLIENT.statusReady === true; }
function fbmSyncShellEnabled(status) { return !(status && (status.masterEnabled === false || status.enabled === false)); }
function fbmSyncShellTitle() {
  var item = (FBM_SYNC_UI_SCHEMA.screens || []).filter(function (screen) { return screen.id === FBM_SYNC_CLIENT.subscreen; })[0];
  return item ? item.label : FBM_SYNC_UI_SCHEMA.shell.fallbackTitle;
}
function fbmSyncShellHeaderBlocks(status) {
  var enabled = fbmSyncShellEnabled(status);
  var schema = FBM_SYNC_UI_SCHEMA.shell;
  return [
    Icon({ id: schema.ids.back, icon: 'back', tooltip: schema.tooltips.back }),
    Text({ id: schema.ids.title, className: uiSyncClass('shell', 'header'), text: fbmSyncShellTitle() }),
    StandaloneControl({ id: schema.ids.master, kind: 'toggle', pressed: enabled, className: enabled ? uiSyncClass('shell', 'toggleOn') : uiSyncClass('shell', 'toggleOff'), ariaLabel: schema.masterAria }),
    Icon({ id: schema.ids.menu, icon: 'more', tooltip: schema.tooltips.menu, disabled: !fbmSyncStatusReady() })
  ];
}
function fbmSyncShellNavBlock() {
  var schema = FBM_SYNC_UI_SCHEMA.shell;
  return Box({ id: schema.ids.nav, className: uiSyncClass('shell', 'nav'), hidden: FBM_SYNC_CLIENT.navOpen !== true, elements: (FBM_SYNC_UI_SCHEMA.screens || []).map(function (item) {
    return Button({ label: item.label, className: uiClassJoin(uiSyncClass('shell', 'navItem'), item.id === FBM_SYNC_CLIENT.subscreen ? uiSyncClass('shell', 'activeItem') : ''), data: { 'sync-screen': item.id } });
  }) });
}
function fbmSyncRenderShell(status) {
  var shell = FBM_SYNC_UI_SCHEMA.shell, headerMount = document.getElementById(shell.ids.header), panel = document.getElementById(shell.ids.body);
  if (!headerMount || !panel || typeof RENDER_INDEX === 'undefined') { return; }
  fbmSyncSetTargetState(shell.ids.root, { addClass: [uiSyncClass('shell', 'active')] });
  fbmSyncSetTargetState(shell.ids.info, { hidden: true });
  fbmSyncSetTargetState(shell.ids.footer, { hidden: true });
  var schema = shell;
  if (!document.getElementById(schema.ids.title)) { fbmSyncReplaceBlocks(headerMount, fbmSyncShellHeaderBlocks(status)); }
  else {
    fbmSyncSetTargetState(schema.ids.title, { text: fbmSyncShellTitle() });
    var enabled = fbmSyncShellEnabled(status);
    fbmSyncSetTargetState(schema.ids.master, { ariaPressed: enabled, disabled: false, addClass: [enabled ? uiSyncClass('shell', 'toggleOn') : uiSyncClass('shell', 'toggleOff')], removeClass: [enabled ? uiSyncClass('shell', 'toggleOff') : uiSyncClass('shell', 'toggleOn')], childText: { [uiSyncClass('shell', 'toggleLabelSelector')]: enabled ? schema.onLabel : schema.offLabel }, title: enabled ? schema.onTitle : schema.offTitle });
  }
  if (!RENDER_INDEX.nodes[schema.ids.nav] || !document.getElementById(schema.ids.nav)) {
    fbmSyncAppendBlock(headerMount, fbmSyncShellNavBlock());
  }
  else { fbmSyncRenderTarget(schema.ids.nav, fbmSyncShellNavBlock().elements); }
  var nav = document.getElementById(schema.ids.nav), navTrigger = document.getElementById(schema.ids.menu);
  if (nav && navTrigger && FBM_SYNC_CLIENT.navOpen === true && typeof PopupList !== 'undefined') {
    PopupList.show(nav, navTrigger, {
      region: panel,
      onClose: function () { FBM_SYNC_CLIENT.navOpen = false; }
    });
  } else if (nav && typeof PopupList !== 'undefined') {
    PopupList.hide(nav);
  } else {
    fbmSyncSetTargetState(schema.ids.nav, { hidden: FBM_SYNC_CLIENT.navOpen !== true });
  }
  fbmSyncSetTargetState(schema.ids.menu, { disabled: !fbmSyncStatusReady() });
  fbmSyncSetTargetState(schema.ids.body, { addClass: fbmSyncShellEnabled(status) ? [] : [uiSyncClass('shell', 'disabled')], removeClass: fbmSyncShellEnabled(status) ? [uiSyncClass('shell', 'disabled')] : [] });
}
/** Dựng ngay khung màn mặc định bằng trạng thái trung tính; snapshot GAS sẽ vá vào sau. */
function fbmSyncRenderInitial() {
  var panel = document.getElementById(FBM_SYNC_UI_SCHEMA.shell.ids.body); if (!panel) { return; }
  fbmSyncRenderShell(FBM_SYNC_CLIENT.lastStatus || {});
  panel.removeAttribute('data-fbm-sync-screen');
  fbmSyncReplaceBlocks(panel, []);
  if (typeof fbmSyncRenderRun === 'function') {
    fbmSyncRenderRun(panel, { phase: 'initializing', mode: FBM_SYNC_CLIENT.mode || 'read', counts: {} });
    panel.setAttribute('data-fbm-sync-screen', 'run');
  }
  fbmSyncApplyMasterDisabled({});
}
function fbmSyncSetScreen(screenId) {
  var ids = FBM_SYNC_UI_SCHEMA.screens.map(function (item) { return item.id; });
  if (typeof fbmSyncCaptureAccountDraft === 'function') { fbmSyncCaptureAccountDraft(); }
  FBM_SYNC_CLIENT.subscreen = ids.indexOf(screenId) >= 0 ? screenId : 'run';
  if (FBM_SYNC_CLIENT.lastStatus) { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus); }
}
function fbmSyncToggleMaster() {
  if (FBM_SYNC_CLIENT.masterToggleFlight) { return FBM_SYNC_CLIENT.masterToggleFlight; }
  var current = FBM_SYNC_CLIENT.lastStatus || {}, enabled = !(current.masterEnabled === false || current.enabled === false), next = Object.assign({}, current, { masterEnabled: !enabled, enabled: !enabled });
  fbmSyncPaint(next);
  return FBM_SYNC_CLIENT.masterToggleFlight = callServer('fbmSetMasterSwitch', [!enabled]).then(fbmSyncStatusOnce).catch(function (error) {
    var rollback = Object.assign({}, FBM_SYNC_CLIENT.lastStatus || current, { masterEnabled: enabled, enabled: enabled, message: String(error && error.message || error) }); fbmSyncPaint(rollback); return null;
  }).finally(function () { FBM_SYNC_CLIENT.masterToggleFlight = null; });
}
function fbmSyncApplyMasterDisabled(status) {
  var ready = fbmSyncStatusReady(), disabled = !ready || !!(status && (status.masterEnabled === false || status.enabled === false));
  var schema = FBM_SYNC_UI_SCHEMA.shell;
  fbmSyncSetTargetState(schema.ids.master, { disabled: false });
  fbmSyncSetTargetState(schema.ids.menu, { disabled: !ready });
  fbmSyncSetTargetState(schema.ids.body, { disabledDescendants: disabled, except: ready ? [schema.ids.master] : [] });
}
</script>
