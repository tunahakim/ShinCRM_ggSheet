<script>
function fbmSyncShellEnabled(status) { return !(status && (status.masterEnabled === false || status.enabled === false)); }
function fbmSyncShellTitle() {
  var item = (FBM_SYNC_UI_SCHEMA.screens || []).filter(function (screen) { return screen.id === FBM_SYNC_CLIENT.subscreen; })[0];
  return item ? item.label : 'Đồng bộ FBM';
}
function fbmSyncShellHeaderBlocks(status) {
  var enabled = fbmSyncShellEnabled(status);
  return [
    Icon({ id: 'fbm-sync-back', icon: 'back', tooltip: 'Quay lại' }),
    Text({ id: 'fbm-sync-module-title', className: 'shin-header-title shin-sync-module-title', text: fbmSyncShellTitle() }),
    StandaloneControl({ id: 'fbm-sync-master-switch', kind: 'toggle', pressed: enabled, className: 'shin-sync-master-switch ' + (enabled ? 'is-on' : 'is-off'), ariaLabel: 'Bật hoặc tắt đồng bộ' }),
    Icon({ id: 'fbm-sync-module-menu', icon: 'more', tooltip: 'Mở menu đồng bộ' })
  ];
}
function fbmSyncShellNavBlock() {
  return Box({ id: 'fbm-sync-nav', className: 'shin-popup-list shin-sync-nav', hidden: FBM_SYNC_CLIENT.navOpen !== true, elements: (FBM_SYNC_UI_SCHEMA.screens || []).map(function (item) {
    return Button({ label: item.label, className: item.id === FBM_SYNC_CLIENT.subscreen ? 'is-active' : '', data: { 'sync-screen': item.id } });
  }) });
}
function fbmSyncRenderShell(status) {
  var screen = document.getElementById('fbm-sync-screen'), headerMount = document.getElementById('fbm-sync-shell-header-region'), navMount = document.getElementById('fbm-sync-shell-nav-region');
  if (!screen || !headerMount || !navMount || typeof RENDER_INDEX === 'undefined') { return; }
  if (!document.getElementById('fbm-sync-module-title')) { fbmSyncReplaceBlocks(headerMount, fbmSyncShellHeaderBlocks(status)); }
  else {
    fbmSyncSetTargetState('fbm-sync-module-title', { text: fbmSyncShellTitle() });
    var enabled = fbmSyncShellEnabled(status);
    fbmSyncSetTargetState('fbm-sync-master-switch', { ariaPressed: enabled, addClass: [enabled ? 'is-on' : 'is-off'], removeClass: [enabled ? 'is-off' : 'is-on'], childText: { '.shin-sync-switch-label': enabled ? 'ON' : 'OFF' }, title: enabled ? 'Đồng bộ đang bật' : 'Đồng bộ đang tắt' });
  }
  if (!RENDER_INDEX.nodes['fbm-sync-nav'] || !document.getElementById('fbm-sync-nav')) { fbmSyncReplaceBlocks(navMount, [fbmSyncShellNavBlock()]); }
  else { fbmSyncRenderTarget('fbm-sync-nav', fbmSyncShellNavBlock().elements); }
  fbmSyncSetTargetState('fbm-sync-nav', { hidden: FBM_SYNC_CLIENT.navOpen !== true });
  fbmSyncSetTargetState('fbm-sync-content', { addClass: fbmSyncShellEnabled(status) ? [] : ['shin-sync-content-disabled'], removeClass: fbmSyncShellEnabled(status) ? ['shin-sync-content-disabled'] : [] });
}
function fbmSyncRenderLoading() {
  var panel = document.getElementById('fbm-sync-content'); if (!panel) { return; }
  fbmSyncRenderShell(FBM_SYNC_CLIENT.lastStatus || {});
  panel.removeAttribute('data-fbm-sync-screen');
  if (typeof RENDER_INDEX !== 'undefined' && RENDER_INDEX.nodes) {
    ['fbm-sync-overview-root', 'fbm-sync-account-root', 'fbm-sync-run-root', 'fbm-sync-results-root', 'fbm-sync-settings-root'].forEach(function (id) { delete RENDER_INDEX.nodes[id]; });
  }
  fbmSyncReplaceBlocks(panel, [Box({ className: 'shin-sync-section', elements: [Text({ className: 'shin-sync-loading', text: 'Đang tải trạng thái phiên đồng bộ FBM' })] })]);
}
function fbmSyncSetScreen(screenId) {
  var ids = FBM_SYNC_UI_SCHEMA.screens.map(function (item) { return item.id; });
  if (typeof fbmSyncCaptureAccountDraft === 'function') { fbmSyncCaptureAccountDraft(); }
  FBM_SYNC_CLIENT.subscreen = ids.indexOf(screenId) >= 0 ? screenId : 'overview';
  if (FBM_SYNC_CLIENT.lastStatus) { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus); }
}
function fbmSyncToggleMaster() {
  var current = FBM_SYNC_CLIENT.lastStatus || {}, enabled = !(current.masterEnabled === false || current.enabled === false), next = Object.assign({}, current, { masterEnabled: !enabled, enabled: !enabled });
  fbmSyncPaint(next);
  return callServer('fbmSetMasterSwitch', [!enabled]).then(fbmSyncStatusOnce).catch(function (error) {
    var rollback = Object.assign({}, FBM_SYNC_CLIENT.lastStatus || current, { masterEnabled: enabled, enabled: enabled, message: String(error && error.message || error) }); fbmSyncPaint(rollback); return null;
  });
}
function fbmSyncApplyMasterDisabled(status) {
  var disabled = !!(status && (status.masterEnabled === false || status.enabled === false));
  fbmSyncSetTargetState('fbm-sync-content', { disabledDescendants: disabled });
}
</script>
