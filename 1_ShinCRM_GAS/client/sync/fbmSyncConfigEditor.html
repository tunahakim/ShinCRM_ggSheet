<script>
/*
 * Bộ điều phối dùng chung cho các card cấu hình FBM.
 * Card chỉ khai control và lệnh nghiệp vụ; lớp này giữ một snapshot trước khi sửa
 * để mọi icon/nút đều đi qua cùng một luồng lưu hoặc hủy.
 */
var FBM_SYNC_CONFIG_KEYS = ['identity', 'login', 'accountSettings', 'module', 'relay', 'extension', 'background', 'loginPolicy'];

function fbmSyncConfigClone(value) {
  if (value === undefined || value === null) { return value; }
  if (typeof value !== 'object') { return value; }
  try { return JSON.parse(JSON.stringify(value)); } catch (ignore) { return value; }
}

function fbmSyncConfigState(key) {
  FBM_SYNC_CLIENT.configEdits = FBM_SYNC_CLIENT.configEdits || {};
  var state = FBM_SYNC_CLIENT.configEdits[key];
  if (!state) {
    state = { editing: false, snapshot: null, draft: null, needsRender: false };
    FBM_SYNC_CLIENT.configEdits[key] = state;
  }
  return state;
}

function fbmSyncConfigIsEditing(key) {
  var state = fbmSyncConfigState(key);
  if (state.editing === true) { return true; }
  // Trạng thái thiếu cấu hình vẫn là trạng thái xem; người dùng phải chủ động bấm Sửa.
  // Giữ cờ legacy loginEditMode để các luồng cũ mở form vẫn đi cùng component này.
  if (key === 'login') { return FBM_SYNC_CLIENT.loginEditMode === true; }
  return false;
}

function fbmSyncConfigDraft(key, fallback) {
  var state = fbmSyncConfigState(key);
  return state.editing && state.draft !== null && state.draft !== undefined ? state.draft : fallback;
}

function fbmSyncConfigActionId(key, action) { return 'fbm-sync-config-' + key + '-' + action; }

function fbmSyncConfigTitleActions(key) {
  var state = fbmSyncConfigState(key), editing = fbmSyncConfigIsEditing(key), actions = [];
  if (editing && (state.editing || (key === 'login' && FBM_SYNC_CLIENT.loginEditMode === true))) {
    actions.push({ id: fbmSyncConfigActionId(key, 'cancel'), icon: 'close', className: 'shin-config-cancel', tooltip: 'Hủy thay đổi', data: { 'sync-config-action': 'cancel', 'sync-config-key': key } });
    actions.push({ id: fbmSyncConfigActionId(key, 'save'), icon: 'check', className: 'shin-config-save', tooltip: 'Lưu thay đổi', data: { 'sync-config-action': 'save', 'sync-config-key': key } });
  } else if (!editing) {
    actions.push({ id: fbmSyncConfigActionId(key, 'edit'), icon: 'pencil', className: 'shin-config-edit-icon', tooltip: 'Sửa cấu hình', data: { 'sync-config-action': 'edit', 'sync-config-key': key } });
  }
  return actions;
}

function fbmSyncConfigButton(key, labels, options) {
  var opts = options || {}, editing = fbmSyncConfigIsEditing(key);
  var label = editing ? labels.save : labels.edit;
  var className = editing && opts.primary !== false ? 'shin-primary' : (!editing ? 'shin-config-edit' : (opts.className || ''));
  return Button({
    id: opts.id || fbmSyncConfigActionId(key, 'button'),
    label: label,
    className: className,
    disabled: !!opts.disabled || (!!FBM_SYNC_CLIENT.running && key !== 'relay'),
    data: { 'sync-config-action': editing ? 'save' : 'edit', 'sync-config-key': key }
  });
}

function fbmSyncConfigButtonRow(key, labels, options) {
  return Row({ className: 'shin-single-action-row shin-config-action-row', elements: [fbmSyncConfigButton(key, labels, options)] });
}

function fbmSyncConfigBeginEdit(key, draft) {
  var state = fbmSyncConfigState(key);
  if (state.editing) { return false; }
  state.snapshot = fbmSyncConfigClone(draft);
  state.draft = fbmSyncConfigClone(draft);
  state.editing = true;
  state.needsRender = true;
  return true;
}

function fbmSyncConfigFinishEdit(key) {
  var state = fbmSyncConfigState(key);
  state.editing = false;
  state.needsRender = false;
  state.snapshot = null;
  state.draft = null;
  if (key === 'login') {
    FBM_SYNC_CLIENT.loginEditMode = false;
    FBM_SYNC_CLIENT.loginDraft = { username: '' };
    var password = document.getElementById('fbm-login-password');
    if (password) { password.value = ''; }
  }
  return true;
}

function fbmSyncConfigCancelEdit(key) {
  var state = fbmSyncConfigState(key), snapshot = fbmSyncConfigClone(state.snapshot);
  if (!state.editing) { return false; }
  if (key === 'identity' && snapshot) {
    FBM_SYNC_CLIENT.identityDraft = fbmSyncConfigClone(snapshot);
    FBM_SYNC_CLIENT.identityInvalid = {};
    FBM_SYNC_CLIENT.identityAction = '';
  } else if (key === 'accountSettings' && snapshot) {
    FBM_SYNC_CLIENT.accountSettingsDraft = fbmSyncConfigClone(snapshot);
    FBM_SYNC_CLIENT.accountSettingsInvalid = {};
  } else if (key === 'login' && snapshot) {
    FBM_SYNC_CLIENT.loginDraft = { username: String(snapshot.username || '') };
  }
  fbmSyncConfigFinishEdit(key);
  if (typeof fbmSyncPaint === 'function') { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus || {}); }
  return true;
}

function fbmSyncConfigDraftValue(key, path, fallback) {
  var source = fbmSyncConfigDraft(key, null);
  if (!source || typeof source !== 'object') { return fallback; }
  var value = source;
  String(path || '').split('.').forEach(function (part) { if (value !== null && value !== undefined) { value = value[part]; } });
  return value === undefined || value === null ? fallback : value;
}

function fbmSyncConfigSetDraftValue(key, path, value) {
  var state = fbmSyncConfigState(key);
  if (!state.editing) { return false; }
  var parts = String(path || '').split('.'), target = state.draft;
  if (!target || typeof target !== 'object') { target = state.draft = {}; }
  for (var i = 0; i < parts.length - 1; i += 1) {
    if (!target[parts[i]] || typeof target[parts[i]] !== 'object') { target[parts[i]] = {}; }
    target = target[parts[i]];
  }
  target[parts[parts.length - 1]] = value;
  return true;
}

function fbmSyncConfigStartEdit(key) {
  var settings = FBM_SYNC_CLIENT.syncSettings || {}, login = FBM_SYNC_CLIENT.loginStatus || {};
  var draft;
  if (key === 'identity') {
    var binding = FBM_SYNC_CLIENT.identityStatus && FBM_SYNC_CLIENT.identityStatus.binding || {};
    draft = { spreadsheetId: String((FBM_SYNC_CLIENT.identityDraft || {}).spreadsheetId || binding.spreadsheetId || ''), userId: String((FBM_SYNC_CLIENT.identityDraft || {}).userId || binding.userId || ''), username: String((FBM_SYNC_CLIENT.identityDraft || {}).username || binding.username || ''), accountName: String((FBM_SYNC_CLIENT.identityDraft || {}).accountName || binding.accountName || '') };
    FBM_SYNC_CLIENT.identityDraft = fbmSyncConfigClone(draft);
  } else if (key === 'accountSettings') {
    var account = settings.account || {};
    draft = { customerPrefix: String(account.customerPrefix || ''), customerCodeLength: String(account.customerCodeLength || ''), activitySince: String(account.activitySince || '') };
    FBM_SYNC_CLIENT.accountSettingsDraft = fbmSyncConfigClone(draft);
  } else if (key === 'login') {
    draft = { username: String(login.public && login.public.usernameHint || '') };
    FBM_SYNC_CLIENT.loginDraft = { username: draft.username };
    FBM_SYNC_CLIENT.loginEditMode = true;
    var password = document.getElementById('fbm-login-password');
    if (password) { password.value = ''; }
  } else if (key === 'module') {
    draft = { approvalThreshold: settings.approvalThreshold === undefined ? 10 : settings.approvalThreshold };
  } else if (key === 'relay') {
    draft = {};
  } else if (key === 'extension') {
    draft = fbmSyncConfigClone(settings.extension || { pollMinutes: 5, runOnStartup: true });
  } else if (key === 'background') {
    draft = fbmSyncConfigClone(settings.background || {});
    draft.enabled = !(FBM_SYNC_CLIENT.lastStatus && FBM_SYNC_CLIENT.lastStatus.backgroundEnabled === false);
  } else if (key === 'loginPolicy') {
    draft = { enabled: login.enabled !== false, autoOpenTab: login.autoOpenTab === true, retryEnabled: login.retryEnabled !== false, retryMinutes: login.retryMinutes || 30 };
  } else { return false; }
  return fbmSyncConfigBeginEdit(key, draft);
}

function fbmSyncConfigSave(key, target) {
  if (key === 'identity' && typeof fbmSyncSaveIdentityManual === 'function') { return fbmSyncSaveIdentityManual(target); }
  if (key === 'login' && typeof fbmSyncSaveLoginConfig === 'function') { return fbmSyncSaveLoginConfig(target); }
  if (key === 'accountSettings' && typeof fbmSyncSaveAccountSettings === 'function') { return fbmSyncSaveAccountSettings(target); }
  if (key === 'module' && typeof fbmSyncSaveSyncSettings === 'function') { return fbmSyncSaveSyncSettings(target); }
  if (key === 'relay' && typeof fbmSyncRotateRelay === 'function') { return fbmSyncRotateRelay(); }
  if (key === 'extension' && typeof fbmSyncSaveExtensionSettings === 'function') { return fbmSyncSaveExtensionSettings(target); }
  if (key === 'background' && typeof fbmSyncSaveBackgroundSettings === 'function') { return fbmSyncSaveBackgroundSettings(target); }
  if (key === 'loginPolicy' && typeof fbmSyncSaveLoginPolicy === 'function') { return fbmSyncSaveLoginPolicy(target); }
  return Promise.resolve(null);
}

function fbmSyncConfigHandleAction(target) {
  if (!target || !target.getAttribute) { return false; }
  var action = target.getAttribute('data-sync-config-action'), key = target.getAttribute('data-sync-config-key');
  if (!action || FBM_SYNC_CONFIG_KEYS.indexOf(key) < 0) { return false; }
  if (action === 'edit') {
    if (fbmSyncConfigStartEdit(key)) { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus || {}); }
    return true;
  }
  if (action === 'cancel') { fbmSyncConfigCancelEdit(key); return true; }
  if (action === 'save') { fbmSyncConfigSave(key, target); return true; }
  return false;
}
</script>
