<script>
/*
 * Bộ điều phối dùng chung cho các card cấu hình FBM.
 * Card chỉ khai control và lệnh nghiệp vụ; lớp này giữ một snapshot trước khi sửa
 * để mọi icon/nút đều đi qua cùng một luồng lưu hoặc hủy.
 */
var FBM_SYNC_CONFIG_KEYS = ['identity', 'login', 'accountSettings', 'module', 'relay', 'extension', 'background', 'loginPolicy'];

/*
 * Đây là schema hành vi của giao diện, không phải schema dữ liệu lưu trong GAS.
 * Nó chỉ mô tả khóa cha/con để renderer dùng cùng một luật khóa cho mọi card.
 */
var FBM_SYNC_CONFIG_UI_SCHEMA = {
  module: { parentPath: 'enabled' },
  background: {
    parentPath: 'enabled',
    dependencies: {
      'heartbeat.minutes': 'heartbeat.enabled',
      'customerFull.minutes': 'customerFull.enabled',
      'activityFull.minutes': 'activityFull.enabled',
      'detail.customersPerRun': 'detail.enabled',
      'detail.minDelaySeconds': 'detail.enabled',
      'detail.maxDelaySeconds': 'detail.enabled'
    }
  },
  loginPolicy: {
    parentPath: 'enabled',
    dependencies: {
      autoOpenTab: 'enabled',
      retryEnabled: 'enabled',
      retryMinutes: 'retryEnabled'
    }
  }
};

function fbmSyncConfigClone(value) {
  if (value === undefined || value === null) { return value; }
  if (typeof value !== 'object') { return value; }
  try { return JSON.parse(JSON.stringify(value)); } catch (ignore) { return value; }
}

function fbmSyncConfigState(key) {
  FBM_SYNC_CLIENT.configEdits = FBM_SYNC_CLIENT.configEdits || {};
  var state = FBM_SYNC_CLIENT.configEdits[key];
  if (!state) {
    state = { editing: false, snapshot: null, draft: null, needsRender: false };
    FBM_SYNC_CLIENT.configEdits[key] = state;
  }
  return state;
}

function fbmSyncConfigIsEditing(key) {
  var state = fbmSyncConfigState(key);
  if (state.editing === true) { return true; }
  // Trạng thái thiếu cấu hình vẫn là trạng thái xem; người dùng phải chủ động bấm Sửa.
  // Giữ cờ legacy loginEditMode để các luồng cũ mở form vẫn đi cùng component này.
  if (key === 'login') { return FBM_SYNC_CLIENT.loginEditMode === true; }
  return false;
}

function fbmSyncConfigDraft(key, fallback) {
  var state = fbmSyncConfigState(key);
  return state.editing && state.draft !== null && state.draft !== undefined ? state.draft : fallback;
}

function fbmSyncConfigSchema() { return FBM_SYNC_UI_SCHEMA.config; }
function fbmSyncConfigActionId(key, action) { return fbmSyncConfigSchema().actionIdPrefix + key + '-' + action; }

function fbmSyncConfigTitleActions(key) {
  var state = fbmSyncConfigState(key), editing = fbmSyncConfigIsEditing(key), actions = [];
  if (editing && (state.editing || (key === 'login' && FBM_SYNC_CLIENT.loginEditMode === true))) {
    var schema = fbmSyncConfigSchema();
    actions.push({ id: fbmSyncConfigActionId(key, schema.actionCancel), icon: 'close', className: uiResolveActionClass('cancel', 'icon'), tooltip: schema.tooltips.cancel, data: { 'sync-config-action': schema.actionCancel, 'sync-config-key': key } });
    actions.push({ id: fbmSyncConfigActionId(key, schema.actionSave), icon: 'check', className: uiResolveActionClass('save', 'icon'), tooltip: schema.tooltips.save, data: { 'sync-config-action': schema.actionSave, 'sync-config-key': key } });
  } else if (!editing) {
    var editSchema = fbmSyncConfigSchema();
    actions.push({ id: fbmSyncConfigActionId(key, editSchema.actionEdit), icon: 'pencil', className: uiResolveActionClass('edit', 'icon'), tooltip: editSchema.tooltips.edit, data: { 'sync-config-action': editSchema.actionEdit, 'sync-config-key': key } });
  }
  return actions;
}

function fbmSyncConfigButton(key, labels, options) {
  var opts = options || {}, editing = fbmSyncConfigIsEditing(key), schema = fbmSyncConfigSchema();
  var label = editing ? labels.save : labels.edit;
  var className = editing && opts.primary !== false ? uiResolveActionClass('save', 'button') : (!editing ? uiResolveActionClass('edit', 'button') : (opts.className || ''));
  return Button({
    id: opts.id || fbmSyncConfigActionId(key, 'button'),
    label: label,
    className: className,
    disabled: !!opts.disabled || (!!FBM_SYNC_CLIENT.running && key !== 'relay'),
    data: { 'sync-config-action': editing ? schema.actionSave : schema.actionEdit, 'sync-config-key': key }
  });
}

function fbmSyncConfigButtonRow(key, labels, options) {
  return Row({ className: uiSyncClass('config', 'actionRow'), elements: [fbmSyncConfigButton(key, labels, options)] });
}

function fbmSyncConfigBeginEdit(key, draft) {
  var state = fbmSyncConfigState(key);
  if (state.editing) { return false; }
  state.snapshot = fbmSyncConfigClone(draft);
  state.draft = fbmSyncConfigClone(draft);
  state.editing = true;
  state.needsRender = true;
  return true;
}

function fbmSyncConfigFinishEdit(key) {
  var state = fbmSyncConfigState(key);
  state.editing = false;
  state.needsRender = false;
  state.snapshot = null;
  state.draft = null;
  if (key === 'login') {
    FBM_SYNC_CLIENT.loginEditMode = false;
    FBM_SYNC_CLIENT.loginDraft = { username: '' };
    var password = document.getElementById(FBM_SYNC_ACCOUNT_SCHEMA.login.password.id);
    if (password) { password.value = ''; }
  }
  return true;
}

function fbmSyncConfigCancelEdit(key) {
  var state = fbmSyncConfigState(key), snapshot = fbmSyncConfigClone(state.snapshot);
  if (!state.editing) { return false; }
  if (key === 'identity' && snapshot) {
    FBM_SYNC_CLIENT.identityDraft = fbmSyncConfigClone(snapshot);
    FBM_SYNC_CLIENT.identityInvalid = {};
    FBM_SYNC_CLIENT.identityAction = '';
  } else if (key === 'accountSettings' && snapshot) {
    FBM_SYNC_CLIENT.accountSettingsDraft = fbmSyncConfigClone(snapshot);
    FBM_SYNC_CLIENT.accountSettingsInvalid = {};
  } else if (key === 'login' && snapshot) {
    FBM_SYNC_CLIENT.loginDraft = { username: String(snapshot.username || '') };
  }
  fbmSyncConfigFinishEdit(key);
  if (typeof fbmSyncPaint === 'function') { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus || {}); }
  return true;
}

function fbmSyncConfigDraftValue(key, path, fallback) {
  var source = fbmSyncConfigDraft(key, null);
  if (!source || typeof source !== 'object') { return fallback; }
  var value = source;
  String(path || '').split('.').forEach(function (part) { if (value !== null && value !== undefined) { value = value[part]; } });
  return value === undefined || value === null ? fallback : value;
}

function fbmSyncConfigMasterEnabled() {
  var status = FBM_SYNC_CLIENT.lastStatus || {};
  return status.masterEnabled !== false && status.enabled !== false;
}

/** Một cổng duy nhất quyết định control thân có được thao tác hay không. */
function fbmSyncConfigControlDisabled(key, path) {
  var schema = FBM_SYNC_CONFIG_UI_SCHEMA[key] || {}, editing = fbmSyncConfigIsEditing(key), dependency = schema.dependencies && schema.dependencies[path];
  if (!editing || FBM_SYNC_CLIENT.running) { return true; }
  if (key === 'background' && !fbmSyncConfigMasterEnabled()) { return true; }
  if (schema.parentPath && path !== schema.parentPath && fbmSyncConfigDraftValue(key, schema.parentPath, true) !== true) { return true; }
  if (dependency && fbmSyncConfigDraftValue(key, dependency, true) !== true) { return true; }
  return false;
}

/** Hiển thị username đầy đủ từ liên kết đã xác nhận; cấu hình cũ có thể chỉ lưu usernameHint đã che. */
function fbmSyncLoginUsernameValue(login) {
  var value = login || FBM_SYNC_CLIENT.loginStatus || {}, binding = FBM_SYNC_CLIENT.identityStatus && FBM_SYNC_CLIENT.identityStatus.binding || {};
  return String(binding.username || value.public && value.public.usernameHint || '');
}

function fbmSyncConfigSetDraftValue(key, path, value) {
  var state = fbmSyncConfigState(key);
  if (!state.editing) { return false; }
  var parts = String(path || '').split('.'), target = state.draft;
  if (!target || typeof target !== 'object') { target = state.draft = {}; }
  for (var i = 0; i < parts.length - 1; i += 1) {
    if (!target[parts[i]] || typeof target[parts[i]] !== 'object') { target[parts[i]] = {}; }
    target = target[parts[i]];
  }
  target[parts[parts.length - 1]] = value;
  return true;
}

function fbmSyncConfigStartEdit(key) {
  var settings = FBM_SYNC_CLIENT.syncSettings || {}, login = FBM_SYNC_CLIENT.loginStatus || {};
  var draft;
  if (key === 'identity') {
    var binding = FBM_SYNC_CLIENT.identityStatus && FBM_SYNC_CLIENT.identityStatus.binding || {};
    draft = { spreadsheetId: String((FBM_SYNC_CLIENT.identityDraft || {}).spreadsheetId || binding.spreadsheetId || ''), userId: String((FBM_SYNC_CLIENT.identityDraft || {}).userId || binding.userId || ''), username: String((FBM_SYNC_CLIENT.identityDraft || {}).username || binding.username || ''), accountName: String((FBM_SYNC_CLIENT.identityDraft || {}).accountName || binding.accountName || '') };
    FBM_SYNC_CLIENT.identityDraft = fbmSyncConfigClone(draft);
  } else if (key === 'accountSettings') {
    var account = settings.account || {};
    draft = { customerPrefix: String(account.customerPrefix || ''), customerCodeLength: String(account.customerCodeLength || ''), activitySince: String(account.activitySince || '') };
    FBM_SYNC_CLIENT.accountSettingsDraft = fbmSyncConfigClone(draft);
  } else if (key === 'login') {
    draft = { username: fbmSyncLoginUsernameValue(login) };
    FBM_SYNC_CLIENT.loginDraft = { username: draft.username };
    FBM_SYNC_CLIENT.loginEditMode = true;
    var password = document.getElementById(FBM_SYNC_ACCOUNT_SCHEMA.login.password.id);
    if (password) { password.value = ''; }
  } else if (key === 'module') {
    draft = { approvalThreshold: settings.approvalThreshold === undefined ? FBM_SYNC_SETTINGS_SCHEMA.defaults.approvalThreshold : settings.approvalThreshold, enabled: fbmSyncConfigMasterEnabled() };
  } else if (key === 'relay') {
    draft = {};
  } else if (key === 'extension') {
    draft = fbmSyncConfigClone(settings.extension || { pollMinutes: FBM_SYNC_SETTINGS_SCHEMA.defaults.pollMinutes, runOnStartup: true });
  } else if (key === 'background') {
    draft = fbmSyncConfigClone(settings.background || {});
    draft.enabled = !(FBM_SYNC_CLIENT.lastStatus && FBM_SYNC_CLIENT.lastStatus.backgroundEnabled === false);
  } else if (key === 'loginPolicy') {
    draft = { enabled: login.enabled !== false, autoOpenTab: login.autoOpenTab === true, retryEnabled: login.retryEnabled !== false, retryMinutes: login.retryMinutes || FBM_SYNC_SETTINGS_SCHEMA.defaults.retryMinutes };
  } else { return false; }
  return fbmSyncConfigBeginEdit(key, draft);
}

function fbmSyncConfigSave(key, target) {
  if (key === 'identity' && typeof fbmSyncSaveIdentityManual === 'function') { return fbmSyncSaveIdentityManual(target); }
  if (key === 'login' && typeof fbmSyncSaveLoginConfig === 'function') { return fbmSyncSaveLoginConfig(target); }
  if (key === 'accountSettings' && typeof fbmSyncSaveAccountSettings === 'function') { return fbmSyncSaveAccountSettings(target); }
  if (key === 'module' && typeof fbmSyncSaveSyncSettings === 'function') { return fbmSyncSaveSyncSettings(target); }
  if (key === 'relay' && typeof fbmSyncRotateRelay === 'function') { return fbmSyncRotateRelay(); }
  if (key === 'extension' && typeof fbmSyncSaveExtensionSettings === 'function') { return fbmSyncSaveExtensionSettings(target); }
  if (key === 'background' && typeof fbmSyncSaveBackgroundSettings === 'function') { return fbmSyncSaveBackgroundSettings(target); }
  if (key === 'loginPolicy' && typeof fbmSyncSaveLoginPolicy === 'function') { return fbmSyncSaveLoginPolicy(target); }
  return Promise.resolve(null);
}

/* Ánh xạ control của từng card về path trong snapshot. Đây là hợp đồng nội bộ của editor, không đưa vào screen schema. */
var FBM_SYNC_CONFIG_UNSAVED_FIELDS = {
  identity: { spreadsheetId: 'fbm-identity-spreadsheet', userId: 'fbm-identity-user', username: 'fbm-identity-username', accountName: 'fbm-identity-account' },
  login: { username: 'fbm-login-username', password: 'fbm-login-password' },
  accountSettings: { customerPrefix: 'fbm-account-customer-prefix', customerCodeLength: 'fbm-account-customer-length', activitySince: 'fbm-account-activity-since' },
  module: { enabled: 'fbm-sync-settings-master-switch', approvalThreshold: 'fbm-sync-setting-approval-threshold' },
  relay: {},
  extension: { pollMinutes: 'fbm-extension-poll-minutes', runOnStartup: 'fbm-sync-run-on-startup' },
  background: {
    enabled: 'fbm-sync-background-switch', direction: 'fbm-sync-background-direction',
    'heartbeat.minutes': 'fbm-sync-process-heartbeat-minutes', 'heartbeat.enabled': 'fbm-sync-process-heartbeat',
    'customerFull.minutes': 'fbm-sync-process-customerFull-minutes', 'customerFull.enabled': 'fbm-sync-process-customerFull',
    'activityFull.minutes': 'fbm-sync-process-activityFull-minutes', 'activityFull.enabled': 'fbm-sync-process-activityFull',
    'detail.minutes': 'fbm-sync-process-detail-minutes', 'detail.enabled': 'fbm-sync-process-detail',
    'detail.customersPerRun': 'fbm-sync-detail-count', 'detail.minDelaySeconds': 'fbm-sync-detail-delay-min', 'detail.maxDelaySeconds': 'fbm-sync-detail-delay-max'
  },
  loginPolicy: { enabled: 'fbm-sync-policy-auto-login', autoOpenTab: 'fbm-sync-policy-auto-open', retryEnabled: 'fbm-sync-policy-retry', retryMinutes: 'fbm-sync-login-retry-minutes' }
};

var FBM_SYNC_CONFIG_UNSAVED_CARDS = {
  identity: 'fbm-sync-identity-card-region', login: 'fbm-sync-login-card-region', accountSettings: 'fbm-sync-account-settings-region',
  module: 'fbm-sync-module-card-region', relay: 'fbm-sync-relay-card-region', extension: 'fbm-sync-extension-card-region',
  background: 'fbm-sync-background-card-region', loginPolicy: 'fbm-sync-login-policy-card-region'
};

function fbmSyncConfigPathGet(value, path) {
  var result = value;
  String(path || '').split('.').forEach(function (part) { if (result !== null && result !== undefined) { result = result[part]; } });
  return result;
}

function fbmSyncConfigUnsavedControlValue(id) {
  var control = document.getElementById(id);
  if (!control) { return undefined; }
  if (control.hasAttribute('aria-pressed')) { return control.getAttribute('aria-pressed') === 'true'; }
  if (control.getAttribute('data-standalone-menu') === '1' || control.getAttribute('data-standalone-select') === '1') { return control.getAttribute('data-value') || control.value || ''; }
  return control.value === undefined || control.value === null ? '' : String(control.value);
}

function fbmSyncConfigUnsavedRead() {
  var keys = [], fields = [], fieldIds = [], fieldsByKey = {};
  FBM_SYNC_CONFIG_KEYS.forEach(function (key) {
    var state = fbmSyncConfigState(key), map = FBM_SYNC_CONFIG_UNSAVED_FIELDS[key] || {};
    if (!state.editing || state.snapshot === null || state.snapshot === undefined) { return; }
    Object.keys(map).forEach(function (path) {
      var current = fbmSyncConfigUnsavedControlValue(map[path]);
      if (current === undefined) { current = fbmSyncConfigPathGet(state.draft, path); }
      var baseline = fbmSyncConfigPathGet(state.snapshot, path);
      var isPassword = key === 'login' && path === 'password';
      var changed = isPassword ? String(current || '') !== '' : (typeof unsavedChangesEqual === 'function' ? !unsavedChangesEqual(current, baseline) : String(current === undefined || current === null ? '' : current).trim() !== String(baseline === undefined || baseline === null ? '' : baseline).trim());
      if (!changed) { return; }
      if (!fieldsByKey[key]) { fieldsByKey[key] = []; }
      fieldsByKey[key].push(path);
      fields.push(key + '.' + path);
      fieldIds.push(map[path]);
      if (keys.indexOf(key) === -1) { keys.push(key); }
    });
  });
  return { dirty: keys.length > 0, keys: keys, fields: fields, fieldIds: fieldIds, fieldsByKey: fieldsByKey };
}

var FBM_SYNC_CONFIG_UNSAVED_PROVIDER = null;
function fbmSyncConfigUnsavedProvider() {
  if (FBM_SYNC_CONFIG_UNSAVED_PROVIDER) { return FBM_SYNC_CONFIG_UNSAVED_PROVIDER; }
  FBM_SYNC_CONFIG_UNSAVED_PROVIDER = {
    read: fbmSyncConfigUnsavedRead,
    save: function () {
      var state = fbmSyncConfigUnsavedRead(), key = state.keys[0];
      if (!key) { return { ok: true }; }
      return Promise.resolve(fbmSyncConfigSave(key, null)).then(function () { return { ok: true }; });
    },
    discard: function () {
      var state = fbmSyncConfigUnsavedRead();
      state.keys.forEach(function (key) { fbmSyncConfigCancelEdit(key); });
      return { ok: true };
    },
    canRunTarget: function (target, state) {
      if (!target || !state || !state.keys.length || state.keys.length !== 1) { return false; }
      var key = state.keys[0], action = target.getAttribute && target.getAttribute('data-sync-config-action'), targetKey = target.getAttribute && target.getAttribute('data-sync-config-key');
      if (action === 'save' && targetKey === key) { return true; }
      if (action === 'cancel' && targetKey === key) { return false; }
      if (targetKey && targetKey !== key) { return false; }
      if (target.id === 'fbm-sync-open-login-policy' || target.id === 'fbm-sync-back' || target.id === 'fbm-sync-module-menu' || target.id === 'fbm-sync-master-switch' || target.id === 'fbm-sync-settings-master-switch') { return false; }
      if (target.hasAttribute && (target.hasAttribute('data-sync-screen') || target.hasAttribute('data-sync-results-tab') || target.hasAttribute('data-sync-page'))) { return false; }
      var cardId = FBM_SYNC_CONFIG_UNSAVED_CARDS[key], card = cardId && target.closest ? target.closest('#' + cardId) : null;
      return !!card;
    }
  };
  return FBM_SYNC_CONFIG_UNSAVED_PROVIDER;
}

function fbmSyncConfigHandleAction(target) {
  if (!target || !target.getAttribute) { return false; }
  var action = target.getAttribute('data-sync-config-action'), key = target.getAttribute('data-sync-config-key');
  if (!action || FBM_SYNC_CONFIG_KEYS.indexOf(key) < 0) { return false; }
  if (action === 'edit') {
    if (fbmSyncConfigStartEdit(key)) { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus || {}); }
    return true;
  }
  if (action === 'cancel') { fbmSyncConfigCancelEdit(key); return true; }
  if (action === 'save') { fbmSyncConfigSave(key, target); return true; }
  return false;
}
</script>
