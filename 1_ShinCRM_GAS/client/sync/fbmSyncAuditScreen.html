<script>
/* Các block preview/audit được gom ở một màn hình con; dữ liệu vẫn do snapshot GAS cấp. */
function fbmSyncPaintAuditBlocks(panel, status) {
  var metadata = status.metadata || {};
  fbmSyncPaintPreview(panel, metadata.preview);
  fbmSyncPaintAudit(panel, metadata.audit);
  fbmSyncPaintRecordIssues(panel, metadata);
}
/** Màn hình conflict riêng: chỉ render một record và các field khác nhau theo chiều dọc. */
function fbmSyncPaintConflictScreen(panel, status) {
  var metadata = status.metadata || {}, conflicts = Array.isArray(metadata.conflicts) ? metadata.conflicts : [], item = conflicts[0];
  var box = document.createElement('div'); box.className = 'shin-sync-audit shin-sync-conflict-screen';
  var back = document.createElement('button'); back.type = 'button'; back.className = 'shin-button'; back.id = 'fbm-sync-conflict-back'; back.textContent = 'Quay lại kết quả phiên'; box.appendChild(back);
  var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Xử lý xung đột (' + Number(metadata.conflictCount || conflicts.length) + ' còn lại)'; box.appendChild(title);
  if (!item) { var empty = document.createElement('div'); empty.className = 'shin-sync-preview-row'; empty.textContent = 'Không còn conflict chờ quyết định.'; box.appendChild(empty); panel.appendChild(box); return; }
  var identity = document.createElement('div'); identity.className = 'shin-sync-preview-row'; identity.textContent = String(item.entity || '') + ' · ' + String(item.id || '') + (item.fbmId ? ' · FBM ' + String(item.fbmId) : ''); box.appendChild(identity);
  (item.fields || []).forEach(function (field) {
    var group = document.createElement('div'); group.className = 'shin-sync-conflict-field';
    var name = document.createElement('div'); name.className = 'shin-sync-preview-title'; name.textContent = String(field.field || ''); group.appendChild(name);
    var shin = document.createElement('div'); shin.className = 'shin-sync-preview-row'; shin.textContent = 'ShinCRM: ' + String(field.left || '(trống)'); group.appendChild(shin);
    var fbm = document.createElement('div'); fbm.className = 'shin-sync-preview-row'; fbm.textContent = 'FBM: ' + String(field.right || '(trống)'); group.appendChild(fbm);
    var pick = document.createElement('select'); pick.className = 'shin-input shin-sync-conflict-choice'; pick.setAttribute('data-fbm-conflict-field', String(field.field || ''));
    [['shin', 'Giữ ShinCRM'], ['fbm', 'Giữ FBM'], ['manual', 'Tự nhập']].forEach(function (option) { var itemOption = document.createElement('option'); itemOption.value = option[0]; itemOption.textContent = option[1]; pick.appendChild(itemOption); });
    group.appendChild(pick);
    var manual = document.createElement('input'); manual.type = 'text'; manual.className = 'shin-input'; manual.hidden = true; manual.placeholder = 'Giá trị kết hợp cho trường này'; manual.setAttribute('data-fbm-conflict-manual', String(field.field || '')); group.appendChild(manual);
    box.appendChild(group);
  });
  var actions = document.createElement('div'); actions.className = 'shin-sync-actions';
  [['shin', 'Giữ toàn bộ ShinCRM'], ['fbm', 'Giữ toàn bộ FBM']].forEach(function (option) {
    var button = document.createElement('button'); button.type = 'button'; button.className = 'shin-button'; button.textContent = option[1];
    button.setAttribute('data-fbm-conflict-choice', option[0]); button.setAttribute('data-fbm-conflict-entity', String(item.entity || '')); button.setAttribute('data-fbm-conflict-id', String(item.id || '')); actions.appendChild(button);
  });
  var merge = document.createElement('button'); merge.type = 'button'; merge.className = 'shin-button shin-primary'; merge.textContent = 'Lưu lựa chọn từng trường'; merge.setAttribute('data-fbm-conflict-merge', 'true'); merge.setAttribute('data-fbm-conflict-entity', String(item.entity || '')); merge.setAttribute('data-fbm-conflict-id', String(item.id || '')); actions.appendChild(merge);
  box.appendChild(actions); panel.appendChild(box);
}
</script>
