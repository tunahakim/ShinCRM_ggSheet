<script>
function fbmSyncAuditContentBlocks(status) {
  var schema = FBM_SYNC_AUDIT_SCHEMA, ui = FBM_SYNC_AUDIT_UI;
  var metadata = status.metadata || {}, preview = metadata.preview || {}, audit = metadata.audit || {};
  var customers = Array.isArray(preview.customers) ? preview.customers : [], activities = Array.isArray(preview.activities) ? preview.activities : [];
  var blocks = [];
  if (customers.length || activities.length) {
    blocks.push(ui.card(schema.titles.preview, customers.slice(0, 10).map(function (item) { return Text({ className: ui.classes.preview, text: schema.labels.customer + String(item.code || '') + schema.labels.separator + String(item.name || '') }); }).concat(activities.slice(0, 10).map(function (item) { return Text({ className: ui.classes.preview, text: schema.labels.activity + String(item.date || '') + schema.labels.separator + String(item.type || '') + schema.labels.separator + String(item.content || '') }); }), preview.truncated ? [Text({ className: ui.classes.muted, text: schema.labels.truncated })] : [])));
  }
  if (Array.isArray(audit.cases) && audit.cases.length) {
    blocks.push(ui.card(schema.titles.scope, audit.cases.map(function (item) { return Text({ className: item.status === 'PASS' ? ui.classes.pass : ui.classes.error, text: (item.status === 'PASS' ? schema.labels.pass : schema.labels.fail) + String(item.name || '') + (item.detail ? schema.labels.separator + String(item.detail) : '') }); })));
  }
  return blocks.concat(fbmSyncRecordIssueBlocks(metadata));
}

function fbmSyncConflictContentBlocks(status) {
  var schema = FBM_SYNC_CONFLICT_SCHEMA, ui = FBM_SYNC_CONFLICT_UI, classes = ui.classes;
  // Bản ghi đang mở là DTO GAS trả khi mở chế độ xung đột, giữ trong RAM Sidebar; status chỉ mang số đếm.
  var metadata = status.metadata || {}, item = FBM_SYNC_CLIENT.conflict;
  var head = Row({ className: classes.head, elements: [Text({ className: classes.count, text: schema.remaining.replace('{count}', Number(item ? item.remaining : metadata.conflictCount) || 0) })] });
  if (!item) { return [ui.card([head, Empty(schema.empty)])]; }
  var invalid = FBM_SYNC_CLIENT.conflictInvalid || {}, missingCount = Object.keys(invalid).length;
  var bulk = StandaloneControl({ id: schema.ids.bulk, kind: 'menu', value: schema.bulk.none, ariaLabel: schema.labels.pick, options: [{ value: schema.bulk.none, label: schema.labels.pick }].concat([schema.bulk.fbm, schema.bulk.shin, schema.bulk.clear].map(function (value) { return { value: value, label: schema.bulkLabels[value] }; })) });
  var fields = (item.fields || []).map(function (field, index) {
    var label = String(field.label || field.field || '');
    var sides = schema.sides.map(function (side) {
      var view = fbmSyncConflictSide(field, side), key = index + '-' + side, sideLabel = side === 'fbm' ? schema.labels.fbmValue : schema.labels.shinValue;
      var fill = function (text) { return text.replace('{side}', sideLabel).replace('{field}', label); };
      return RowGroup({ elements: [
        Row({ className: classes.sideHead, elements: [Text({ className: classes.sideLabel, text: sideLabel }), Text({ id: schema.ids.editedPrefix + key, className: classes.edited, text: schema.labels.edited, hidden: !view.edited })] }),
        Row({ className: classes.sideRow, elements: [
          StandaloneControl({ id: schema.ids.valuePrefix + key, kind: 'textarea', value: view.value, placeholder: schema.labels.empty, readonly: !view.editable, className: uiClassJoin(classes.value, view.selected ? classes.selected : '', view.dimmed ? classes.dimmed : ''), data: { 'fbm-conflict-value': field.field, 'fbm-conflict-side': side }, ariaLabel: fill(schema.labels.valueAria) }),
          StandaloneControl({ id: schema.ids.radioPrefix + key, kind: 'radio', group: schema.ids.radioPrefix + index, value: side, pressed: view.selected, className: classes.radio, data: { 'fbm-conflict-pick': field.field, 'fbm-conflict-side': side }, ariaLabel: fill(schema.labels.choiceAria) })
        ] })
      ] });
    });
    return RowGroup({ id: schema.ids.fieldPrefix + index, className: uiClassJoin(classes.field, invalid[field.field] ? classes.invalid : ''), elements: [Row({ className: classes.fieldHead, elements: [Text({ className: classes.fieldName, text: label }), Text({ className: classes.pickLabel, text: schema.labels.pick })] })].concat(sides) });
  });
  var footer = [
    Text({ id: schema.ids.missing, className: classes.missing, text: schema.labels.missing.replace('{count}', missingCount), hidden: !missingCount }),
    Text({ id: schema.ids.pushNote, className: classes.note, text: schema.labels.pushNote, hidden: !fbmSyncConflictDecision(item).pushes }),
    Row({ className: classes.singleAction, elements: [Button({ id: schema.ids.save, label: schema.labels.save, className: uiResolveActionClass('save', 'button') })] }),
    Row({ className: classes.singleAction, elements: [Button({ id: schema.ids.back, label: schema.labels.back })] })
  ];
  var meta = [item.code || item.id, item.name].filter(function (part) { return !!part; }).join(schema.separators.meta);
  return [ui.card([head, Text({ className: classes.meta, text: meta }), bulk].concat(fields, footer))];
}

</script>
