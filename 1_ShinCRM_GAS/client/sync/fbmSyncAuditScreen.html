<script>
function fbmSyncPaintAuditBlocks(panel, status) {
  var metadata = status.metadata || {}, preview = metadata.preview || {}, audit = metadata.audit || {};
  var customers = Array.isArray(preview.customers) ? preview.customers : [], activities = Array.isArray(preview.activities) ? preview.activities : [];
  if (customers.length || activities.length) {
    var previewCard = fbmSyncAppendCard(panel, 'Bản ghi đã đọc'); var previewBody = previewCard.querySelector('.shin-card-body');
    customers.slice(0, 10).forEach(function (item) { fbmSyncAppendText(previewBody, 'Khách: ' + String(item.code || '') + ' · ' + String(item.name || ''), 'shin-sync-preview-row'); });
    activities.slice(0, 10).forEach(function (item) { fbmSyncAppendText(previewBody, 'Giao dịch: ' + String(item.date || '') + ' · ' + String(item.type || '') + ' · ' + String(item.content || ''), 'shin-sync-preview-row'); });
    if (preview.truncated) { fbmSyncAppendText(previewBody, 'Bản xem trước đã giới hạn số dòng.', 'shin-sync-muted'); }
  }
  if (Array.isArray(audit.cases) && audit.cases.length) {
    var auditCard = fbmSyncAppendCard(panel, 'Nghiệm thu phạm vi thử'); var auditBody = auditCard.querySelector('.shin-card-body');
    audit.cases.forEach(function (item) { fbmSyncAppendText(auditBody, (item.status === 'PASS' ? '✓ ' : '✕ ') + String(item.name || '') + (item.detail ? ' · ' + String(item.detail) : ''), item.status === 'PASS' ? 'shin-sync-pass-row' : 'shin-sync-error-message'); });
  }
  fbmSyncPaintRecordIssues(panel, metadata);
}

function fbmSyncPaintConflictScreen(panel, status) {
  var metadata = status.metadata || {}, conflicts = Array.isArray(metadata.conflicts) ? metadata.conflicts : [], item = conflicts[0];
  var card = fbmSyncAppendCard(panel, 'Xử lý xung đột', 'shin-sync-conflict-screen'); var body = card.querySelector('.shin-card-body');
  var head = fbmSyncAppendBox(body, 'shin-sync-conflict-head');
  fbmSyncAppendText(head, Number(metadata.conflictCount || conflicts.length) + ' xung đột còn lại', 'shin-sync-conflict-count');
  fbmSyncAppendButton(head, 'fbm-sync-conflict-back', 'Quay lại kết quả', false);
  if (!item) { fbmSyncAppendText(body, 'Không có xung đột cần xử lý.', 'shin-sync-empty-state'); return; }
  fbmSyncAppendText(body, String(item.entity || '') + ' · ' + String(item.id || '') + (item.fbmId ? ' · FBM ' + String(item.fbmId) : ''), 'shin-sync-conflict-meta');
  (item.fields || []).forEach(function (field) {
    var group = fbmSyncAppendBox(body, 'shin-sync-conflict-field');
    fbmSyncAppendText(group, String(field.field || ''), 'shin-sync-conflict-field-name');
    fbmSyncAppendText(group, 'ShinCRM: ' + String(field.left || '(trống)'), 'shin-sync-conflict-value shin-sync-conflict-value-shin');
    fbmSyncAppendText(group, 'FBM: ' + String(field.right || '(trống)'), 'shin-sync-conflict-value shin-sync-conflict-value-fbm');
    var pick = fbmSyncAppendSelect(group, '', [{ value: 'shin', label: 'Giữ ShinCRM' }, { value: 'fbm', label: 'Giữ FBM' }, { value: 'manual', label: 'Tự nhập' }], 'shin', 'shin-input shin-sync-conflict-choice'); pick.setAttribute('data-fbm-conflict-field', String(field.field || ''));
    var manual = fbmSyncAppendInput(group, '', 'text', '', 'Giá trị kết hợp'); manual.hidden = true; manual.setAttribute('data-fbm-conflict-manual', String(field.field || ''));
  });
  var actions = fbmSyncAppendBox(body, 'shin-sync-form-actions');
  [['shin', 'Giữ toàn bộ ShinCRM'], ['fbm', 'Giữ toàn bộ FBM']].forEach(function (option) { var button = fbmSyncAppendButton(actions, '', option[1], false); button.setAttribute('data-fbm-conflict-choice', option[0]); button.setAttribute('data-fbm-conflict-entity', String(item.entity || '')); button.setAttribute('data-fbm-conflict-id', String(item.id || '')); });
  var merge = fbmSyncAppendButton(actions, '', 'Lưu lựa chọn từng trường', true); merge.setAttribute('data-fbm-conflict-merge', 'true'); merge.setAttribute('data-fbm-conflict-entity', String(item.entity || '')); merge.setAttribute('data-fbm-conflict-id', String(item.id || ''));
}
</script>
