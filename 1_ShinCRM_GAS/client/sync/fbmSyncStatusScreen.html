<script>
/* Snapshot trạng thái dùng các Block chung; phần đang chạy có thể cập nhật tại chỗ để không làm chớp màn hình. */
function fbmSyncLiveStatusValue(status, count, field) {
  status = status || {}; count = count || {};
  if (field === 'phase') { return status.label || status.phase || 'Sẵn sàng'; }
  if (field === 'operation') { return 'Luồng: ' + String(status.direction || 'Chưa xác định') + ' · Đối tượng: ' + String(status.entityLabel || 'Tổng hợp'); }
  if (field === 'session') { return status.session ? 'Customer: ' + (status.session.customer ? 'Đã xác nhận' : 'Chưa có') + ' · Activity: ' + (status.session.activity ? 'Đã xác nhận' : 'Chưa có') : ''; }
  if (field === 'count') { return 'Đã xử lý ' + Number(count.completed || 0) + ' · thành công ' + Number(count.succeeded || 0) + ' · lỗi ' + Number(count.error || 0) + ' · xung đột ' + Number(count.conflict || 0) + ' · hoãn ' + Number(count.skipped || 0); }
  if (field === 'current') { return String(status.current || ''); }
  return String(status.message || '');
}
function fbmSyncLiveStatusNode(body, status, count, field, className) {
  var node = fbmSyncAppendText(body, fbmSyncLiveStatusValue(status, count, field), className);
  node.setAttribute('data-fbm-sync-live-status', field);
  node.hidden = !node.textContent;
  return node;
}
function fbmSyncPaintStatusBlocks(panel, status, count) {
  status = status || {}; count = count || {};
  var box = fbmSyncAppendCard(panel, 'Trạng thái phiên', 'shin-sync-status-card');
  var body = box.querySelector('.shin-card-body');
  fbmSyncLiveStatusNode(body, status, count, 'phase', 'shin-sync-phase');
  fbmSyncLiveStatusNode(body, status, count, 'operation', 'shin-sync-operation');
  fbmSyncLiveStatusNode(body, status, count, 'session', 'shin-sync-session');
  fbmSyncLiveStatusNode(body, status, count, 'count', 'shin-sync-count');
  fbmSyncPaintProgress(body, status, count);
  fbmSyncLiveStatusNode(body, status, count, 'current', 'shin-sync-current');
  fbmSyncLiveStatusNode(body, status, count, 'message', status.phase === 'error' ? 'shin-sync-error-message' : 'shin-sync-message');
}
function fbmSyncPatchLiveStatus(panel, status, screen) {
  if (!panel || String(panel.getAttribute('data-fbm-sync-screen') || '') !== String(screen || '') || (screen !== 'run' && screen !== 'results')) { return false; }
  var nodes = panel.querySelectorAll('[data-fbm-sync-live-status]');
  if (!nodes.length) { return false; }
  if (screen === 'run' && typeof fbmSyncPatchLivePipeline === 'function' && !fbmSyncPatchLivePipeline(panel, status)) { return false; }
  var count = status && status.counts || {};
  if (typeof fbmSyncPatchLiveProgress === 'function' && !fbmSyncPatchLiveProgress(panel, status, count)) { return false; }
  nodes.forEach(function (node) {
    var field = node.getAttribute('data-fbm-sync-live-status'), value = fbmSyncLiveStatusValue(status, count, field);
    node.textContent = value;
    node.hidden = !value;
    if (field === 'message') { node.className = status && status.phase === 'error' ? 'shin-sync-error-message' : 'shin-sync-message'; }
  });
  return true;
}
</script>
<script>
function fbmSyncPaintRecordIssues(panel, metadata) {
  metadata = metadata || {};
  var conflicts = Array.isArray(metadata.conflicts) ? metadata.conflicts : [];
  var preflight = Array.isArray(metadata.preflightIssues) ? metadata.preflightIssues : [];
  var failures = Object.keys(metadata.pushFailures || {});
  var categories = Array.isArray(metadata.categoryBlocks) ? metadata.categoryBlocks : [];
  if (!preflight.length && !conflicts.length && !failures.length && !categories.length) { return; }
  var card = fbmSyncAppendCard(panel, 'Cần xử lý', 'shin-sync-issues-card'); var body = card.querySelector('.shin-card-body');
  if (preflight.length) { fbmSyncAppendText(body, 'Preflight có ' + preflight.length + ' vấn đề; mở tab Lỗi để xem chi tiết.', 'shin-sync-error-message'); }
  if (conflicts.length) { fbmSyncAppendText(body, 'Có ' + Number(metadata.conflictCount || conflicts.length) + ' xung đột đang chờ quyết định.', 'shin-sync-preview-row'); var open = fbmSyncAppendButton(body, 'fbm-sync-open-conflicts', 'Mở xử lý xung đột', false); }
  if (failures.length) { fbmSyncAppendText(body, 'Có ' + failures.length + ' bản ghi lỗi đẩy; mở tab Lỗi để tra từng mã.', 'shin-sync-preview-row'); }
  if (categories.length) { fbmSyncAppendText(body, 'Có ' + categories.length + ' bản ghi bị chặn do Category.', 'shin-sync-preview-row'); }
}
</script>
