<script>
/* Snapshot trạng thái dùng các Block chung; chỉ thay vùng đọc để không làm chớp control. */
function fbmSyncLiveStatusValue(status, count, field) {
  status = status || {}; count = count || {};
  var schema = FBM_SYNC_STATUS_SCHEMA;
  if (field === 'phase') { return status.label || status.phase || schema.phaseFallback; }
  if (field === 'operation') { return schema.operationPrefix + String(status.direction || schema.operationFallback) + schema.operationSeparator + String(status.entityLabel || schema.entityFallback); }
  if (field === 'session') { return status.session ? schema.sessionCustomer + (status.session.customer ? schema.confirmed : schema.absent) + schema.sessionActivity + (status.session.activity ? schema.confirmed : schema.absent) : ''; }
  if (field === 'count') { return schema.count.completed + Number(count.completed || 0) + schema.count.succeeded + Number(count.succeeded || 0) + schema.count.error + Number(count.error || 0) + schema.count.conflict + Number(count.conflict || 0) + schema.count.skipped + Number(count.skipped || 0); }
  if (field === 'current') { return String(status.current || ''); }
  return String(status.message || '');
}
function fbmSyncProgressBlocks(status, count) {
  var data = fbmSyncProgressData(status || {}, count || {});
  var schema = FBM_SYNC_STATUS_SCHEMA;
  return schema.layout.progress({ label: data.label, trackClass: !data.active ? ' ' + schema.classes.idle : '', ariaValueNow: data.determinate ? String(data.percent) : null, fillClass: (!data.determinate && data.active ? ' ' + schema.classes.indeterminate : '') + (data.waitingForResponse ? ' ' + schema.classes.waiting : ''), width: data.determinate ? data.percent + '%' : data.active ? '35%' : '0%' });
}
function fbmSyncStatusBlocks(status, count) {
  status = status || {}; count = count || {};
  var schema = FBM_SYNC_STATUS_SCHEMA, fields = [['phase', schema.classes.phase], ['operation', schema.classes.operation], ['session', schema.classes.session], ['count', schema.classes.count], ['current', schema.classes.current], ['message', status.phase === 'error' ? schema.classes.error : schema.classes.message]];
  var elements = fields.map(function (item) {
    var value = fbmSyncLiveStatusValue(status, count, item[0]);
    return value ? Text({ className: item[1], text: value }) : null;
  }).filter(function (node) { return !!node; });
  elements.splice(4, 0, fbmSyncProgressBlocks(status, count));
  return [schema.layout.card(elements)];
}
function fbmSyncPatchStatusBlocks(panel, status, targetId) {
  var id = targetId || FBM_SYNC_STATUS_SCHEMA.regions.liveStatus;
  if (!panel || !RENDER_INDEX.nodes[id]) { return false; }
  fbmSyncRenderTarget(id, fbmSyncStatusBlocks(status, status && status.counts || {}));
  return true;
}
function fbmSyncPatchLiveStatus(panel, status, screen) {
  if (!panel || String(panel.getAttribute('data-fbm-sync-screen') || '') !== String(screen || '') || (screen !== 'run' && screen !== 'results')) { return false; }
  if (screen === 'run' && typeof fbmSyncPatchLivePipeline === 'function' && !fbmSyncPatchLivePipeline(panel, status)) { return false; }
  return fbmSyncPatchStatusBlocks(panel, status);
}
</script>
<script>
function fbmSyncRecordIssueBlocks(metadata) {
  metadata = metadata || {};
  var schema = FBM_SYNC_ISSUES_SCHEMA;
  var conflicts = Array.isArray(metadata.conflicts) ? metadata.conflicts : [];
  var preflight = Array.isArray(metadata.preflightIssues) ? metadata.preflightIssues : [];
  var identityBlocks = Array.isArray(metadata.identityBlocks) ? metadata.identityBlocks : [];
  var pushFailures = metadata.pushFailures || {};
  var pushFailureDetails = metadata.pushFailureDetails || {};
  var failures = Object.keys(pushFailures);
  Object.keys(pushFailureDetails).forEach(function (key) { if (failures.indexOf(key) < 0) { failures.push(key); } });
  var categories = Array.isArray(metadata.categoryBlocks) ? metadata.categoryBlocks : [];
  var activityMissing = Array.isArray(metadata.activityBulkMissing) ? metadata.activityBulkMissing : [];
  var hasRecordIssues = conflicts.length || identityBlocks.length || failures.length || categories.length || activityMissing.length;
  var blocks = [];
  if (preflight.length) {
    blocks.push(schema.layout.card(schema.titles.preflight, preflight.slice(-30).map(function (item) {
      var severity = item && item.blocking ? schema.classes.error : schema.classes.preview;
      return Text({ className: severity, text: (item && item.blocking ? schema.preflight.error : schema.preflight.warning) + schema.code + String(item && item.code || '') + schema.closeCode + ' ' + String(item && item.message || '') });
    })));
  }
  if (!hasRecordIssues) { return blocks; }
  var elements = [];
  if (conflicts.length) { elements.push(Text({ className: schema.classes.preview, text: schema.conflict.message.replace('{count}', Number(metadata.conflictCount || conflicts.length)) }), Button({ id: schema.ids.openConflicts, label: schema.conflict.action })); }
  identityBlocks.slice(-20).forEach(function (item) { elements.push(Text({ className: schema.classes.preview, text: schema.identity + String(item && item.fbmCustomerCode || '') + schema.separator + String(item && item.reason || '') })); });
  if (failures.length) {
    elements.push(Text({ className: schema.classes.preview, text: schema.failures.message.replace('{count}', failures.length) }), Button({ label: schema.failures.action.replace('{count}', failures.length), data: { [schema.ids.retryAll]: true } }));
    failures.slice(-5).forEach(function (key) {
      var detail = pushFailureDetails[key] || {}, suffix = detail.reason ? schema.separator + String(detail.reason) : '';
      if (detail.code) { suffix += schema.code + String(detail.code) + (detail.status ? schema.http + String(detail.status) : '') + schema.closeCode; }
      if (detail.requestKind) { suffix += schema.step + String(detail.requestKind); }
      elements.push(Text({ className: schema.classes.preview, text: schema.failures.item + String(key) + suffix }));
    });
  }
  categories.slice(-20).forEach(function (item) { elements.push(Text({ className: schema.classes.preview, text: schema.category + String(item && item.source || schema.categoryFallback) + (item && item.code ? schema.separator + String(item.code) : '') + (item && item.reason ? schema.separator + String(item.reason) : '') })); });
  activityMissing.slice(-20).forEach(function (item) { elements.push(Text({ className: schema.classes.preview, text: schema.activityMissing + String(item && item.id || '') + (item && item.fbmId ? schema.separator + schema.fbmPrefix + String(item.fbmId) : '') })); });
  blocks.push(schema.layout.card(schema.titles.details, elements));
  return blocks;
}
</script>
