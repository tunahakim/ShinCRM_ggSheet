<script>
/* Snapshot trạng thái dùng các Block chung; chỉ thay vùng đọc để không làm chớp control. */
function fbmSyncStatusLine(label, value) { return label + FBM_SYNC_STATUS_SCHEMA.labelSeparator + value; }
/** Thông tin lượt, mỗi ý một dòng; ý nào không có giá trị thì không hiện. */
function fbmSyncStatusInfoLines(status) {
  var schema = FBM_SYNC_STATUS_SCHEMA, lines = [], active = fbmSyncProgressData(status, {}).active;
  lines.push(fbmSyncStatusLine(schema.info.direction, String(status.direction || schema.directionFallback)));
  var pack = (FBM_SYNC_RUN_SCHEMA.pack.options || []).filter(function (option) { return option.value === status.scanPack; })[0];
  // Lượt không theo gói (Giữ phiên có đẩy) mang nhãn do GAS đặt.
  var packLabel = pack ? pack.label : String(status.scanLabel || '');
  if (packLabel) { lines.push(fbmSyncStatusLine(schema.info.pack, packLabel)); }
  if (status.session) { lines.push(fbmSyncStatusLine(schema.info.session, schema.session.customer + (status.session.customer ? schema.session.confirmed : schema.session.absent) + schema.session.separator + schema.session.activity + (status.session.activity ? schema.session.confirmed : schema.session.absent))); }
  if (active && (status.entityLabel || status.current)) { lines.push(fbmSyncStatusLine(schema.info.current, [status.entityLabel, status.current].filter(function (part) { return !!part; }).join(' '))); }
  return lines;
}
/** Kết quả lượt theo bộ đếm GAS; chưa có lượt nào thì không hiện. Dòng đẩy chỉ hiện ở chiều có đẩy. */
function fbmSyncStatusResultLines(status, count) {
  var schema = FBM_SYNC_STATUS_SCHEMA;
  if (!status.runId) { return []; }
  return schema.results.filter(function (item) { return !item.pushOnly || status.canPush; }).map(function (item) {
    var value = item.parts
      ? item.parts.map(function (part) { return valueTextNumber(Number(count[part.key] || 0)) + part.unit; }).join(schema.session.separator)
      : valueTextNumber(Number(count[item.key] || 0));
    return fbmSyncStatusLine(item.label, value);
  });
}
function fbmSyncProgressBlocks(status, count) {
  var data = fbmSyncProgressData(status || {}, count || {});
  var schema = FBM_SYNC_STATUS_SCHEMA;
  return FBM_SYNC_STATUS_UI.layout.progress({ label: data.label, trackClass: !data.active ? FBM_SYNC_STATUS_UI.classes.idle : '', ariaValueNow: data.determinate ? String(data.percent) : null, fillClass: uiClassJoin(!data.determinate && data.active ? FBM_SYNC_STATUS_UI.classes.indeterminate : '', data.waitingForResponse ? FBM_SYNC_STATUS_UI.classes.waiting : ''), width: data.determinate ? data.percent + '%' : data.active ? '35%' : '0%' });
}
function fbmSyncStatusBlocks(status, count) {
  status = status || {}; count = count || {};
  var schema = FBM_SYNC_STATUS_SCHEMA, classes = FBM_SYNC_STATUS_UI.classes;
  var item = function (text) { return Text({ className: classes.item, text: text }); };
  var results = fbmSyncStatusResultLines(status, count);
  var elements = [Text({ className: classes.phase, text: status.label || status.phase || schema.phaseFallback })]
    .concat(fbmSyncStatusInfoLines(status).map(item))
    .concat([fbmSyncProgressBlocks(status, count)])
    .concat(results.length ? [Text({ className: classes.heading, text: schema.resultsTitle })].concat(results.map(item)) : []);
  if (status.message) { elements.push(Text({ className: status.phase === 'error' ? classes.error : classes.message, text: String(status.message) })); }
  return [FBM_SYNC_STATUS_UI.layout.card(elements)];
}
function fbmSyncPatchStatusBlocks(panel, status, targetId) {
  var id = targetId || FBM_SYNC_STATUS_SCHEMA.regions.liveStatus;
  if (!panel || !RENDER_INDEX.nodes[id]) { return false; }
  fbmSyncRenderTarget(id, fbmSyncStatusBlocks(status, status && status.counts || {}));
  return true;
}
function fbmSyncPatchLiveStatus(panel, status, screen) {
  if (!panel || String(panel.getAttribute('data-fbm-sync-screen') || '') !== String(screen || '') || (screen !== 'run' && screen !== 'results')) { return false; }
  if (screen === 'run' && typeof fbmSyncPatchLivePipeline === 'function' && !fbmSyncPatchLivePipeline(panel, status)) { return false; }
  return fbmSyncPatchStatusBlocks(panel, status);
}
</script>
<script>
function fbmSyncRecordIssueBlocks(metadata) {
  metadata = metadata || {};
  var schema = FBM_SYNC_ISSUES_SCHEMA, ui = FBM_SYNC_ISSUES_UI;
  var conflictCount = Number(metadata.conflictCount || 0);
  var preflight = Array.isArray(metadata.preflightIssues) ? metadata.preflightIssues : [];
  var identityBlocks = Array.isArray(metadata.identityBlocks) ? metadata.identityBlocks : [];
  var pushFailures = metadata.pushFailures || {};
  var pushFailureDetails = metadata.pushFailureDetails || {};
  var failures = Object.keys(pushFailures);
  Object.keys(pushFailureDetails).forEach(function (key) { if (failures.indexOf(key) < 0) { failures.push(key); } });
  var categories = Array.isArray(metadata.categoryBlocks) ? metadata.categoryBlocks : [];
  var activityMissing = Array.isArray(metadata.activityBulkMissing) ? metadata.activityBulkMissing : [];
  var customerErrors = metadata.customerErrors || {}, customerErrorTotal = Number(customerErrors.total || 0);
  var hasRecordIssues = conflictCount || identityBlocks.length || failures.length || categories.length || activityMissing.length || customerErrorTotal;
  var blocks = [];
  if (preflight.length) {
    blocks.push(ui.card(schema.titles.preflight, preflight.slice(-30).map(function (item) {
      var severity = item && item.blocking ? ui.classes.error : ui.classes.preview;
      return Text({ className: severity, text: (item && item.blocking ? schema.preflight.error : schema.preflight.warning) + schema.code + String(item && item.code || '') + schema.closeCode + ' ' + String(item && item.message || '') });
    })));
  }
  if (!hasRecordIssues) { return blocks; }
  var elements = [];
  if (conflictCount) { elements.push(Text({ className: ui.classes.preview, text: schema.conflict.message.replace('{count}', conflictCount) }), Button({ id: schema.ids.openConflicts, label: schema.conflict.action })); }
  identityBlocks.slice(-20).forEach(function (item) { elements.push(Text({ className: ui.classes.preview, text: schema.identity + String(item && item.fbmCustomerCode || '') + schema.separator + String(item && item.reason || '') })); });
  if (failures.length) {
    elements.push(Text({ className: ui.classes.preview, text: schema.failures.message.replace('{count}', failures.length) }), Button({ label: schema.failures.action.replace('{count}', failures.length), data: { [schema.ids.retryAll]: true } }));
    failures.slice(-5).forEach(function (key) {
      var detail = pushFailureDetails[key] || {}, suffix = detail.reason ? schema.separator + String(detail.reason) : '';
      if (detail.code) { suffix += schema.code + String(detail.code) + (detail.status ? schema.http + String(detail.status) : '') + schema.closeCode; }
      if (detail.requestKind) { suffix += schema.step + String(detail.requestKind); }
      elements.push(Text({ className: ui.classes.preview, text: schema.failures.item + String(key) + suffix }));
    });
  }
  if (customerErrorTotal) {
    elements.push(Text({ className: ui.classes.error, text: schema.customerErrors.message.replace('{count}', customerErrorTotal) }));
    (Array.isArray(customerErrors.recent) ? customerErrors.recent : []).forEach(function (item) { elements.push(Text({ className: ui.classes.preview, text: schema.customerErrors.item + String(item && item.customer || '') + schema.separator + String(item && item.reason || '') + schema.code + String(item && item.code || '') + (item && item.status ? schema.http + String(item.status) : '') + schema.closeCode })); });
  }
  categories.slice(-20).forEach(function (item) { elements.push(Text({ className: ui.classes.preview, text: schema.category + String(item && item.source || schema.categoryFallback) + (item && item.code ? schema.separator + String(item.code) : '') + (item && item.reason ? schema.separator + String(item.reason) : '') })); });
  activityMissing.slice(-20).forEach(function (item) { elements.push(Text({ className: ui.classes.preview, text: schema.activityMissing + String(item && item.id || '') + (item && item.fbmId ? schema.separator + schema.fbmPrefix + String(item.fbmId) : '') })); });
  blocks.push(ui.card(schema.titles.details, elements));
  return blocks;
}
</script>
