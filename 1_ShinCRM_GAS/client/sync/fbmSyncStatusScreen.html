<script>
/* Snapshot trạng thái dùng các Block chung; chỉ thay vùng đọc để không làm chớp control. */
function fbmSyncLiveStatusValue(status, count, field) {
  status = status || {}; count = count || {};
  if (field === 'phase') { return status.label || status.phase || 'Sẵn sàng'; }
  if (field === 'operation') { return 'Luồng: ' + String(status.direction || 'Chưa xác định') + ' · Đối tượng: ' + String(status.entityLabel || 'Tổng hợp'); }
  if (field === 'session') { return status.session ? 'Customer: ' + (status.session.customer ? 'Đã xác nhận' : 'Chưa có') + ' · Activity: ' + (status.session.activity ? 'Đã xác nhận' : 'Chưa có') : ''; }
  if (field === 'count') { return 'Đã xử lý ' + Number(count.completed || 0) + ' · thành công ' + Number(count.succeeded || 0) + ' · lỗi ' + Number(count.error || 0) + ' · xung đột ' + Number(count.conflict || 0) + ' · hoãn ' + Number(count.skipped || 0); }
  if (field === 'current') { return String(status.current || ''); }
  return String(status.message || '');
}
function fbmSyncProgressBlocks(status, count) {
  var data = fbmSyncProgressData(status || {}, count || {});
  return Box({ className: 'shin-sync-progress', elements: [
    Text({ id: 'fbm-sync-progress-label', className: 'shin-sync-progress-label', text: data.label }),
    Box({ id: 'fbm-sync-progress-track', className: 'shin-sync-progress-track', ariaValueNow: data.determinate ? String(data.percent) : null, elements: [Box({ id: 'fbm-sync-progress-fill', className: 'shin-sync-progress-fill' + (!data.determinate && data.active ? ' is-indeterminate' : '') + (data.waitingForResponse ? ' is-waiting' : ''), spatialConfig: { width: data.determinate ? data.percent + '%' : '35%' }, elements: [] })] })
  ] });
}
function fbmSyncStatusBlocks(status, count) {
  status = status || {}; count = count || {};
  var fields = [['phase', 'shin-sync-phase'], ['operation', 'shin-sync-operation'], ['session', 'shin-sync-session'], ['count', 'shin-sync-count'], ['current', 'shin-sync-current'], ['message', status.phase === 'error' ? 'shin-error-message' : 'shin-sync-message']];
  var elements = fields.map(function (item) {
    var value = fbmSyncLiveStatusValue(status, count, item[0]);
    return value ? Text({ className: item[1], text: value }) : null;
  }).filter(function (node) { return !!node; });
  elements.splice(4, 0, fbmSyncProgressBlocks(status, count));
  return [Card({ title: 'Trạng thái phiên', elements: elements })];
}
function fbmSyncPatchStatusBlocks(panel, status, targetId) {
  var id = targetId || 'fbm-sync-live-status-region';
  if (!panel || !RENDER_INDEX.nodes[id]) { return false; }
  fbmSyncRenderTarget(id, fbmSyncStatusBlocks(status, status && status.counts || {}));
  return true;
}
function fbmSyncPatchLiveStatus(panel, status, screen) {
  if (!panel || String(panel.getAttribute('data-fbm-sync-screen') || '') !== String(screen || '') || (screen !== 'run' && screen !== 'results')) { return false; }
  if (screen === 'run' && typeof fbmSyncPatchLivePipeline === 'function' && !fbmSyncPatchLivePipeline(panel, status)) { return false; }
  return fbmSyncPatchStatusBlocks(panel, status);
}
</script>
<script>
function fbmSyncRecordIssueBlocks(metadata) {
  metadata = metadata || {};
  var conflicts = Array.isArray(metadata.conflicts) ? metadata.conflicts : [];
  var preflight = Array.isArray(metadata.preflightIssues) ? metadata.preflightIssues : [];
  var identityBlocks = Array.isArray(metadata.identityBlocks) ? metadata.identityBlocks : [];
  var pushFailures = metadata.pushFailures || {};
  var pushFailureDetails = metadata.pushFailureDetails || {};
  var failures = Object.keys(pushFailures);
  Object.keys(pushFailureDetails).forEach(function (key) { if (failures.indexOf(key) < 0) { failures.push(key); } });
  var categories = Array.isArray(metadata.categoryBlocks) ? metadata.categoryBlocks : [];
  var activityMissing = Array.isArray(metadata.activityBulkMissing) ? metadata.activityBulkMissing : [];
  var hasRecordIssues = conflicts.length || identityBlocks.length || failures.length || categories.length || activityMissing.length;
  var blocks = [];
  if (preflight.length) {
    blocks.push(Card({ title: 'Preflight', elements: preflight.slice(-30).map(function (item) {
      var severity = item && item.blocking ? 'shin-error-message' : 'shin-preview-row';
      return Text({ className: severity, text: (item && item.blocking ? 'Lỗi' : 'Cảnh báo') + ' [' + String(item && item.code || '') + '] ' + String(item && item.message || '') });
    }) }));
  }
  if (!hasRecordIssues) { return blocks; }
  var elements = [];
  if (conflicts.length) { elements.push(Text({ className: 'shin-preview-row', text: 'Có ' + Number(metadata.conflictCount || conflicts.length) + ' xung đột đang chờ quyết định.' }), Button({ id: 'fbm-sync-open-conflicts', label: 'Mở xử lý xung đột' })); }
  identityBlocks.slice(-20).forEach(function (item) { elements.push(Text({ className: 'shin-preview-row', text: 'Chặn nhận diện Customer ' + String(item && item.fbmCustomerCode || '') + ' · ' + String(item && item.reason || '') })); });
  if (failures.length) {
    elements.push(Text({ className: 'shin-preview-row', text: 'Có ' + failures.length + ' bản ghi lỗi đẩy; mở tab Lỗi để tra từng mã.' }), Button({ label: 'Mở lại ' + failures.length + ' bản ghi lỗi', data: { 'fbm-push-retry-all': true } }));
    failures.slice(-5).forEach(function (key) {
      var detail = pushFailureDetails[key] || {}, suffix = detail.reason ? ' · ' + String(detail.reason) : '';
      if (detail.code) { suffix += ' [' + String(detail.code) + (detail.status ? ' HTTP ' + String(detail.status) : '') + ']'; }
      if (detail.requestKind) { suffix += ' · bước ' + String(detail.requestKind); }
      elements.push(Text({ className: 'shin-preview-row', text: 'Lỗi đẩy ' + String(key) + suffix }));
    });
  }
  categories.slice(-20).forEach(function (item) { elements.push(Text({ className: 'shin-preview-row', text: 'Chặn do Category ' + String(item && item.source || 'Category') + (item && item.code ? ' · ' + String(item.code) : '') + (item && item.reason ? ' · ' + String(item.reason) : '') })); });
  activityMissing.slice(-20).forEach(function (item) { elements.push(Text({ className: 'shin-preview-row', text: 'Activity không thấy trong FBM ' + String(item && item.id || '') + (item && item.fbmId ? ' · FBM ' + String(item.fbmId) : '') })); });
  blocks.push(Card({ title: 'Chi tiết bản ghi', elements: elements }));
  return blocks;
}
</script>
