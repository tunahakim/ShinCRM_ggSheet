<script>
/* Khai báo tĩnh cho module Đồng bộ; renderer chỉ đọc các màn hình này, không chứa nghiệp vụ. */
var FBM_SYNC_UI_SCHEMA = {
  screens: [
    { id: 'run', label: 'Chạy đồng bộ' },
    { id: 'account', label: 'Tài khoản FBM' },
    { id: 'results', label: 'Kết quả & xử lý' },
    { id: 'settings', label: 'Cài đặt phiên' }
  ],
  modes: [
    { value: 'check', label: 'Kiểm tra an toàn' },
    { value: 'read', label: 'Lấy từ FBM → ShinCRM' },
    { value: 'push', label: 'Đẩy từ ShinCRM → FBM' },
    { value: 'write', label: 'Đồng bộ hai chiều' }
  ]
};

/* Các màn hình động vẫn khai bằng Block; DOM chỉ được chạm qua cổng renderer chung. */
function fbmSyncAppendBlock(parent, node, ctx) { return renderBlockInto(parent, node, ctx || {}); }
function fbmSyncReplaceBlocks(parent, nodes, ctx) { return renderReplaceChildren(parent, nodes || [], ctx || {}); }
function fbmSyncRenderTarget(id, elements) {
  var target = RENDER_INDEX.nodes[id];
  if (!target) { throw new Error('Vùng Đồng bộ FBM "' + id + '" chưa được khai bằng Block.'); }
  target.elements = Array.isArray(elements) ? elements : [];
  return renderTarget(id);
}
function fbmSyncSetTargetState(id, state) { return renderTargetState(id, state || {}); }
function fbmSyncAppendBox(parent, className, id, elements, data) { return fbmSyncAppendBlock(parent, Box({ id: id || null, className: className || '', elements: elements || [], data: data || null })); }
</script>
