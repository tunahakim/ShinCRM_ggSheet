<script>
/* Sidebar chỉ hiển thị tiến độ; GAS là nguồn state duy nhất. */

}

/** Tạo nút điều khiển dùng chung cho panel tiến độ. */
function fbmSyncMakeButton(id, label, primary) {

}
/** Mở/đóng panel và chỉ hỏi GAS khi người dùng vừa mở panel. */
function syncPanelToggle() {
  var screen = document.getElementById('fbm-sync-screen');
  if (!screen) { throw new Error('Sidebar thieu man dong bo FBM.'); }
  screen.hidden = false;
  FBM_SYNC_CLIENT.subscreen = 'overview'; FBM_SYNC_CLIENT.openedAt = Date.now(); FBM_SYNC_CLIENT.viewEpoch += 1;
  if (screen.hidden || typeof fbmSyncStatusOnce !== 'function') { return null; }
  // Relay config chỉ phục vụ các request FBM; không cần chặn snapshot trạng thái.
  return Promise.all([fbmSyncConfigureRelay(), fbmSyncStatusOnce(true), fbmSyncLoadIdentityStatus()]).then(function (results) { return fbmSyncLoadLoginStatus().then(function () { return results[1]; }); });
}
function fbmSyncLoadIdentityStatus() {
  if (typeof callServer !== 'function') { return Promise.resolve(null); }
  return callServer('fbmGetIdentityStatus').then(function (identity) {
    FBM_SYNC_CLIENT.identityStatus = identity || {};
    if (FBM_SYNC_CLIENT.lastStatus) { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus); }
    return identity;
  }).catch(function () { return null; });
}
function fbmSyncLoadLoginStatus() {
  if (typeof callServer !== 'function') { return Promise.resolve(null); }
  return callServer('fbmGetLoginConfig').then(function (login) { FBM_SYNC_CLIENT.loginStatus = login || {}; if (FBM_SYNC_CLIENT.lastStatus) { fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus); } return login; }).catch(function () { return null; });
}
/** Đưa cấu hình Web App/khóa sang Extension; không gửi cookie hay payload FBM. */
function fbmSyncConfigureRelay() {

  return callServer('fbmGetRelayConfig').then(function (config) {
    FBM_SYNC_CLIENT.relayConfigured = true;
    fbmSyncPostRelayConfig(config, false);
    return config;
  }).catch(function () { return null; });
}
/** Gửi relay config và tùy chọn chờ Extension xác nhận đã lưu. */
function fbmSyncPostRelayConfig(config, requireAck) {
  if (window.top === window || !config || !config.url || !config.key) { return Promise.resolve(false); }
  var id = String(Date.now()) + '-' + Math.random().toString(36).slice(2);
  if (!requireAck) {
    window.top.postMessage({ action: 'CRM_FBM_CONFIG', id: id, nonce: SHEET_LINK_NONCE, config: { url: config.url, key: config.key, spreadsheetId: config.spreadsheetId || '' } }, 'https://docs.google.com');
    return Promise.resolve(true);
  }
  return new Promise(function (resolve, reject) {
    var timer = setTimeout(function () { delete FBM_SYNC_CLIENT.relayWaiters[id]; reject(new Error('Extension không xác nhận đã lưu khóa relay mới.')); }, 5000);
    FBM_SYNC_CLIENT.relayWaiters[id] = { resolve: resolve, reject: reject, timer: timer };
    window.top.postMessage({ action: 'CRM_FBM_CONFIG', id: id, nonce: SHEET_LINK_NONCE, config: { url: config.url, key: config.key, spreadsheetId: config.spreadsheetId || '' } }, 'https://docs.google.com');
  });
}
/** Vẽ snapshot status, không suy diễn nghiệp vụ ở client. */
function fbmSyncPaint(status, freshOpen) {
  var panel = document.getElementById('fbm-sync-content');
  if (!panel || !status) { return; }
  // GAS orchestration returns { ok, request, status }; the panel only paints the inner snapshot.
  status = status.status || status;
  FBM_SYNC_CLIENT.lastStatus = status;
  // Do not replay a terminal error from an earlier sidebar session as the new screen's state.
  if (freshOpen && status.phase === 'error' && Number(status.updatedAt || 0) < Number(FBM_SYNC_CLIENT.openedAt || 0)) {
    status = Object.assign({}, status, { phase: 'idle', label: 'Sẵn sàng', message: '', lastError: '', counts: { total: 0, completed: 0, succeeded: 0, error: 0, conflict: 0, skipped: 0 } });
  }
  fbmSyncPaintHeaderState(status);
  if (status.writeAllowed !== undefined) { FBM_SYNC_CLIENT.writeAllowed = status.writeAllowed === true; }

  panel.hidden = false; panel.textContent = '';
  var count = status.counts || {};
  var active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(status.phase) >= 0;
  if (typeof fbmSyncRenderShell === 'function') { fbmSyncRenderShell(status); }
  if (FBM_SYNC_CLIENT.subscreen === 'account' && typeof fbmSyncRenderAccount === 'function') { fbmSyncRenderAccount(panel, status); }
  else if (FBM_SYNC_CLIENT.subscreen === 'run' && typeof fbmSyncRenderRun === 'function') { fbmSyncRenderRun(panel, status); }
  else if (FBM_SYNC_CLIENT.subscreen === 'results' && typeof fbmSyncRenderResults === 'function') { fbmSyncRenderResults(panel, status); }
  else if (typeof fbmSyncRenderOverview === 'function') { fbmSyncRenderOverview(panel, status); }

  if (typeof fbmSyncApplyMasterDisabled === 'function') { fbmSyncApplyMasterDisabled(status); }
}
/** Đồng bộ màu icon header với phase hiện tại của phiên GAS. */
function fbmSyncPaintHeaderState(status) {
  var button = document.getElementById('fbm-sync-menu');
  if (!button || !status) { return; }
  ['running', 'paused', 'error'].forEach(function (name) { button.classList.remove('shin-sync-status-' + name); });
  var phase = String(status.phase || '');
  var state = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(phase) >= 0 ? 'running' : (['paused', 'conflict'].indexOf(phase) >= 0 ? 'paused' : (phase === 'error' ? 'error' : ''));

}
/** Vẽ tiến trình riêng của phiên, không dùng chung dải loading của Sidebar. */
function fbmSyncPaintProgress(panel, status, count) {
  var phase = String(status.phase || ''), active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(phase) >= 0;
  var waitingForResponse = active && status.cursor && status.cursor.kind === 'push_wait';
  var total = Math.max(0, Number(count.total || 0)), completed = Math.max(0, Number(count.completed || 0));

  var label = document.createElement('div'); label.className = 'shin-sync-progress-label';
  label.textContent = determinate ? 'Tiến trình: ' + completed + '/' + total + ' (' + percent + '%)' + (waitingForResponse ? ' · đang chờ phản hồi' : '') : (active ? 'Tiến trình: đang xử lý…' : 'Tiến trình: chưa có tổng số bản ghi');

/** Render only bounded, read-only fields returned by the GAS preview snapshot. */
function fbmSyncPaintPreview(panel, preview) {
  if (!preview) { return; }
  var customers = preview.customers || [], activities = preview.activities || [];
  if (!customers.length && !activities.length) { return; }
  var box = document.createElement('div'); box.className = 'shin-sync-preview';
  var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Dữ liệu đã đọc'; box.appendChild(title);
  var list = document.createElement('div'); list.className = 'shin-sync-preview-list'; box.appendChild(list);
  customers.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Khách: ' + (item.code || '(không có mã)') + ' · ' + (item.name || '(không có tên)'); list.appendChild(row);
  });
  activities.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Giao dịch: ' + (item.date || '(không có ngày)') + ' · ' + (item.type || '(không có loại)') + ' · ' + (item.content || '(trống)'); list.appendChild(row);
  });
  if (preview.truncated) { var more = document.createElement('div'); more.className = 'shin-sync-preview-more'; more.textContent = 'Preview đã giới hạn số dòng.'; box.appendChild(more); }
  panel.appendChild(box);

/** Hiển thị kết quả từng case nghiệm thu sau lượt Đọc thử. */

  metadata = metadata || {};
  var conflicts = Array.isArray(metadata.conflicts) ? metadata.conflicts : [];
  var identityBlocks = Array.isArray(metadata.identityBlocks) ? metadata.identityBlocks : [];
  var pushFailures = metadata.pushFailures || {};
  var pushFailureDetails = metadata.pushFailureDetails || {};
  var preflightIssues = Array.isArray(metadata.preflightIssues) ? metadata.preflightIssues : [];
  var categoryBlocks = Array.isArray(metadata.categoryBlocks) ? metadata.categoryBlocks : [];
  var activityMissing = Array.isArray(metadata.activityBulkMissing) ? metadata.activityBulkMissing : [];
  var hasRecordIssues = conflicts.length || identityBlocks.length || Object.keys(pushFailures).length || categoryBlocks.length || activityMissing.length;
  if (!preflightIssues.length && !hasRecordIssues) { return; }

  if (preflightIssues.length) {
    var preflightTitle = document.createElement('div'); preflightTitle.className = 'shin-sync-preview-title'; preflightTitle.textContent = 'Preflight'; box.appendChild(preflightTitle);
    preflightIssues.slice(-30).forEach(function (item) {

      preflightRow.textContent = (item.blocking ? 'Loi' : 'Canh bao') + ' [' + String(item.code || '') + '] ' + String(item.message || ''); box.appendChild(preflightRow);
    });
  }
  if (hasRecordIssues) {
    var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Chi tiết bản ghi'; box.appendChild(title);
  }
  if (conflicts.length) {
    var conflictSummary = document.createElement('div'); conflictSummary.className = 'shin-sync-preview-row';
    conflictSummary.textContent = 'Có ' + Number(metadata.conflictCount || conflicts.length) + ' xung đột đang chờ quyết định.';
    box.appendChild(conflictSummary);
    var conflictButton = document.createElement('button'); conflictButton.type = 'button'; conflictButton.className = 'shin-button'; conflictButton.id = 'fbm-sync-open-conflicts'; conflictButton.textContent = 'Mở màn hình xử lý xung đột'; box.appendChild(conflictButton);
  }
  identityBlocks.slice(-20).forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Chặn nhận diện Customer ' + String(item.fbmCustomerCode || '') + ' · ' + String(item.reason || ''); box.appendChild(row);
  });
  var failureKeys = Object.keys(pushFailures);
  if (failureKeys.length) {
    var failureSummary = document.createElement('div'); failureSummary.className = 'shin-sync-preview-row'; failureSummary.textContent = 'Có ' + failureKeys.length + ' bản ghi lỗi đẩy; xem Log để tra từng mã.'; box.appendChild(failureSummary);
    var retryAll = document.createElement('button'); retryAll.type = 'button'; retryAll.className = 'shin-button'; retryAll.textContent = 'Mở lại ' + failureKeys.length + ' bản ghi lỗi';
    retryAll.setAttribute('data-fbm-push-retry-all', 'true'); box.appendChild(retryAll);
  }
  failureKeys.slice(-5).forEach(function (key) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    var detail = pushFailureDetails[key] || {};
    var suffix = detail.reason ? ' · ' + String(detail.reason) : '';
    if (detail.code) { suffix += ' [' + String(detail.code) + (detail.status ? ' HTTP ' + String(detail.status) : '') + ']'; }
    if (detail.requestKind) { suffix += ' · bước ' + String(detail.requestKind); }
    var label = document.createElement('span'); label.textContent = 'Lỗi đẩy ' + String(key) + suffix; row.appendChild(label);
    box.appendChild(row);
  });
  categoryBlocks.slice(-20).forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Chặn do Category ' + String(item.source || 'Category') + (item.code ? ' · ' + String(item.code) : '') + (item.reason ? ' · ' + String(item.reason) : ''); box.appendChild(row);
  });
  activityMissing.slice(-20).forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Activity không thấy trong FBM ' + String(item.id || '') + (item.fbmId ? ' · FBM ' + String(item.fbmId) : ''); box.appendChild(row);
  });
  panel.appendChild(box);
}
/** Hiển thị kết quả từng case nghiệm thu sau lượt Đọc thử. */
function fbmSyncPaintAudit(panel, audit) {
  if (!audit || !Array.isArray(audit.cases) || !audit.cases.length) { return; }
  var box = document.createElement('div'); box.className = 'shin-sync-audit';
  var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Kiểm tra ALT00010'; box.appendChild(title);
  audit.cases.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = (item.status === 'PASS' ? '✓ ' : '✕ ') + String(item.name || '') + (item.detail ? ' · ' + String(item.detail) : '');
    box.appendChild(row);
  });
  panel.appendChild(box);
}
/** Đăng ký listener một lần cho response và các nút đồng bộ. */

  window.addEventListener('message', function (event) {
    var data = event.data || {};

/** Mở phiên mới; chặn click trùng khi phiên đang chạy. */

      fbmSyncPaint({ label: 'Lỗi', phase: 'error', message: reason, lastError: reason, counts: {} });

  });
