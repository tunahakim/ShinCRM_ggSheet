function fbmSyncRotateRelay() {

/**
 * Nút Chấp thuận (thông báo chờ đẩy hoặc màn Chạy đồng bộ): mở màn đồng bộ rồi chạy ngay một lượt tay chiều Đẩy mang dấu tập đang hiện. Không có lệnh duyệt riêng: GAS chỉ đẩy khi tập dựng lại trong chính lượt này khớp dấu, lệch thì lượt không đẩy gì và hiện phiếu mới.

function fbmSyncApprovePush(fingerprint) {
  return Promise.resolve(syncPanelToggle()).then(function () {
    FBM_SYNC_CLIENT.mode = 'push';
    return fbmSyncRun('push', { approvedFingerprint: String(fingerprint || '') });
  });
}
/**
 * Cổng duy nhất của lệnh Dừng, cho nút Dừng (`any`) và lựa chọn dừng lượt nền (`background`): báo Extension máy này ngừng gửi phần còn lại của lô (request đang bay không bị cắt), rồi gửi lệnh Dừng cho GAS. GAS ghi cờ dừng không chờ khóa.
 * GAS trả `SYNC_STOP_PENDING` khi một lát đang giữ khóa: lượt đóng ở lát đó hoặc lát kế (lượt do máy khác chở cũng vậy), status đóng về theo đường relay như mọi lát.

function fbmSyncStop(scope) {
  fbmSyncCancelExtensionBatch();
  return callServer(scope === 'background' ? 'fbmStopBackground' : 'fbmCancelSync');
}
/**
 * Nút Dừng. GAS đóng được lượt ngay thì kết thúc chỗ chờ lượt tay bằng status GAS trả, không chờ Extension: response lô đang bay về sau không khớp lượt nào, chờ nó thì nút kẹt ở "Đang dừng…".
 * `SYNC_STOP_PENDING` có chỗ chờ thì vẽ status GAS (nút "Đang dừng…" theo `actions.run`): status đóng lượt về qua relay sẽ kết thúc chỗ chờ.
 * GAS không dừng được (`ok` false, ví dụ lượt kẹt mà GAS bận) thì vẽ status GAS trả (nút vẫn là Dừng) rồi báo lỗi để người dùng bấm lại.

function fbmSyncCancel() {
  var ticket = fbmSyncStatusTicket();
  return fbmSyncStop('any').then(function (result) {
    var status = fbmSyncStatusFromResult(result, ticket);
    if (result.ok === false) { throw fbmSyncDriveFailure(result, 'Không dừng được phiên đồng bộ trên GAS.'); }

/** Lối thoát khi màn đồng bộ kẹt (FBM-044): hỏi lại bằng dialog chung, còn việc có được đặt lại hay không do GAS quyết. */

  }).catch(function (error) {

  });
}
/** Hủy phiên FBM cũ chỉ sau khi người dùng xác nhận; GAS quyết có được làm không, tự đối chiếu đúng tài khoản đã liên kết và quyết có mở lại lượt đồng bộ bị chặn hay không (lượt mở lại nối tiếp trong cùng lần chờ qua `follows`). Sidebar không tự mở lượt sau khi đăng nhập. */

/**
 * Lệnh của người dùng gặp lượt nền đang chạy (GAS trả `SYNC_BACKGROUND_RUNNING`): hỏi người dùng dừng nền hay để nền chạy tiếp. Lượt nền không bao giờ bị dừng khi người dùng chưa chọn.

/** Đưa màn đồng bộ về như vừa mở: xóa mọi dấu thao tác dở (dòng báo, tab Xung đột vừa bấm, chế độ kiểm tra) về giá trị lúc mở rồi vẽ bằng `status` thật của GAS. Dùng khi người dùng đóng popup lượt nền, coi như chưa bấm nút gây ra popup. */

}
/** Popup "Đồng bộ nền đang chạy". Tóm tắt chỉ có bước đang chạy và giờ bắt đầu lấy từ `status`, đủ để chọn; không kèm tiến trình chạy theo. */
function fbmSyncAskBackgroundRunning(status, task) {

    title: 'Đồng bộ nền đang chạy',

/** Mở phiên mới. Chặn bấm đúp bằng khóa nút trên DOM ở cửa nhận bấm (`fbmSyncHoldButton`); có cho mở hay không là việc của GAS (`actions`, mã lỗi của `start`). */

    return fbmSyncReportError(error, 'Đồng bộ không thành công.', 'sync_run');
