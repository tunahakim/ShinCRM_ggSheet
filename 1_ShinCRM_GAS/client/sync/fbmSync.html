<script>
/* Sidebar chỉ hiển thị tiến độ; GAS là nguồn state duy nhất. */
var FBM_SYNC_CLIENT = { installed: false, waiting: {}, running: false, mode: 'read', writeAllowed: false, openedAt: 0, relayConfigured: false, viewEpoch: 0, statusRequestSeq: 0, lastServerUpdatedAt: 0, traceEvents: [], subscreen: 'status', lastStatus: null };
/** Timeout cho một request Extension để phiên không treo vô hạn khi tab FBM/bridge mất kết nối. */
var FBM_SYNC_REQUEST_TIMEOUT_MS = 20000;
var FBM_SYNC_GAS_CONTINUE_WARN_MS = 5000;
// Sau moc nay khong tiep tuc hien loading vo han; tu ket luan timeout, khong tu gui lai request ghi.
var FBM_SYNC_GAS_CONTINUE_TIMEOUT_MS = 15000;

function fbmSyncClientTrace(stage, request, extra) {
  var meta = request && request.meta && request.meta.trace || {}, event = Object.assign({ at: Date.now(), stage: stage, runId: String(meta.runId || ''), requestId: String(meta.requestId || ''), operation: String(request && request.meta && request.meta.kind || ''), entity: String(request && request.meta && request.meta.entity || ''), recordId: String(request && request.meta && (request.meta.id || request.meta.shinId || request.meta.stt_rec_kh) || '') }, extra || {});
  FBM_SYNC_CLIENT.traceEvents.push(event);
  if (FBM_SYNC_CLIENT.traceEvents.length > 20) { FBM_SYNC_CLIENT.traceEvents.shift(); }
  return event;
}

/** Tạo nút điều khiển dùng chung cho panel tiến độ. */
function fbmSyncMakeButton(id, label, primary) {
  var button = document.createElement('button');
  button.type = 'button'; button.id = id; button.className = 'shin-button' + (primary ? ' shin-primary' : ''); button.textContent = label;
  return button;
}
/** Mở/đóng panel và chỉ hỏi GAS khi người dùng vừa mở panel. */
function syncPanelToggle() {
  var screen = document.getElementById('fbm-sync-screen');
  if (!screen) { throw new Error('Sidebar thieu man dong bo FBM.'); }
  screen.hidden = !screen.hidden;
  if (!screen.hidden) { FBM_SYNC_CLIENT.openedAt = Date.now(); FBM_SYNC_CLIENT.viewEpoch += 1; }
  if (screen.hidden || typeof fbmSyncStatusOnce !== 'function') { return null; }
  // Relay config chỉ phục vụ các request FBM; không cần chặn snapshot trạng thái.
  return Promise.all([fbmSyncConfigureRelay(), fbmSyncStatusOnce(true)]).then(function (results) { return results[1]; });
}
/** Đưa cấu hình Web App/khóa sang Extension; không gửi cookie hay payload FBM. */
function fbmSyncConfigureRelay() {
  if (FBM_SYNC_CLIENT.relayConfigured || typeof callServer !== 'function') { return Promise.resolve(null); }
  return callServer('fbmGetRelayConfig').then(function (config) {
    FBM_SYNC_CLIENT.relayConfigured = true;
    if (window.top !== window && config && config.url && config.key) {
      window.top.postMessage({ action: 'CRM_FBM_CONFIG', nonce: SHEET_LINK_NONCE, config: { url: config.url, key: config.key, spreadsheetId: config.spreadsheetId || '' } }, 'https://docs.google.com');
    }
    return config;
  }).catch(function () { return null; });
}
/** Vẽ snapshot status, không suy diễn nghiệp vụ ở client. */
function fbmSyncPaint(status, freshOpen) {
  var panel = document.getElementById('fbm-sync-content');
  if (!panel || !status) { return; }
  // GAS orchestration returns { ok, request, status }; the panel only paints the inner snapshot.
  status = status.status || status;
  FBM_SYNC_CLIENT.lastStatus = status;
  // Do not replay a terminal error from an earlier sidebar session as the new screen's state.
  if (freshOpen && status.phase === 'error' && Number(status.updatedAt || 0) < Number(FBM_SYNC_CLIENT.openedAt || 0)) {
    status = Object.assign({}, status, { phase: 'idle', label: 'Sẵn sàng', message: '', lastError: '', counts: { total: 0, completed: 0, succeeded: 0, error: 0, conflict: 0, skipped: 0 } });
  }
  fbmSyncPaintHeaderState(status);
  if (status.writeAllowed !== undefined) { FBM_SYNC_CLIENT.writeAllowed = status.writeAllowed === true; }
  panel.hidden = false; panel.textContent = '';
  var count = status.counts || {};
  var active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(status.phase) >= 0;
  fbmSyncPaintStatusBlocks(panel, status, count);
  if (FBM_SYNC_CLIENT.subscreen === 'conflict') { fbmSyncPaintConflictScreen(panel, status); }
  else { fbmSyncPaintAuditBlocks(panel, status); }
  fbmSyncPaintSettingsBlock(panel, active, status);
}
/** Đồng bộ màu icon header với phase hiện tại của phiên GAS. */
function fbmSyncPaintHeaderState(status) {
  var button = document.getElementById('fbm-sync-menu');
  if (!button || !status) { return; }
  ['running', 'paused', 'error'].forEach(function (name) { button.classList.remove('shin-sync-status-' + name); });
  var phase = String(status.phase || '');
  var state = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(phase) >= 0 ? 'running' : (['paused', 'conflict'].indexOf(phase) >= 0 ? 'paused' : (phase === 'error' ? 'error' : ''));
  if (state) { button.classList.add('shin-sync-status-' + state); }
  button.setAttribute('aria-label', 'Đồng bộ FBM' + (state === 'running' ? ' — đang chạy' : state === 'paused' ? ' — tạm dừng' : state === 'error' ? ' — có lỗi' : ''));
}
/** Vẽ tiến trình riêng của phiên, không dùng chung dải loading của Sidebar. */
function fbmSyncPaintProgress(panel, status, count) {
  var phase = String(status.phase || ''), active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(phase) >= 0;
  var waitingForResponse = active && status.cursor && status.cursor.kind === 'push_wait';
  var total = Math.max(0, Number(count.total || 0)), completed = Math.max(0, Number(count.completed || 0));
  var determinate = total > 0;
  var percent = determinate ? Math.min(100, Math.round(completed * 100 / total)) : 0;
  var box = document.createElement('div'); box.className = 'shin-sync-progress';
  var label = document.createElement('div'); label.className = 'shin-sync-progress-label';
  label.textContent = determinate ? 'Tiến trình: ' + completed + '/' + total + ' (' + percent + '%)' + (waitingForResponse ? ' · đang chờ phản hồi' : '') : (active ? 'Tiến trình: đang xử lý…' : 'Tiến trình: chưa có tổng số bản ghi');
  box.appendChild(label);
  var track = document.createElement('div'); track.className = 'shin-sync-progress-track'; track.setAttribute('role', 'progressbar'); track.setAttribute('aria-valuemin', '0'); track.setAttribute('aria-valuemax', '100');
  if (determinate) { track.setAttribute('aria-valuenow', String(percent)); }
  var fill = document.createElement('div'); fill.className = 'shin-sync-progress-fill' + (!determinate && active ? ' is-indeterminate' : '') + (waitingForResponse ? ' is-waiting' : ''); fill.style.width = determinate ? percent + '%' : '35%'; track.appendChild(fill); box.appendChild(track);
  panel.appendChild(box);
}
/** Render only bounded, read-only fields returned by the GAS preview snapshot. */
function fbmSyncPaintPreview(panel, preview) {
  if (!preview) { return; }
  var customers = preview.customers || [], activities = preview.activities || [];
  if (!customers.length && !activities.length) { return; }
  var box = document.createElement('div'); box.className = 'shin-sync-preview';
  var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Dữ liệu đã đọc'; box.appendChild(title);
  var list = document.createElement('div'); list.className = 'shin-sync-preview-list'; box.appendChild(list);
  customers.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Khách: ' + (item.code || '(không có mã)') + ' · ' + (item.name || '(không có tên)'); list.appendChild(row);
  });
  activities.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Giao dịch: ' + (item.date || '(không có ngày)') + ' · ' + (item.type || '(không có loại)') + ' · ' + (item.content || '(trống)'); list.appendChild(row);
  });
  if (preview.truncated) { var more = document.createElement('div'); more.className = 'shin-sync-preview-more'; more.textContent = 'Preview đã giới hạn số dòng.'; box.appendChild(more); }
  panel.appendChild(box);
}
/** Hiển thị kết quả từng case nghiệm thu sau lượt Đọc thử. */
function fbmSyncPaintRecordIssues(panel, metadata) {
  metadata = metadata || {};
  var conflicts = Array.isArray(metadata.conflicts) ? metadata.conflicts : [];
  var identityBlocks = Array.isArray(metadata.identityBlocks) ? metadata.identityBlocks : [];
  var pushFailures = metadata.pushFailures || {};
  var pushFailureDetails = metadata.pushFailureDetails || {};
  var preflightIssues = Array.isArray(metadata.preflightIssues) ? metadata.preflightIssues : [];
  var categoryBlocks = Array.isArray(metadata.categoryBlocks) ? metadata.categoryBlocks : [];
  var activityMissing = Array.isArray(metadata.activityBulkMissing) ? metadata.activityBulkMissing : [];
  var hasRecordIssues = conflicts.length || identityBlocks.length || Object.keys(pushFailures).length || categoryBlocks.length || activityMissing.length;
  if (!preflightIssues.length && !hasRecordIssues) { return; }
  var box = document.createElement('div'); box.className = 'shin-sync-audit';
  if (preflightIssues.length) {
    var preflightTitle = document.createElement('div'); preflightTitle.className = 'shin-sync-preview-title'; preflightTitle.textContent = 'Preflight'; box.appendChild(preflightTitle);
    preflightIssues.slice(-30).forEach(function (item) {
      var preflightRow = document.createElement('div'); preflightRow.className = 'shin-sync-preview-row';
      preflightRow.textContent = (item.blocking ? 'Loi' : 'Canh bao') + ' [' + String(item.code || '') + '] ' + String(item.message || ''); box.appendChild(preflightRow);
    });
  }
  if (hasRecordIssues) {
    var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Chi tiết bản ghi'; box.appendChild(title);
  }
  if (conflicts.length) {
    var conflictSummary = document.createElement('div'); conflictSummary.className = 'shin-sync-preview-row';
    conflictSummary.textContent = 'Có ' + Number(metadata.conflictCount || conflicts.length) + ' xung đột đang chờ quyết định.';
    box.appendChild(conflictSummary);
    var conflictButton = document.createElement('button'); conflictButton.type = 'button'; conflictButton.className = 'shin-button'; conflictButton.id = 'fbm-sync-open-conflicts'; conflictButton.textContent = 'Mở màn hình xử lý xung đột'; box.appendChild(conflictButton);
  }
  identityBlocks.slice(-20).forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Chặn nhận diện Customer ' + String(item.fbmCustomerCode || '') + ' · ' + String(item.reason || ''); box.appendChild(row);
  });
  var failureKeys = Object.keys(pushFailures);
  if (failureKeys.length) {
    var failureSummary = document.createElement('div'); failureSummary.className = 'shin-sync-preview-row'; failureSummary.textContent = 'Có ' + failureKeys.length + ' bản ghi lỗi đẩy; xem Log để tra từng mã.'; box.appendChild(failureSummary);
    var retryAll = document.createElement('button'); retryAll.type = 'button'; retryAll.className = 'shin-button'; retryAll.textContent = 'Mở lại ' + failureKeys.length + ' bản ghi lỗi';
    retryAll.setAttribute('data-fbm-push-retry-all', 'true'); box.appendChild(retryAll);
  }
  failureKeys.slice(-5).forEach(function (key) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    var detail = pushFailureDetails[key] || {};
    var suffix = detail.reason ? ' · ' + String(detail.reason) : '';
    if (detail.code) { suffix += ' [' + String(detail.code) + (detail.status ? ' HTTP ' + String(detail.status) : '') + ']'; }
    if (detail.requestKind) { suffix += ' · bước ' + String(detail.requestKind); }
    var label = document.createElement('span'); label.textContent = 'Lỗi đẩy ' + String(key) + suffix; row.appendChild(label);
    box.appendChild(row);
  });
  categoryBlocks.slice(-20).forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Chặn do Category ' + String(item.source || 'Category') + (item.code ? ' · ' + String(item.code) : '') + (item.reason ? ' · ' + String(item.reason) : ''); box.appendChild(row);
  });
  activityMissing.slice(-20).forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Activity không thấy trong FBM ' + String(item.id || '') + (item.fbmId ? ' · FBM ' + String(item.fbmId) : ''); box.appendChild(row);
  });
  panel.appendChild(box);
}
/** Hiển thị kết quả từng case nghiệm thu sau lượt Đọc thử. */
function fbmSyncPaintAudit(panel, audit) {
  if (!audit || !Array.isArray(audit.cases) || !audit.cases.length) { return; }
  var box = document.createElement('div'); box.className = 'shin-sync-audit';
  var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Kiểm tra ALT00010'; box.appendChild(title);
  audit.cases.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = (item.status === 'PASS' ? '✓ ' : '✕ ') + String(item.name || '') + (item.detail ? ' · ' + String(item.detail) : '');
    box.appendChild(row);
  });
  panel.appendChild(box);
}
/** Đăng ký listener một lần cho response và các nút đồng bộ. */
function fbmSyncInstall() {
  if (FBM_SYNC_CLIENT.installed) { return; }
  FBM_SYNC_CLIENT.installed = true;
  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.action !== 'CRM_FBM_RESPONSE' || (typeof SHEET_LINK_NONCE !== 'undefined' && data.nonce !== SHEET_LINK_NONCE)) { return; }
    var waiter = FBM_SYNC_CLIENT.waiting[data.id];
    if (!waiter) { return; }
    // Listener cũ sau khi Extension Reload không còn runtime context. Bridge mới sẽ được nạp lại;
    // giữ nguyên waiter và phát lại đúng một lần thay vì kết thúc phiên bằng lỗi giả.
    if (data.retryable) {
      if (waiter.retryCount < 1) {
        waiter.retryCount += 1;
        setTimeout(function () {
          if (!FBM_SYNC_CLIENT.waiting[data.id]) { return; }
          (window.top === window ? window : window.top).postMessage({ action: 'CRM_FBM_REQUEST', id: data.id, nonce: SHEET_LINK_NONCE, request: waiter.request }, 'https://docs.google.com');
        }, 400);
      }
      // Bridge cũ có thể tiếp tục phát lỗi sau lần thử lại; chờ response thật
      // hoặc timeout thay vì làm rơi response FBM đang chạy.
      return;
    }
    delete FBM_SYNC_CLIENT.waiting[data.id];
    fbmSyncClientTrace(data.error ? 'client_extension_failure' : 'client_extension_success', waiter.request, data.error ? { error: data.error } : {});
    if (data.result && typeof data.result === 'object' && data.result.transport) { data.result.transport.trace = (data.result.transport.trace || []).concat(FBM_SYNC_CLIENT.traceEvents.slice()); }
    if (data.error) { var bridgeError = new Error(data.error); bridgeError.trace = (data.trace || []).concat(FBM_SYNC_CLIENT.traceEvents.slice()); waiter.reject(bridgeError); } else { waiter.resolve(data.result); }
  });
  document.addEventListener('click', function (event) {
    var target = event.target && event.target.closest ? event.target.closest('#fbm-sync-back, #fbm-sync-start, #fbm-sync-approve, #fbm-sync-cancel, #fbm-sync-open-conflicts, #fbm-sync-conflict-back, [data-fbm-conflict-choice], [data-fbm-push-retry-all]') : null;
    if (!target) { return; }
    event.preventDefault();
    if (target.hasAttribute('data-fbm-push-retry-all')) {
      target.disabled = true;
      fbmSyncRetryPushFailures().catch(function () { target.disabled = false; });
    } else if (target.id === 'fbm-sync-open-conflicts') {
      FBM_SYNC_CLIENT.subscreen = 'conflict';
      fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus);
    } else if (target.id === 'fbm-sync-conflict-back') {
      FBM_SYNC_CLIENT.subscreen = 'status';
      fbmSyncPaint(FBM_SYNC_CLIENT.lastStatus);
    } else if (target.hasAttribute('data-fbm-conflict-choice')) {
      target.disabled = true;
      fbmSyncResolveConflict(target.getAttribute('data-fbm-conflict-entity'), target.getAttribute('data-fbm-conflict-id'), target.getAttribute('data-fbm-conflict-choice')).catch(function () { target.disabled = false; });
    } else if (target.id === 'fbm-sync-back') { syncScreenClose(); }
    else if (target.id === 'fbm-sync-approve') { fbmSyncApprovePush(); }
    else if (target.id === 'fbm-sync-start') { fbmSyncRun(FBM_SYNC_CLIENT.mode); }
    else if (target.id === 'fbm-sync-cancel') { fbmSyncCancel(); }
  });
  document.addEventListener('change', function (event) {
    var target = event.target;
    if (!target) { return; }
    if (target.id === 'fbm-sync-mode') { FBM_SYNC_CLIENT.mode = target.value; }
    if (target.id === 'fbm-sync-write-gate') { fbmSyncSetWriteGate(target.checked); }
  });
}
/** Close the screen while keeping orchestration alive. */
function syncScreenClose() {
  var screen = document.getElementById('fbm-sync-screen');
  if (screen) { screen.hidden = true; }
  return screen;
}
/** Chuyển một envelope sang tab FBM và chờ response thô. */
function fbmSyncExtensionRequest(request) {
  fbmSyncInstall();
  return new Promise(function (resolve, reject) {
    var id = String(request && request.meta && request.meta.trace && request.meta.trace.requestId || (String(Date.now()) + '-' + Math.random().toString(36).slice(2)));
    fbmSyncClientTrace('client_next_request_started', request);
    FBM_SYNC_CLIENT.waiting[id] = { resolve: resolve, reject: reject, request: request, retryCount: 0 };
    // Send through the parent Sheets window; event.source remains the Sidebar iframe.
    (window.top === window ? window : window.top).postMessage({ action: 'CRM_FBM_REQUEST', id: id, nonce: SHEET_LINK_NONCE, request: request }, 'https://docs.google.com');
    setTimeout(function () { if (FBM_SYNC_CLIENT.waiting[id]) { delete FBM_SYNC_CLIENT.waiting[id]; reject(new Error('Không nhận được phản hồi từ tab FBM sau 20 giây. Hãy kiểm tra tab FBM và Extension.')); } }, FBM_SYNC_REQUEST_TIMEOUT_MS);
  });
}
/** Lấy status một lần, không tạo vòng polling khi không chạy. */
function fbmSyncStatusOnce(freshOpen) {
  var epoch = FBM_SYNC_CLIENT.viewEpoch, requestSeq = ++FBM_SYNC_CLIENT.statusRequestSeq, runningWhenRequested = FBM_SYNC_CLIENT.running;
  return callServer('fbmGetSyncStatus').then(function (status) {
    var snapshot = status && (status.status || status) || {}, updatedAt = Number(snapshot.updatedAt || 0);
    // Status của lượt mở/checkbox cũ không được phép vẽ đè loading của lượt mới.
    if (epoch !== FBM_SYNC_CLIENT.viewEpoch || requestSeq < FBM_SYNC_CLIENT.statusRequestSeq) { return status; }
    if (FBM_SYNC_CLIENT.running && !runningWhenRequested) { return status; }
    if (updatedAt && updatedAt < FBM_SYNC_CLIENT.lastServerUpdatedAt) { return status; }
    if (updatedAt) { FBM_SYNC_CLIENT.lastServerUpdatedAt = updatedAt; }
    return fbmSyncPaint(status, freshOpen);
  });
}
function fbmSyncResolveConflict(entity, id, choice) {
  return callServer('fbmResolveConflict', [entity, id, choice]).then(function (result) {
    if (!result || result.ok === false) { throw new Error(result && (result.message || result.code) || 'Không giải quyết được conflict.'); }
    return fbmSyncStatusOnce();
  }).catch(function (error) {
    return fbmSyncStatusOnce().then(function (status) {
      var snapshot = status && (status.status || status) || {};

      fbmSyncPaint(snapshot);
      throw error;
    });
  });
}
function fbmSyncRetryPushFailures() {
  return callServer('fbmRetryPushFailures').then(function (result) {
    if (!result || result.ok === false) { throw new Error(result && (result.message || result.code) || 'Không mở lại được bản ghi lỗi.'); }
    return fbmSyncStatusOnce();
  });
}
/** Đọc cờ ghi ở GAS và đồng bộ lại checkbox sau mỗi lần mở panel. */
function fbmSyncSetWriteGate(enabled) {
  return callServer('fbmSetWriteMode', [enabled === true]).then(function (result) { FBM_SYNC_CLIENT.writeAllowed = !!(result && result.enabled); return fbmSyncStatusOnce(); });
}
function fbmSyncApprovePush() {

    if (!started || started.ok === false) { throw new Error(started && (started.message || started.code) || 'Không chấp thuận được phiên ghi.'); }

  }).then(function (value) { FBM_SYNC_CLIENT.running = false; return value; }).catch(function (error) {
    FBM_SYNC_CLIENT.running = false;
    fbmSyncPaint({ phase: 'error', label: 'Có lỗi', message: String(error && error.message || error), counts: {} });
    return null;
  });
}
/** Thử lại một lần khi chính hạ tầng Apps Script chưa đọc được mã dự án. */
function fbmSyncStartServer(mode, attempt) {
  fbmSyncClientTrace('client_gas_call_started', null, { operation: 'fbmStartSync' });
  return callServer('fbmStartSync', [mode, FBM_SYNC_CLIENT.traceEvents.slice()]).then(function (result) { fbmSyncClientTrace('client_gas_success', null, { operation: 'fbmStartSync' }); return result; }).catch(function (err) {
    fbmSyncClientTrace('client_gas_failure', null, { operation: 'fbmStartSync', error: String(err && err.message || err) });
    var message = String(err && err.message || err || '');

/** Dừng phiên ở GAS và hủy vòng chạy phía Sidebar. */
function fbmSyncCancel() {
  FBM_SYNC_CLIENT.running = false;
  return callServer('fbmCancelSync').then(fbmSyncPaint);
}
/** Mô tả chặng đang chờ mà không ghi thêm tiến độ tạm vào GAS. */
function fbmSyncWaitingStatus(status, message) {
  var snapshot = status && (status.status || status) || {};

}
/** Giảm response form trước callback GAS; giữ đúng dữ liệu cần dựng OldValue và ticket. */
function fbmSyncProjectFormResponse(request, response) {

/** Chạy chuỗi request GAS -> Extension cho tới khi hết cursor. */
