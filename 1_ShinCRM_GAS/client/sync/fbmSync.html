<script>
/* Sidebar chỉ hiển thị tiến độ; GAS là nguồn state duy nhất. */
var FBM_SYNC_CLIENT = { installed: false, waiting: {}, running: false, mode: 'read', writeAllowed: false, openedAt: 0, relayConfigured: false };
/** Timeout cho một request Extension để phiên không treo vô hạn khi tab FBM/bridge mất kết nối. */
var FBM_SYNC_REQUEST_TIMEOUT_MS = 20000;

/** Tạo nút điều khiển dùng chung cho panel tiến độ. */
function fbmSyncMakeButton(id, label, primary) {
  var button = document.createElement('button');
  button.type = 'button'; button.id = id; button.className = 'shin-button' + (primary ? ' shin-primary' : ''); button.textContent = label;
  return button;
}
/** Mở/đóng panel và chỉ hỏi GAS khi người dùng vừa mở panel. */
function syncPanelToggle() {
  var screen = document.getElementById('fbm-sync-screen');
  if (!screen) { throw new Error('Sidebar thieu man dong bo FBM.'); }
  screen.hidden = !screen.hidden;
  if (!screen.hidden) { FBM_SYNC_CLIENT.openedAt = Date.now(); }
  if (screen.hidden || typeof fbmSyncStatusOnce !== 'function') { return null; }
  return fbmSyncConfigureRelay().then(function () { return fbmSyncStatusOnce(true); });
}
/** Đưa cấu hình Web App/khóa sang Extension; không gửi cookie hay payload FBM. */
function fbmSyncConfigureRelay() {
  if (FBM_SYNC_CLIENT.relayConfigured || typeof callServer !== 'function') { return Promise.resolve(null); }
  return callServer('fbmGetRelayConfig').then(function (config) {
    FBM_SYNC_CLIENT.relayConfigured = true;
    if (window.top !== window && config && config.url && config.key) {
      window.top.postMessage({ action: 'CRM_FBM_CONFIG', nonce: SHEET_LINK_NONCE, config: { url: config.url, key: config.key } }, 'https://docs.google.com');
    }
    return config;
  }).catch(function () { return null; });
}
/** Vẽ snapshot status, không suy diễn nghiệp vụ ở client. */
function fbmSyncPaint(status, freshOpen) {
  var panel = document.getElementById('fbm-sync-content');
  if (!panel || !status) { return; }
  // GAS orchestration returns { ok, request, status }; the panel only paints the inner snapshot.
  status = status.status || status;
  // Do not replay a terminal error from an earlier sidebar session as the new screen's state.
  if (freshOpen && status.phase === 'error' && Number(status.updatedAt || 0) < Number(FBM_SYNC_CLIENT.openedAt || 0)) {
    status = Object.assign({}, status, { phase: 'idle', label: 'Sẵn sàng', message: '', lastError: '', counts: { total: 0, completed: 0, succeeded: 0, error: 0, conflict: 0, skipped: 0 } });
  }
  fbmSyncPaintHeaderState(status);
  if (status.writeAllowed !== undefined) { FBM_SYNC_CLIENT.writeAllowed = status.writeAllowed === true; }
  panel.hidden = false; panel.textContent = '';
  var title = document.createElement('div'); title.className = 'shin-sync-title'; title.textContent = 'Đồng bộ FBM'; panel.appendChild(title);
  var phase = document.createElement('div'); phase.className = 'shin-sync-phase'; phase.textContent = status.label || status.phase || ''; panel.appendChild(phase);
  var operation = document.createElement('div'); operation.className = 'shin-sync-operation'; operation.textContent = 'Luồng: ' + String(status.direction || 'Chưa xác định') + ' · Đối tượng: ' + String(status.entityLabel || 'Tổng hợp'); panel.appendChild(operation);
  if (status.session) { var session = document.createElement('div'); session.className = 'shin-sync-session'; session.textContent = 'Phiên FBM: Customer ' + (status.session.customer ? 'OK' : 'chưa có') + ' · Activity ' + (status.session.activity ? 'OK' : 'chưa có'); panel.appendChild(session); }
  var count = status.counts || {};
  var counts = document.createElement('div'); counts.className = 'shin-sync-count'; counts.textContent = 'Đã xử lý ' + Number(count.completed || 0) + ' · thành công ' + Number(count.succeeded || 0) + ' · lỗi ' + Number(count.error || 0) + ' · xung đột ' + Number(count.conflict || 0) + ' · hoãn ' + Number(count.skipped || 0); panel.appendChild(counts);
  fbmSyncPaintProgress(panel, status, count);
  if (status.current) { var current = document.createElement('div'); current.className = 'shin-sync-current'; current.textContent = String(status.current); panel.appendChild(current); }
  if (status.message) { var message = document.createElement('div'); message.className = 'shin-sync-message'; message.textContent = String(status.message); panel.appendChild(message); }
  fbmSyncPaintPreview(panel, status.metadata && status.metadata.preview);
  fbmSyncPaintAudit(panel, status.metadata && status.metadata.audit);
  var actions = document.createElement('div'); actions.className = 'shin-sync-actions';
  var active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(status.phase) >= 0;
  var mode = document.createElement('select'); mode.id = 'fbm-sync-mode'; mode.className = 'shin-input'; mode.disabled = active;
  [['read', 'Đọc thử'], ['write', 'Ghi thật']].forEach(function (item) { var option = document.createElement('option'); option.value = item[0]; option.textContent = item[1]; mode.appendChild(option); });
  mode.value = FBM_SYNC_CLIENT.mode; mode.title = 'Chọn chiều chạy của phiên đồng bộ';
  actions.appendChild(mode);
  actions.appendChild(fbmSyncMakeButton(active ? 'fbm-sync-cancel' : 'fbm-sync-start', active ? 'Dừng đồng bộ' : 'Đồng bộ ngay', !active));
  panel.appendChild(actions);
  var gate = document.createElement('label'); gate.className = 'shin-sync-write-gate';
  var check = document.createElement('input'); check.type = 'checkbox'; check.id = 'fbm-sync-write-gate'; check.checked = FBM_SYNC_CLIENT.writeAllowed; check.disabled = active;
  gate.appendChild(check); gate.appendChild(document.createTextNode(' Cho phép ghi thật lên FBM')); panel.appendChild(gate);
}
/** Đồng bộ màu icon header với phase hiện tại của phiên GAS. */
function fbmSyncPaintHeaderState(status) {
  var button = document.getElementById('fbm-sync-menu');
  if (!button || !status) { return; }
  ['running', 'paused', 'error'].forEach(function (name) { button.classList.remove('shin-sync-status-' + name); });
  var phase = String(status.phase || '');
  var state = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(phase) >= 0 ? 'running' : (['paused', 'conflict'].indexOf(phase) >= 0 ? 'paused' : (phase === 'error' ? 'error' : ''));
  if (state) { button.classList.add('shin-sync-status-' + state); }
  button.setAttribute('aria-label', 'Đồng bộ FBM' + (state === 'running' ? ' — đang chạy' : state === 'paused' ? ' — tạm dừng' : state === 'error' ? ' — có lỗi' : ''));
}
/** Vẽ tiến trình riêng của phiên, không dùng chung dải loading của Sidebar. */
function fbmSyncPaintProgress(panel, status, count) {
  var phase = String(status.phase || ''), active = ['checking_session', 'pull_customer', 'pull_activity', 'reconcile', 'push'].indexOf(phase) >= 0;
  var total = Math.max(0, Number(count.total || 0)), completed = Math.max(0, Number(count.completed || 0));
  var determinate = total > 0;
  var percent = determinate ? Math.min(100, Math.round(completed * 100 / total)) : 0;
  var box = document.createElement('div'); box.className = 'shin-sync-progress';
  var label = document.createElement('div'); label.className = 'shin-sync-progress-label';
  label.textContent = determinate ? 'Tiến trình: ' + completed + '/' + total + ' (' + percent + '%)' : (active ? 'Tiến trình: đang xử lý…' : 'Tiến trình: chưa có tổng số bản ghi');
  box.appendChild(label);
  var track = document.createElement('div'); track.className = 'shin-sync-progress-track'; track.setAttribute('role', 'progressbar'); track.setAttribute('aria-valuemin', '0'); track.setAttribute('aria-valuemax', '100');
  if (determinate) { track.setAttribute('aria-valuenow', String(percent)); }
  var fill = document.createElement('div'); fill.className = 'shin-sync-progress-fill' + (!determinate && active ? ' is-indeterminate' : ''); fill.style.width = determinate ? percent + '%' : '35%'; track.appendChild(fill); box.appendChild(track);
  panel.appendChild(box);
}
/** Render only bounded, read-only fields returned by the GAS preview snapshot. */
function fbmSyncPaintPreview(panel, preview) {
  if (!preview) { return; }
  var customers = preview.customers || [], activities = preview.activities || [];
  if (!customers.length && !activities.length) { return; }
  var box = document.createElement('div'); box.className = 'shin-sync-preview';
  var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Dữ liệu đã đọc'; box.appendChild(title);
  var list = document.createElement('div'); list.className = 'shin-sync-preview-list'; box.appendChild(list);
  customers.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Khách: ' + (item.code || '(không có mã)') + ' · ' + (item.name || '(không có tên)'); list.appendChild(row);
  });
  activities.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = 'Giao dịch: ' + (item.date || '(không có ngày)') + ' · ' + (item.type || '(không có loại)') + ' · ' + (item.content || '(trống)'); list.appendChild(row);
  });
  if (preview.truncated) { var more = document.createElement('div'); more.className = 'shin-sync-preview-more'; more.textContent = 'Preview đã giới hạn số dòng.'; box.appendChild(more); }
  panel.appendChild(box);
}
/** Hiển thị kết quả từng case nghiệm thu sau lượt Đọc thử. */
function fbmSyncPaintAudit(panel, audit) {
  if (!audit || !Array.isArray(audit.cases) || !audit.cases.length) { return; }
  var box = document.createElement('div'); box.className = 'shin-sync-audit';
  var title = document.createElement('div'); title.className = 'shin-sync-preview-title'; title.textContent = 'Kiểm tra ALT00010'; box.appendChild(title);
  audit.cases.forEach(function (item) {
    var row = document.createElement('div'); row.className = 'shin-sync-preview-row';
    row.textContent = (item.status === 'PASS' ? '✓ ' : '✕ ') + String(item.name || '') + (item.detail ? ' · ' + String(item.detail) : '');
    box.appendChild(row);
  });
  panel.appendChild(box);
}
/** Đăng ký listener một lần cho response và các nút đồng bộ. */
function fbmSyncInstall() {
  if (FBM_SYNC_CLIENT.installed) { return; }
  FBM_SYNC_CLIENT.installed = true;
  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.action !== 'CRM_FBM_RESPONSE' || (typeof SHEET_LINK_NONCE !== 'undefined' && data.nonce !== SHEET_LINK_NONCE)) { return; }
    var waiter = FBM_SYNC_CLIENT.waiting[data.id];
    if (!waiter) { return; }
    delete FBM_SYNC_CLIENT.waiting[data.id];
    if (data.error) { waiter.reject(new Error(data.error)); } else { waiter.resolve(data.result); }
  });
  document.addEventListener('click', function (event) {
    var target = event.target && event.target.closest ? event.target.closest('#fbm-sync-back, #fbm-sync-start, #fbm-sync-cancel') : null;
    if (!target) { return; }
    event.preventDefault();
    if (target.id === 'fbm-sync-back') { syncScreenClose(); }
    else if (target.id === 'fbm-sync-start') { fbmSyncRun(FBM_SYNC_CLIENT.mode); }
    else if (target.id === 'fbm-sync-cancel') { fbmSyncCancel(); }
  });
  document.addEventListener('change', function (event) {
    var target = event.target;
    if (!target) { return; }
    if (target.id === 'fbm-sync-mode') { FBM_SYNC_CLIENT.mode = target.value; }
    if (target.id === 'fbm-sync-write-gate') { fbmSyncSetWriteGate(target.checked); }
  });
}
/** Close the screen while keeping orchestration alive. */
function syncScreenClose() {
  var screen = document.getElementById('fbm-sync-screen');
  if (screen) { screen.hidden = true; }
  return screen;
}
/** Chuyển một envelope sang tab FBM và chờ response thô. */
function fbmSyncExtensionRequest(request) {
  fbmSyncInstall();
  return new Promise(function (resolve, reject) {
    var id = String(Date.now()) + '-' + Math.random().toString(36).slice(2);
    FBM_SYNC_CLIENT.waiting[id] = { resolve: resolve, reject: reject };
    // Send through the parent Sheets window; event.source remains the Sidebar iframe.
    (window.top === window ? window : window.top).postMessage({ action: 'CRM_FBM_REQUEST', id: id, nonce: SHEET_LINK_NONCE, request: request }, 'https://docs.google.com');
    setTimeout(function () { if (FBM_SYNC_CLIENT.waiting[id]) { delete FBM_SYNC_CLIENT.waiting[id]; reject(new Error('Không nhận được phản hồi từ tab FBM sau 20 giây. Hãy kiểm tra tab FBM và Extension.')); } }, FBM_SYNC_REQUEST_TIMEOUT_MS);
  });
}
/** Lấy status một lần, không tạo vòng polling khi không chạy. */
function fbmSyncStatusOnce(freshOpen) { return callServer('fbmGetSyncStatus').then(function (status) { return fbmSyncPaint(status, freshOpen); }); }
/** Đọc cờ ghi ở GAS và đồng bộ lại checkbox sau mỗi lần mở panel. */
function fbmSyncSetWriteGate(enabled) {
  return callServer('fbmSetWriteMode', [enabled === true]).then(function (result) { FBM_SYNC_CLIENT.writeAllowed = !!(result && result.enabled); return fbmSyncStatusOnce(); });
}
/** Thử lại một lần khi chính hạ tầng Apps Script chưa đọc được mã dự án. */
function fbmSyncStartServer(mode, attempt) {
  return callServer('fbmStartSync', [mode]).catch(function (err) {
    var message = String(err && err.message || err || '');
    if (Number(attempt || 0) < 1 && /DEADLINE_EXCEEDED|đọc từ bộ nhớ/i.test(message)) { return fbmSyncStartServer(mode, Number(attempt || 0) + 1); }
    throw err;
  });
}
/** Dừng phiên ở GAS và hủy vòng chạy phía Sidebar. */
function fbmSyncCancel() {
  FBM_SYNC_CLIENT.running = false;
  return callServer('fbmCancelSync').then(fbmSyncPaint);
}
/** Mô tả chặng đang chờ mà không ghi thêm tiến độ tạm vào GAS. */
function fbmSyncWaitingStatus(status, message) {
  var snapshot = status && (status.status || status) || {};
  return Object.assign({}, snapshot, { message: message });
}
/** Chạy chuỗi request GAS -> Extension cho tới khi hết cursor. */
function fbmSyncLoop(status) {
  fbmSyncPaint(status);
  if (!status || !status.request) {
    FBM_SYNC_CLIENT.running = false;
    if (FBM_SYNC_CLIENT.mode === 'read' && typeof callServer === 'function') {
      return callServer('fbmAuditAltState').then(function (audit) {
        var snapshot = status && (status.status || status) || {};
        snapshot.metadata = Object.assign({}, snapshot.metadata || {}, { audit: audit });
        fbmSyncPaint(snapshot);
        return snapshot;
      }).catch(function () { return status; });
    }
    return status;
  }
  var entity = status.request.meta && status.request.meta.entity === 'activity' ? 'giao dịch' : 'khách hàng';
  fbmSyncPaint(fbmSyncWaitingStatus(status, 'Đang chờ tab FBM trả dữ liệu ' + entity + '...'));
  return fbmSyncExtensionRequest(status.request).then(function (response) {
    if (!FBM_SYNC_CLIENT.running) { return fbmSyncStatusOnce(); }
    fbmSyncPaint(fbmSyncWaitingStatus(status, 'Đã nhận phản hồi FBM; đang chờ GAS xử lý...'));
    return callServer('fbmContinueSync', [response]);
  }).then(fbmSyncLoop);
}
/** Mở phiên mới; chặn click trùng khi phiên đang chạy. */
function fbmSyncRun(mode) {
  if (FBM_SYNC_CLIENT.running) { return Promise.resolve(null); }
  if (typeof sheetLinkExtensionAlive === 'function' && !sheetLinkExtensionAlive()) {
    var missing = { label: 'Chưa kết nối Extension', phase: 'error', message: 'Chưa nhận được bắt tay từ Extension. Hãy tải lại Extension rồi mở lại tab FBM.', counts: {} };
    fbmSyncPaint(missing);
    return Promise.resolve(missing);
  }
  FBM_SYNC_CLIENT.running = true;
  fbmSyncPaint({ phase: 'checking_session', label: 'Đang chuẩn bị đồng bộ', direction: 'Kết nối FBM', entityLabel: 'Chuẩn bị phiên', message: 'Đang chuẩn bị phiên đồng bộ...', counts: {} });
  var work = fbmSyncStartServer(mode || 'read', 0).then(function (started) {
    if (!started || !started.ok) {
      FBM_SYNC_CLIENT.running = false;
      if (started && started.status) { fbmSyncPaint(started.status); }
      return started || { ok: false };
    }
    return fbmSyncLoop(started);
  });
  return work.then(function (value) { FBM_SYNC_CLIENT.running = false; return value; }, function (err) {
    FBM_SYNC_CLIENT.running = false;
    var reason = err && err.message ? err.message : String(err);
    return callServer('fbmLogSyncError', [reason]).catch(function () { return null; }).then(function () {
      return callServer('fbmCancelSync').catch(function () { return null; });
    }).then(function () {
      fbmSyncPaint({ label: 'Lỗi', phase: 'error', message: reason, lastError: reason, counts: {} });
      return null;
    });
  });
}
</script>
